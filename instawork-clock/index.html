<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InstaWork Clock-in</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/favicon.png?v=2">
  <link rel="stylesheet" href="/instawork-clock/assets/instawork-clock.css?v=2" />
  <script src="/auth-gate.js"></script>
</head>
<body>
  <header class="brand-bar">
    <div class="brand-inner">
      <h1>InstaWork Clock-in</h1>
      <span class="muted" id="updatedLabel"></span>
    </div>
  </header>
  <main class="layout">
    <section class="card toolbar">
      <label>Date <input id="date" type="date"></label>
      <label>Store <input id="store" type="text" inputmode="numeric" placeholder="All" size="5"></label>
      <button type="button" id="refreshBtn" class="btn">Refresh</button>
      <a class="btn btn-secondary" id="clockLink" href="https://eod-api.the-dump-bin.com/share/clock/" target="_blank" rel="noopener">Worker link</a>
      <label>Name <input id="addName" type="text" autocomplete="name"></label>
      <label>Phone <input id="addPhone" type="tel" inputmode="tel" autocomplete="tel"></label>
      <button type="button" id="addBtn" class="btn">Add</button>
      <span class="save-note" id="addNote" hidden></span>
    </section>
    <section id="boards"><p class="muted">Loading…</p></section>
  </main>
  <script src="/instawork-clock/assets/instawork-clock.js?v=7"></script>
</body>
</html>
