<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checklane Reset Hub — Store 00163</title>
<script src="/auth-gate.js"></script>
<link rel="stylesheet" href="planogram.css">
<script src="planogram.js" defer></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242836;
    --border: #2e3345;
    --text: #e8eaf0;
    --text2: #8b90a5;
    --text3: #5a5f73;
    --aisle: #141820;
    --lane-label: #c4c9dc;
    --entrance: #fbbf24;
    --side-l: rgba(52, 211, 153, 0.35);
    --side-r: rgba(244, 114, 182, 0.35);
    --state-not_started: #6b7280;
    --state-assigned: #3b82f6;
    --state-in_progress: #f59e0b;
    --state-needs_attention: #ef4444;
    --state-done_pending_signoff: #14b8a6;
    --state-signed_off: #22c55e;
    --state-not_in_store: #f59e0b;
    --radius: 8px;
    --panel-width: min(360px, 92vw);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(180deg, var(--bg) 85%, transparent);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  .app-header h1 {
    font-size: 1rem;
    font-weight: 700;
  }

  .header-brand {
    flex: 1 1 180px;
    min-width: 0;
  }

  .signed-in-chip {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 8px;
    margin-top: 6px;
    padding: 6px 10px;
    border-radius: var(--radius);
    border: 1px solid #3b82f6;
    background: rgba(59, 130, 246, 0.14);
    max-width: 100%;
  }

  .signed-in-chip--unknown {
    border-color: var(--border);
    background: var(--surface2);
  }

  .signed-in-chip-prefix {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #93c5fd;
    font-weight: 700;
  }

  .signed-in-chip--unknown .signed-in-chip-prefix {
    color: var(--text2);
  }

  .signed-in-chip-name {
    font-size: 0.9rem;
    font-weight: 800;
    color: #e0f2fe;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: min(100%, 320px);
  }

  .signed-in-chip--unknown .signed-in-chip-name {
    color: var(--text2);
    font-weight: 600;
  }

  .signed-in-rank-pill {
    font-size: 0.62rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
  }

  .signed-in-rank-pill--rep {
    color: #bfdbfe;
    background: rgba(59, 130, 246, 0.2);
    border-color: rgba(59, 130, 246, 0.35);
  }

  .signed-in-rank-pill--lead {
    color: #fde68a;
    background: rgba(245, 158, 11, 0.18);
    border-color: rgba(245, 158, 11, 0.35);
  }

  .signed-in-rank-pill--supervisor {
    color: #bbf7d0;
    background: rgba(34, 197, 94, 0.16);
    border-color: rgba(34, 197, 94, 0.35);
  }

  .app-header .store-tag {
    font-size: 0.75rem;
    color: var(--text2);
    font-weight: 500;
  }

  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    padding: 8px 14px;
    border-radius: var(--radius);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    min-height: 40px;
  }

  .btn:active { opacity: 0.85; }
  .btn.active { background: #334155; border-color: #475569; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    color: var(--text2);
    white-space: nowrap;
  }

  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .legend-swatch.muted-demo {
    background: var(--surface2);
    border: 1px dashed var(--text3);
    opacity: 0.45;
  }

  .main-layout {
    display: flex;
    min-height: calc(100vh - 120px);
  }

  .view-container { flex: 1; min-width: 0; }

  .view-hidden { display: none !important; }

  /* ── Map view — horizontal lane rows stacked vertically ── */
  .map-view {
    padding: 12px 8px 24px;
    overflow-x: auto;
  }

  .map-stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 960px;
    margin: 0 auto;
  }

  .stack-group {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
  }

  .stack-group-header {
    padding: 8px 12px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text2);
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  .stack-group-body {
    display: flex;
    flex-direction: column;
  }

  .lane-row {
    display: flex;
    align-items: stretch;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    min-height: 52px;
  }

  .lane-row:last-child { border-bottom: none; }

  .lane-row-label {
    flex: 0 0 auto;
    min-width: 76px;
    max-width: 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-right: 8px;
    border-right: 1px solid var(--border);
  }

  .lane-num {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--lane-label);
    letter-spacing: 0.04em;
    line-height: 1.1;
  }

  .lane-commodity {
    font-size: 0.62rem;
    color: var(--text2);
    margin-top: 3px;
    line-height: 1.25;
  }

  .lane-row-fixtures {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 4px;
    min-width: 0;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .lane-row-fixtures .fixture {
    flex: 0 0 auto;
  }

  .flow-arrow {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    color: var(--text3);
    font-size: 1.1rem;
    opacity: 0.55;
    padding-left: 2px;
  }

  .flow-arrow::after {
    content: '→';
  }

  /* ── USCAN pod — facing pairs across center aisle ── */
  .uscan-pod {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pod-back-cap {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 4px;
    align-items: stretch;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border);
  }

  .pod-back-cap-label {
    flex: 0 0 auto;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text3);
    align-self: center;
    padding-right: 8px;
    min-width: 52px;
  }

  .pod-facing {
    display: flex;
    flex-direction: column;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .pod-facing-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 4px;
    padding: 6px 8px;
    min-height: 56px;
  }

  .pod-facing-row.row-left {
    background: rgba(52, 211, 153, 0.04);
    border-bottom: 1px dashed var(--border);
  }

  .pod-facing-row.row-right {
    background: rgba(244, 114, 182, 0.04);
  }

  .pod-row-tag {
    flex: 0 0 auto;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text3);
    padding: 0 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pod-facing-row.row-left .pod-row-tag { color: #6ee7b7; }
  .pod-facing-row.row-right .pod-row-tag { color: #f9a8d4; }

  .pod-stand-cell {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 3px;
    min-width: 0;
  }

  .pod-stand-cell .lane-mini-label {
    flex: 0 0 auto;
    font-size: 0.65rem;
    font-weight: 800;
    color: var(--lane-label);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    padding: 0 2px;
    opacity: 0.85;
  }

  .pod-stand-cell .stand-fixtures {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 3px;
    min-width: 0;
  }

  .pod-aisle-band {
    height: 22px;
    flex-shrink: 0;
    background: repeating-linear-gradient(
      90deg,
      var(--aisle) 0px,
      var(--aisle) 10px,
      #1c2030 10px,
      #1c2030 20px
    );
    border-top: 1px dashed var(--border);
    border-bottom: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
  }

  .pod-aisle-band::before { content: 'Pod aisle — customer / cart'; }

  .pod-tail-rows {
    display: flex;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }

  .pod-side-strip {
    flex: 0 0 8px;
    border-radius: 2px;
    align-self: stretch;
  }

  .pod-side-strip.strip-L {
    border-left: 2px dashed #34d399;
    background: var(--side-l);
  }

  .pod-side-strip.strip-R {
    border-right: 2px dashed #f472b6;
    background: var(--side-r);
  }

  .you-are-here {
    text-align: center;
    padding: 16px 12px 24px;
    color: var(--entrance);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .you-are-here::before {
    content: '▲';
    display: block;
    font-size: 1.2rem;
    margin-bottom: 4px;
  }

  /* ── Fixture primitives ── */
  .fixture {
    position: relative;
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    background: var(--surface2);
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    --fixture-color: var(--state-not_started);
    border-left: 4px solid var(--fixture-color);
  }

  .fixture.interactive:active { transform: scale(0.98); }

  .fixture.muted {
    opacity: 0.38;
    border-style: dashed;
    border-color: var(--text3);
    border-left-style: dashed;
    cursor: default;
    pointer-events: none;
  }

  .fixture.state-not_started { --fixture-color: var(--state-not_started); }
  .fixture.state-assigned { --fixture-color: var(--state-assigned); }
  .fixture.state-in_progress { --fixture-color: var(--state-in_progress); }
  .fixture.state-needs_attention {
    --fixture-color: var(--state-needs_attention);
    animation: pulse-attention 1.8s ease-in-out infinite;
  }
  .fixture.state-done_pending_signoff { --fixture-color: var(--state-done_pending_signoff); }
  .fixture.state-signed_off { --fixture-color: var(--state-signed_off); }
  .fixture.state-not_in_store { --fixture-color: var(--state-not_in_store); }

  @keyframes pulse-attention {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.35); }
    50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.12); }
  }

  .fx-label {
    font-size: 0.58rem;
    font-weight: 600;
    color: var(--text);
    padding: 3px 5px;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .fx-type-tag {
    font-size: 0.5rem;
    text-transform: uppercase;
    color: var(--text3);
    padding: 0 5px 3px;
    letter-spacing: 0.04em;
  }

  .fx-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    padding: 0 3px 3px;
    min-width: 0;
  }

  .fx-meta-row .fx-type-tag {
    flex: 1 1 auto;
    min-width: 0;
    padding: 0 0 0 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .fx-meta-row .fx-type-tag--empty {
    visibility: hidden;
    padding: 0;
    min-height: 0;
  }

  .fx-meta-row--badge-only {
    justify-content: flex-end;
    min-height: 14px;
  }

  .fx-dbkey {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 2px 4px;
    border-radius: 0 0 4px 4px;
    background: rgba(15, 23, 42, 0.92);
    border-top: 1px solid rgba(96, 165, 250, 0.35);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.54rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #bfdbfe;
    text-align: center;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
    z-index: 3;
  }

  .fixture.interactive {
    padding-bottom: 15px;
  }

  .fixture.muted .fx-dbkey {
    background: rgba(15, 23, 42, 0.75);
    border-top-color: rgba(148, 163, 184, 0.25);
    color: var(--text2);
  }

  /* Stand types */
  .stand {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 2px;
    padding: 3px;
    min-width: 88px;
  }

  .stand-block {
    background: rgba(0,0,0,0.25);
    border-radius: 3px;
    font-size: 0.48rem;
    font-weight: 700;
    text-align: center;
    padding: 3px 2px;
    color: var(--text2);
    letter-spacing: 0.02em;
  }

  .stand-block.screen { grid-column: 1 / -1; }
  .stand-block.scanner { grid-column: 1; }
  .stand-block.bag { grid-column: 2; }

  /* Side shelf */
  .side-shelf-prim {
    width: 36px;
    min-height: 56px;
    border: 2px dashed;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 0.5rem;
    font-weight: 700;
    padding: 4px 2px;
  }

  .side-shelf-prim.side-L {
    border-color: #34d399;
    background: var(--side-l);
    color: #6ee7b7;
  }

  .side-shelf-prim.side-R {
    border-color: #f472b6;
    background: var(--side-r);
    color: #f9a8d4;
  }

  /* Horizontal bar types */
  .h-bar {
    min-height: 22px;
    display: flex;
    align-items: center;
  }

  .h-bar .fx-label { -webkit-line-clamp: 1; padding: 2px 6px; }

  /* Block types */
  .block-prim { min-height: 26px; }
  .block-prim.size-sm { min-height: 22px; }
  .block-prim.size-md { min-height: 30px; }
  .block-prim.size-lg { min-height: 38px; }

  /* ── List view ── */
  .list-view {
    padding: 12px 16px 80px;
    overflow-x: auto;
  }

  .list-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }

  .list-table th,
  .list-table td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }

  .list-table th {
    color: var(--text2);
    font-weight: 600;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  .list-table th:hover { color: var(--text); }
  .list-table tr.row-muted { opacity: 0.45; }
  .list-table tr.row-clickable { cursor: pointer; }
  .list-table tr.row-clickable:hover { background: var(--surface); }

  .list-table .assignee-cell {
    font-weight: 600;
    color: #93c5fd;
    max-width: 140px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .list-table .assignee-cell--none { color: var(--text3); font-weight: 500; }

  .list-table .dbkey-cell {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.76rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .assignments-btn {
    /* legacy hook — styling via .header-badge-btn--assignments */
  }

  .header-badge-btn {
    appearance: none;
    border: 1px solid transparent;
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    min-height: 40px;
    display: none;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    line-height: 1.2;
  }

  .header-badge-btn.visible {
    display: inline-flex;
  }

  .header-badge-btn .count {
    border-radius: 999px;
    min-width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 800;
    padding: 0 6px;
  }

  .header-badge-btn--pending {
    border-color: #f59e0b;
    background: rgba(245, 158, 11, 0.15);
    color: #fbbf24;
  }

  .header-badge-btn--pending .count {
    background: #f59e0b;
    color: #1a1d27;
  }

  .header-badge-btn--tag-batch {
    border-color: #14b8a6;
    background: rgba(20, 184, 166, 0.15);
    color: #5eead4;
  }

  .header-badge-btn--tag-batch .count {
    background: #14b8a6;
    color: #1a1d27;
  }

  .header-badge-btn--assignments {
    border-color: #3b82f6;
    background: rgba(59, 130, 246, 0.15);
    color: #93c5fd;
  }

  .header-badge-btn--assignments .count {
    background: #3b82f6;
    color: #fff;
  }

  .assignments-view {
    padding: 12px 16px 88px;
    width: 100%;
    max-width: none;
    margin: 0;
  }

  .assignments-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }

  .assignments-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
  }

  .assignments-stat-value {
    font-size: 1.35rem;
    font-weight: 800;
    line-height: 1.1;
    color: var(--text);
  }

  .assignments-stat-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text2);
    margin-top: 4px;
  }

  .assign-person-block {
    margin-bottom: 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
  }

  .assign-person-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    background: linear-gradient(180deg, rgba(59, 130, 246, 0.14) 0%, var(--surface2) 100%);
    border-bottom: 1px solid var(--border);
  }

  .assign-person-name {
    font-size: 1.05rem;
    font-weight: 800;
    color: #bfdbfe;
  }

  .assign-person-count {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text2);
    white-space: nowrap;
  }

  .assign-set-list {
    list-style: none;
  }

  .assign-set-row {
    display: grid;
    grid-template-columns: 52px 88px minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    min-height: 44px;
  }

  .assign-set-row.has-assign {
    grid-template-columns: 52px 88px minmax(0, 1fr) auto minmax(180px, 280px);
  }

  .assign-set-actions {
    display: flex;
    gap: 6px;
    align-items: stretch;
    cursor: default;
  }

  .assign-set-actions .hub-roster-select {
    flex: 1;
    min-width: 0;
    min-height: 36px;
    padding: 6px 8px;
    font-size: 0.78rem;
  }

  .assign-set-actions .btn-assign {
    min-height: 36px;

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function shortName(name) {
  return name.replace(/^CKLN\s+/i, '').slice(0, 42);
}

function classifyFixture(fixture) {
  if (fixture.type != null && fixture.type !== '') return fixture.type;

  const name = (fixture.name || '').toUpperCase();
  const action = (fixture.action || '').toUpperCase();

  if (name.includes('USCAN') && name.includes('KIT')) return 'uscan_stand';
  if (name.includes('BELTED') && name.includes('SCO')) return 'belted_sco';
  if (name.includes('SIDE SHELF') || name.includes('RETRO FIT')) return 'side_shelf';
  if (name.includes('QUE')) return 'queue';
  if (name.includes('TAIL')) return 'liberty_tail';
  if (name.includes('ENDCAP')) return 'endcap';
  if (name.includes('COOLER')) return 'cooler';
  if (name.includes('REGISTER')) return 'register';
  if (name.includes('REUSABLE BAG') || name.includes('TOTES')) return 'bag_rack';
  if (name.includes('CAO')) return 'cao_long';
  if (name.includes('CHECKSTAND')) return 'checkstand';
  if (name.includes('CIGARETTE') || name.includes('WA PACKS')) return 'cigarette';
  if (name.includes('SHIPPER') || name.includes('RUG') || name.includes('BATTERY')) return 'misc_display';

  if (action.startsWith('C082')) return 'cooler';
  if (action.startsWith('C121')) return 'cigarette';
  if (action.startsWith('C889')) return 'bag_rack';
  if (action.startsWith('C901') || action.startsWith('C218') || action.startsWith('C808')) return 'misc_display';
  if (action.startsWith('C201')) return 'register';

  return 'unclassified';
}

function ensureFixtureTypes(fixtures) {
  fixtures.forEach(f => {
    if (f.type == null || f.type === '') f.type = classifyFixture(f);
  });
}

function orderFixturesInLane(fixtures, inputIndex) {
  const priority = new Map(FIXTURE_ORDER.map((t, i) => [t, i]));
  return fixtures.slice().sort((a, b) => {
    const pa = priority.has(a.type) ? priority.get(a.type) : FIXTURE_ORDER.length;
    const pb = priority.has(b.type) ? priority.get(b.type) : FIXTURE_ORDER.length;
    if (pa !== pb) return pa - pb;
    return (inputIndex.get(a) ?? 0) - (inputIndex.get(b) ?? 0);
  });
}

function generateLayout(fixtures) {
  const inputIndex = new Map(fixtures.map((f, i) => [f, i]));
  const byLane = {};

  fixtures.forEach(f => {
    if (!byLane[f.lane]) byLane[f.lane] = [];
    byLane[f.lane].push(f);
  });

  const lanes = Object.keys(byLane).sort((a, b) => Number(b) - Number(a));

  return {
    lanes: lanes.map(lane => {
      const all = byLane[lane];
      const left = all.filter(f => f.type === 'side_shelf' && f.side === 'L');
      const right = all.filter(f => f.type === 'side_shelf' && f.side === 'R');
      const main = all.filter(f => f.type !== 'side_shelf' || f.side === 'E');
      return {
        lane,
        left,
        fixtures: orderFixturesInLane(main, inputIndex),
        right
      };
    })
  };
}

function reportLayout(layout, fixtures) {
  const typeCounts = {};
  const unclassified = [];

  fixtures.forEach(f => {
    typeCounts[f.type] = (typeCounts[f.type] || 0) + 1;
    if (f.type === 'unclassified') unclassified.push({ lane: f.lane, name: f.name });
  });

  console.log('[Checklane Hub] Layout report');
  console.log('  Total fixtures:', fixtures.length);
  console.log('  Lanes:', layout.lanes.length);
  console.log('  Count per type:', typeCounts);
  if (unclassified.length) {
    console.warn('[Checklane Hub] UNCLASSIFIED:', unclassified);
  } else {
    console.log('  UNCLASSIFIED: none');
  }
}

function fixtureKey(f) {
  return f.dbkey || f.action + '@' + f.lane;
}

function sectionKey(lane, dbkey) {
  return String(lane || '') + ':' + String(dbkey);
}

function findFixture(dbkey, action, lane) {
  if (lane && action) {
    const match = FIXTURES.find(f => f.dbkey === dbkey && f.action === action && f.lane === lane);
    if (match) return match;
  }
  if (lane) {
    const match = FIXTURES.find(f => f.dbkey === dbkey && f.lane === lane);
    if (match) return match;
  }
  if (action) {
    const match = FIXTURES.find(f => f.dbkey === dbkey && f.action === action);
    if (match) return match;
  }
  return FIXTURES.find(f => f.dbkey === dbkey);
}

function fixtureNameForDbkey(dbkey) {
  const f = FIXTURES.find(x => x.dbkey === String(dbkey));
  return f ? f.name : String(dbkey || '—');
}

function formatRaisedAt(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  } catch (_) {
    return iso;
  }
}

function applySnapshot(snapshot) {
  hubContext.myRank = snapshot.myRank ?? 1;
  hubContext.myUserId = snapshot.myUserId ?? null;
  hubContext.sections = {};
  (snapshot.sections || []).forEach(row => {
    if (row && row.dbkey) {
      hubContext.sections[sectionKey(row.lane || '', row.dbkey)] = row;
    }
  });
  hubContext.pendingActions = snapshot.pendingActions || [];
  hubContext.verifiedUnsentTags = snapshot.stats?.verifiedUnsentTags ?? 0;
  hubContext.draftTags = snapshot.stats?.draftTags ?? 0;

  const stateMap = snapshotSectionsToStateMap(snapshot.sections);
  applyState(stateMap);

  updatePendingBadge();
  updateTagBatchBadge();
  renderPendingList();
  if (selectedPendingId && !hubContext.pendingActions.some(p => p.id === selectedPendingId)) {
    selectedPendingId = null;
    closePendingDetail();
  }
  refreshPogWorkingChrome();
  updateSignedInDisplay();
}

function getFixtureState(lane, dbkey) {
  if (dbkey == null && lane == null) return 'not_started';
  if (typeof lane !== 'string' && typeof lane !== 'number' && dbkey != null && lane != null && typeof lane === 'object') {
    const f = lane;
    lane = f.lane;
    dbkey = f.dbkey;
  }
  if (!dbkey) return 'not_started';

  const laneKey = sectionKey(lane, dbkey);
  if (fixtureStates[laneKey] !== undefined) return fixtureStates[laneKey];

  const legacyKey = sectionKey('', dbkey);
  if (fixtureStates[legacyKey] !== undefined) return fixtureStates[legacyKey];

  const dbkeyOnly = String(dbkey);
  if (fixtureStates[dbkeyOnly] !== undefined) return fixtureStates[dbkeyOnly];

  const meta = getSectionMeta(lane, dbkey);
  if (meta?.state) return meta.state;

  return 'not_started';
}

/* ── Fixture shape renderers (neutral — no state colors at render time) ── */
function renderFxMetaRow(typeLabel, opts) {
  const badgeOnly = opts?.badgeOnly;
  const label = typeLabel != null && typeLabel !== '' ? String(typeLabel) : '';
  const rowClass = 'fx-meta-row' + (badgeOnly ? ' fx-meta-row--badge-only' : '');
  const tag = label
    ? '<div class="fx-type-tag">' + escapeHtml(label) + '</div>'
    : '<div class="fx-type-tag fx-type-tag--empty" aria-hidden="true"></div>';
  return '<div class="' + rowClass + '">' + tag + '</div>';
}

function renderStandInner(type) {
  const label = type === 'belted_sco' ? 'SCO' : type === 'checkstand' ? 'CS' : 'USCAN';
  return (
    '<div class="stand">' +
      '<div class="stand-block screen">SCREEN</div>' +
      '<div class="stand-block scanner">SCANNER</div>' +
      '<div class="stand-block bag">BAG</div>' +
    '</div>' +
    renderFxMetaRow(label)
  );
}

function formatFixtureDbkeyText(dbkey) {
  if (dbkey == null || dbkey === '') return '—';
  return String(dbkey);
}

function renderFxDbkeyHtml(f) {
  const text = formatFixtureDbkeyText(f.dbkey);
  return '<div class="fx-dbkey" title="DBKey ' + escapeHtml(text) + '">' + escapeHtml(text) + '</div>';
}

function renderFixtureEl(f) {
  const dbkeyAttr = f.dbkey || '';
  const dbkeyTitle = formatFixtureDbkeyText(f.dbkey);
  const muted = !f.on_manifest;
  const classes = ['fixture'];
  if (!muted) classes.push('interactive');
  if (muted) classes.push('muted');

  let inner = '';
  const t = f.type;

  if (t === 'uscan_stand' || t === 'belted_sco' || t === 'checkstand' || t === 'register') {
    inner = renderStandInner(t);
  } else if (t === 'side_shelf') {
    inner =
      '<div class="side-shelf-prim side-' + f.side + '">' +
        escapeHtml(shortName(f.name)) +
      '</div>' +
      renderFxMetaRow('', { badgeOnly: true });
  } else if (t === 'queue' || t === 'cigarette' || t === 'bag_rack' || t === 'misc_display' || t === 'unclassified') {
    inner =
      '<div class="h-bar">' +
        '<div class="fx-label">' + escapeHtml(shortName(f.name)) + '</div>' +
      '</div>' +
      renderFxMetaRow(t === 'unclassified' ? '?' : t.replace('_', ' '));
  } else {
    let size = 'size-md';
    if (t === 'liberty_tail' || t === 'cao_long') size = 'size-lg';
    else if (t === 'endcap') size = 'size-sm';
    inner =
      '<div class="block-prim ' + size + '">' +
        '<div class="fx-label">' + escapeHtml(shortName(f.name)) + '</div>' +
      '</div>' +
      renderFxMetaRow(t.replace('_', ' '));
  }

  return (
    '<div class="' + classes.join(' ') + '" ' +
      'data-dbkey="' + escapeHtml(dbkeyAttr) + '" ' +
      'data-action="' + escapeHtml(f.action) + '" ' +
      'data-lane="' + escapeHtml(f.lane) + '" ' +
      'title="' + escapeHtml(f.name + ' · DBKey ' + dbkeyTitle) + '">' +
      inner +
      renderFxDbkeyHtml(f) +
    '</div>'
  );
}

function flowArrowHtml() {
  return '<div class="flow-arrow" title="Customer flow toward front (right)" aria-hidden="true"></div>';
}

function renderHorizontalLaneRow(laneRow) {
  const lane = laneRow.lane;
  const fixtureHtml =
    (laneRow.left || []).map(renderFixtureEl).join('') +
    (laneRow.fixtures || []).map(renderFixtureEl).join('') +
    (laneRow.right || []).map(renderFixtureEl).join('');

  return (
    '<div class="lane-row" data-lane="' + escapeHtml(lane) + '">' +
      '<div class="lane-row-label">' +
        '<span class="lane-num">' + escapeHtml(lane) + '</span>' +
      '</div>' +
      '<div class="lane-row-fixtures">' + fixtureHtml + '</div>' +
      flowArrowHtml() +
    '</div>'
  );
}

    '<span class="legend-item">' +
      '<span class="legend-swatch muted-demo"></span>Not scheduled (muted)' +
    '</span>';
}

function statePillClass(st) {
  const key = WORK_STATES.includes(st) ? st : 'not_started';
  return 'state-pill state-pill--' + key;
}

function statePillHtml(f) {
  if (!f.on_manifest) {
    return '<span class="state-pill muted-pill">Not scheduled</span>';
  }
  const st = getFixtureState(f.lane, f.dbkey);
  return '<span class="' + statePillClass(st) + '">' +
    escapeHtml(STATE_LABELS[st]) + '</span>';
}

function renderList() {
  const rows = FIXTURES.slice().sort((a, b) => {
    let va, vb;
    switch (listSort.col) {
      case 'lane': va = Number(a.lane); vb = Number(b.lane); break;
      case 'name': va = a.name.toLowerCase(); vb = b.name.toLowerCase(); break;
      case 'type': va = a.type; vb = b.type; break;
      case 'state':
        va = a.on_manifest ? getFixtureState(a.lane, a.dbkey) : 'zzz';
        vb = b.on_manifest ? getFixtureState(b.lane, b.dbkey) : 'zzz';
        break;
      case 'assignee':
        va = a.on_manifest ? sectionAssigneeText(a.lane, a.dbkey).toLowerCase() : 'zzz';
        vb = b.on_manifest ? sectionAssigneeText(b.lane, b.dbkey).toLowerCase() : 'zzz';
        break;
      case 'dbkey':
        va = a.dbkey || '';
        vb = b.dbkey || '';
        break;
      default: va = a.lane; vb = b.lane;
    }
    if (va < vb) return listSort.asc ? -1 : 1;
    if (va > vb) return listSort.asc ? 1 : -1;
    return 0;
  });

  const arrow = col => listSort.col === col ? (listSort.asc ? ' ▲' : ' ▼') : '';

  const body = rows.map(f => {
    const clickable = f.on_manifest && f.dbkey;
    const assignee = f.on_manifest && f.dbkey ? sectionAssigneeText(f.lane, f.dbkey) : '—';
    const assigneeClass = assignee === 'Unassigned' || assignee === '—'
      ? 'assignee-cell assignee-cell--none'
      : 'assignee-cell';
    return (
      '<tr class="' + (f.on_manifest ? '' : 'row-muted') +
        (clickable ? ' row-clickable' : '') + '" ' +
        'data-list-key="' + escapeHtml(fixtureKey(f)) + '" ' +
        (clickable ? 'data-dbkey="' + escapeHtml(f.dbkey) + '" data-action="' + escapeHtml(f.action) + '" data-lane="' + escapeHtml(f.lane) + '"' : '') +
      '>' +
        '<td>' + escapeHtml(f.lane) + '</td>' +
        '<td class="dbkey-cell">' + escapeHtml(f.dbkey || '—') + '</td>' +
        '<td>' + escapeHtml(f.name) + '</td>' +
        '<td class="' + assigneeClass + '">' + escapeHtml(assignee) + '</td>' +
        '<td>' + escapeHtml(f.type) + '</td>' +
        '<td>' + statePillHtml(f) + '</td>' +
      '</tr>'
    );
  }).join('');

  document.getElementById('list-view').innerHTML =
    '<table class="list-table">' +
      '<thead><tr>' +
        '<th data-sort="lane">Lane' + arrow('lane') + '</th>' +
        '<th data-sort="dbkey">DBKey' + arrow('dbkey') + '</th>' +
        '<th data-sort="name">Name' + arrow('name') + '</th>' +
        '<th data-sort="assignee">Assignee' + arrow('assignee') + '</th>' +
        '<th data-sort="type">Type' + arrow('type') + '</th>' +
        '<th data-sort="state">State' + arrow('state') + '</th>' +
      '</tr></thead>' +
      '<tbody>' + body + '</tbody>' +
    '</table>';
}

function updateListStateCells() {
  const keyMap = {};
  FIXTURES.forEach(f => { keyMap[fixtureKey(f)] = f; });
  document.querySelectorAll('#list-view tbody tr[data-list-key]').forEach(row => {
    const f = keyMap[row.getAttribute('data-list-key')];
    if (!f) return;
    if (row.cells[5]) row.cells[5].innerHTML = statePillHtml(f);
    if (row.cells[3] && f.on_manifest && f.dbkey) {
      const assignee = sectionAssigneeText(f.lane, f.dbkey);
      row.cells[3].textContent = assignee;
      row.cells[3].className = assignee === 'Unassigned'
        ? 'assignee-cell assignee-cell--none'
        : 'assignee-cell';
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   STATE-BINDING SEAM — Step 3 plugs live data in here only.
   Do not hardcode state colors at render time; always go through applyState().
   ═══════════════════════════════════════════════════════════════════════════ */
function applyState(states) {
  fixtureStates = { ...states };

  const stateClasses = WORK_STATES.map(s => 'state-' + s);

  document.querySelectorAll('.fixture[data-dbkey]').forEach(el => {
    el.classList.remove(...stateClasses);

    if (el.classList.contains('muted')) return;

    const dbkey = el.getAttribute('data-dbkey');
    const lane = el.getAttribute('data-lane');
    const state = getFixtureState(lane, dbkey);
    el.classList.add('state-' + state);
  });

  updateListStateCells();
  updateMapAssigneeBadges();
  updateAssignmentsBadge();
  if (hubCurrentView === 'assignments') renderAssignmentsView();
  if (selectedDbkey) refreshDetailPanel();
  if (isPogViewOpen()) refreshPogWorkingChrome();
}

function setFixtureState(lane, dbkey, newState) {
  if (arguments.length === 2) {
    newState = dbkey;
    dbkey = lane;
    lane = '';
  }
  if (!dbkey || !WORK_STATES.includes(newState)) return;
  fixtureStates[sectionKey(lane, dbkey)] = newState;
  applyState(fixtureStates);
}

function openDetail(dbkey, action, opts) {
  const lane = opts?.lane;
  const fixture = findFixture(dbkey, action, lane);
  if (!fixture || !fixture.on_manifest) return;

  selectedDbkey = dbkey;
  selectedLane = fixture.lane;
  refreshDetailPanel(fixture);
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('overlay').classList.add('visible');
  document.getElementById('main-layout').classList.add('panel-open');
  if (!opts?.skipHistory) syncHubUrl({ fixture: dbkey, lane: fixture.lane, pog: null });
  saveHubSession({ fixture: dbkey, lane: fixture.lane, pog: null });
}

function hideDetailForPog() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('main-layout').classList.remove('panel-open');
}

function closeDetail(opts) {
  if (!opts?.skipHistory && isDetailOpen() && !confirmLeaveDetail()) {
    hubNavLock = true;
    syncHubUrl({ fixture: selectedDbkey, lane: selectedLane, pog: null });
    hubNavLock = false;
    return;
  }
  selectedDbkey = null;
  selectedLane = null;
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('main-layout').classList.remove('panel-open');
  if (!opts?.skipHistory) syncHubUrl({ fixture: null, lane: null, pog: null });
  saveHubSession({ fixture: null });
}

function refreshDetailPanel(fixture) {
  if (!fixture && selectedDbkey) {
    fixture = findFixture(selectedDbkey, null, selectedLane);
  }
  if (!fixture) return;

  const isLive = !!liveVisitId;
  let html =
    '<div class="detail-row"><div class="label">Name</div><div class="value">' + escapeHtml(fixture.name) + '</div></div>' +
    '<div class="detail-row"><div class="label">Lane</div><div class="value">' + escapeHtml(fixture.lane) + '</div></div>' +
    '<div class="detail-row"><div class="label">Type</div><div class="value">' + escapeHtml(fixture.type) + '</div></div>' +
    '<div class="detail-row"><div class="label">Action</div><div class="value"><code>' + escapeHtml(fixture.action) + '</code></div></div>' +
    '<div class="detail-row"><div class="label">DBKey</div><div class="value">' + escapeHtml(fixture.dbkey || '—') + '</div></div>' +
    '<div class="detail-row"><div class="label">On manifest</div><div class="value">' + (fixture.on_manifest ? 'Yes' : 'No') + '</div></div>' +
    '<div class="detail-row"><div class="label">Current state</div><div class="value">' + statePillHtml(fixture) + '</div></div>';

  if (isLive && fixture.dbkey) {
    html += buildSectionWorkflowHtml(fixture.lane, fixture.dbkey, 'detail');
  }

  if (fixture.dbkey) {
    let pogBtnLabel = 'Open POG / Work this set';
    if (isLive) {
      if (isSectionNotInStore(fixture.lane, fixture.dbkey)) {
        pogBtnLabel = 'View POG (not in store)';
      } else if (isSectionSignedOff(fixture.lane, fixture.dbkey)) {
        pogBtnLabel = 'View POG (signed off)';
      }
    }
    html += '<div class="detail-row"><button type="button" class="btn btn-pog-open" id="btn-open-pog">' +
      escapeHtml(pogBtnLabel) + '</button></div>';
  }

  if (!isLive) {
    const stateBtns = WORK_STATES.map(s =>
      '<button type="button" class="state-btn" data-state="' + s + '">' +
        escapeHtml(STATE_LABELS[s]) +
      '</button>'
    ).join('');
    html += '<div class="detail-row"><div class="label">Change state</div><div class="state-buttons" id="state-buttons">' + stateBtns + '</div></div>';
  } else if (hubContext.myRank >= 1 && canRaiseSectionFlags(fixture.lane, fixture.dbkey)) {
    html +=
      '<div class="flag-actions" id="flag-actions">' +
        '<div class="label">Raise flag (rep)</div>' +
        '<button type="button" class="flag-btn flag-help" id="flag-help">Needs help</button>' +
        '<button type="button" class="flag-btn flag-tag" id="flag-tag-toggle">Missing tag</button>' +
        '<div class="missing-tag-form" id="missing-tag-form">' +
          '<label for="flag-upc">UPC</label>' +
          '<input type="text" id="flag-upc" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Scan or enter UPC">' +
          '<label for="flag-desc">Description (optional)</label>' +
          '<input type="text" id="flag-desc" autocomplete="off" placeholder="Product name">' +
          '<label for="flag-loc">Location (optional)</label>' +
          '<input type="text" id="flag-loc" autocomplete="off" placeholder="Shelf / position">' +
          '<div class="form-actions">' +
            '<button type="button" class="btn btn-submit" id="flag-tag-submit">Add to planogram list</button>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="flag-btn flag-nis" id="flag-nis">Not in store</button>' +
        '<div class="flag-status" id="flag-status"></div>' +
      '</div>';
  } else if (isLive && isSectionNotInStore(fixture.lane, fixture.dbkey)) {
    html +=
      '<div class="detail-row signed-off-note">' +
        '<div class="label">Rep flags</div>' +
        '<div class="value">Lead confirmed this set is not in store. Reopen it if the set is found.</div>' +
      '</div>';
  } else if (isLive && isSectionSignedOff(fixture.lane, fixture.dbkey)) {
    html +=
      '<div class="detail-row signed-off-note">' +
        '<div class="label">Rep flags</div>' +
        '<div class="value">This set is signed off. Leads can reopen it if more work is needed.</div>' +
      '</div>';
  }

  document.getElementById('detail-body').innerHTML = html;

  document.getElementById('btn-open-pog')?.addEventListener('click', () => {
    openPogWorkingView(fixture);
  });

  if (!isLive) {
    document.getElementById('state-buttons').addEventListener('click', e => {
      const btn = e.target.closest('[data-state]');
      if (!btn || !fixture.dbkey) return;
      setFixtureState(fixture.lane, fixture.dbkey, btn.getAttribute('data-state'));
    });
    return;
  }

  bindSectionWorkflow(fixture.lane, fixture.dbkey, {
    assignSelectId: 'section-assign-select',
    assignBtnId: 'section-assign-btn',
    unassignBtnId: 'section-unassign-btn',
    reopenReasonId: 'section-reopen-reason',
    reopenBtnId: 'section-reopen-btn',
    assignRowId: 'section-assign-row',
    startId: 'section-start',
    markDoneId: 'section-mark-done',
    signoffId: 'section-signoff',
    statusId: 'workflow-status',
  });

  const statusEl = document.getElementById('flag-status');
  const setFlagStatus = (msg, kind) => {
    if (!statusEl) return;
    statusEl.textContent = msg || '';
    statusEl.className = 'flag-status' + (kind ? ' ' + kind : '');
  };

  const disableFlags = (disabled) => {
    document.querySelectorAll('#flag-actions .flag-btn, #flag-tag-submit').forEach(btn => {
      btn.disabled = disabled;
    });
  };

  document.getElementById('flag-help')?.addEventListener('click', async () => {
    disableFlags(true);
    setFlagStatus('Raising help flag…');
    try {
      await hubMutatePost('/sections/' + encodeURIComponent(fixture.dbkey) + '/flag/help', { lane: fixture.lane });
      setFlagStatus('Help request sent — pending lead review', 'ok');
    } catch (err) {
      setFlagStatus(err.message || 'Failed', 'error');
      disableFlags(false);
    }
  });

  document.getElementById('flag-nis')?.addEventListener('click', async () => {
    disableFlags(true);
    setFlagStatus('Raising not-in-store flag…');
    try {
      await hubMutatePost('/sections/' + encodeURIComponent(fixture.dbkey) + '/flag/nis', {
        lane: fixture.lane,
        ...nisFixtureMeta(fixture),
      });
      setFlagStatus('Not-in-store flag sent — pending lead review', 'ok');
    } catch (err) {
      setFlagStatus(err.message || 'Failed', 'error');
      disableFlags(false);
    }
  });

  document.getElementById('flag-tag-toggle')?.addEventListener('click', () => {
    document.getElementById('missing-tag-form')?.classList.toggle('open');
    const upc = document.getElementById('flag-upc');
    if (upc) setTimeout(() => upc.focus(), 50);
  });

  document.getElementById('flag-tag-submit')?.addEventListener('click', async () => {
    const upc = (document.getElementById('flag-upc')?.value || '').trim();
    if (!upc) {
      setFlagStatus('UPC is required', 'error');
      document.getElementById('flag-upc')?.focus();
      return;
    }
    disableFlags(true);
    setFlagStatus('Adding to planogram list…');
    try {
      await hubPost('/sections/' + encodeURIComponent(fixture.dbkey) + '/flag/missing-tag', {
        lane: fixture.lane,
        upc,
        description: (document.getElementById('flag-desc')?.value || '').trim() || undefined,
        location: (document.getElementById('flag-loc')?.value || '').trim() || undefined,
      });
      setFlagStatus('Added — open POG to review and submit all tags for this set', 'ok');
    } catch (err) {
      setFlagStatus(err.message || 'Failed', 'error');
      disableFlags(false);
    }
  });
}

function setView(view, opts) {
  const isMap = view === 'map';
  const isList = view === 'list';
  const isAssignments = view === 'assignments';
  hubCurrentView = view;
  document.getElementById('map-view').classList.toggle('view-hidden', !isMap);
  document.getElementById('list-view').classList.toggle('view-hidden', !isList);
  document.getElementById('assignments-view').classList.toggle('view-hidden', !isAssignments);
  document.getElementById('btn-map').classList.toggle('active', isMap);
  document.getElementById('btn-list').classList.toggle('active', isList);
  document.getElementById('btn-assignments').classList.toggle('active', isAssignments);
  if (isAssignments) {
    loadHubRoster().then(() => renderAssignmentsView());
  }
  if (!opts?.skipHistory) syncHubUrl({ view });
  saveHubSession({ view });
}

function hubSessionRead() {
  try {
    return JSON.parse(sessionStorage.getItem(HUB_SESSION_KEY) || '{}');
  } catch {
    return {};
  }
}

function saveHubSession(partial) {
  try {
    const cur = hubSessionRead();
    sessionStorage.setItem(HUB_SESSION_KEY, JSON.stringify({
      ...cur,
      ...partial,
      ts: Date.now(),
    }));
  } catch { /* private mode */ }
}

function getHubUrlParams() {
  return new URLSearchParams(window.location.search);
}

function readHubUrlState() {
  const p = getHubUrlParams();
  return {
    visit: p.get('visit'),
    view: p.get('view') || 'map',
    fixture: p.get('fixture'),
    lane: p.get('lane'),
    pog: p.get('pog'),
  };
}

function buildHubUrl(patch) {
  const p = getHubUrlParams();
  Object.entries(patch).forEach(([key, value]) => {
    if (value == null || value === '') p.delete(key);
    else p.set(key, value);
  });
  const q = p.toString();
  return window.location.pathname + (q ? '?' + q : '');
}

function syncHubUrl(patch, replace) {
  if (hubNavLock) return;
  const url = buildHubUrl(patch);
  const state = { hub: { ...readHubUrlState(), ...patch } };
  if (replace) history.replaceState(state, '', url);
  else history.pushState(state, '', url);
}

function isPogViewOpen() {
  return document.getElementById('pog-working-view')?.classList.contains('open');
}

function isDetailOpen() {
  return document.getElementById('detail-panel')?.classList.contains('open');
}

function isActiveWorkSession() {
  return isPogViewOpen() || (isDetailOpen() && !!selectedDbkey);
}

function confirmLeavePog() {
  if (typeof Scanner !== 'undefined' && Scanner.isRunning) {
    return window.confirm('Scanner is active. Leave this set?');
  }
  const input = document.getElementById('pog-wv-search-input');
  if (input && input.value.trim()) {
    return window.confirm('Leave this set? Your search will be saved for this session.');
  }
  return window.confirm('Leave this set and go back?');
}

function confirmLeaveDetail() {
  return window.confirm('Close this fixture detail?');
}

const LEAVE_POG_DOUBLE_MS = 500;
let leavePogArmedAt = 0;
let leavePogConfirmTimer = null;

function resetLeavePogBackState() {
  if (leavePogConfirmTimer) {
    clearTimeout(leavePogConfirmTimer);
    leavePogConfirmTimer = null;
  }
  leavePogArmedAt = 0;
  document.getElementById('pog-wv-back')?.classList.remove('armed');
}

function updatePogWvBackButton() {
  const backBtn = document.getElementById('pog-wv-back');
  if (!backBtn) return;
  if (pogSearchReturnState && pogSearchReturnState.fixture) {
    const origin = pogSearchReturnState.fixture;
    backBtn.textContent = '← Back to your set';
    backBtn.title = 'Return to ' + shortName(origin.name) + ' (lane ' + origin.lane + ')';
    backBtn.classList.add('return-set');
  } else {
    backBtn.textContent = '← Back';
    backBtn.title = '';
    backBtn.classList.remove('return-set');
  }
}

function clearPogSearchReturnState() {
  pogSearchReturnState = null;
  updatePogWvBackButton();
}

async function openPogFromSearchHit(dbkey, upc) {
  const fix = fixtureForDbkey(dbkey);
  if (!fix || !pogWorkingFixture) return;
  if (String(fix.dbkey) === String(pogWorkingFixture.dbkey)) {
    if (upc) highlightPogTile(upc);
    return;
  }

  if (!pogSearchReturnState) {
    pogSearchReturnState = {
      fixture: pogWorkingFixture,
      searchQuery: document.getElementById('pog-wv-search-input')?.value || '',
      pogMask: pogMaskCardOpacity,
      scrollTop: document.getElementById('pog-wv-scroll')?.scrollTop || 0,
    };
  }

  updatePogWvBackButton();
  await openPogWorkingView(fix, {
    skipHistory: true,
    peekMode: true,
    searchHighlightUpc: upc || null,
  });
}

async function returnFromPogSearchPeek() {
  const state = pogSearchReturnState;
  if (!state?.fixture) return;

  pogSearchReturnState = null;
  updatePogWvBackButton();

  await openPogWorkingView(state.fixture, {
    skipHistory: true,
    restoreSession: true,
    session: {
      pogSearch: state.searchQuery,
      pogMask: state.pogMask,
    },
  });

  const scrollEl = document.getElementById('pog-wv-scroll');
  if (scrollEl) scrollEl.scrollTop = state.scrollTop || 0;

  syncHubUrl({
    pog: state.fixture.dbkey,
    fixture: state.fixture.dbkey,
    lane: state.fixture.lane,
    view: hubCurrentView,
  }, true);
}

/** First back tap waits; second within 500ms leaves immediately; otherwise confirm. */
function requestLeavePog(onLeave) {
  const now = Date.now();
  const backBtn = document.getElementById('pog-wv-back');

  if (leavePogConfirmTimer) {
    clearTimeout(leavePogConfirmTimer);
    leavePogConfirmTimer = null;
  }

  if (leavePogArmedAt && (now - leavePogArmedAt) < LEAVE_POG_DOUBLE_MS) {
    resetLeavePogBackState();
    onLeave();
    return;
  }

  leavePogArmedAt = now;
  backBtn?.classList.add('armed');
  leavePogConfirmTimer = setTimeout(() => {
    leavePogConfirmTimer = null;
    leavePogArmedAt = 0;
    backBtn?.classList.remove('armed');
    if (confirmLeavePog()) onLeave();
  }, LEAVE_POG_DOUBLE_MS);
}

function handleHubPopState() {
  if (hubNavLock) return;
  const url = readHubUrlState();

  if (isPogViewOpen() && !url.pog) {
    hubNavLock = true;
    syncHubUrl({ pog: pogWorkingFixture?.dbkey || null, fixture: selectedDbkey || url.fixture || null });
    hubNavLock = false;
    requestLeavePog(() => closePogWorkingView({ skipHistory: true, skipConfirm: true }));
    return;
  }

  if (url.view && url.view !== hubCurrentView) {
    setView(url.view, { skipHistory: true });
  }

  if (url.pog) {
    const fix = fixtureForDbkey(url.pog);
    if (fix && fix.dbkey !== pogWorkingFixture?.dbkey) {
      openPogWorkingView(fix, { skipHistory: true });
    }
    return;
  }

  if (url.fixture) {
    const fix = findFixture(url.fixture, null, url.lane);
    if (fix && (!isDetailOpen() || selectedDbkey !== url.fixture || selectedLane !== fix.lane)) {
      openDetail(url.fixture, fix.action, { lane: fix.lane, skipHistory: true });
    }
    return;
  }

  if (isDetailOpen()) closeDetail({ skipHistory: true });
}

async function restoreHubNavigation() {
  const url = readHubUrlState();
  hubNavLock = true;
  if (url.view === 'list') setView('list', { skipHistory: true });
  else if (url.view === 'assignments') setView('assignments', { skipHistory: true });
  else setView('map', { skipHistory: true });

  if (url.fixture) {
    const fix = findFixture(url.fixture, null, url.lane);
    if (fix) openDetail(url.fixture, fix.action, { lane: fix.lane, skipHistory: true });
  }

  if (url.pog) {
    const fix = fixtureForDbkey(url.pog);
    if (fix) {
      const sess = hubSessionRead();
      await openPogWorkingView(fix, { skipHistory: true, restoreSession: true, session: sess });
    }
  }
  hubNavLock = false;
  syncHubUrl({
    view: url.view || hubCurrentView,
    fixture: url.pog ? (fixtureForDbkey(url.pog)?.dbkey || url.fixture) : url.fixture,
    pog: url.pog,
  }, true);
}

  document.getElementById('btn-map').addEventListener('click', () => {
    if (isPogViewOpen()) {
      requestLeavePog(() => closePogWorkingView({ skipConfirm: true }));
      return;
    }

    if (isDetailOpen()) closeDetail({ skipHistory: true });
    setView('map');
  });
  document.getElementById('btn-list').addEventListener('click', () => {
    if (isPogViewOpen()) {
      requestLeavePog(() => closePogWorkingView({ skipConfirm: true }));
      return;
    }

    if (isDetailOpen()) closeDetail({ skipHistory: true });
    setView('list');
  });
  document.getElementById('btn-assignments').addEventListener('click', () => {
    if (isPogViewOpen()) {
      requestLeavePog(() => closePogWorkingView({ skipConfirm: true }));
      return;
    }
    if (isDetailOpen() && !confirmLeaveDetail()) return;
    if (isDetailOpen()) closeDetail({ skipHistory: true });
    setView('assignments');
  });

  document.getElementById('assignments-view').addEventListener('click', async e => {
    if (e.target.closest('.assign-set-actions')) {
      const unassignBtn = e.target.closest('.assign-set-unassign-btn');
      if (unassignBtn) {
        e.preventDefault();
        e.stopPropagation();
        const row = unassignBtn.closest('.assign-set-row[data-dbkey]');
        if (row) await handleInlineUnassign(row);
        return;
      }
      const btn = e.target.closest('.assign-set-btn');
      if (btn) {
        e.preventDefault();
        e.stopPropagation();
        const row = btn.closest('.assign-set-row[data-dbkey]');
        if (row) await handleInlineAssignment(row);
      }
      return;
    }

    const row = e.target.closest('.assign-set-row[data-dbkey]');
    if (!row) return;
    openDetail(row.getAttribute('data-dbkey'), row.getAttribute('data-action'), {
      lane: row.getAttribute('data-lane'),
    });
  });

  document.getElementById('map-view').addEventListener('click', e => {
    const el = e.target.closest('.fixture.interactive[data-dbkey]');
    if (!el) return;
    const dbkey = el.getAttribute('data-dbkey');
    const action = el.getAttribute('data-action');
    const lane = el.getAttribute('data-lane');
    if (dbkey) openDetail(dbkey, action, { lane });
  });

  document.getElementById('list-view').addEventListener('click', e => {
    const th = e.target.closest('th[data-sort]');
    if (th) {
      const col = th.getAttribute('data-sort');
      if (listSort.col === col) listSort.asc = !listSort.asc;
      else { listSort.col = col; listSort.asc = true; }
      renderList();
      applyState(fixtureStates);
      return;
    }
    const row = e.target.closest('tr.row-clickable[data-dbkey]');
    if (!row) return;
    openDetail(row.getAttribute('data-dbkey'), row.getAttribute('data-action'), {
      lane: row.getAttribute('data-lane'),
    });
  });

  document.getElementById('detail-close').addEventListener('click', closeDetail);
  document.getElementById('overlay').addEventListener('click', closeDetail);

  document.getElementById('pending-badge').addEventListener('click', () => {
    if (hubContext.myRank >= 2) {
      toggleTagBatchPanel(false);
      togglePendingPanel(true);
    }
  });
  document.getElementById('pending-close').addEventListener('click', () => togglePendingPanel(false));

  document.getElementById('tag-batch-badge').addEventListener('click', () => {
    if (hubContext.myRank >= 2) {
      togglePendingPanel(false);
      toggleTagBatchPanel(true);
    }
  });
  document.getElementById('tag-batch-close').addEventListener('click', () => toggleTagBatchPanel(false));
  document.getElementById('btn-send-tag-batch').addEventListener('click', () => sendTagBatchEmail());
  document.getElementById('btn-verify-all-tags')?.addEventListener('click', () => verifyAllPendingMissingTags());
  document.getElementById('btn-refresh-tag-gather')?.addEventListener('click', () => loadTagBatchPreview());

  document.getElementById('pog-wv-back').addEventListener('click', () => {
    if (pogSearchReturnState) {
      resetLeavePogBackState();
      returnFromPogSearchPeek();
      return;
    }
    requestLeavePog(() => closePogWorkingView({ skipConfirm: true }));
  });
  document.getElementById('pog-wv-scroll').addEventListener('click', e => {
    const openBtn = e.target.closest('[data-open-pog-dbkey]');
    if (openBtn) {
      openPogFromSearchHit(
        openBtn.getAttribute('data-open-pog-dbkey'),
        openBtn.getAttribute('data-open-pog-upc'),
      );
      return;
    }
    const tile = e.target.closest('.pog-wv-tile, .planogram-tile');
    if (tile && tile.dataset.upc) {
      const hit = findPogProduct(tile.dataset.upc, tile.dataset.bay, tile.dataset.fixture);
      if (hit) openPogProductModal(hit.prod, hit.bay, hit.fixture);
    }
  });

  document.getElementById('pog-product-modal-close')?.addEventListener('click', closePogProductModal);
  document.getElementById('pog-product-modal')?.addEventListener('click', e => {
    if (e.target.id === 'pog-product-modal') closePogProductModal();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && typeof Scanner !== 'undefined' && Scanner.isRunning) {
      acquirePogScannerWakeLock();
    } else if (document.visibilityState === 'hidden') {
      releasePogScannerWakeLock();
    }
  });

  window.addEventListener('popstate', handleHubPopState);

  window.addEventListener('beforeunload', (e) => {
    if (isActiveWorkSession()) {
      saveHubSession({
        pogSearch: document.getElementById('pog-wv-search-input')?.value || '',
        pogMask: pogMaskCardOpacity,
      });
      e.preventDefault();
      e.returnValue = '';
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   POG WORKING VIEW — read-only virtual planogram + scoped search (Phase 2)
   ═══════════════════════════════════════════════════════════════════════════ */
let pogProductsCache = null;
let pogCatalogCache = null;
let pogCatalogLoadPromise = null;
const pogLayoutCache = {};
let pogWorkingFixture = null;
let pogWorkingLayout = null;
let pogMaskCardOpacity = 0;
let pogSelectedProduct = null;
let pogLastNotFoundUpc = null;
let pogSearchReturnState = null;
let pogWvActionsBound = false;
let pogSearchUiBound = false;
let pogScannerWakeLock = null;

function pogUrl(path) {
  return POG_SERVICE_BASE + path;
}

async function ensurePogCatalogLoaded() {
  if (pogProductsCache && pogCatalogCache) return;
  if (!pogCatalogLoadPromise) {
    pogCatalogLoadPromise = Promise.all([
      fetch(pogUrl('/products.json')).then(r => {
        if (!r.ok) throw new Error('products.json ' + r.status);
        return r.json();
      }),
      fetch(pogUrl('/pog_products.json')).then(r => {
        if (!r.ok) throw new Error('pog_products.json ' + r.status);
        return r.json();
      }),
    ]).then(([products, pogProducts]) => {
      pogCatalogCache = products;
      pogProductsCache = pogProducts;
    });
  }
  try {
    await pogCatalogLoadPromise;
  } catch (err) {
    pogCatalogLoadPromise = null;
    throw err;
  }
}

async function fetchPogLayout(dbkey) {
  const dk = String(dbkey);
  if (pogLayoutCache[dk]) return pogLayoutCache[dk];
  const resp = await fetch(pogUrl('/pog_layouts/' + encodeURIComponent(dk) + '.json'));
  if (resp.status === 404) return null;
  if (!resp.ok) throw new Error('Layout fetch failed (' + resp.status + ')');
  const layout = await resp.json();
  pogLayoutCache[dk] = layout;
  return layout;
}

function pdfFilenameFromFixture(fixture) {
  if (!fixture) return null;
  const id = fixture.manifest_pog_id;
  if (id) return id + '.pdf';
  return null;
}

function productInfo(upc) {
  return (pogCatalogCache && pogCatalogCache[String(upc)]) || null;
}

function upcsForDbkeyStore(dbkey, storeNum) {
  if (!pogProductsCache || !dbkey) return [];
  const byStore = pogProductsCache[String(dbkey)];
  if (!byStore) return [];
  const sn = String(storeNum || HUB_STORE_NUM);
  return byStore[sn] || byStore[sn.replace(/^0+/, '')] || [];
}

function uniqueManifestDbkeys() {
  const seen = new Set();
  const out = [];
  for (const f of FIXTURES) {
    if (f.dbkey && f.on_manifest && !seen.has(f.dbkey)) {
      seen.add(f.dbkey);
      out.push(f.dbkey);
    }
  }
  return out;
}

function dbkeysInLane(lane) {
  const seen = new Set();
  const out = [];
  for (const f of FIXTURES) {
    if (f.lane === lane && f.dbkey && f.on_manifest && !seen.has(f.dbkey)) {
      seen.add(f.dbkey);
      out.push(f.dbkey);
    }
  }
  return out;
}

function fixtureForDbkey(dbkey) {
  return FIXTURES.find(f => f.dbkey === String(dbkey) && f.on_manifest) ||
    FIXTURES.find(f => f.dbkey === String(dbkey));
}

function normalizeUpcDigits(value) {
  return String(value == null ? '' : value).replace(/\D/g, '');
}

function normalizeUpcInput(value) {
  return normalizeUpcDigits(value).replace(/^0+/, '');
}

function getUpcCandidates(raw) {
  const cleanScan = normalizeUpcInput(raw);
  const scanNoCheck = cleanScan.length > 1 ? cleanScan.slice(0, -1) : cleanScan;
  return { cleanScan, scanNoCheck, candidates: [cleanScan, scanNoCheck] };
}

function expandScanCandidates(rawCode) {
  const digits = normalizeUpcDigits(rawCode);
  const out = new Set();
  const add = (value) => {
    const v = normalizeUpcInput(value);
    if (v) out.add(v);
  };

  add(digits);
  const { cleanScan, scanNoCheck, candidates } = getUpcCandidates(rawCode);
  candidates.forEach(add);
  add(scanNoCheck);

  if (digits.length >= 12) add(digits.slice(0, -1));
  if (digits.length === 13) {
    add(digits.slice(1, -1));
    add(digits.slice(1));
  }
  if (digits.length === 14) add(digits.slice(2, -1));
  if (digits.length >= 10) add(digits.slice(-10));
  if (digits.length >= 11) add(digits.slice(-11));

  return [...out];
}

function collectUpcsFromDbkeys(dbkeys) {
  const out = new Set();
  for (const dk of dbkeys || []) {
    for (const upc of upcsForDbkeyStore(dk, HUB_STORE_NUM)) out.add(String(upc));
  }
  return [...out];
}

function collectLayoutUpcs(layout) {
  const out = new Set();
  walkLayoutProducts(layout, (prod) => out.add(String(prod.upc)));
  return [...out];
}

function resolveScanToCatalogUpc(rawCode) {
  const rawDigits = normalizeUpcDigits(rawCode);
  const scanCandidates = expandScanCandidates(rawCode);
  const pools = [];

  if (pogWorkingLayout) {
    pools.push({ scope: 'this', upcs: collectLayoutUpcs(pogWorkingLayout) });
  }
  if (pogWorkingFixture?.lane) {
    pools.push({ scope: 'lane', upcs: collectUpcsFromDbkeys(dbkeysInLane(pogWorkingFixture.lane)) });
  }
  pools.push({ scope: 'store', upcs: collectUpcsFromDbkeys(uniqueManifestDbkeys()) });

  for (const pool of pools) {
    for (const cand of scanCandidates) {
      for (const upc of pool.upcs) {
        if (normalizeUpcInput(upc) === cand || upcMatchesQuery(cand, upc)) {
          return { upc, display: normalizeUpcInput(upc), raw: rawCode, method: pool.scope };
        }
      }
    }
    if (rawDigits.length >= 4) {
      const suffix = rawDigits.slice(-4);
      const suffixMatches = pool.upcs.filter(u => normalizeUpcInput(u).endsWith(suffix));
      if (suffixMatches.length === 1) {
        return {
          upc: suffixMatches[0],
          display: normalizeUpcInput(suffixMatches[0]),
          raw: rawCode,
          method: pool.scope + '-suffix4',
        };
      }
    }
  }

  const fallback = normalizeUpcInput(rawCode);
  return { upc: fallback, display: fallback, raw: rawCode, method: 'none' };
}

function upcMatchesQuery(query, upc) {
  const q = normalizeUpcDigits(query);
  const u = normalizeUpcDigits(upc);
  if (!q || !u) return false;
  if (u === q) return true;

  const qNorm = normalizeUpcInput(query);
  const pUpc = normalizeUpcInput(upc);
  if (qNorm && pUpc === qNorm) return true;

  if (/^\d{4}$/.test(q) && u.endsWith(q)) return true;
  if (q.length >= 4 && u.endsWith(q)) return true;

  const { cleanScan, scanNoCheck, candidates } = getUpcCandidates(query);
  if (candidates.includes(pUpc)) return true;
  if (pUpc === scanNoCheck) return true;
  if (pUpc.length > 8 && (pUpc.startsWith(cleanScan) || cleanScan.startsWith(pUpc))) {
    if (Math.abs(pUpc.length - cleanScan.length) === 1) return true;
  }
  return false;
}

function textMatchesQuery(query, text) {
  const q = String(query || '').trim().toLowerCase();
  if (q.length < 2) return false;
  return String(text || '').toLowerCase().includes(q);
}

function productDisplayName(upc, layoutProduct) {
  const info = productInfo(upc);
  if (info && info.name) return info.name;
  if (layoutProduct && layoutProduct.desc_fallback) return layoutProduct.desc_fallback;
  if (info && info.fallback_desc) return info.fallback_desc;
  return 'UPC ' + upc;
}

function productDisplaySize(upc, layoutProduct) {
  const info = productInfo(upc);
  if (info && info.size) return info.size;
  if (layoutProduct && layoutProduct.size_fallback) return layoutProduct.size_fallback;
  if (info && info.fallback_size) return info.fallback_size;
  return '';
}

function parsePegPosition(code) {
  if (!code) return null;
  const m = String(code).match(/^R\s*(\d+)\s*C\s*(\d+)$/i);
  if (!m) return null;
  return { row: parseInt(m[1], 10), col: parseInt(m[2], 10) };
}

function walkLayoutProducts(layout, visitor) {
  if (!layout || !Array.isArray(layout.bays)) return;
  for (const bay of layout.bays) {
    const fixtures = (bay.fixtures || []).slice();
    for (const fixture of fixtures) {
      for (const prod of fixture.products || []) {
        visitor(prod, bay, fixture);
      }
    }
  }
}

function fixtureLocationLabel(bay, fixture) {
  const type = fixture.type === 'pegboard' ? 'pegboard' : (fixture.label || fixture.type || 'fixture');
  return 'bay ' + bay.bay_num + ', ' + type + ' ' + (fixture.fixture_num || '');
}

function searchInLayout(layout, query) {
  const hits = [];
  if (!layout) return hits;
  const qDigits = normalizeUpcDigits(query);
  const isShortUpcQuery = /^\d{4}$/.test(qDigits);

  walkLayoutProducts(layout, (prod, bay, fixture) => {
    const name = productDisplayName(prod.upc, prod);
    const desc = prod.desc_fallback || name;
    let match = false;
    if (isShortUpcQuery) {
      match = normalizeUpcInput(prod.upc).endsWith(qDigits);
    } else {
      match = upcMatchesQuery(query, prod.upc) || textMatchesQuery(query, desc) || textMatchesQuery(query, name);
    }
    if (!match) return;
    hits.push({
      scope: 'this',
      upc: prod.upc,
      name,
      location: fixtureLocationLabel(bay, fixture),
      bayNum: bay.bay_num,
      fixtureNum: fixture.fixture_num,
      dbkey: layout.dbkey,
    });
  });
  return hits;
}

function searchInDbkeyList(dbkeys, query, excludeDbkey) {
  const hits = [];
  const qDigits = normalizeUpcDigits(query);
  const isShortUpcQuery = /^\d{4}$/.test(qDigits);
  const isUpcQuery = qDigits.length >= 4;

  for (const dk of dbkeys) {
    if (dk === excludeDbkey) continue;
    const upcs = upcsForDbkeyStore(dk, HUB_STORE_NUM);
    for (const upc of upcs) {
      const info = productInfo(upc);
      const name = productDisplayName(upc, null);
      const desc = (info && info.fallback_desc) || name;
      let match = false;
      if (isShortUpcQuery) {
        match = normalizeUpcInput(upc).endsWith(qDigits);
      } else if (isUpcQuery) {
        match = upcMatchesQuery(query, upc);
      } else {
        match = textMatchesQuery(query, name) || textMatchesQuery(query, desc);
      }
      if (!match) continue;
      const fix = fixtureForDbkey(dk);
      hits.push({
        scope: 'other',
        upc,
        name,
        dbkey: dk,
        title: fix ? shortName(fix.name) : ('DBKey ' + dk),
        lane: fix ? fix.lane : '—',
      });
    }
  }
  return hits;
}

function runPogSearch(query) {
  const q = String(query || '').trim();
  if (!q) return { hits: [], notFound: false };

  let hits = searchInLayout(pogWorkingLayout, q);
  if (hits.length) return { hits, notFound: false };

  const lane = pogWorkingFixture ? pogWorkingFixture.lane : null;
  if (lane) {
    hits = searchInDbkeyList(dbkeysInLane(lane), q, pogWorkingFixture.dbkey);
    if (hits.length) return { hits, notFound: false };
  }

  hits = searchInDbkeyList(uniqueManifestDbkeys(), q, pogWorkingFixture ? pogWorkingFixture.dbkey : null);
  if (hits.length) return { hits, notFound: false };

  return { hits: [], notFound: true };
}

function formatPogPosition(bay, fixture, prod) {
  if (fixture.type === 'pegboard') {
    const lines = [String(prod.pos)];
    const peg = parsePegPosition(prod.position_code);
    if (peg) {
      lines.push('R' + String(peg.row).padStart(2, '0'));
      lines.push('C' + String(peg.col).padStart(2, '0'));
    }
    return lines.join('\n');
  }
  return 'Bay ' + bay.bay_num + ' · ' + (fixture.label || 'Shelf') + ' · Position ' + prod.pos;
}

function aisleFromFixtureLane(lane) {
  const digits = String(lane || '').replace(/\D/g, '');
  if (!digits) return '0';
  const n = Number(digits);
  return Number.isFinite(n) ? String(n) : digits;
}

function compactTagLocation(bay, fixture, prod, lane) {
  const aisle = aisleFromFixtureLane(lane);
  if (fixture.type === 'pegboard') {
    const peg = parsePegPosition(prod.position_code);
    if (peg) {
      return aisle + 'R' + String(peg.row).padStart(2, '0') + 'C' + String(peg.col).padStart(2, '0');
    }
  }
  return aisle + 'B' + String(bay.bay_num).padStart(2, '0') + 'F' + String(fixture.fixture_num || 0).padStart(2, '0') + 'P' + String(prod.pos).padStart(2, '0');
}

function renderPogPositionCardHtml(fixture, prod) {
  if (fixture.type === 'pegboard') {
    const peg = parsePegPosition(prod.position_code);
    let html = '<span>' + escapeHtml(String(prod.pos)) + '</span>';
    if (peg) {
      html += '<span>R' + escapeHtml(String(peg.row).padStart(2, '0')) + '</span>';
      html += '<span>C' + escapeHtml(String(peg.col).padStart(2, '0')) + '</span>';
    }
    return html;
  }
  return '<span>' + escapeHtml(String(prod.pos)) + '</span>';
}

function findPogProduct(upc, bayNum, fixtureNum) {
  if (!pogWorkingLayout) return null;
  let found = null;
  walkLayoutProducts(pogWorkingLayout, (prod, bay, fixture) => {
    if (String(prod.upc) === String(upc) &&
        String(bay.bay_num) === String(bayNum) &&
        String(fixture.fixture_num) === String(fixtureNum)) {
      found = { prod, bay, fixture };
    }
  });
  return found;
}

function openPogProductModal(prod, bay, fixture) {
  const modal = document.getElementById('pog-product-modal');
  if (!modal) return;

  const upc = String(prod.upc);
  const info = productInfo(upc);
  const img = document.getElementById('pog-product-modal-img');
  const fallback = document.getElementById('pog-product-modal-img-fallback');
  const displayName = productDisplayName(upc, prod);

  if (img) {
    img.classList.remove('is-hidden');
    img.src = pogUrl('/products-png/' + encodeURIComponent(upc) + '.png');
    img.alt = displayName;
    img.onerror = () => {
      img.classList.add('is-hidden');
      if (fallback) {
        fallback.textContent = displayName;
        fallback.classList.add('visible');
      }
    };
    img.onload = () => {
      if (fallback) fallback.classList.remove('visible');
    };
  }

  const nameEl = document.getElementById('pog-product-modal-name');
  if (nameEl) nameEl.textContent = displayName;
  const brandEl = document.getElementById('pog-product-modal-brand');
  if (brandEl) brandEl.textContent = (info && info.brand) || '';
  const sizeEl = document.getElementById('pog-product-modal-size');
  if (sizeEl) sizeEl.textContent = productDisplaySize(upc, prod);
  const upcEl = document.getElementById('pog-product-modal-upc');
  if (upcEl) upcEl.textContent = 'UPC: ' + upc;
  const posEl = document.getElementById('pog-product-modal-position');
  if (posEl) posEl.textContent = formatPogPosition(bay, fixture, prod);
  const metaEl = document.getElementById('pog-product-modal-meta');
  if (metaEl) metaEl.textContent = 'Facings: ' + Math.max(1, prod.facings || 1);
  const newEl = document.getElementById('pog-product-modal-new');
  if (newEl) newEl.hidden = !prod.is_new;

  pogSelectedProduct = {
    upc,
    name: displayName,
    location: formatPogPosition(bay, fixture, prod),
    bay,
    fixture,
    prod,
  };

  const modalActions = document.getElementById('pog-product-modal-actions');
  if (modalActions) {
    modalActions.hidden = !(liveVisitId && hubContext.myRank >= 1);
  }
  const tagBtn = document.getElementById('pog-product-modal-flag-tag');
  if (tagBtn) {
    tagBtn.disabled = false;
    tagBtn.textContent = 'Add missing tag to list';
  }

  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
}

function closePogProductModal() {
  const modal = document.getElementById('pog-product-modal');
  if (!modal) return;
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
  pogSelectedProduct = null;
}

function applyPogMaskOpacity(pct) {
  pogMaskCardOpacity = pct;
  const bays = document.querySelector('.pog-wv-bays');
  if (bays) bays.style.setProperty('--pog-wv-card-opacity', String(pct / 100));
  const valEl = document.getElementById('pog-wv-mask-value');
  if (valEl) valEl.textContent = pct + '%';
  const maskSlider = document.getElementById('pog-wv-mask-slider');
  if (maskSlider) maskSlider.value = String(pct);
  if (typeof window.virtualPlanogramSetPegOpacity === 'function') {
    window.virtualPlanogramSetPegOpacity(pct / 100);
  }
}

async function acquirePogScannerWakeLock() {
  try {
    if ('wakeLock' in navigator && !pogScannerWakeLock) {
      pogScannerWakeLock = await navigator.wakeLock.request('screen');
      pogScannerWakeLock.addEventListener('release', () => { pogScannerWakeLock = null; });
    }
  } catch { /* unsupported or denied */ }
}

async function releasePogScannerWakeLock() {
  try {
    if (pogScannerWakeLock) {
      await pogScannerWakeLock.release();
      pogScannerWakeLock = null;
    }
  } catch { /* ok */ }
}

async function stopPogScanner() {
  if (typeof Scanner !== 'undefined') await Scanner.stop();
  await releasePogScannerWakeLock();
  const box = document.getElementById('pog-wv-scanner-box');
  if (box) box.hidden = true;
  const err = document.getElementById('pog-wv-scanner-error');
  if (err) {
    err.hidden = true;
    err.textContent = '';
  }
}

async function handlePogScan(code) {
  await stopPogScanner();
  const resolved = resolveScanToCatalogUpc(code);
  const input = document.getElementById('pog-wv-search-input');
  const searchValue = resolved.display || normalizeUpcInput(code);
  if (input) input.value = searchValue;
  const result = runPogSearch(resolved.upc || searchValue);
  renderPogSearchResults(result, {
    scannedRaw: code,
    resolvedUpc: resolved.method !== 'none' ? resolved.upc : null,
  });
  if (result.hits.length === 1 && result.hits[0].scope === 'this') {
    highlightPogTile(result.hits[0].upc);
  }
  saveHubSession({ pogSearch: searchValue });
}

async function startPogScanner() {
  const box = document.getElementById('pog-wv-scanner-box');
  const errEl = document.getElementById('pog-wv-scanner-error');
  if (!box) return;

  box.hidden = false;
  if (errEl) {
    errEl.hidden = true;
    errEl.textContent = '';
  }

  if (typeof Scanner === 'undefined') {
    if (errEl) {
      errEl.textContent = 'Scanner unavailable in this browser. Use text search.';
      errEl.hidden = false;
    }
    return;
  }

  await acquirePogScannerWakeLock();
  await Scanner.start('pog-wv-scanner-region', handlePogScan);

  if (!Scanner.isRunning) {
    await releasePogScannerWakeLock();
    if (errEl) {
      errEl.textContent = 'Camera unavailable or permission denied. Use text search.';
      errEl.hidden = false;
    }
    box.hidden = true;
    return;
  }

  const torchBtn = document.getElementById('pog-wv-scanner-torch');
  if (torchBtn) {
    torchBtn.hidden = !Scanner.torchAvailable;
    torchBtn.textContent = 'Torch';
  }
}

function renderPogTile(prod, bay, fixture, dbkey) {
  const upc = String(prod.upc);
