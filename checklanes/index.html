<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checklane Reset Hub — Store 00163</title>
<script src="/auth-gate.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242836;
    --border: #2e3345;
    --text: #e8eaf0;
    --text2: #8b90a5;
    --text3: #5a5f73;
    --aisle: #141820;
    --lane-label: #c4c9dc;
    --entrance: #fbbf24;
    --side-l: rgba(52, 211, 153, 0.35);
    --side-r: rgba(244, 114, 182, 0.35);
    --state-not_started: #6b7280;
    --state-assigned: #3b82f6;
    --state-in_progress: #f59e0b;
    --state-needs_attention: #ef4444;
    --state-done_pending_signoff: #14b8a6;
    --state-signed_off: #22c55e;
    --radius: 8px;
    --panel-width: min(360px, 92vw);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(180deg, var(--bg) 85%, transparent);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  .app-header h1 {
    font-size: 1rem;
    font-weight: 700;
    flex: 1 1 180px;
  }

  .app-header .store-tag {
    font-size: 0.75rem;
    color: var(--text2);
    font-weight: 500;
  }

  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    padding: 8px 14px;
    border-radius: var(--radius);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    min-height: 40px;
  }

  .btn:active { opacity: 0.85; }
  .btn.active { background: #334155; border-color: #475569; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    color: var(--text2);
    white-space: nowrap;
  }

  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .legend-swatch.muted-demo {
    background: var(--surface2);
    border: 1px dashed var(--text3);
    opacity: 0.45;
  }

  .main-layout {
    display: flex;
    min-height: calc(100vh - 120px);
  }

  .view-container { flex: 1; min-width: 0; }

  .view-hidden { display: none !important; }

  /* ── Map view — horizontal lane rows stacked vertically ── */
  .map-view {
    padding: 12px 8px 24px;
    overflow-x: auto;
  }

  .map-stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 960px;
    margin: 0 auto;
  }

  .stack-group {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
  }

  .stack-group-header {
    padding: 8px 12px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text2);
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  .stack-group-body {
    display: flex;
    flex-direction: column;
  }

  .lane-row {
    display: flex;
    align-items: stretch;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    min-height: 52px;
  }

  .lane-row:last-child { border-bottom: none; }

  .lane-row-label {
    flex: 0 0 auto;
    min-width: 76px;
    max-width: 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-right: 8px;
    border-right: 1px solid var(--border);
  }

  .lane-num {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--lane-label);
    letter-spacing: 0.04em;
    line-height: 1.1;
  }

  .lane-commodity {
    font-size: 0.62rem;
    color: var(--text2);
    margin-top: 3px;
    line-height: 1.25;
  }

  .lane-row-fixtures {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 4px;
    min-width: 0;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .lane-row-fixtures .fixture {
    flex: 0 0 auto;
  }

  .flow-arrow {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    color: var(--text3);
    font-size: 1.1rem;
    opacity: 0.55;
    padding-left: 2px;
  }

  .flow-arrow::after {
    content: '→';
  }

  /* ── USCAN pod — facing pairs across center aisle ── */
  .uscan-pod {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pod-back-cap {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 4px;
    align-items: stretch;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border);
  }

  .pod-back-cap-label {
    flex: 0 0 auto;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text3);
    align-self: center;
    padding-right: 8px;
    min-width: 52px;
  }

  .pod-facing {
    display: flex;
    flex-direction: column;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .pod-facing-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 4px;
    padding: 6px 8px;
    min-height: 56px;
  }

  .pod-facing-row.row-left {
    background: rgba(52, 211, 153, 0.04);
    border-bottom: 1px dashed var(--border);
  }

  .pod-facing-row.row-right {
    background: rgba(244, 114, 182, 0.04);
  }

  .pod-row-tag {
    flex: 0 0 auto;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text3);
    padding: 0 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pod-facing-row.row-left .pod-row-tag { color: #6ee7b7; }
  .pod-facing-row.row-right .pod-row-tag { color: #f9a8d4; }

  .pod-stand-cell {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 3px;
    min-width: 0;
  }

  .pod-stand-cell .lane-mini-label {
    flex: 0 0 auto;
    font-size: 0.65rem;
    font-weight: 800;
    color: var(--lane-label);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    padding: 0 2px;
    opacity: 0.85;
  }

  .pod-stand-cell .stand-fixtures {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 3px;
    min-width: 0;
  }

  .pod-aisle-band {
    height: 22px;
    flex-shrink: 0;
    background: repeating-linear-gradient(
      90deg,
      var(--aisle) 0px,
      var(--aisle) 10px,
      #1c2030 10px,
      #1c2030 20px
    );
    border-top: 1px dashed var(--border);
    border-bottom: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
  }

  .pod-aisle-band::before { content: 'Pod aisle — customer / cart'; }

  .pod-tail-rows {
    display: flex;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }

  .pod-side-strip {
    flex: 0 0 8px;
    border-radius: 2px;
    align-self: stretch;
  }

  .pod-side-strip.strip-L {
    border-left: 2px dashed #34d399;
    background: var(--side-l);
  }

  .pod-side-strip.strip-R {
    border-right: 2px dashed #f472b6;
    background: var(--side-r);
  }

  .you-are-here {
    text-align: center;
    padding: 16px 12px 24px;
    color: var(--entrance);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .you-are-here::before {
    content: '▲';
    display: block;
    font-size: 1.2rem;
    margin-bottom: 4px;
  }

  /* ── Fixture primitives ── */
  .fixture {
    position: relative;
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    background: var(--surface2);
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    --fixture-color: var(--state-not_started);
    border-left: 4px solid var(--fixture-color);
  }

  .fixture.interactive:active { transform: scale(0.98); }

  .fixture.muted {
    opacity: 0.38;
    border-style: dashed;
    border-color: var(--text3);
    border-left-style: dashed;
    cursor: default;
    pointer-events: none;
  }

  .fixture.state-not_started { --fixture-color: var(--state-not_started); }
  .fixture.state-assigned { --fixture-color: var(--state-assigned); }
  .fixture.state-in_progress { --fixture-color: var(--state-in_progress); }
  .fixture.state-needs_attention {
    --fixture-color: var(--state-needs_attention);
    animation: pulse-attention 1.8s ease-in-out infinite;
  }
  .fixture.state-done_pending_signoff { --fixture-color: var(--state-done_pending_signoff); }
  .fixture.state-signed_off { --fixture-color: var(--state-signed_off); }

  @keyframes pulse-attention {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.35); }
    50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.12); }
  }

  .fx-label {
    font-size: 0.58rem;
    font-weight: 600;
    color: var(--text);
    padding: 3px 5px;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .fx-type-tag {
    font-size: 0.5rem;
    text-transform: uppercase;
    color: var(--text3);
    padding: 0 5px 3px;
    letter-spacing: 0.04em;
  }

  /* Stand types */
  .stand {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 2px;
    padding: 3px;
    min-width: 88px;
  }

  .stand-block {
    background: rgba(0,0,0,0.25);
    border-radius: 3px;
    font-size: 0.48rem;
    font-weight: 700;
    text-align: center;
    padding: 3px 2px;
    color: var(--text2);
    letter-spacing: 0.02em;
  }

  .stand-block.screen { grid-column: 1 / -1; }
  .stand-block.scanner { grid-column: 1; }
  .stand-block.bag { grid-column: 2; }

  /* Side shelf */
  .side-shelf-prim {
    width: 36px;
    min-height: 56px;
    border: 2px dashed;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 0.5rem;
    font-weight: 700;
    padding: 4px 2px;
  }

  .side-shelf-prim.side-L {
    border-color: #34d399;
    background: var(--side-l);
    color: #6ee7b7;
  }

  .side-shelf-prim.side-R {
    border-color: #f472b6;
    background: var(--side-r);
    color: #f9a8d4;
  }

  /* Horizontal bar types */
  .h-bar {
    min-height: 22px;
    display: flex;
    align-items: center;
  }

  .h-bar .fx-label { -webkit-line-clamp: 1; padding: 2px 6px; }

  /* Block types */
  .block-prim { min-height: 26px; }
  .block-prim.size-sm { min-height: 22px; }
  .block-prim.size-md { min-height: 30px; }
  .block-prim.size-lg { min-height: 38px; }

  /* ── List view ── */
  .list-view {
    padding: 12px 16px 80px;
    overflow-x: auto;
  }

  .list-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }

  .list-table th,
  .list-table td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }

  .list-table th {
    color: var(--text2);
    font-weight: 600;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  .list-table th:hover { color: var(--text); }
  .list-table tr.row-muted { opacity: 0.45; }
  .list-table tr.row-clickable { cursor: pointer; }
  .list-table tr.row-clickable:hover { background: var(--surface); }

  .state-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #fff;
    background: var(--pill-color, var(--state-not_started));
  }

  .state-pill.muted-pill {
    background: var(--surface2);
    color: var(--text3);
    border: 1px dashed var(--text3);
  }

  /* ── Detail panel ── */
  .detail-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: var(--panel-width);
    height: 100%;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 200;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
    box-shadow: -8px 0 24px rgba(0,0,0,0.4);
  }

  .detail-panel.open { transform: translateX(0); }

  .detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .detail-header h2 {
    font-size: 0.95rem;
    font-weight: 700;
  }

  .detail-close {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
  }

  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .detail-row {
    margin-bottom: 12px;
  }

  .detail-row .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text3);
    margin-bottom: 3px;
  }

  .detail-row .value {
    font-size: 0.85rem;
    color: var(--text);
    word-break: break-word;
  }

  .state-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 16px;
  }

  .state-btn {
    font-size: 0.68rem;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-weight: 600;
  }

  .state-btn:active { opacity: 0.8; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pending-badge {
    appearance: none;
    border: 1px solid #f59e0b;
    background: rgba(245, 158, 11, 0.15);
    color: #fbbf24;
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    min-height: 40px;
    display: none;
  }

  .pending-badge.visible { display: inline-flex; align-items: center; gap: 6px; }
  .pending-badge .count {
    background: #f59e0b;
    color: #1a1d27;
    border-radius: 999px;
    min-width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    padding: 0 6px;
  }

  .tag-batch-badge {
    appearance: none;
    border: 1px solid #14b8a6;
    background: rgba(20, 184, 166, 0.15);
    color: #5eead4;
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    min-height: 40px;
    display: none;
  }

  .tag-batch-badge.visible { display: inline-flex; align-items: center; gap: 6px; }
  .tag-batch-badge .count {
    background: #14b8a6;
    color: #1a1d27;
    border-radius: 999px;
    min-width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    padding: 0 6px;
  }

  .tag-batch-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 62vh;
    background: var(--surface);
    border-top: 1px solid var(--border);
    z-index: 215;
    transform: translateY(100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.45);
  }

  .tag-batch-panel.open { transform: translateY(0); }

  .tag-batch-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 12px 12px;
  }

  .tag-batch-item {
    border: 1px solid var(--border);
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 8px;
  }

  .tag-batch-item.invalid {
    border-color: #ef4444;
    background: rgba(239, 68, 68, 0.08);
  }

  .tag-batch-item-upc {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 4px;
  }

  .tag-batch-item.invalid .tag-batch-item-upc { color: #fca5a5; }

  .tag-batch-item-desc {
    font-size: 0.82rem;
    color: var(--text2);
    margin-bottom: 4px;
  }

  .tag-batch-item-loc {
    font-size: 0.72rem;
    color: var(--text3);
  }

  .tag-batch-footer {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .btn-send-tag-batch {
    width: 100%;
    min-height: 48px;
    background: #14b8a6;
    border: 1px solid #0d9488;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    border-radius: var(--radius);
    cursor: pointer;
  }

  .btn-send-tag-batch:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .flag-actions {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .flag-actions .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text3);
  }

  .flag-btn {
    appearance: none;
    width: 100%;
    min-height: 48px;
    padding: 12px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
  }

  .flag-btn:active { opacity: 0.85; }
  .flag-btn.flag-help { border-color: #ef4444; color: #fca5a5; }
  .flag-btn.flag-tag { border-color: #3b82f6; color: #93c5fd; }
  .flag-btn.flag-nis { border-color: #f59e0b; color: #fcd34d; }
  .flag-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .missing-tag-form {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: var(--surface2);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }

  .missing-tag-form.open { display: flex; }

  .missing-tag-form label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text3);
  }

  .missing-tag-form input,
  .missing-tag-form textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
    min-height: 44px;
  }

  .missing-tag-form textarea { min-height: 56px; resize: vertical; font-size: 0.85rem; }

  .form-actions { display: flex; gap: 8px; margin-top: 4px; }

  .form-actions .btn-submit {
    flex: 1;
    min-height: 44px;
    background: #3b82f6;
    border-color: #2563eb;
    color: #fff;
  }

  .flag-status {
    font-size: 0.78rem;
    color: var(--text2);
    min-height: 1.2em;
  }

  .flag-status.error { color: #fca5a5; }
  .flag-status.ok { color: #86efac; }

  .pending-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function shortName(name) {
  return name.replace(/^CKLN\s+/i, '').slice(0, 42);
}

function classifyFixture(fixture) {
  if (fixture.type != null && fixture.type !== '') return fixture.type;

  const name = (fixture.name || '').toUpperCase();
  const action = (fixture.action || '').toUpperCase();

  if (name.includes('USCAN') && name.includes('KIT')) return 'uscan_stand';
  if (name.includes('BELTED') && name.includes('SCO')) return 'belted_sco';
  if (name.includes('SIDE SHELF') || name.includes('RETRO FIT')) return 'side_shelf';
  if (name.includes('QUE')) return 'queue';
  if (name.includes('TAIL')) return 'liberty_tail';
  if (name.includes('ENDCAP')) return 'endcap';
  if (name.includes('COOLER')) return 'cooler';
  if (name.includes('REGISTER')) return 'register';
  if (name.includes('REUSABLE BAG') || name.includes('TOTES')) return 'bag_rack';
  if (name.includes('CAO')) return 'cao_long';
  if (name.includes('CHECKSTAND')) return 'checkstand';
  if (name.includes('CIGARETTE') || name.includes('WA PACKS')) return 'cigarette';
  if (name.includes('SHIPPER') || name.includes('RUG') || name.includes('BATTERY')) return 'misc_display';

  if (action.startsWith('C082')) return 'cooler';
  if (action.startsWith('C121')) return 'cigarette';
  if (action.startsWith('C889')) return 'bag_rack';
  if (action.startsWith('C901') || action.startsWith('C218') || action.startsWith('C808')) return 'misc_display';
  if (action.startsWith('C201')) return 'register';

  return 'unclassified';
}

function ensureFixtureTypes(fixtures) {
  fixtures.forEach(f => {
    if (f.type == null || f.type === '') f.type = classifyFixture(f);
  });
}

function orderFixturesInLane(fixtures, inputIndex) {
  const priority = new Map(FIXTURE_ORDER.map((t, i) => [t, i]));
  return fixtures.slice().sort((a, b) => {
    const pa = priority.has(a.type) ? priority.get(a.type) : FIXTURE_ORDER.length;
    const pb = priority.has(b.type) ? priority.get(b.type) : FIXTURE_ORDER.length;
    if (pa !== pb) return pa - pb;
    return (inputIndex.get(a) ?? 0) - (inputIndex.get(b) ?? 0);
  });
}

function generateLayout(fixtures) {
  const inputIndex = new Map(fixtures.map((f, i) => [f, i]));
  const byLane = {};

  fixtures.forEach(f => {
    if (!byLane[f.lane]) byLane[f.lane] = [];
    byLane[f.lane].push(f);
  });

  const lanes = Object.keys(byLane).sort((a, b) => Number(b) - Number(a));

  return {
    lanes: lanes.map(lane => {
      const all = byLane[lane];
      const left = all.filter(f => f.type === 'side_shelf' && f.side === 'L');
      const right = all.filter(f => f.type === 'side_shelf' && f.side === 'R');
      const main = all.filter(f => f.type !== 'side_shelf' || f.side === 'E');
      return {
        lane,
        left,
        fixtures: orderFixturesInLane(main, inputIndex),
        right
      };
    })
  };
}

function reportLayout(layout, fixtures) {
  const typeCounts = {};
  const unclassified = [];

  fixtures.forEach(f => {
    typeCounts[f.type] = (typeCounts[f.type] || 0) + 1;
    if (f.type === 'unclassified') unclassified.push({ lane: f.lane, name: f.name });
  });

  console.log('[Checklane Hub] Layout report');
  console.log('  Total fixtures:', fixtures.length);
  console.log('  Lanes:', layout.lanes.length);
  console.log('  Count per type:', typeCounts);
  if (unclassified.length) {
    console.warn('[Checklane Hub] UNCLASSIFIED:', unclassified);
  } else {
    console.log('  UNCLASSIFIED: none');
  }
}

function formatRaisedAt(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  } catch (_) {
    return iso;
  }
}

function applySnapshot(snapshot) {
  const stateMap = snapshotSectionsToStateMap(snapshot.sections);
  applyState(stateMap);
  hubContext.myRank = snapshot.myRank ?? 1;

  hubContext.sections = {};
  (snapshot.sections || []).forEach(row => {
    if (row && row.dbkey) hubContext.sections[String(row.dbkey)] = row;
  });
  hubContext.pendingActions = snapshot.pendingActions || [];
  hubContext.verifiedUnsentTags = snapshot.stats?.verifiedUnsentTags ?? 0;
  updatePendingBadge();

  renderPendingList();
  if (selectedPendingId && !hubContext.pendingActions.some(p => p.id === selectedPendingId)) {
    selectedPendingId = null;

function renderStandInner(type) {
  const label = type === 'belted_sco' ? 'SCO' : type === 'checkstand' ? 'CS' : 'USCAN';
  return (
    '<div class="stand">' +
      '<div class="stand-block screen">SCREEN</div>' +
      '<div class="stand-block scanner">SCANNER</div>' +
      '<div class="stand-block bag">BAG</div>' +
      '<div class="fx-type-tag">' + label + '</div>' +
    '</div>'
  );
}

function renderFixtureEl(f) {
  const dbkeyAttr = f.dbkey || '';
  const muted = !f.on_manifest;
  const classes = ['fixture'];
  if (!muted) classes.push('interactive');
  if (muted) classes.push('muted');

  let inner = '';
  const t = f.type;

  if (t === 'uscan_stand' || t === 'belted_sco' || t === 'checkstand' || t === 'register') {
    inner = renderStandInner(t);
  } else if (t === 'side_shelf') {
    inner =
      '<div class="side-shelf-prim side-' + f.side + '">' +
        escapeHtml(shortName(f.name)) +
      '</div>';
  } else if (t === 'queue' || t === 'cigarette' || t === 'bag_rack' || t === 'misc_display' || t === 'unclassified') {
    inner =
      '<div class="h-bar">' +
        '<div class="fx-label">' + escapeHtml(shortName(f.name)) + '</div>' +
      '</div>' +
      '<div class="fx-type-tag">' + escapeHtml(t === 'unclassified' ? '?' : t.replace('_', ' ')) + '</div>';
  } else {
    let size = 'size-md';
    if (t === 'liberty_tail' || t === 'cao_long') size = 'size-lg';
    else if (t === 'endcap') size = 'size-sm';
    inner =
      '<div class="block-prim ' + size + '">' +
        '<div class="fx-label">' + escapeHtml(shortName(f.name)) + '</div>' +
        '<div class="fx-type-tag">' + escapeHtml(t.replace('_', ' ')) + '</div>' +
      '</div>';
  }

  return (
    '<div class="' + classes.join(' ') + '" ' +
      'data-dbkey="' + escapeHtml(dbkeyAttr) + '" ' +
      'data-action="' + escapeHtml(f.action) + '" ' +
      'data-lane="' + escapeHtml(f.lane) + '" ' +
      'title="' + escapeHtml(f.name) + '">' +
      inner +
    '</div>'
  );
}

  return '<span class="state-pill" style="--pill-color:var(' + STATE_CSS[st] + ')">' +

function renderList() {
  const rows = FIXTURES.slice().sort((a, b) => {
    let va, vb;
    switch (listSort.col) {
      case 'lane': va = Number(a.lane); vb = Number(b.lane); break;
      case 'name': va = a.name.toLowerCase(); vb = b.name.toLowerCase(); break;
      case 'type': va = a.type; vb = b.type; break;
      case 'state':
        va = a.on_manifest ? getFixtureState(a.dbkey) : 'zzz';
        vb = b.on_manifest ? getFixtureState(b.dbkey) : 'zzz';
        break;
      default: va = a.lane; vb = b.lane;
    }
    if (va < vb) return listSort.asc ? -1 : 1;
    if (va > vb) return listSort.asc ? 1 : -1;
    return 0;
  });

  const arrow = col => listSort.col === col ? (listSort.asc ? ' ▲' : ' ▼') : '';

  const body = rows.map(f => {
    const clickable = f.on_manifest && f.dbkey;
    return (
      '<tr class="' + (f.on_manifest ? '' : 'row-muted') +
        (clickable ? ' row-clickable' : '') + '" ' +
        'data-list-key="' + escapeHtml(fixtureKey(f)) + '" ' +
        (clickable ? 'data-dbkey="' + escapeHtml(f.dbkey) + '" data-action="' + escapeHtml(f.action) + '"' : '') +
      '>' +
        '<td>' + escapeHtml(f.lane) + '</td>' +
        '<td>' + escapeHtml(f.name) + '</td>' +
        '<td>' + escapeHtml(f.type) + '</td>' +
        '<td>' + statePillHtml(f) + '</td>' +
      '</tr>'
    );
  }).join('');

  document.getElementById('list-view').innerHTML =
    '<table class="list-table">' +
      '<thead><tr>' +
        '<th data-sort="lane">Lane' + arrow('lane') + '</th>' +
        '<th data-sort="name">Name' + arrow('name') + '</th>' +
        '<th data-sort="type">Type' + arrow('type') + '</th>' +
        '<th data-sort="state">State' + arrow('state') + '</th>' +
      '</tr></thead>' +
      '<tbody>' + body + '</tbody>' +
    '</table>';
}

/* ═══════════════════════════════════════════════════════════════════════════
   STATE-BINDING SEAM — Step 3 plugs live data in here only.
   Do not hardcode state colors at render time; always go through applyState().
   ═══════════════════════════════════════════════════════════════════════════ */
function applyState(states) {
  fixtureStates = { ...states };

  const stateClasses = WORK_STATES.map(s => 'state-' + s);

  document.querySelectorAll('.fixture[data-dbkey]').forEach(el => {
    el.classList.remove(...stateClasses);

    if (el.classList.contains('muted')) return;

    const dbkey = el.getAttribute('data-dbkey');
    const state = (dbkey && fixtureStates[dbkey]) ? fixtureStates[dbkey] : 'not_started';
    el.classList.add('state-' + state);
  });

  updateListStateCells();
  if (selectedDbkey) refreshDetailPanel();
  if (isPogViewOpen()) refreshPogWorkingChrome();
}

function setFixtureState(dbkey, newState) {
  if (!dbkey || !WORK_STATES.includes(newState)) return;
  fixtureStates[dbkey] = newState;
  applyState(fixtureStates);
}

  const fixture = FIXTURES.find(f => f.dbkey === dbkey && f.action === action) ||

  selectedDbkey = dbkey;
  refreshDetailPanel(fixture);
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('overlay').classList.add('visible');
  document.getElementById('main-layout').classList.add('panel-open');
  if (!opts?.skipHistory) syncHubUrl({ fixture: dbkey, pog: null });
  saveHubSession({ fixture: dbkey, pog: null });
}

  document.getElementById('overlay').classList.remove('visible');

        '<button type="button" class="flag-btn flag-nis" id="flag-nis">Not in store</button>' +
        '<div class="flag-status" id="flag-status"></div>' +
      '</div>';
  }

  document.getElementById('detail-body').innerHTML = html;

  document.getElementById('btn-open-pog')?.addEventListener('click', () => {
    openPogWorkingView(fixture);
  });

  if (!isLive) {
    document.getElementById('state-buttons').addEventListener('click', e => {
      const btn = e.target.closest('[data-state]');
      if (!btn || !fixture.dbkey) return;
      setFixtureState(fixture.dbkey, btn.getAttribute('data-state'));
    });
    return;
  }

  const statusEl = document.getElementById('flag-status');
  const setFlagStatus = (msg, kind) => {
    if (!statusEl) return;
    statusEl.textContent = msg || '';
    statusEl.className = 'flag-status' + (kind ? ' ' + kind : '');
  };

  const disableFlags = (disabled) => {
    document.querySelectorAll('#flag-actions .flag-btn, #flag-tag-submit').forEach(btn => {
      btn.disabled = disabled;
    });
  };

  document.getElementById('flag-help')?.addEventListener('click', async () => {
    disableFlags(true);
    setFlagStatus('Raising help flag…');
    try {
      await hubPost('/sections/' + encodeURIComponent(fixture.dbkey) + '/flag/help', {});
      setFlagStatus('Flag raised — waiting for live update…', 'ok');
    } catch (err) {
      setFlagStatus(err.message || 'Failed', 'error');
      disableFlags(false);
    }
  });

  document.getElementById('flag-nis')?.addEventListener('click', async () => {
    disableFlags(true);
    setFlagStatus('Raising not-in-store flag…');
    try {
      await hubPost('/sections/' + encodeURIComponent(fixture.dbkey) + '/flag/nis', {});
      setFlagStatus('Flag raised — waiting for live update…', 'ok');
    } catch (err) {
      setFlagStatus(err.message || 'Failed', 'error');
      disableFlags(false);
    }
  });

  document.getElementById('flag-tag-toggle')?.addEventListener('click', () => {
    document.getElementById('missing-tag-form')?.classList.toggle('open');
    const upc = document.getElementById('flag-upc');
    if (upc) setTimeout(() => upc.focus(), 50);
  });

  document.getElementById('flag-tag-submit')?.addEventListener('click', async () => {
    const upc = (document.getElementById('flag-upc')?.value || '').trim();
    if (!upc) {
      setFlagStatus('UPC is required', 'error');
      document.getElementById('flag-upc')?.focus();
      return;
    }
    disableFlags(true);
    setFlagStatus('Raising missing-tag flag…');
    try {
      await hubPost('/sections/' + encodeURIComponent(fixture.dbkey) + '/flag/missing-tag', {
        upc,
        description: (document.getElementById('flag-desc')?.value || '').trim() || undefined,
        location: (document.getElementById('flag-loc')?.value || '').trim() || undefined,
      });
      setFlagStatus('Flag raised — waiting for live update…', 'ok');
    } catch (err) {
      setFlagStatus(err.message || 'Failed', 'error');
      disableFlags(false);
    }
  });
}

function setView(view, opts) {
  const isMap = view === 'map';
  hubCurrentView = view;
  document.getElementById('map-view').classList.toggle('view-hidden', !isMap);
  document.getElementById('list-view').classList.toggle('view-hidden', isMap);
  document.getElementById('btn-map').classList.toggle('active', isMap);
  document.getElementById('btn-list').classList.toggle('active', !isMap);
  if (!opts?.skipHistory) syncHubUrl({ view });
  saveHubSession({ view });
}

function hubSessionRead() {
  try {
    return JSON.parse(sessionStorage.getItem(HUB_SESSION_KEY) || '{}');
  } catch {
    return {};
  }
}

function saveHubSession(partial) {
  try {
    const cur = hubSessionRead();
    sessionStorage.setItem(HUB_SESSION_KEY, JSON.stringify({
      ...cur,
      ...partial,
      ts: Date.now(),
    }));
  } catch { /* private mode */ }
}

function getHubUrlParams() {
  return new URLSearchParams(window.location.search);
}

function readHubUrlState() {
  const p = getHubUrlParams();
  return {
    visit: p.get('visit'),
    view: p.get('view') || 'map',
    fixture: p.get('fixture'),
    pog: p.get('pog'),
  };
}

function buildHubUrl(patch) {
  const p = getHubUrlParams();
  Object.entries(patch).forEach(([key, value]) => {
    if (value == null || value === '') p.delete(key);
    else p.set(key, value);
  });
  const q = p.toString();
  return window.location.pathname + (q ? '?' + q : '');
}

function syncHubUrl(patch, replace) {
  if (hubNavLock) return;
  const url = buildHubUrl(patch);
  const state = { hub: { ...readHubUrlState(), ...patch } };
  if (replace) history.replaceState(state, '', url);
  else history.pushState(state, '', url);
}

function isPogViewOpen() {
  return document.getElementById('pog-working-view')?.classList.contains('open');
}

function isDetailOpen() {
  return document.getElementById('detail-panel')?.classList.contains('open');
}

function isActiveWorkSession() {
  return isPogViewOpen() || (isDetailOpen() && !!selectedDbkey);
}

function confirmLeavePog() {
  if (typeof Scanner !== 'undefined' && Scanner.isRunning) {
    return window.confirm('Scanner is active. Leave this set?');
  }
  const input = document.getElementById('pog-wv-search-input');
  if (input && input.value.trim()) {
    return window.confirm('Leave this set? Your search will be saved for this session.');
  }
  return window.confirm('Leave this set and go back?');
}

function confirmLeaveDetail() {
  return window.confirm('Close this fixture detail?');
}

function handleHubPopState() {
  if (hubNavLock) return;
  const url = readHubUrlState();

  if (isPogViewOpen() && !url.pog) {
    if (!confirmLeavePog()) {
      hubNavLock = true;
      syncHubUrl({ pog: pogWorkingFixture?.dbkey || null, fixture: selectedDbkey || url.fixture || null });
      hubNavLock = false;
      return;
    }
    closePogWorkingView({ skipHistory: true });
  }

  if (url.view && url.view !== hubCurrentView) {
    setView(url.view, { skipHistory: true });
  }

  if (url.pog) {
    const fix = fixtureForDbkey(url.pog);
    if (fix && fix.dbkey !== pogWorkingFixture?.dbkey) {
      openPogWorkingView(fix, { skipHistory: true });
    }
    return;
  }

  if (url.fixture) {
    const fix = FIXTURES.find(f => f.dbkey === url.fixture && f.on_manifest) ||
      FIXTURES.find(f => f.dbkey === url.fixture);
    if (fix && (!isDetailOpen() || selectedDbkey !== url.fixture)) {
      openDetail(url.fixture, fix.action, { skipHistory: true });
    }
    return;
  }

  if (isDetailOpen()) closeDetail({ skipHistory: true });
}

async function restoreHubNavigation() {
  const url = readHubUrlState();
  hubNavLock = true;
  if (url.view === 'list') setView('list', { skipHistory: true });
  else setView('map', { skipHistory: true });

  if (url.fixture) {
    const fix = FIXTURES.find(f => f.dbkey === url.fixture && f.on_manifest) ||
      FIXTURES.find(f => f.dbkey === url.fixture);
    if (fix) openDetail(url.fixture, fix.action, { skipHistory: true });
  }

  if (url.pog) {
    const fix = fixtureForDbkey(url.pog);
    if (fix) {
      const sess = hubSessionRead();
      await openPogWorkingView(fix, { skipHistory: true, restoreSession: true, session: sess });
    }
  }
  hubNavLock = false;
  syncHubUrl({
    view: url.view || hubCurrentView,
    fixture: url.pog ? (fixtureForDbkey(url.pog)?.dbkey || url.fixture) : url.fixture,
    pog: url.pog,
  }, true);
}

function bindEvents() {
  document.getElementById('btn-map').addEventListener('click', () => {
    if (isPogViewOpen()) {
      closePogWorkingView();
      return;
    }
    if (isDetailOpen() && !confirmLeaveDetail()) return;
    if (isDetailOpen()) closeDetail({ skipHistory: true });
    setView('map');
  });
  document.getElementById('btn-list').addEventListener('click', () => {
    if (isPogViewOpen()) {
      closePogWorkingView();
      return;
    }
    if (isDetailOpen() && !confirmLeaveDetail()) return;
    if (isDetailOpen()) closeDetail({ skipHistory: true });
    setView('list');
  });

  document.getElementById('map-view').addEventListener('click', e => {
    const el = e.target.closest('.fixture.interactive[data-dbkey]');
    if (!el) return;
    const dbkey = el.getAttribute('data-dbkey');
    const action = el.getAttribute('data-action');
    if (dbkey) openDetail(dbkey, action);
  });

  document.getElementById('list-view').addEventListener('click', e => {
    const th = e.target.closest('th[data-sort]');
    if (th) {
      const col = th.getAttribute('data-sort');
      if (listSort.col === col) listSort.asc = !listSort.asc;
      else { listSort.col = col; listSort.asc = true; }
      renderList();
      applyState(fixtureStates);
      return;
    }
    const row = e.target.closest('tr.row-clickable[data-dbkey]');
    if (!row) return;
    openDetail(row.getAttribute('data-dbkey'), row.getAttribute('data-action'));
  });

  document.getElementById('detail-close').addEventListener('click', closeDetail);
  document.getElementById('overlay').addEventListener('click', closeDetail);

  document.getElementById('pending-badge').addEventListener('click', () => {
    if (hubContext.myRank >= 2) {
      toggleTagBatchPanel(false);
      togglePendingPanel(true);
    }
  });
  document.getElementById('pending-close').addEventListener('click', () => togglePendingPanel(false));

  document.getElementById('tag-batch-badge').addEventListener('click', () => {
    if (hubContext.myRank >= 2) {
      togglePendingPanel(false);
      toggleTagBatchPanel(true);
    }
  });
  document.getElementById('tag-batch-close').addEventListener('click', () => toggleTagBatchPanel(false));
  document.getElementById('btn-send-tag-batch').addEventListener('click', () => sendTagBatchEmail());

  document.getElementById('pog-wv-back').addEventListener('click', () => closePogWorkingView());
  document.getElementById('pog-wv-scroll').addEventListener('click', e => {
    const openBtn = e.target.closest('[data-open-pog-dbkey]');
    if (openBtn) {
      const dk = openBtn.getAttribute('data-open-pog-dbkey');
      const fix = FIXTURES.find(f => f.dbkey === dk);
      if (fix) openPogWorkingView(fix);
      return;
    }
    const tile = e.target.closest('.pog-wv-tile');
    if (tile && tile.dataset.upc) {
      const hit = findPogProduct(tile.dataset.upc, tile.dataset.bay, tile.dataset.fixture);
      if (hit) openPogProductModal(hit.prod, hit.bay, hit.fixture);
    }
  });

  document.getElementById('pog-product-modal-close')?.addEventListener('click', closePogProductModal);
  document.getElementById('pog-product-modal')?.addEventListener('click', e => {
    if (e.target.id === 'pog-product-modal') closePogProductModal();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && typeof Scanner !== 'undefined' && Scanner.isRunning) {
      acquirePogScannerWakeLock();
    } else if (document.visibilityState === 'hidden') {
      releasePogScannerWakeLock();
    }
  });

  window.addEventListener('popstate', handleHubPopState);

  window.addEventListener('beforeunload', (e) => {
    if (isActiveWorkSession()) {
      saveHubSession({
        pogSearch: document.getElementById('pog-wv-search-input')?.value || '',
        pogMask: pogMaskCardOpacity,
      });
      e.preventDefault();
      e.returnValue = '';
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   POG WORKING VIEW — read-only virtual planogram + scoped search (Phase 2)
   ═══════════════════════════════════════════════════════════════════════════ */
let pogProductsCache = null;
let pogCatalogCache = null;
let pogCatalogLoadPromise = null;
const pogLayoutCache = {};
let pogWorkingFixture = null;
let pogWorkingLayout = null;
let pogMaskCardOpacity = 0;
let pogSelectedProduct = null;
let pogLastNotFoundUpc = null;
let pogWvActionsBound = false;
let pogScannerWakeLock = null;

function pogUrl(path) {
  return POG_SERVICE_BASE + path;
}

async function ensurePogCatalogLoaded() {
  if (pogProductsCache && pogCatalogCache) return;
  if (!pogCatalogLoadPromise) {
    pogCatalogLoadPromise = Promise.all([
      fetch(pogUrl('/products.json')).then(r => {
        if (!r.ok) throw new Error('products.json ' + r.status);
        return r.json();
      }),
      fetch(pogUrl('/pog_products.json')).then(r => {
        if (!r.ok) throw new Error('pog_products.json ' + r.status);
        return r.json();
      }),
    ]).then(([products, pogProducts]) => {
      pogCatalogCache = products;
      pogProductsCache = pogProducts;
    });
  }
  try {
    await pogCatalogLoadPromise;
  } catch (err) {
    pogCatalogLoadPromise = null;
    throw err;
  }
}

async function fetchPogLayout(dbkey) {
  const dk = String(dbkey);
  if (pogLayoutCache[dk]) return pogLayoutCache[dk];
  const resp = await fetch(pogUrl('/pog_layouts/' + encodeURIComponent(dk) + '.json'));
  if (resp.status === 404) return null;
  if (!resp.ok) throw new Error('Layout fetch failed (' + resp.status + ')');
  const layout = await resp.json();
  pogLayoutCache[dk] = layout;
  return layout;
}

function pdfFilenameFromFixture(fixture) {
  if (!fixture) return null;
  const id = fixture.manifest_pog_id;
  if (id) return id + '.pdf';
  return null;
}

function productInfo(upc) {
  return (pogCatalogCache && pogCatalogCache[String(upc)]) || null;
}

function upcsForDbkeyStore(dbkey, storeNum) {
  if (!pogProductsCache || !dbkey) return [];
  const byStore = pogProductsCache[String(dbkey)];
  if (!byStore) return [];
  const sn = String(storeNum || HUB_STORE_NUM);
  return byStore[sn] || byStore[sn.replace(/^0+/, '')] || [];
}

function uniqueManifestDbkeys() {
  const seen = new Set();
  const out = [];
  for (const f of FIXTURES) {
    if (f.dbkey && f.on_manifest && !seen.has(f.dbkey)) {
      seen.add(f.dbkey);
      out.push(f.dbkey);
    }
  }
  return out;
}

function dbkeysInLane(lane) {
  const seen = new Set();
  const out = [];
  for (const f of FIXTURES) {
    if (f.lane === lane && f.dbkey && f.on_manifest && !seen.has(f.dbkey)) {
      seen.add(f.dbkey);
      out.push(f.dbkey);
    }
  }
  return out;
}

function fixtureForDbkey(dbkey) {
  return FIXTURES.find(f => f.dbkey === String(dbkey) && f.on_manifest) ||
    FIXTURES.find(f => f.dbkey === String(dbkey));
}

function normalizeUpcDigits(value) {
  return String(value == null ? '' : value).replace(/\D/g, '');
}

function normalizeUpcInput(value) {
  return normalizeUpcDigits(value).replace(/^0+/, '');
}

function getUpcCandidates(raw) {
  const cleanScan = normalizeUpcInput(raw);
  const scanNoCheck = cleanScan.length > 1 ? cleanScan.slice(0, -1) : cleanScan;
  return { cleanScan, scanNoCheck, candidates: [cleanScan, scanNoCheck] };
}

function expandScanCandidates(rawCode) {
  const digits = normalizeUpcDigits(rawCode);
  const out = new Set();
  const add = (value) => {
    const v = normalizeUpcInput(value);
    if (v) out.add(v);
  };

  add(digits);
  const { cleanScan, scanNoCheck, candidates } = getUpcCandidates(rawCode);
  candidates.forEach(add);
  add(scanNoCheck);

  if (digits.length >= 12) add(digits.slice(0, -1));
  if (digits.length === 13) {
    add(digits.slice(1, -1));
    add(digits.slice(1));
  }
  if (digits.length === 14) add(digits.slice(2, -1));
  if (digits.length >= 10) add(digits.slice(-10));
  if (digits.length >= 11) add(digits.slice(-11));

  return [...out];
}

function collectUpcsFromDbkeys(dbkeys) {
  const out = new Set();
  for (const dk of dbkeys || []) {
    for (const upc of upcsForDbkeyStore(dk, HUB_STORE_NUM)) out.add(String(upc));
  }
  return [...out];
}

function collectLayoutUpcs(layout) {
  const out = new Set();
  walkLayoutProducts(layout, (prod) => out.add(String(prod.upc)));
  return [...out];
}

function resolveScanToCatalogUpc(rawCode) {
  const rawDigits = normalizeUpcDigits(rawCode);
  const scanCandidates = expandScanCandidates(rawCode);
  const pools = [];

  if (pogWorkingLayout) {
    pools.push({ scope: 'this', upcs: collectLayoutUpcs(pogWorkingLayout) });
  }
  if (pogWorkingFixture?.lane) {
    pools.push({ scope: 'lane', upcs: collectUpcsFromDbkeys(dbkeysInLane(pogWorkingFixture.lane)) });
  }
  pools.push({ scope: 'store', upcs: collectUpcsFromDbkeys(uniqueManifestDbkeys()) });

  for (const pool of pools) {
    for (const cand of scanCandidates) {
      for (const upc of pool.upcs) {
        if (normalizeUpcInput(upc) === cand || upcMatchesQuery(cand, upc)) {
          return { upc, display: normalizeUpcInput(upc), raw: rawCode, method: pool.scope };
        }
      }
    }
    if (rawDigits.length >= 4) {
      const suffix = rawDigits.slice(-4);
      const suffixMatches = pool.upcs.filter(u => normalizeUpcInput(u).endsWith(suffix));
      if (suffixMatches.length === 1) {
        return {
          upc: suffixMatches[0],
          display: normalizeUpcInput(suffixMatches[0]),
          raw: rawCode,
          method: pool.scope + '-suffix4',
        };
      }
    }
  }

  const fallback = normalizeUpcInput(rawCode);
  return { upc: fallback, display: fallback, raw: rawCode, method: 'none' };
}

function upcMatchesQuery(query, upc) {
  const q = normalizeUpcDigits(query);
  const u = normalizeUpcDigits(upc);
  if (!q || !u) return false;
  if (u === q) return true;

  const qNorm = normalizeUpcInput(query);
  const pUpc = normalizeUpcInput(upc);
  if (qNorm && pUpc === qNorm) return true;

  if (/^\d{4}$/.test(q) && u.endsWith(q)) return true;
  if (q.length >= 4 && u.endsWith(q)) return true;

  const { cleanScan, scanNoCheck, candidates } = getUpcCandidates(query);
  if (candidates.includes(pUpc)) return true;
  if (pUpc === scanNoCheck) return true;
  if (pUpc.length > 8 && (pUpc.startsWith(cleanScan) || cleanScan.startsWith(pUpc))) {
    if (Math.abs(pUpc.length - cleanScan.length) === 1) return true;
  }
  return false;
}

function textMatchesQuery(query, text) {
  const q = String(query || '').trim().toLowerCase();
  if (q.length < 2) return false;
  return String(text || '').toLowerCase().includes(q);
}

function productDisplayName(upc, layoutProduct) {
  const info = productInfo(upc);
  if (info && info.name) return info.name;
  if (layoutProduct && layoutProduct.desc_fallback) return layoutProduct.desc_fallback;
  if (info && info.fallback_desc) return info.fallback_desc;
  return 'UPC ' + upc;
}

function productDisplaySize(upc, layoutProduct) {
  const info = productInfo(upc);
  if (info && info.size) return info.size;
  if (layoutProduct && layoutProduct.size_fallback) return layoutProduct.size_fallback;
  if (info && info.fallback_size) return info.fallback_size;
  return '';
}

function parsePegPosition(code) {
  if (!code) return null;
  const m = String(code).match(/^R(\d+)C(\d+)$/i);
  if (!m) return null;
  return { row: parseInt(m[1], 10), col: parseInt(m[2], 10) };
}

function walkLayoutProducts(layout, visitor) {
  if (!layout || !Array.isArray(layout.bays)) return;
  for (const bay of layout.bays) {
    const fixtures = (bay.fixtures || []).slice();
    for (const fixture of fixtures) {
      for (const prod of fixture.products || []) {
        visitor(prod, bay, fixture);
      }
    }
  }
}

function fixtureLocationLabel(bay, fixture) {
  const type = fixture.type === 'pegboard' ? 'pegboard' : (fixture.label || fixture.type || 'fixture');
  return 'bay ' + bay.bay_num + ', ' + type + ' ' + (fixture.fixture_num || '');
}

function searchInLayout(layout, query) {
  const hits = [];
  if (!layout) return hits;
  const qDigits = normalizeUpcDigits(query);
  const isShortUpcQuery = /^\d{4}$/.test(qDigits);

  walkLayoutProducts(layout, (prod, bay, fixture) => {
    const name = productDisplayName(prod.upc, prod);
    const desc = prod.desc_fallback || name;
    let match = false;
    if (isShortUpcQuery) {
      match = normalizeUpcInput(prod.upc).endsWith(qDigits);
    } else {
      match = upcMatchesQuery(query, prod.upc) || textMatchesQuery(query, desc) || textMatchesQuery(query, name);
    }
    if (!match) return;
    hits.push({
      scope: 'this',
      upc: prod.upc,
      name,
      location: fixtureLocationLabel(bay, fixture),
      bayNum: bay.bay_num,
      fixtureNum: fixture.fixture_num,
      dbkey: layout.dbkey,
    });
  });
  return hits;
}

function searchInDbkeyList(dbkeys, query, excludeDbkey) {
  const hits = [];
  const qDigits = normalizeUpcDigits(query);
  const isShortUpcQuery = /^\d{4}$/.test(qDigits);
  const isUpcQuery = qDigits.length >= 4;

  for (const dk of dbkeys) {
    if (dk === excludeDbkey) continue;
    const upcs = upcsForDbkeyStore(dk, HUB_STORE_NUM);
    for (const upc of upcs) {
      const info = productInfo(upc);
      const name = productDisplayName(upc, null);
      const desc = (info && info.fallback_desc) || name;
      let match = false;
      if (isShortUpcQuery) {
        match = normalizeUpcInput(upc).endsWith(qDigits);
      } else if (isUpcQuery) {
        match = upcMatchesQuery(query, upc);
      } else {
        match = textMatchesQuery(query, name) || textMatchesQuery(query, desc);
      }
      if (!match) continue;
      const fix = fixtureForDbkey(dk);
      hits.push({
        scope: 'other',
        upc,
        name,
        dbkey: dk,
        title: fix ? shortName(fix.name) : ('DBKey ' + dk),
        lane: fix ? fix.lane : '—',
      });
    }
  }
  return hits;
}

function runPogSearch(query) {
  const q = String(query || '').trim();
  if (!q) return { hits: [], notFound: false };

  let hits = searchInLayout(pogWorkingLayout, q);
  if (hits.length) return { hits, notFound: false };

  const lane = pogWorkingFixture ? pogWorkingFixture.lane : null;
  if (lane) {
    hits = searchInDbkeyList(dbkeysInLane(lane), q, pogWorkingFixture.dbkey);
    if (hits.length) return { hits, notFound: false };
  }

  hits = searchInDbkeyList(uniqueManifestDbkeys(), q, pogWorkingFixture ? pogWorkingFixture.dbkey : null);
  if (hits.length) return { hits, notFound: false };

  return { hits: [], notFound: true };
}

function formatPogPosition(bay, fixture, prod) {
  if (fixture.type === 'pegboard') {
    const lines = [String(prod.pos)];
    const peg = parsePegPosition(prod.position_code);
    if (peg) {
      lines.push('R' + String(peg.row).padStart(2, '0'));
      lines.push('C' + String(peg.col).padStart(2, '0'));
    }
    return lines.join('\n');
  }
  return 'Bay ' + bay.bay_num + ' · ' + (fixture.label || 'Shelf') + ' · Position ' + prod.pos;
}

function renderPogPositionCardHtml(fixture, prod) {
  if (fixture.type === 'pegboard') {
    const peg = parsePegPosition(prod.position_code);
    let html = '<span>' + escapeHtml(String(prod.pos)) + '</span>';
    if (peg) {
      html += '<span>R' + escapeHtml(String(peg.row).padStart(2, '0')) + '</span>';
      html += '<span>C' + escapeHtml(String(peg.col).padStart(2, '0')) + '</span>';
    }
    return html;
  }
  return '<span>' + escapeHtml(String(prod.pos)) + '</span>';
}

function findPogProduct(upc, bayNum, fixtureNum) {
  if (!pogWorkingLayout) return null;
  let found = null;
  walkLayoutProducts(pogWorkingLayout, (prod, bay, fixture) => {
    if (String(prod.upc) === String(upc) &&
        String(bay.bay_num) === String(bayNum) &&
        String(fixture.fixture_num) === String(fixtureNum)) {
      found = { prod, bay, fixture };
    }
  });
  return found;
}

function openPogProductModal(prod, bay, fixture) {
  const modal = document.getElementById('pog-product-modal');
  if (!modal) return;

  const upc = String(prod.upc);
  const info = productInfo(upc);
  const img = document.getElementById('pog-product-modal-img');
  const fallback = document.getElementById('pog-product-modal-img-fallback');
  const displayName = productDisplayName(upc, prod);

  if (img) {
    img.style.display = '';
    img.src = pogUrl('/products-png/' + encodeURIComponent(upc) + '.png');
    img.alt = displayName;
    img.onerror = () => {
      img.style.display = 'none';
      if (fallback) {
        fallback.textContent = displayName;
        fallback.classList.add('visible');
      }
    };
    img.onload = () => {
      if (fallback) fallback.classList.remove('visible');
    };
  }

  const nameEl = document.getElementById('pog-product-modal-name');
  if (nameEl) nameEl.textContent = displayName;
  const brandEl = document.getElementById('pog-product-modal-brand');
  if (brandEl) brandEl.textContent = (info && info.brand) || '';
  const sizeEl = document.getElementById('pog-product-modal-size');
  if (sizeEl) sizeEl.textContent = productDisplaySize(upc, prod);
  const upcEl = document.getElementById('pog-product-modal-upc');
  if (upcEl) upcEl.textContent = 'UPC: ' + upc;
  const posEl = document.getElementById('pog-product-modal-position');
  if (posEl) posEl.textContent = formatPogPosition(bay, fixture, prod);
  const metaEl = document.getElementById('pog-product-modal-meta');
  if (metaEl) metaEl.textContent = 'Facings: ' + Math.max(1, prod.facings || 1);
  const newEl = document.getElementById('pog-product-modal-new');
  if (newEl) newEl.hidden = !prod.is_new;

  pogSelectedProduct = {
    upc,
    name: displayName,
    location: formatPogPosition(bay, fixture, prod),
  };

  const modalActions = document.getElementById('pog-product-modal-actions');
  if (modalActions) {
    modalActions.hidden = !(liveVisitId && hubContext.myRank >= 1);
  }

  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
}

function closePogProductModal() {
  const modal = document.getElementById('pog-product-modal');
  if (!modal) return;
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
  pogSelectedProduct = null;
}

function applyPogMaskOpacity(pct) {
  pogMaskCardOpacity = pct;
  const bays = document.querySelector('.pog-wv-bays');
  if (bays) bays.style.setProperty('--pog-wv-card-opacity', String(pct / 100));
  const valEl = document.getElementById('pog-wv-mask-value');
  if (valEl) valEl.textContent = pct + '%';
}

async function acquirePogScannerWakeLock() {
  try {
    if ('wakeLock' in navigator && !pogScannerWakeLock) {
      pogScannerWakeLock = await navigator.wakeLock.request('screen');
      pogScannerWakeLock.addEventListener('release', () => { pogScannerWakeLock = null; });
    }
  } catch { /* unsupported or denied */ }
}

async function releasePogScannerWakeLock() {
  try {
    if (pogScannerWakeLock) {
      await pogScannerWakeLock.release();
      pogScannerWakeLock = null;
    }
  } catch { /* ok */ }
}

async function stopPogScanner() {
  if (typeof Scanner !== 'undefined') await Scanner.stop();
  await releasePogScannerWakeLock();
  const box = document.getElementById('pog-wv-scanner-box');
  if (box) box.hidden = true;
  const err = document.getElementById('pog-wv-scanner-error');
  if (err) {
    err.hidden = true;
    err.textContent = '';
  }
}

async function handlePogScan(code) {
  await stopPogScanner();
  const resolved = resolveScanToCatalogUpc(code);
  const input = document.getElementById('pog-wv-search-input');
  const searchValue = resolved.display || normalizeUpcInput(code);
  if (input) input.value = searchValue;
  const result = runPogSearch(resolved.upc || searchValue);
  renderPogSearchResults(result, {
    scannedRaw: code,
    resolvedUpc: resolved.method !== 'none' ? resolved.upc : null,
  });
  if (result.hits.length === 1 && result.hits[0].scope === 'this') {
    highlightPogTile(result.hits[0].upc);
  }
  saveHubSession({ pogSearch: searchValue });
}

async function startPogScanner() {
  const box = document.getElementById('pog-wv-scanner-box');
  const errEl = document.getElementById('pog-wv-scanner-error');
  if (!box) return;

  box.hidden = false;
  if (errEl) {
    errEl.hidden = true;
    errEl.textContent = '';
  }

  if (typeof Scanner === 'undefined') {
    if (errEl) {
      errEl.textContent = 'Scanner unavailable in this browser. Use text search.';
      errEl.hidden = false;
    }
    return;
  }

  await acquirePogScannerWakeLock();
  await Scanner.start('pog-wv-scanner-region', handlePogScan);

  if (!Scanner.isRunning) {
    await releasePogScannerWakeLock();
    if (errEl) {
      errEl.textContent = 'Camera unavailable or permission denied. Use text search.';
      errEl.hidden = false;
    }
    box.hidden = true;
    return;
  }

  const torchBtn = document.getElementById('pog-wv-scanner-torch');
  if (torchBtn) {
    torchBtn.hidden = !Scanner.torchAvailable;
    torchBtn.textContent = 'Torch';
  }
}

function renderPogTile(prod, bay, fixture, dbkey) {
  const upc = String(prod.upc);
  const name = productDisplayName(upc, prod);
  const size = productDisplaySize(upc, prod);
  const tileId = 'pog-tile-' + dbkey + '-' + bay.bay_num + '-' + fixture.fixture_num + '-' + upc;
  const imgUrl = pogUrl('/products-png/' + encodeURIComponent(upc) + '.png');
  const facings = prod.facings > 1 ? (' · ×' + prod.facings) : '';
  const newBadge = prod.is_new ? '<span class="pog-wv-badge-new">NEW</span>' : '';

  return (
    '<button type="button" class="pog-wv-tile" id="' + escapeHtml(tileId) + '" ' +
      'data-upc="' + escapeHtml(upc) + '" ' +
      'data-bay="' + escapeHtml(String(bay.bay_num)) + '" ' +
      'data-fixture="' + escapeHtml(String(fixture.fixture_num)) + '">' +
      newBadge +
      '<div class="pog-wv-tile-visual">' +
        '<img class="pog-wv-tile-img" loading="lazy" decoding="async" src="' + escapeHtml(imgUrl) + '" alt="" ' +
          'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
        '<div class="pog-wv-tile-textonly" style="display:none">' + escapeHtml(name.slice(0, 40)) + '</div>' +
        '<div class="pog-wv-tile-card" aria-hidden="true">' + renderPogPositionCardHtml(fixture, prod) + '</div>' +
      '</div>' +
      '<div class="pog-wv-tile-name">' + escapeHtml(name) + '</div>' +
      '<div class="pog-wv-tile-upc">' + escapeHtml(upc) + '</div>' +
      '<div class="pog-wv-tile-meta">' + escapeHtml(size) + escapeHtml(facings) + '</div>' +
    '</button>'
  );
}

function renderPogFixture(fixture, bay, dbkey) {
  let inner = '';
  const label = escapeHtml(fixture.label || fixture.type || 'Fixture');

  if (fixture.type === 'pegboard') {
    const rows = Math.max(1, fixture.rows || 1);
    const cols = Math.max(1, fixture.cols || 1);
    const cells = Array.from({ length: rows * cols }, () => '');
    const products = (fixture.products || []).slice();

    products.sort((a, b) => (a.pos || 0) - (b.pos || 0));
    let fallbackIdx = 0;
    for (const prod of products) {
      const peg = parsePegPosition(prod.position_code);
      let idx;
      if (peg && peg.row >= 1 && peg.col >= 1 && peg.row <= rows && peg.col <= cols) {
        idx = (peg.row - 1) * cols + (peg.col - 1);
      } else {
        idx = fallbackIdx;
        fallbackIdx += 1;
      }
      if (idx >= 0 && idx < cells.length && !cells[idx]) {
        cells[idx] = renderPogTile(prod, bay, fixture, dbkey);
      }
    }

    inner = '<div class="pog-wv-peg-grid" style="grid-template-columns:repeat(' + cols + ', minmax(0,1fr))">' +
      cells.map(cell => '<div class="pog-wv-peg-cell">' + (cell || '') + '</div>').join('') +
      '</div>';
  } else {
    const products = (fixture.products || []).slice().sort((a, b) => (a.pos || 0) - (b.pos || 0));
    inner = '<div class="pog-wv-shelf-row">' +
      products.map(p => renderPogTile(p, bay, fixture, dbkey)).join('') +
      '</div>';
  }

  return (
    '<div class="pog-wv-fixture">' +
      '<div class="pog-wv-fixture-label">' + label + '</div>' +
      inner +
    '</div>'
  );
}

function renderPogBays(layout) {
  const dbkey = layout.dbkey;
  const bays = (layout.bays || []).slice().sort((a, b) => (a.bay_num || 0) - (b.bay_num || 0));
  return bays.map(bay => {
    const fixtures = (bay.fixtures || []).slice()
      .sort((a, b) => (b.offset_from_base_in || 0) - (a.offset_from_base_in || 0));
    const fixtureHtml = fixtures.map(f => renderPogFixture(f, bay, dbkey)).join('');
    return (
      '<div class="pog-wv-bay" data-bay="' + escapeHtml(String(bay.bay_num)) + '">' +
        '<div class="pog-wv-bay-head">Bay ' + escapeHtml(String(bay.bay_num)) +
          ' · ' + escapeHtml(String(bay.width_ft || '?')) + ' ft · PDF page ' + escapeHtml(String(bay.pdf_page || '—')) +
        '</div>' +
        '<div class="pog-wv-fixtures">' + fixtureHtml + '</div>' +
      '</div>'
    );
  }).join('');
}

function renderPogSearchResults(result, meta) {
  const box = document.getElementById('pog-wv-search-results');
  if (!box) return;

  if (!result.hits.length && !result.notFound) {
    box.innerHTML = '';
    return;
  }

  const clearHead =
    '<div class="pog-wv-search-results-head">' +
      '<span class="pog-wv-search-results-title">Search results</span>' +
      '<button type="button" class="btn pog-wv-search-clear" id="pog-wv-search-clear">Clear</button>' +
    '</div>';

  if (result.notFound) {
    let msg = 'Not found in any set.';
    let notFoundUpc = '';
    if (meta && meta.scannedRaw) {
      notFoundUpc = String(meta.resolvedUpc || meta.scannedRaw || '').trim();
      msg = 'Scanned ' + escapeHtml(String(meta.scannedRaw)) + ' — not found in any set.';
      if (meta.resolvedUpc && meta.resolvedUpc !== meta.scannedRaw) {
        msg += ' Resolved to ' + escapeHtml(String(meta.resolvedUpc)) + '.';
      }
      msg += ' Try the last 4 digits of the UPC.';
    } else {
      notFoundUpc = String(document.getElementById('pog-wv-search-input')?.value || '').trim();
    }
    pogLastNotFoundUpc = notFoundUpc;

    let notFoundActions = '';
    if (liveVisitId && hubContext.myRank >= 1) {
      notFoundActions =
        '<div class="pog-wv-notfound-actions">' +
          '<button type="button" class="pog-wv-notfound-btn flag-tag" data-notfound-flag="missing-tag">Flag missing tag</button>' +
          '<button type="button" class="pog-wv-notfound-btn flag-nis" data-notfound-flag="nis">Flag not in store</button>' +
        '</div>';
    }

    box.innerHTML = clearHead +
      '<div class="pog-wv-search-group"><div class="pog-wv-search-hit-info">' + msg + notFoundActions + '</div></div>';
    document.getElementById('pog-wv-search-clear')?.addEventListener('click', clearPogSearch);
    return;
  }

  const thisHits = result.hits.filter(h => h.scope === 'this');
  const otherHits = result.hits.filter(h => h.scope === 'other');
  let html = clearHead;

  if (thisHits.length) {
    html += '<div class="pog-wv-search-group"><div class="pog-wv-search-group-title">In this set</div>';
    for (const h of thisHits) {
      html += '<div class="pog-wv-search-hit">' +
        '<div class="pog-wv-search-hit-info">' +
          '<div class="pog-wv-search-hit-name">' + escapeHtml(h.name) + '</div>' +
          '<div class="pog-wv-search-hit-upc">UPC ' + escapeHtml(String(h.upc)) + '</div>' +
          '<div class="pog-wv-search-hit-loc">' + escapeHtml(h.location) + '</div>' +
        '</div>' +
        '<button type="button" class="pog-wv-search-open" data-scroll-to-upc="' + escapeHtml(h.upc) + '">Show</button>' +
      '</div>';
    }
    html += '</div>';
  }

  if (otherHits.length) {
    html += '<div class="pog-wv-search-group"><div class="pog-wv-search-group-title">In another set</div>';
    const seen = new Set();
    for (const h of otherHits) {
      const key = h.dbkey + ':' + h.upc;
      if (seen.has(key)) continue;
      seen.add(key);
      html += '<div class="pog-wv-search-hit">' +
        '<div class="pog-wv-search-hit-info">' +
          '<div class="pog-wv-search-hit-name">' + escapeHtml(h.name) + '</div>' +
          '<div class="pog-wv-search-hit-upc">UPC ' + escapeHtml(String(h.upc)) + '</div>' +
          '<div class="pog-wv-search-hit-loc">' + escapeHtml(h.title) + ' · lane ' + escapeHtml(h.lane) + '</div>' +
        '</div>' +
        '<button type="button" class="pog-wv-search-open" data-open-pog-dbkey="' + escapeHtml(h.dbkey) + '">Open</button>' +
      '</div>';
    }
    html += '</div>';
  }

  box.innerHTML = html;
  document.getElementById('pog-wv-search-clear')?.addEventListener('click', clearPogSearch);
}

function clearPogSearch() {
  const input = document.getElementById('pog-wv-search-input');
  if (input) input.value = '';
  renderPogSearchResults({ hits: [], notFound: false });
  document.querySelectorAll('.pog-wv-tile--highlight').forEach(el => {
    el.classList.remove('pog-wv-tile--highlight');
  });
  saveHubSession({ pogSearch: '' });
}

function highlightPogTile(upc) {
  document.querySelectorAll('.pog-wv-tile--highlight').forEach(el => {
    el.classList.remove('pog-wv-tile--highlight');
  });
  const tiles = document.querySelectorAll('.pog-wv-tile[data-upc="' + upc + '"]');
  if (!tiles.length) return;
  tiles.forEach(t => t.classList.add('pog-wv-tile--highlight'));
  tiles[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function bindPogSearchUi() {
  const input = document.getElementById('pog-wv-search-input');
  const btn = document.getElementById('pog-wv-search-btn');
  const results = document.getElementById('pog-wv-search-results');

  const run = () => {
    const query = input ? input.value : '';
    const result = runPogSearch(query);
    renderPogSearchResults(result);
    if (result.hits.length === 1 && result.hits[0].scope === 'this') {
      highlightPogTile(result.hits[0].upc);
    }
    saveHubSession({ pogSearch: query });
  };

  btn?.addEventListener('click', run);
  input?.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); run(); }
  });
  input?.addEventListener('input', () => {
    const v = (input.value || '').trim();
    saveHubSession({ pogSearch: v });
    if (/^\d{4}$/.test(v)) run();
  });
  results?.addEventListener('click', e => {
    const showBtn = e.target.closest('[data-scroll-to-upc]');
    if (showBtn) {
      highlightPogTile(showBtn.getAttribute('data-scroll-to-upc'));
      return;
    }
    const notFoundBtn = e.target.closest('[data-notfound-flag]');
    if (notFoundBtn) {
      const kind = notFoundBtn.getAttribute('data-notfound-flag');
      if (kind === 'missing-tag') {
        openPogMissingTagForm({ upc: pogLastNotFoundUpc || '' });
      } else if (kind === 'nis') {
        setPogWvActionsDisabled(true);
        setPogWvActionStatus('Raising not-in-store flag…');
        submitPogSectionFlag('nis', {}).then(() => {
          setPogWvActionStatus('Flagged — pending lead review', 'ok');
        }).catch(err => {
          setPogWvActionStatus(err.message || 'Failed', 'error');
          setPogWvActionsDisabled(false);
        });
      }
    }
  });

  const maskSlider = document.getElementById('pog-wv-mask-slider');
  maskSlider?.addEventListener('input', () => {
    const pct = parseInt(maskSlider.value, 10) || 0;
    applyPogMaskOpacity(pct);
    saveHubSession({ pogMask: pct });
  });
  applyPogMaskOpacity(pogMaskCardOpacity);

  document.getElementById('pog-wv-scan-btn')?.addEventListener('click', () => {
    const box = document.getElementById('pog-wv-scanner-box');
    if (box && !box.hidden && typeof Scanner !== 'undefined' && Scanner.isRunning) {
      stopPogScanner();
    } else {
      startPogScanner();
    }
  });

  document.getElementById('pog-wv-scanner-stop')?.addEventListener('click', () => stopPogScanner());

  document.getElementById('pog-wv-scanner-torch')?.addEventListener('click', async () => {
    if (typeof Scanner === 'undefined') return;
    const on = await Scanner.toggleTorch();
    const torchBtn = document.getElementById('pog-wv-scanner-torch');
    if (torchBtn) torchBtn.textContent = on ? 'Torch off' : 'Torch';
  });
}

        '<button type="button" class="btn pog-wv-search-btn" id="pog-wv-search-btn">Search</button>' +
      '</div>' +
      '<div class="pog-wv-scanner-box" id="pog-wv-scanner-box" hidden>' +
        '<div class="pog-wv-scanner-controls">' +
          '<button type="button" class="btn" id="pog-wv-scanner-stop">Stop</button>' +
          '<button type="button" class="btn" id="pog-wv-scanner-torch" hidden>Torch</button>' +
        '</div>' +
        '<p class="pog-wv-scanner-hint">Point at barcode — scans full frame</p>' +
        '<div id="pog-wv-scanner-region"></div>' +
        '<p class="pog-wv-scanner-error" id="pog-wv-scanner-error" hidden></p>' +
      '</div>' +
      '<div class="pog-wv-search-results" id="pog-wv-search-results"></div>' +
    '</div>' +

  if (previewImg) {
    previewImg.onerror = () => {
      const wrap = document.getElementById('pog-wv-preview');
      if (wrap) wrap.style.display = 'none';
    };
  }

  document.getElementById('pog-wv-preview-toggle')?.addEventListener('click', () => {
    document.getElementById('pog-wv-preview')?.classList.toggle('open');
  });

  bindPogSearchUi();
  bindPogWorkingActions();
  refreshPogWorkingChrome();
}

function getSectionMeta(dbkey) {
  if (!dbkey) return null;
  return hubContext.sections[String(dbkey)] || null;
}

function isAssignedRepForDbkey(dbkey) {
  const meta = getSectionMeta(dbkey);
  if (!meta || meta.assignee_id == null || hubContext.myUserId == null) return false;
  return Number(meta.assignee_id) === Number(hubContext.myUserId);
}

function canShowPogMarkDone(dbkey) {
  if (!liveVisitId || hubContext.myRank < 1) return false;
  if (getFixtureState(dbkey) !== 'in_progress') return false;
  return hubContext.myRank >= 2 || isAssignedRepForDbkey(dbkey);
}

function canShowPogSignoff(dbkey) {
  if (!liveVisitId || hubContext.myRank < 2) return false;
  return getFixtureState(dbkey) === 'done_pending_signoff';
}

function pogWorkingDbkey() {
  return pogWorkingFixture?.dbkey || null;
}

function defaultPogFlagLocation() {
  if (!pogWorkingFixture) return undefined;
  return 'Lane ' + pogWorkingFixture.lane + ' · ' + shortName(pogWorkingFixture.name);
}

function setPogWvActionStatus(msg, kind) {
  const el = document.getElementById('pog-wv-action-status');
  if (!el) return;
  el.textContent = msg || '';

function hubUrl(path) {
  return '/api/hub/' + encodeURIComponent(liveVisitId) + path;
}

async function hubPost(path, body) {
  if (!liveVisitId) throw new Error('No live visit');
  const authFetch = window.dumpBinAuthFetch || fetch;
  const resp = await authFetch(hubUrl(path), {
    method: 'POST',
    noBounceOn401: true,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  if (resp.status === 401) throw new Error('Not signed in');
  if (resp.status === 403) throw new Error('Lead or supervisor required');
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('Request failed (' + resp.status + ')'));
  return data;
}

async function hubGet(path) {

  if (resp.status === 401) throw new Error('Not signed in');

  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('Request failed (' + resp.status + ')'));
  return data;
}

      payloadHtml +

async function loadLiveState(visitId) {
  const authFetch = window.dumpBinAuthFetch || fetch;
  const resp = await authFetch(
    '/api/hub/' + encodeURIComponent(visitId) + '/snapshot',
    { noBounceOn401: true }
  );
  if (resp.status === 401) {
    throw new Error('Not signed in — you will be redirected to sign in');
  }
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error || ('Snapshot request failed (' + resp.status + ')'));
  }
  const snapshot = await resp.json();
  applySnapshot(snapshot);
  return snapshot;
}

function parseSseEvents(buffer) {
  const events = [];
  const parts = buffer.split('\n\n');
  const remainder = parts.pop() || '';
  for (const part of parts) {
    if (!part.trim()) continue;
    let eventName = 'message';
    let data = '';
    for (const line of part.split('\n')) {
      if (line.startsWith('event:')) eventName = line.slice(6).trim();
      else if (line.startsWith('data:')) data += line.slice(5).trim();
    }
    if (data) events.push({ event: eventName, data });
  }
  return { events, remainder };
}

async function connectHubStream(visitId) {
  if (streamAbort) {
    streamAbort.aborted = true;
    streamAbort = null;
  }

  const authFetch = window.dumpBinAuthFetch || fetch;
  const controller = { aborted: false };
  streamAbort = controller;

  const resp = await authFetch(
    '/api/hub/' + encodeURIComponent(visitId) + '/stream',
    {
      noBounceOn401: true,
      headers: { Accept: 'text/event-stream' },
    }
  );

  if (!resp.ok || !resp.body) {
    console.warn('[Checklane Hub] SSE stream unavailable:', resp.status);
    return;
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  (async () => {
    try {
      while (!controller.aborted) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parsed = parseSseEvents(buffer);
        buffer = parsed.remainder;
        for (const evt of parsed.events) {
          if (evt.event === 'snapshot') {
            try {
              const snapshot = JSON.parse(evt.data);
              pendingDetailCache = {};
              applySnapshot(snapshot);
            } catch (err) {
              console.warn('[Checklane Hub] Bad snapshot event:', err);
            }
          }
        }
      }
    } catch (err) {
      if (!controller.aborted) {
        console.warn('[Checklane Hub] SSE stream ended:', err.message || err);
      }
    }
  })();
}

      setDataSourceLabel(
        'Store 00163 · live visit ' + visitId +
        ' · ' + (snapshot.stats?.total ?? 0) + ' sections · rank ' + (snapshot.myRank ?? 1)
      );
      console.log('[Checklane Hub] Live snapshot loaded', snapshot);
      connectHubStream(visitId).catch(err => {
        console.warn('[Checklane Hub] SSE connect failed:', err);
      });
    } catch (err) {
      console.error('[Checklane Hub] Live state failed, falling back to SEED_STATES:', err);
      applyState(SEED_STATES);
      const detail = err && err.message ? err.message : String(err);
      setDataSourceLabel('Store 00163 · live load failed — ' + detail);
    }
  } else {
    applyState(SEED_STATES);
    setDataSourceLabel('Store 00163 · 83 fixtures · 26 lanes · SEED_STATES demo');
  }

  await restoreHubNavigation();
}

init();
</script>
