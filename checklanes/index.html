<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checklanes — Select Store</title>
<script src="/auth-gate.js"></script>
<script src="hub-presence.js"></script>
<link rel="stylesheet" href="/styles.css">
<style>
  :root {
    --cl-bg: #0f1117;
    --cl-surface: #1a1d27;
    --cl-surface2: #242836;
    --cl-border: #2e3345;
    --cl-text: #e8eaf0;
    --cl-text2: #8b90a5;
    --cl-accent: #3b82f6;
    --cl-assigned: #22c55e;
    --cl-radius: 10px;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cl-bg);
    color: var(--cl-text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }

  .cl-wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  .cl-hero {
    margin-bottom: 28px;
  }

  .cl-hero h1 {
    margin: 0 0 8px;
    font-size: 1.6rem;
    font-weight: 800;
  }

  .cl-hero p {
    margin: 0;
    color: var(--cl-text2);
    line-height: 1.5;
  }

  .cl-user-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: var(--cl-radius);
    border: 1px solid var(--cl-border);
    background: var(--cl-surface);
  }

  .cl-badge {
    font-size: 0.65rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid transparent;
  }

  .cl-badge--admin {
    color: #fde68a;
    background: rgba(245, 158, 11, 0.15);
    border-color: rgba(245, 158, 11, 0.35);
  }

  .cl-badge--supervisor {
    color: #bbf7d0;
    background: rgba(34, 197, 94, 0.14);
    border-color: rgba(34, 197, 94, 0.35);
  }

  .cl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  #store-grid:not(.cl-grid) {
    display: block;
  }

  #store-grid.cl-grid {
    display: grid;
  }

  .cl-store-card {
    border: 1px solid var(--cl-border);
    border-radius: var(--cl-radius);
    background: var(--cl-surface);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .cl-store-card--assigned {
    border-color: rgba(34, 197, 94, 0.55);
    box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.15);
  }

  .cl-store-card--test {
    border-style: dashed;
  }

  .cl-store-title {
    font-size: 1.05rem;
    font-weight: 800;
    margin: 0;
  }

  .cl-store-meta {
    font-size: 0.8rem;
    color: var(--cl-text2);
    margin: 0;
  }

  .cl-role-pill {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--cl-surface2);
    color: var(--cl-text2);
  }

  .cl-role-pill--lead { color: #fde68a; }
  .cl-role-pill--rep { color: #bfdbfe; }
  .cl-role-pill--supervisor { color: #bbf7d0; }

  .cl-shift-info {
    margin: 0;
    display: grid;
    gap: 6px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--cl-border);
    background: var(--cl-bg);
  }

  .cl-shift-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    align-items: baseline;
    font-size: 0.8rem;
  }

  .cl-shift-label {
    color: var(--cl-text2);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 0.65rem;
  }

  .cl-shift-value {
    color: var(--cl-text);
    font-weight: 600;
  }

  .cl-shift-note {
    color: var(--cl-text2);
    font-size: 0.75rem;
  }

  .cl-supervisor-section {
    margin-bottom: 24px;
  }

  .cl-supervisor-heading {
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--cl-border);
    font-size: 1rem;
    font-weight: 800;
    color: var(--cl-text);
  }

  .cl-supervisor-count {
    color: var(--cl-text2);
    font-weight: 600;
    font-size: 0.85rem;
  }

  .cl-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: auto;
  }

  .cl-btn {
    appearance: none;
    border: 1px solid var(--cl-border);
    background: var(--cl-surface2);
    color: var(--cl-text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
  }

  .cl-btn--primary {
    background: var(--cl-accent);
    border-color: #2563eb;
    color: #fff;
  }

  .cl-btn--ghost {
    background: transparent;
  }

  .cl-empty, .cl-error, .cl-loading {
    padding: 24px;
    border-radius: var(--cl-radius);
    border: 1px dashed var(--cl-border);
    color: var(--cl-text2);
    text-align: center;
  }

  .cl-panel {
    margin-top: 14px;
    padding: 14px;
    border-radius: var(--cl-radius);
    border: 1px solid var(--cl-border);
    background: var(--cl-surface2);
  }

  .cl-panel h3 {
    margin: 0 0 10px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--cl-text2);
  }

  .cl-member-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--cl-border);
  }

  .cl-member-row:last-child { border-bottom: none; }

  .cl-member-name {
    flex: 1 1 140px;
    font-weight: 700;
    font-size: 0.9rem;
  }

  .cl-member-email {
    font-size: 0.75rem;
    color: var(--cl-text2);
  }

  .cl-form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .cl-input, .cl-select {
    flex: 1 1 160px;
    min-height: 38px;
    border-radius: 8px;
    border: 1px solid var(--cl-border);
    background: var(--cl-bg);
    color: var(--cl-text);
    padding: 8px 10px;
    font-size: 0.85rem;
  }

  .cl-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 16px;
    color: var(--cl-text2);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .cl-back:hover { color: var(--cl-text); }

  .cl-presence-panel {
    margin-bottom: 20px;
  }

  .cl-activity-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .cl-activity-head h2 {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 800;
    flex: 1 1 auto;
  }

  .cl-activity-tabs {
    display: inline-flex;
    gap: 6px;
    padding: 3px;
    border-radius: 999px;
    border: 1px solid var(--cl-border);
    background: var(--cl-bg);
  }

  .cl-activity-tab {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--cl-text2);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  .cl-activity-tab.is-active {
    background: var(--cl-surface2);
    color: var(--cl-text);
  }

  .cl-history-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }

  .cl-history-filters .cl-select {
    min-width: 140px;
    min-height: 34px;
    flex: 0 1 auto;
  }

  .cl-presence-dot--past {
    background: #64748b;
    box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.18);
  }

  .cl-history-when {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .cl-history-duration,
  .cl-history-open {
    font-size: 0.72rem;
    color: var(--cl-text2);
  }

  .cl-history-open {
    color: #86efac;
    font-weight: 700;
  }

  .cl-presence-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .cl-presence-head h2 {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 800;
  }

  .cl-presence-updated {
    font-size: 0.75rem;
    color: var(--cl-text2);
  }

  .cl-presence-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .cl-presence-row {
    display: grid;
    grid-template-columns: minmax(160px, 1.2fr) minmax(180px, 2fr) auto;
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--cl-border);
    background: var(--cl-bg);
  }

  @media (max-width: 720px) {
    .cl-presence-row {
      grid-template-columns: 1fr;
    }
  }

  .cl-presence-who {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .cl-presence-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    flex-shrink: 0;
  }

  .cl-presence-name {
    font-weight: 700;
    font-size: 0.9rem;
  }

  .cl-presence-email {
    font-size: 0.75rem;
    color: var(--cl-text2);
  }

  .cl-presence-where {
    font-size: 0.85rem;
    color: var(--cl-text);
  }

  .cl-presence-when {
    font-size: 0.75rem;
    color: var(--cl-text2);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="cl-wrap">
  <a href="/" class="cl-back" id="cl-back-home" hidden>← Team Resources</a>

  <section class="cl-hero">
    <h1>Checklanes</h1>
    <p>Select your store to open the Reset Hub dashboard. You only see locations you are assigned to — admins and supervisors see their full purview.</p>
    <div class="cl-user-bar" id="user-bar" hidden>
      <span id="user-email"></span>
      <span class="cl-badge cl-badge--admin" id="admin-badge" hidden>Admin</span>
      <span class="cl-badge cl-badge--supervisor" id="supervisor-badge" hidden>Supervisor</span>
    </div>
  </section>

  <section class="cl-panel cl-presence-panel" id="presence-panel" hidden>
    <div class="cl-activity-head">
      <h2>Activity</h2>
      <div class="cl-activity-tabs" role="tablist" aria-label="Activity views">
        <button type="button" class="cl-activity-tab is-active" data-activity-tab="live" role="tab" aria-selected="true">Live</button>
        <button type="button" class="cl-activity-tab" data-activity-tab="history" role="tab" aria-selected="false">History</button>
      </div>
      <span class="cl-presence-updated" id="presence-updated"></span>
    </div>
    <div class="cl-history-filters" id="presence-history-filters" hidden>
      <select class="cl-select" data-history-hours aria-label="History time range">
        <option value="24">Last 24 hours</option>
        <option value="72" selected>Last 3 days</option>
        <option value="168">Last 7 days</option>
      </select>
      <select class="cl-select" data-history-store aria-label="Filter by store">
        <option value="">All stores</option>
      </select>
    </div>
    <div id="presence-live-pane">
      <div id="presence-list"></div>
    </div>
    <div id="presence-history-pane" hidden>
      <div id="presence-history-list"></div>
    </div>
  </section>

  <div id="status" class="cl-loading">Loading your stores…</div>
  <div id="store-grid" hidden></div>
</div>

<script>
(function () {
  'use strict';

  function padStore(n) {
    const d = String(n || '').replace(/\D/g, '');
    return d ? String(Number(d)).padStart(5, '0') : '';
  }

  function roleLabel(role) {
    if (role === 'lead') return 'Lead';
    if (role === 'rep') return 'Rep';
    if (role === 'supervisor') return 'Supervisor';
    return '';
  }

  /** Keep in sync with checklanes/hub-version.json + hub.html HUB_BUILD. */
  const HUB_RELEASE_BUILD = '20260602-dual-aisle-v2';

  function resolveStoreVisitId(store) {
    return store.liveVisitId || (store.shift && store.shift.visitId) || store.defaultVisitId || null;
  }

  function hubUrl(store) {
    const visit = resolveStoreVisitId(store);
    if (!visit) return null;
    return 'hub.html?store=' + encodeURIComponent(store.storeNumber) +
      '&visit=' + encodeURIComponent(visit) +
      '&_hb=' + encodeURIComponent(HUB_RELEASE_BUILD);
  }

  function formatShiftWindow(shift) {
    if (!shift) return '';
    const parts = [];
    if (shift.scheduledDateLabel) parts.push(shift.scheduledDateLabel);
    if (shift.shiftStart && shift.shiftEnd) {
      parts.push(shift.shiftStart + ' – ' + shift.shiftEnd);
    } else if (shift.shiftStart) {
      parts.push(shift.shiftStart);
    }
    return parts.join(' · ');
  }

  function appendShiftInfo(card, store) {
    const shift = store.shift || {};
    const visitId = resolveStoreVisitId(store);
    if (!visitId && !shift.leadName && !shift.supervisorLabel) return;

    const block = document.createElement('div');
    block.className = 'cl-shift-info';

    if (visitId) {
      const visitRow = document.createElement('div');
      visitRow.className = 'cl-shift-row';
      visitRow.innerHTML =
        '<span class="cl-shift-label">Visit ID</span>' +
        '<span class="cl-shift-value">' + escapeHtml(visitId) + '</span>';
      block.appendChild(visitRow);
    }

    if (shift.leadName) {
      const row = document.createElement('div');
      row.className = 'cl-shift-row';
      row.innerHTML =
        '<span class="cl-shift-label">Lead</span>' +
        '<span class="cl-shift-value">' + escapeHtml(shift.leadName) + '</span>';
      if (shift.leadSource === 'hub+schedule' && shift.visitLead && shift.hubLead) {
        row.innerHTML += '<span class="cl-shift-note">Schedule: ' + escapeHtml(shift.visitLead) + '</span>';
      } else if (shift.leadSource === 'schedule' && !shift.hubLead) {
        row.innerHTML += '<span class="cl-shift-note">From schedule</span>';
      }
      block.appendChild(row);
    } else {
      const row = document.createElement('div');
      row.className = 'cl-shift-row';
      row.innerHTML =
        '<span class="cl-shift-label">Lead</span>' +
        '<span class="cl-shift-note">Not assigned yet</span>';
      block.appendChild(row);
    }

    if (shift.supervisorLabel) {
      const row = document.createElement('div');
      row.className = 'cl-shift-row';
      row.innerHTML =
        '<span class="cl-shift-label">Supervisor</span>' +
        '<span class="cl-shift-value">' + escapeHtml(shift.supervisorLabel) + '</span>';
      block.appendChild(row);
    }

    const when = formatShiftWindow(shift);
    if (when) {
      const row = document.createElement('div');
      row.className = 'cl-shift-row';
      row.innerHTML =
        '<span class="cl-shift-label">Shift</span>' +
        '<span class="cl-shift-note">' + escapeHtml(when) + '</span>';
      block.appendChild(row);
    }

    card.appendChild(block);
  }

  function groupStoresBySupervisor(stores) {
    const groups = new Map();
    stores.forEach(function (store) {
      const key = (store.shift && store.shift.supervisorKey) || '__unassigned__';
      const label = (store.shift && store.shift.supervisorLabel) || 'No supervisor assigned';
      if (!groups.has(key)) groups.set(key, { label: label, stores: [] });
      groups.get(key).stores.push(store);
    });

    return Array.from(groups.values()).sort(function (a, b) {
      if (a.label === 'No supervisor assigned') return 1;
      if (b.label === 'No supervisor assigned') return -1;
      return a.label.localeCompare(b.label);
    });
  }

  async function apiFetch(path, options) {
    const fn = window.dumpBinAuthFetch || fetch;
    const resp = await fn('/api/hub' + path, options || {});
    if (!resp.ok) {
      const err = await resp.json().catch(function () { return {}; });
      throw new Error(err.error || ('Request failed (' + resp.status + ')'));
    }
    return resp.json();
  }

  function renderMemberRow(member, storeNumber, canManage) {
    const row = document.createElement('div');
    row.className = 'cl-member-row';
    row.innerHTML =
      '<div class="cl-member-name">' + escapeHtml(member.name) +
      ' <span class="cl-role-pill cl-role-pill--' + escapeHtml(member.role) + '">' +
      escapeHtml(roleLabel(member.role)) + '</span></div>' +
      '<div class="cl-member-email">' + escapeHtml(member.email) + '</div>';

    if (canManage) {
      const actions = document.createElement('div');
      actions.style.display = 'flex';
      actions.style.gap = '6px';

      if (member.role !== 'lead') {
        const leadBtn = document.createElement('button');
        leadBtn.type = 'button';
        leadBtn.className = 'cl-btn cl-btn--ghost';
        leadBtn.textContent = 'Make lead';
        leadBtn.addEventListener('click', function () {
          patchMember(storeNumber, member.id, 'lead');
        });
        actions.appendChild(leadBtn);
      }

      if (member.role !== 'rep') {
        const repBtn = document.createElement('button');
        repBtn.type = 'button';
        repBtn.className = 'cl-btn cl-btn--ghost';
        repBtn.textContent = 'Make rep';
        repBtn.addEventListener('click', function () {
          patchMember(storeNumber, member.id, 'rep');
        });
        actions.appendChild(repBtn);
      }

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'cl-btn cl-btn--ghost';
      removeBtn.textContent = 'Remove';
      removeBtn.addEventListener('click', function () {
        if (!confirm('Remove ' + member.name + ' from this store?')) return;
        removeMember(storeNumber, member.id);
      });
      actions.appendChild(removeBtn);

      row.appendChild(actions);
    }

    return row;
  }

  function escapeHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function loadMembers(storeNumber, panelEl, canManage) {
    panelEl.innerHTML = '<div class="cl-loading">Loading team…</div>';
    try {
      const data = await apiFetch('/stores/' + encodeURIComponent(storeNumber) + '/assignments');
      panelEl.innerHTML = '<h3>Team</h3>';
      if (!data.members.length) {
        panelEl.innerHTML += '<p class="cl-store-meta">No one assigned yet.</p>';
      } else {
        data.members.forEach(function (m) {
          panelEl.appendChild(renderMemberRow(m, storeNumber, canManage));
        });
      }

      if (canManage) {
        const form = document.createElement('div');
        form.className = 'cl-form-row';
        form.innerHTML =
          '<input class="cl-input" type="email" placeholder="Email to add" data-add-email>' +
          '<select class="cl-select" data-add-role>' +
          '<option value="rep">Rep</option><option value="lead">Lead</option></select>' +
          '<button type="button" class="cl-btn cl-btn--primary">Add person</button>';
        form.querySelector('button').addEventListener('click', function () {
          const email = form.querySelector('[data-add-email]').value.trim();
          const role = form.querySelector('[data-add-role]').value;
          if (!email) return;
          addMember(storeNumber, email, role, panelEl, canManage);
        });
        panelEl.appendChild(form);
      }
    } catch (err) {
      panelEl.innerHTML = '<div class="cl-error">' + escapeHtml(err.message) + '</div>';
    }
  }

  async function addMember(storeNumber, email, role, panelEl, canManage) {
    await apiFetch('/stores/' + encodeURIComponent(storeNumber) + '/assignments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, role: role }),
    });
    await loadMembers(storeNumber, panelEl, canManage);
    await refreshStores();
  }

  async function patchMember(storeNumber, userId, role) {
    await apiFetch('/stores/' + encodeURIComponent(storeNumber) + '/assignments/' + userId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ role: role }),
    });
    const panel = document.querySelector('[data-team-panel="' + storeNumber + '"]');
    if (panel) await loadMembers(storeNumber, panel, true);
    await refreshStores();
  }

  async function removeMember(storeNumber, userId) {
    await apiFetch('/stores/' + encodeURIComponent(storeNumber) + '/assignments/' + userId, {
      method: 'DELETE',
    });
    const panel = document.querySelector('[data-team-panel="' + storeNumber + '"]');
    if (panel) await loadMembers(storeNumber, panel, true);
    await refreshStores();
  }

  function renderStoreCard(store) {
    const card = document.createElement('article');
    card.className = 'cl-store-card';
    if (store.isAssigned) card.classList.add('cl-store-card--assigned');
    if (store.isTest) card.classList.add('cl-store-card--test');

    const title = document.createElement('h2');
    title.className = 'cl-store-title';
    title.textContent = store.name || ('Store ' + padStore(store.storeNumber));
    card.appendChild(title);

    const meta = document.createElement('p');
    meta.className = 'cl-store-meta';
    const visitNote = resolveStoreVisitId(store);
    meta.textContent = 'Store #' + padStore(store.storeNumber) +
      (visitNote ? ' · Visit ' + visitNote : '') +
      (store.isTest ? ' · Test environment' : '') +
      (store.isAssigned ? ' · You are assigned here' : '');
    card.appendChild(meta);

    if (store.myRole) {
      const role = document.createElement('span');
      role.className = 'cl-role-pill cl-role-pill--' + store.myRole;
      role.textContent = roleLabel(store.myRole);
      card.appendChild(role);
    }

    appendShiftInfo(card, store);

    const actions = document.createElement('div');
    actions.className = 'cl-actions';

    const url = hubUrl(store);
    if (url) {
      const open = document.createElement('a');
      open.className = 'cl-btn cl-btn--primary';
      open.href = url;
      open.textContent = 'Open dashboard';
      actions.appendChild(open);
    } else {
      const pending = document.createElement('span');
      pending.className = 'cl-store-meta';
      pending.textContent = 'No active visit configured';
      actions.appendChild(pending);
    }

    if (store.canManage) {
      const manage = document.createElement('button');
      manage.type = 'button';
      manage.className = 'cl-btn cl-btn--ghost';
      manage.textContent = 'Manage team';
      manage.addEventListener('click', function () {
        const existing = card.querySelector('[data-team-panel]');
        if (existing) {
          existing.remove();
          manage.textContent = 'Manage team';
          return;
        }
        const panel = document.createElement('div');
        panel.className = 'cl-panel';
        panel.setAttribute('data-team-panel', store.storeNumber);
        card.appendChild(panel);
        manage.textContent = 'Hide team';
        loadMembers(store.storeNumber, panel, true);
      });
      actions.appendChild(manage);
    }

    card.appendChild(actions);
    return card;
  }

  let lastPayload = null;

  async function refreshStores() {
    if (!lastPayload) return init();
    renderStores(lastPayload);
  }

  function renderStores(payload) {
    const status = document.getElementById('status');
    const grid = document.getElementById('store-grid');
    const userBar = document.getElementById('user-bar');

    userBar.hidden = false;
    document.getElementById('user-email').textContent = payload.email || '';
    document.getElementById('admin-badge').hidden = !payload.isAdmin;
    document.getElementById('supervisor-badge').hidden = !payload.isSupervisor || payload.isAdmin;

    if (!payload.stores.length) {
      status.className = 'cl-empty';
      status.textContent = 'No stores are available for your account yet. Contact your supervisor to be assigned.';
      status.hidden = false;
      grid.hidden = true;
      return;
    }

    status.hidden = true;
    grid.hidden = false;
    grid.className = payload.organizeBySupervisor ? '' : 'cl-grid';
    grid.innerHTML = '';

    const sorted = payload.stores.slice().sort(function (a, b) {
      if (a.isAssigned !== b.isAssigned) return a.isAssigned ? -1 : 1;
      return (a.name || '').localeCompare(b.name || '');
    });

    if (payload.organizeBySupervisor) {
      const groups = groupStoresBySupervisor(sorted);
      groups.forEach(function (group) {
        const section = document.createElement('section');
        section.className = 'cl-supervisor-section';

        const heading = document.createElement('h2');
        heading.className = 'cl-supervisor-heading';
        heading.innerHTML =
          escapeHtml(group.label) +
          ' <span class="cl-supervisor-count">(' + group.stores.length + ' store' +
          (group.stores.length === 1 ? '' : 's') + ')</span>';
        section.appendChild(heading);

        const groupGrid = document.createElement('div');
        groupGrid.className = 'cl-grid';
        group.stores.forEach(function (store) {
          groupGrid.appendChild(renderStoreCard(store));
        });
        section.appendChild(groupGrid);
        grid.appendChild(section);
      });
      return;
    }

    sorted.forEach(function (store) {
      grid.appendChild(renderStoreCard(store));
    });
  }

  function applyDirectChecklanesUi() {
    const back = document.getElementById('cl-back-home');
    if (!back) return;
    try {
      if (localStorage.getItem('dumpBinChecklanesEntry') === '1') {
        back.hidden = true;
        return;
      }
    } catch (_) {}
    back.hidden = false;
  }

  async function init() {
    if (window.dumpBinAuthReady) await window.dumpBinAuthReady;
    applyDirectChecklanesUi();

    if (window.ChecklanePresence) {
      ChecklanePresence.configure(function () {
        return { page: 'store-picker' };
      });
      ChecklanePresence.start();
    }

    const status = document.getElementById('status');
    try {
      const payload = await apiFetch('/stores');
      lastPayload = payload;
      renderStores(payload);

      if (payload.canViewPresence && window.ChecklanePresence) {
        const panel = document.getElementById('presence-panel');
        panel.hidden = false;
        var initialTab = (location.hash === '#activity-history') ? 'history' : 'live';
        ChecklanePresence.startActivityPanel({
          root: panel,
          livePanel: document.getElementById('presence-list'),
          historyPanel: document.getElementById('presence-history-list'),
          livePaneWrap: document.getElementById('presence-live-pane'),
          historyPaneWrap: document.getElementById('presence-history-pane'),
          statusEl: document.getElementById('presence-updated'),
          historyFiltersEl: document.getElementById('presence-history-filters'),
          storeOptions: payload.stores || [],
          currentEmail: payload.email,
          initialTab: initialTab,
        });
      }
    } catch (err) {
      status.className = 'cl-error';
      status.textContent = err.message || 'Failed to load stores';
    }
  }

  init();
})();
</script>
</body>
</html>
