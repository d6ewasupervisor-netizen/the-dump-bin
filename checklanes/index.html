<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checklanes — Select Store</title>
<script src="/auth-gate.js"></script>
<link rel="stylesheet" href="/styles.css">
<style>
  :root {
    --cl-bg: #0f1117;
    --cl-surface: #1a1d27;
    --cl-surface2: #242836;
    --cl-border: #2e3345;
    --cl-text: #e8eaf0;
    --cl-text2: #8b90a5;
    --cl-accent: #3b82f6;
    --cl-assigned: #22c55e;
    --cl-radius: 10px;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cl-bg);
    color: var(--cl-text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }

  .cl-wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  .cl-hero {
    margin-bottom: 28px;
  }

  .cl-hero h1 {
    margin: 0 0 8px;
    font-size: 1.6rem;
    font-weight: 800;
  }

  .cl-hero p {
    margin: 0;
    color: var(--cl-text2);
    line-height: 1.5;
  }

  .cl-user-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: var(--cl-radius);
    border: 1px solid var(--cl-border);
    background: var(--cl-surface);
  }

  .cl-badge {
    font-size: 0.65rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid transparent;
  }

  .cl-badge--admin {
    color: #fde68a;
    background: rgba(245, 158, 11, 0.15);
    border-color: rgba(245, 158, 11, 0.35);
  }

  .cl-badge--supervisor {
    color: #bbf7d0;
    background: rgba(34, 197, 94, 0.14);
    border-color: rgba(34, 197, 94, 0.35);
  }

  .cl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .cl-store-card {
    border: 1px solid var(--cl-border);
    border-radius: var(--cl-radius);
    background: var(--cl-surface);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .cl-store-card--assigned {
    border-color: rgba(34, 197, 94, 0.55);
    box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.15);
  }

  .cl-store-card--test {
    border-style: dashed;
  }

  .cl-store-title {
    font-size: 1.05rem;
    font-weight: 800;
    margin: 0;
  }

  .cl-store-meta {
    font-size: 0.8rem;
    color: var(--cl-text2);
    margin: 0;
  }

  .cl-role-pill {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--cl-surface2);
    color: var(--cl-text2);
  }

  .cl-role-pill--lead { color: #fde68a; }
  .cl-role-pill--rep { color: #bfdbfe; }
  .cl-role-pill--supervisor { color: #bbf7d0; }

  .cl-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: auto;
  }

  .cl-btn {
    appearance: none;
    border: 1px solid var(--cl-border);
    background: var(--cl-surface2);
    color: var(--cl-text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
  }

  .cl-btn--primary {
    background: var(--cl-accent);
    border-color: #2563eb;
    color: #fff;
  }

  .cl-btn--ghost {
    background: transparent;
  }

  .cl-empty, .cl-error, .cl-loading {
    padding: 24px;
    border-radius: var(--cl-radius);
    border: 1px dashed var(--cl-border);
    color: var(--cl-text2);
    text-align: center;
  }

  .cl-panel {
    margin-top: 14px;
    padding: 14px;
    border-radius: var(--cl-radius);
    border: 1px solid var(--cl-border);
    background: var(--cl-surface2);
  }

  .cl-panel h3 {
    margin: 0 0 10px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--cl-text2);
  }

  .cl-member-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--cl-border);
  }

  .cl-member-row:last-child { border-bottom: none; }

  .cl-member-name {
    flex: 1 1 140px;
    font-weight: 700;
    font-size: 0.9rem;
  }

  .cl-member-email {
    font-size: 0.75rem;
    color: var(--cl-text2);
  }

  .cl-form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .cl-input, .cl-select {
    flex: 1 1 160px;
    min-height: 38px;
    border-radius: 8px;
    border: 1px solid var(--cl-border);
    background: var(--cl-bg);
    color: var(--cl-text);
    padding: 8px 10px;
    font-size: 0.85rem;
  }

  .cl-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 16px;
    color: var(--cl-text2);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .cl-back:hover { color: var(--cl-text); }
</style>
</head>
<body>
<div class="cl-wrap">
  <a href="/" class="cl-back" id="cl-back-home" hidden>← Team Resources</a>

  <section class="cl-hero">
    <h1>Checklanes</h1>
    <p>Select your store to open the Reset Hub dashboard. You only see locations you are assigned to — admins and supervisors see their full purview.</p>
    <div class="cl-user-bar" id="user-bar" hidden>
      <span id="user-email"></span>
      <span class="cl-badge cl-badge--admin" id="admin-badge" hidden>Admin</span>
      <span class="cl-badge cl-badge--supervisor" id="supervisor-badge" hidden>Supervisor</span>
    </div>
  </section>

  <div id="status" class="cl-loading">Loading your stores…</div>
  <div id="store-grid" class="cl-grid" hidden></div>
</div>

<script>
(function () {
  'use strict';

  function padStore(n) {
    const d = String(n || '').replace(/\D/g, '');
    return d ? String(Number(d)).padStart(5, '0') : '';
  }

  function roleLabel(role) {
    if (role === 'lead') return 'Lead';
    if (role === 'rep') return 'Rep';
    if (role === 'supervisor') return 'Supervisor';
    return '';
  }

  function hubUrl(store) {
    const visit = store.defaultVisitId;
    if (!visit) return null;
    return 'hub.html?store=' + encodeURIComponent(store.storeNumber) +
      '&visit=' + encodeURIComponent(visit);
  }

  async function apiFetch(path, options) {
    const fn = window.dumpBinAuthFetch || fetch;
    const resp = await fn('/api/hub' + path, options || {});
    if (!resp.ok) {
      const err = await resp.json().catch(function () { return {}; });
      throw new Error(err.error || ('Request failed (' + resp.status + ')'));
    }
    return resp.json();
  }

  function renderMemberRow(member, storeNumber, canManage) {
    const row = document.createElement('div');
    row.className = 'cl-member-row';
    row.innerHTML =
      '<div class="cl-member-name">' + escapeHtml(member.name) +
      ' <span class="cl-role-pill cl-role-pill--' + escapeHtml(member.role) + '">' +
      escapeHtml(roleLabel(member.role)) + '</span></div>' +
      '<div class="cl-member-email">' + escapeHtml(member.email) + '</div>';

    if (canManage) {
      const actions = document.createElement('div');
      actions.style.display = 'flex';
      actions.style.gap = '6px';

      if (member.role !== 'lead') {
        const leadBtn = document.createElement('button');
        leadBtn.type = 'button';
        leadBtn.className = 'cl-btn cl-btn--ghost';
        leadBtn.textContent = 'Make lead';
        leadBtn.addEventListener('click', function () {
          patchMember(storeNumber, member.id, 'lead');
        });
        actions.appendChild(leadBtn);
      }

      if (member.role !== 'rep') {
        const repBtn = document.createElement('button');
        repBtn.type = 'button';
        repBtn.className = 'cl-btn cl-btn--ghost';
        repBtn.textContent = 'Make rep';
        repBtn.addEventListener('click', function () {
          patchMember(storeNumber, member.id, 'rep');
        });
        actions.appendChild(repBtn);
      }

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'cl-btn cl-btn--ghost';
      removeBtn.textContent = 'Remove';
      removeBtn.addEventListener('click', function () {
        if (!confirm('Remove ' + member.name + ' from this store?')) return;
        removeMember(storeNumber, member.id);
      });
      actions.appendChild(removeBtn);

      row.appendChild(actions);
    }

    return row;
  }

  function escapeHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function loadMembers(storeNumber, panelEl, canManage) {
    panelEl.innerHTML = '<div class="cl-loading">Loading team…</div>';
    try {
      const data = await apiFetch('/stores/' + encodeURIComponent(storeNumber) + '/assignments');
      panelEl.innerHTML = '<h3>Team</h3>';
      if (!data.members.length) {
        panelEl.innerHTML += '<p class="cl-store-meta">No one assigned yet.</p>';
      } else {
        data.members.forEach(function (m) {
          panelEl.appendChild(renderMemberRow(m, storeNumber, canManage));
        });
      }

      if (canManage) {
        const form = document.createElement('div');
        form.className = 'cl-form-row';
        form.innerHTML =
          '<input class="cl-input" type="email" placeholder="Email to add" data-add-email>' +
          '<select class="cl-select" data-add-role>' +
          '<option value="rep">Rep</option><option value="lead">Lead</option></select>' +
          '<button type="button" class="cl-btn cl-btn--primary">Add person</button>';
        form.querySelector('button').addEventListener('click', function () {
          const email = form.querySelector('[data-add-email]').value.trim();
          const role = form.querySelector('[data-add-role]').value;
          if (!email) return;
          addMember(storeNumber, email, role, panelEl, canManage);
        });
        panelEl.appendChild(form);
      }
    } catch (err) {
      panelEl.innerHTML = '<div class="cl-error">' + escapeHtml(err.message) + '</div>';
    }
  }

  async function addMember(storeNumber, email, role, panelEl, canManage) {
    await apiFetch('/stores/' + encodeURIComponent(storeNumber) + '/assignments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, role: role }),
    });
    await loadMembers(storeNumber, panelEl, canManage);
    await refreshStores();
  }

  async function patchMember(storeNumber, userId, role) {
    await apiFetch('/stores/' + encodeURIComponent(storeNumber) + '/assignments/' + userId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ role: role }),
    });
    const panel = document.querySelector('[data-team-panel="' + storeNumber + '"]');
    if (panel) await loadMembers(storeNumber, panel, true);
    await refreshStores();
  }

  async function removeMember(storeNumber, userId) {
    await apiFetch('/stores/' + encodeURIComponent(storeNumber) + '/assignments/' + userId, {
      method: 'DELETE',
    });
    const panel = document.querySelector('[data-team-panel="' + storeNumber + '"]');
    if (panel) await loadMembers(storeNumber, panel, true);
    await refreshStores();
  }

  function renderStoreCard(store) {
    const card = document.createElement('article');
    card.className = 'cl-store-card';
    if (store.isAssigned) card.classList.add('cl-store-card--assigned');
    if (store.isTest) card.classList.add('cl-store-card--test');

    const title = document.createElement('h2');
    title.className = 'cl-store-title';
    title.textContent = store.name || ('Store ' + padStore(store.storeNumber));
    card.appendChild(title);

    const meta = document.createElement('p');
    meta.className = 'cl-store-meta';
    meta.textContent = 'Store #' + padStore(store.storeNumber) +
      (store.isTest ? ' · Test environment' : '') +
      (store.isAssigned ? ' · You are assigned here' : '');
    card.appendChild(meta);

    if (store.myRole) {
      const role = document.createElement('span');
      role.className = 'cl-role-pill cl-role-pill--' + store.myRole;
      role.textContent = roleLabel(store.myRole);
      card.appendChild(role);
    }

    const actions = document.createElement('div');
    actions.className = 'cl-actions';

    const url = hubUrl(store);
    if (url) {
      const open = document.createElement('a');
      open.className = 'cl-btn cl-btn--primary';
      open.href = url;
      open.textContent = 'Open dashboard';
      actions.appendChild(open);
    } else {
      const pending = document.createElement('span');
      pending.className = 'cl-store-meta';
      pending.textContent = 'No active visit configured';
      actions.appendChild(pending);
    }

    if (store.canManage) {
      const manage = document.createElement('button');
      manage.type = 'button';
      manage.className = 'cl-btn cl-btn--ghost';
      manage.textContent = 'Manage team';
      manage.addEventListener('click', function () {
        const existing = card.querySelector('[data-team-panel]');
        if (existing) {
          existing.remove();
          manage.textContent = 'Manage team';
          return;
        }
        const panel = document.createElement('div');
        panel.className = 'cl-panel';
        panel.setAttribute('data-team-panel', store.storeNumber);
        card.appendChild(panel);
        manage.textContent = 'Hide team';
        loadMembers(store.storeNumber, panel, true);
      });
      actions.appendChild(manage);
    }

    card.appendChild(actions);
    return card;
  }

  let lastPayload = null;

  async function refreshStores() {
    if (!lastPayload) return init();
    renderStores(lastPayload);
  }

  function renderStores(payload) {
    const status = document.getElementById('status');
    const grid = document.getElementById('store-grid');
    const userBar = document.getElementById('user-bar');

    userBar.hidden = false;
    document.getElementById('user-email').textContent = payload.email || '';
    document.getElementById('admin-badge').hidden = !payload.isAdmin;
    document.getElementById('supervisor-badge').hidden = !payload.isSupervisor || payload.isAdmin;

    if (!payload.stores.length) {
      status.className = 'cl-empty';
      status.textContent = 'No stores are available for your account yet. Contact your supervisor to be assigned.';
      status.hidden = false;
      grid.hidden = true;
      return;
    }

    status.hidden = true;
    grid.hidden = false;
    grid.innerHTML = '';

    const sorted = payload.stores.slice().sort(function (a, b) {
      if (a.isAssigned !== b.isAssigned) return a.isAssigned ? -1 : 1;
      return (a.name || '').localeCompare(b.name || '');
    });

    sorted.forEach(function (store) {
      grid.appendChild(renderStoreCard(store));
    });
  }

  function applyDirectChecklanesUi() {
    const back = document.getElementById('cl-back-home');
    if (!back) return;
    try {
      if (localStorage.getItem('dumpBinChecklanesEntry') === '1') {
        back.hidden = true;
        return;
      }
    } catch (_) {}
    back.hidden = false;
  }

  async function init() {
    if (window.dumpBinAuthReady) await window.dumpBinAuthReady;
    applyDirectChecklanesUi();

    const status = document.getElementById('status');
    try {
      const payload = await apiFetch('/stores');
      lastPayload = payload;
      renderStores(payload);
    } catch (err) {
      status.className = 'cl-error';
      status.textContent = err.message || 'Failed to load stores';
    }
  }

  init();
})();
</script>
</body>
</html>
