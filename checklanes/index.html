  );
}

function renderPogFixture(fixture, bay, dbkey) {
  let inner = '';
  const label = escapeHtml(fixture.label || fixture.type || 'Fixture');

  if (fixture.type === 'pegboard') {
    const rows = Math.max(1, fixture.rows || 1);
    const cols = Math.max(1, fixture.cols || 1);
    const cells = Array.from({ length: rows * cols }, () => '');
    const products = (fixture.products || []).slice();

    products.sort((a, b) => (a.pos || 0) - (b.pos || 0));
    let fallbackIdx = 0;
    for (const prod of products) {
      const peg = parsePegPosition(prod.position_code);
      let idx;
      if (peg && peg.row >= 1 && peg.col >= 1 && peg.row <= rows && peg.col <= cols) {
        idx = (peg.row - 1) * cols + (peg.col - 1);
      } else {
        idx = fallbackIdx;
        fallbackIdx += 1;
      }
      if (idx >= 0 && idx < cells.length && !cells[idx]) {
        cells[idx] = renderPogTile(prod, bay, fixture, dbkey);
      }
    }

    inner = '<div class="pog-wv-peg-grid" style="--peg-cols:' + cols + '">' +
      cells.map(cell => '<div class="pog-wv-peg-cell">' + (cell || '') + '</div>').join('') +
      '</div>';
  } else {
    const products = (fixture.products || []).slice().sort((a, b) => (a.pos || 0) - (b.pos || 0));
    inner = '<div class="pog-wv-shelf-row">' +
      products.map(p => renderPogTile(p, bay, fixture, dbkey)).join('') +
      '</div>';
  }

  return (
    '<div class="pog-wv-fixture">' +
      '<div class="pog-wv-fixture-label">' + label + '</div>' +
      inner +
    '</div>'
  );
}

function renderPogBays(layout) {
  const dbkey = layout.dbkey;
  const bays = (layout.bays || []).slice().sort((a, b) => (a.bay_num || 0) - (b.bay_num || 0));
  return bays.map(bay => {
    const fixtures = (bay.fixtures || []).slice()
      .sort((a, b) => (b.offset_from_base_in || 0) - (a.offset_from_base_in || 0));
    const fixtureHtml = fixtures.map(f => renderPogFixture(f, bay, dbkey)).join('');
    return (
      '<div class="pog-wv-bay" data-bay="' + escapeHtml(String(bay.bay_num)) + '">' +
        '<div class="pog-wv-bay-head">Bay ' + escapeHtml(String(bay.bay_num)) +
          ' · ' + escapeHtml(String(bay.width_ft || '?')) + ' ft · PDF page ' + escapeHtml(String(bay.pdf_page || '—')) +
        '</div>' +
        '<div class="pog-wv-fixtures">' + fixtureHtml + '</div>' +
      '</div>'
    );
  }).join('');
}

function renderPogSearchResults(result, meta) {
  const box = document.getElementById('pog-wv-search-results');
  if (!box) return;

  if (!result.hits.length && !result.notFound) {
    box.innerHTML = '';
    return;
  }

  const clearHead =
    '<div class="pog-wv-search-results-head">' +
      '<span class="pog-wv-search-results-title">Search results</span>' +
      '<button type="button" class="btn pog-wv-search-clear" id="pog-wv-search-clear">Clear</button>' +
    '</div>';

  if (result.notFound) {
    let msg = 'Not found in any set.';
    let notFoundUpc = '';
    if (meta && meta.scannedRaw) {
      notFoundUpc = String(meta.resolvedUpc || meta.scannedRaw || '').trim();
      msg = 'Scanned ' + escapeHtml(String(meta.scannedRaw)) + ' — not found in any set.';
      if (meta.resolvedUpc && meta.resolvedUpc !== meta.scannedRaw) {
        msg += ' Resolved to ' + escapeHtml(String(meta.resolvedUpc)) + '.';
      }
      msg += ' Try the last 4 digits of the UPC.';
    } else {
      notFoundUpc = String(document.getElementById('pog-wv-search-input')?.value || '').trim();
    }
    pogLastNotFoundUpc = notFoundUpc;

    let notFoundActions = '';
    if (liveVisitId && hubContext.myRank >= 1 && pogWorkingFixture &&
        canRaiseSectionFlags(pogWorkingFixture.lane, pogWorkingFixture.dbkey)) {
      notFoundActions =
        '<div class="pog-wv-notfound-actions">' +
          '<button type="button" class="pog-wv-notfound-btn flag-tag" data-notfound-flag="missing-tag">Flag missing tag</button>' +
          '<button type="button" class="pog-wv-notfound-btn flag-nis" data-notfound-flag="nis">Flag not in store</button>' +
        '</div>';
    }

    box.innerHTML = clearHead +
      '<div class="pog-wv-search-group"><div class="pog-wv-search-hit-info">' + msg + notFoundActions + '</div></div>';
    document.getElementById('pog-wv-search-clear')?.addEventListener('click', clearPogSearch);
    return;
  }

  const thisHits = result.hits.filter(h => h.scope === 'this');
  const otherHits = result.hits.filter(h => h.scope === 'other');
  let html = clearHead;

  if (thisHits.length) {
    html += '<div class="pog-wv-search-group"><div class="pog-wv-search-group-title">In this set</div>';
    for (const h of thisHits) {
      html += '<div class="pog-wv-search-hit">' +
        '<div class="pog-wv-search-hit-info">' +
          '<div class="pog-wv-search-hit-name">' + escapeHtml(h.name) + '</div>' +
          '<div class="pog-wv-search-hit-upc">UPC ' + escapeHtml(String(h.upc)) + '</div>' +
          '<div class="pog-wv-search-hit-loc">' + escapeHtml(h.location) + '</div>' +
        '</div>' +
        '<button type="button" class="pog-wv-search-open" data-scroll-to-upc="' + escapeHtml(h.upc) + '">Show</button>' +
      '</div>';
    }
    html += '</div>';
  }

  if (otherHits.length) {
    html += '<div class="pog-wv-search-group"><div class="pog-wv-search-group-title">In another set</div>';
    const seen = new Set();
    for (const h of otherHits) {
      const key = h.dbkey + ':' + h.upc;
      if (seen.has(key)) continue;
      seen.add(key);
      html += '<div class="pog-wv-search-hit">' +
        '<div class="pog-wv-search-hit-info">' +
          '<div class="pog-wv-search-hit-name">' + escapeHtml(h.name) + '</div>' +
          '<div class="pog-wv-search-hit-upc">UPC ' + escapeHtml(String(h.upc)) + '</div>' +
          '<div class="pog-wv-search-hit-loc">' + escapeHtml(h.title) + ' · lane ' + escapeHtml(h.lane) + '</div>' +
        '</div>' +
        '<button type="button" class="pog-wv-search-open" data-open-pog-dbkey="' + escapeHtml(h.dbkey) + '" data-open-pog-upc="' + escapeHtml(String(h.upc)) + '">Open</button>' +
      '</div>';
    }
    html += '</div>';
  }

  box.innerHTML = html;
  document.getElementById('pog-wv-search-clear')?.addEventListener('click', clearPogSearch);
}

function clearPogSearch() {
  const input = document.getElementById('pog-wv-search-input');
  if (input) input.value = '';
  renderPogSearchResults({ hits: [], notFound: false });
  document.querySelectorAll('.pog-wv-tile--highlight, .planogram-tile--highlight').forEach(el => {
    el.classList.remove('pog-wv-tile--highlight', 'planogram-tile--highlight');
  });

}

function highlightPogTile(upc) {
  document.querySelectorAll('.pog-wv-tile--highlight, .planogram-tile--highlight').forEach(el => {
    el.classList.remove('pog-wv-tile--highlight', 'planogram-tile--highlight');
  });
  const tiles = document.querySelectorAll('.pog-wv-tile[data-upc="' + upc + '"], .planogram-tile[data-upc="' + upc + '"]');
  if (!tiles.length) return;
  tiles.forEach(t => t.classList.add('planogram-tile--highlight'));

function bindPogSearchUi() {
  if (pogSearchUiBound) return;
  pogSearchUiBound = true;

  const input = document.getElementById('pog-wv-search-input');
  const btn = document.getElementById('pog-wv-search-btn');
  const results = document.getElementById('pog-wv-search-results');

  const run = () => {
    const query = input ? input.value : '';
    const result = runPogSearch(query);
    renderPogSearchResults(result);
    if (result.hits.length === 1 && result.hits[0].scope === 'this') {
      highlightPogTile(result.hits[0].upc);
    }
    saveHubSession({ pogSearch: query });
  };

  btn?.addEventListener('click', run);
  input?.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); run(); }
  });
  input?.addEventListener('input', () => {
    const v = (input.value || '').trim();
    saveHubSession({ pogSearch: v });
    if (/^\d{4}$/.test(v)) run();
  });
  results?.addEventListener('click', e => {
    const showBtn = e.target.closest('[data-scroll-to-upc]');
    if (showBtn) {
      highlightPogTile(showBtn.getAttribute('data-scroll-to-upc'));
      return;
    }
    const openBtn = e.target.closest('[data-open-pog-dbkey]');
    if (openBtn) {
      openPogFromSearchHit(
        openBtn.getAttribute('data-open-pog-dbkey'),
        openBtn.getAttribute('data-open-pog-upc'),
      );
      return;
    }
    const notFoundBtn = e.target.closest('[data-notfound-flag]');
    if (notFoundBtn) {
      const kind = notFoundBtn.getAttribute('data-notfound-flag');
      if (kind === 'missing-tag') {
        openPogMissingTagForm({ upc: pogLastNotFoundUpc || '' });
      } else if (kind === 'nis') {
        setPogWvActionsDisabled(true);
        setPogWvActionStatus('Raising not-in-store flag…');
        submitPogSectionFlag('nis', {}).then(() => {
          setPogWvActionStatus('Flagged — pending lead review', 'ok');
        }).catch(err => {
          setPogWvActionStatus(err.message || 'Failed', 'error');
          setPogWvActionsDisabled(false);
        });
      }
    }
  });

  const maskSlider = document.getElementById('pog-wv-mask-slider');
  maskSlider?.addEventListener('input', () => {
    const pct = parseInt(maskSlider.value, 10) || 0;
    applyPogMaskOpacity(pct);
    saveHubSession({ pogMask: pct });
  });
  applyPogMaskOpacity(pogMaskCardOpacity);

  document.getElementById('pog-wv-scan-btn')?.addEventListener('click', () => {
    const box = document.getElementById('pog-wv-scanner-box');
    if (box && !box.hidden && typeof Scanner !== 'undefined' && Scanner.isRunning) {
      stopPogScanner();
    } else {
      startPogScanner();
    }
  });

  document.getElementById('pog-wv-scanner-stop')?.addEventListener('click', () => stopPogScanner());

  document.getElementById('pog-wv-scanner-torch')?.addEventListener('click', async () => {
    if (typeof Scanner === 'undefined') return;
    const on = await Scanner.toggleTorch();
    const torchBtn = document.getElementById('pog-wv-scanner-torch');
    if (torchBtn) torchBtn.textContent = on ? 'Torch off' : 'Torch';
  });
}

    '<div class="pog-wv-preview open" id="pog-wv-preview">' +

      '<div class="pog-wv-preview-body">' +

        (pdfUrl
          ? '<div class="pog-wv-preview-links"><a href="' + escapeHtml(pdfUrl) + '" target="_blank" rel="noopener">View full PDF</a></div>'
          : '') +
      '</div>' +
    '</div>' +
    '<div class="pog-wv-meta">' + meta + '</div>' +
    '<div class="pog-wv-bays" id="pog-wv-planogram-host" style="--pog-wv-card-opacity:' + (pogMaskCardOpacity / 100) + '"></div>';

    previewImg.onerror = () => {
      const wrap = document.getElementById('pog-wv-preview');

  document.getElementById('pog-wv-preview-toggle')?.addEventListener('click', () => {
    document.getElementById('pog-wv-preview')?.classList.toggle('open');
  });

  bindPogSearchUi();
  refreshPogWorkingChrome();
}

function getLaneSectionState(lane, dbkey) {
  return getFixtureState(lane, dbkey);
}

function getSectionMeta(lane, dbkey) {
  if (dbkey == null && lane != null && typeof lane === 'string' && !String(lane).includes(':')) {
    dbkey = lane;
    lane = '';
  }
  if (!dbkey) return null;
  const key = sectionKey(lane, dbkey);
  if (hubContext.sections[key]) return hubContext.sections[key];
  const legacyKey = sectionKey('', dbkey);
  return hubContext.sections[legacyKey] || null;
}

function sectionAssigneeText(lane, dbkey) {
  const meta = getSectionMeta(lane, dbkey);
  if (meta?.assignee_name) return meta.assignee_name;
  if (meta?.assignee_id != null) return 'User #' + meta.assignee_id;
  return 'Unassigned';
}

function canManageSectionAssignment(lane, dbkey) {
  if (!liveVisitId || hubContext.myRank < 2 || !dbkey) return false;
  const st = getFixtureState(lane, dbkey);
  return ['not_started', 'assigned', 'in_progress', 'needs_attention'].includes(st);
}

function canShowSectionAssign(lane, dbkey) {
  return canManageSectionAssignment(lane, dbkey);
}

function canShowSectionUnassign(lane, dbkey) {
  if (!canManageSectionAssignment(lane, dbkey)) return false;
  const meta = getSectionMeta(lane, dbkey);
  return meta?.assignee_id != null;
}

function canShowSectionReopen(lane, dbkey) {
  if (!liveVisitId || hubContext.myRank < 2 || !dbkey) return false;
  const st = getFixtureState(lane, dbkey);
  return st === 'signed_off' || st === 'not_in_store';
}

function canRaiseSectionFlags(lane, dbkey) {
  if (!liveVisitId || hubContext.myRank < 1 || !dbkey) return false;
  return !isSectionTerminal(lane, dbkey);
}

function isSectionSignedOff(lane, dbkey) {
  return getFixtureState(lane, dbkey) === 'signed_off';
}

function isSectionNotInStore(lane, dbkey) {
  return getFixtureState(lane, dbkey) === 'not_in_store';
}

function isSectionTerminal(lane, dbkey) {
  const st = getFixtureState(lane, dbkey);
  return st === 'signed_off' || st === 'not_in_store';
}

function canShowSectionStart(lane, dbkey) {
  if (!liveVisitId || !dbkey) return false;
  if (getFixtureState(lane, dbkey) !== 'assigned') return false;
  return hubContext.myRank >= 2 || isAssignedRepForFixture(lane, dbkey);
}

function isAssignedRepForFixture(lane, dbkey) {
  const meta = getSectionMeta(lane, dbkey);
  if (!meta || meta.assignee_id == null || hubContext.myUserId == null) return false;
  return Number(meta.assignee_id) === Number(hubContext.myUserId);
}

function hubSectionPost(dbkey, lane, suffix, body) {
  return hubPost('/sections/' + encodeURIComponent(dbkey) + '/' + suffix, {
    ...(body || {}),
    lane: lane || '',
  });
}

function rosterSelectOptionsHtml(selectedId) {
  return hubRoster.map(p => {
    const selected = selectedId != null && Number(p.id) === Number(selectedId) ? ' selected' : '';
    return '<option value="' + escapeHtml(String(p.id)) + '"' + selected + '>' + escapeHtml(p.name) + '</option>';
  }).join('');
}

function populateRosterSelect(selectEl) {
  if (!selectEl) return;
  const cur = selectEl.value;
  selectEl.innerHTML = '<option value="">Choose rep…</option>' + rosterSelectOptionsHtml();
  if (cur) selectEl.value = cur;
}

async function loadHubRoster() {
  if (!liveVisitId) {
    hubRoster = [];
    updateSignedInDisplay();
    return hubRoster;
  }
  if (hubRosterLoadPromise) return hubRosterLoadPromise;
  hubRosterLoadPromise = (async () => {
    try {
      const data = await hubGet('/roster');
      hubRoster = data.roster || [];
    } catch (err) {
      console.warn('[Checklane Hub] roster load failed:', err);
      hubRoster = [];
    } finally {
      hubRosterLoadPromise = null;
    }
    updateSignedInDisplay();
    return hubRoster;
  })();
  return hubRosterLoadPromise;
}

function formatEmailAsDisplayName(email) {
  if (!email) return null;
  const local = String(email).split('@')[0] || email;
  return local
    .replace(/[._-]+/g, ' ')
    .replace(/\b\w/g, ch => ch.toUpperCase())
    .trim();
}

function resolveSignedInDisplayName() {
  if (hubContext.myUserId != null && hubRoster.length) {
    const match = hubRoster.find(p => Number(p.id) === Number(hubContext.myUserId));
    if (match?.name) return match.name;
  }
  return formatEmailAsDisplayName(hubSignedInUser.email);
}

function hubRankLabel(rank) {
  const r = Number(rank) || 1;
  if (r >= 3) return 'Supervisor';
  if (r >= 2) return 'Lead';
  return 'Rep';
}

function updateSignedInDisplay() {
  const chip = document.getElementById('signed-in-chip');
  const nameEl = document.getElementById('signed-in-display');
  const rankEl = document.getElementById('signed-in-rank-pill');
  if (!chip || !nameEl) return;

  const email = hubSignedInUser.email;
  const displayName = resolveSignedInDisplayName();

  if (!email && !displayName) {
    chip.classList.add('signed-in-chip--unknown');
    nameEl.textContent = 'Unknown user';
    nameEl.removeAttribute('title');
    if (rankEl) rankEl.hidden = true;
    return;
  }

  chip.classList.remove('signed-in-chip--unknown');
  nameEl.textContent = displayName || email;
  nameEl.title = email && displayName && displayName !== email ? email : '';

  if (rankEl) {
    if (liveVisitId) {
      const rank = Number(hubContext.myRank) || 1;
      rankEl.hidden = false;
      rankEl.textContent = hubRankLabel(rank);
      rankEl.className = 'signed-in-rank-pill signed-in-rank-pill--' +
        (rank >= 3 ? 'supervisor' : rank >= 2 ? 'lead' : 'rep');
    } else {
      rankEl.hidden = true;
    }
  }
}

async function loadHubIdentity() {
  try {
    const authFetch = window.dumpBinAuthFetch || fetch;
    const resp = await authFetch('/api/whoami', { noBounceOn401: true });
    if (!resp.ok) {
      hubSignedInUser = { email: null };
      updateSignedInDisplay();
      return;
    }
    const data = await resp.json();
    hubSignedInUser = { email: data.email || null };
    updateSignedInDisplay();
  } catch (err) {
    console.warn('[Checklane Hub] whoami failed:', err);
    updateSignedInDisplay();
  }
}

function buildSectionWorkflowHtml(lane, dbkey, mode) {
  const meta = getSectionMeta(lane, dbkey);
  const assignee = sectionAssigneeText(lane, dbkey);
  const showAssign = canShowSectionAssign(lane, dbkey);
  const showUnassign = canShowSectionUnassign(lane, dbkey);
  const showReopen = canShowSectionReopen(lane, dbkey);
  const showStart = canShowSectionStart(lane, dbkey);
  const showMarkDone = canShowPogMarkDone(lane, dbkey);
  const showSignoff = canShowPogSignoff(lane, dbkey);
  const showActiveWorkflow = showAssign || showUnassign || showStart || showMarkDone || showSignoff;
  const sectionState = getFixtureState(lane, dbkey);

  const reopenHtml = showReopen
    ? (
      '<div class="reopen-row" id="section-reopen-row">' +
        '<div class="label">' + (sectionState === 'not_in_store' ? 'Reopen not-in-store set' : 'Reopen completed set') + '</div>' +
        '<p class="reopen-hint">' + (sectionState === 'not_in_store'

      '</div>'
    )
    : '';

  if (mode === 'detail') {

      ? 'Not in store'

    return (
      '<div class="section-workflow" id="section-workflow">' +
        '<div class="label">' + workflowLabel + '</div>' +
        (showActiveWorkflow
          ? (
            '<div class="detail-row"><div class="label">Assignee</div><div class="value" id="section-assignee-display">' +
              escapeHtml(assignee) +
            '</div></div>' +
            '<div class="assign-row" id="section-assign-row"' + (showAssign ? '' : ' hidden') + '>' +
              '<select class="hub-roster-select" id="section-assign-select" aria-label="Assign rep">' +
                '<option value="">Choose rep…</option>' + rosterSelectOptionsHtml(meta?.assignee_id) +
              '</select>' +
              '<button type="button" class="btn-assign" id="section-assign-btn">Assign</button>' +
              '<button type="button" class="btn-unassign" id="section-unassign-btn"' + (showUnassign ? '' : ' hidden') + '>Unassign</button>' +
            '</div>' +
            '<div class="workflow-buttons">' +
              '<button type="button" class="pog-wv-complete-btn pog-wv-start-btn" id="section-start"' +
                (showStart ? '' : ' hidden') + '>Start</button>' +
              '<button type="button" class="pog-wv-complete-btn" id="section-mark-done"' +
                (showMarkDone ? '' : ' hidden') + '>Mark done</button>' +
              '<button type="button" class="pog-wv-complete-btn signoff" id="section-signoff"' +
                (showSignoff ? '' : ' hidden') + '>Sign off</button>' +
            '</div>'
          )
          : '') +
        reopenHtml +
        '<div class="flag-status" id="workflow-status"></div>' +
      '</div>'
    );
  }

  return '';
}

      ids.startId,

      ids.signoffId,

    const reasonEl = document.getElementById(ids.reopenReasonId);

  document.getElementById(ids.assignBtnId)?.addEventListener('click', async () => {

    if (!Number.isFinite(assigneeId)) {

    setBusy(true);
    setStatus('Assigning…');

    } catch (err) {

    setBusy(true);
    setStatus('Unassigning…');
    try {

      setStatus('Unassigned', 'ok');
    } catch (err) {
      setStatus(err.message || 'Unassign failed', 'error');
      setBusy(false);
    }
  });

  document.getElementById(ids.reopenBtnId)?.addEventListener('click', async () => {

function collectAssignmentRows() {
  const rows = [];
  for (const f of FIXTURES) {
    if (!f.on_manifest || !f.dbkey) continue;
    const meta = getSectionMeta(f.lane, f.dbkey);
    rows.push({
      dbkey: f.dbkey,
      action: f.action,
      lane: f.lane,
      name: f.name,
      shortName: shortName(f.name),
      state: getFixtureState(f.lane, f.dbkey),
      assigneeId: meta?.assignee_id ?? null,
      assigneeName: meta?.assignee_name || null,
    });
  }
  return rows;
}

function buildAssignmentGroups() {
  const rows = collectAssignmentRows();
  const byPerson = new Map();
  const unassigned = [];

  for (const row of rows) {
    if (row.assigneeId != null) {
      const key = String(row.assigneeId);
      if (!byPerson.has(key)) {
        byPerson.set(key, {
          assigneeId: row.assigneeId,
          name: row.assigneeName || ('User #' + row.assigneeId),
          sets: [],
        });
      }
      byPerson.get(key).sets.push(row);
    } else {
      unassigned.push(row);
    }
  }

  const people = Array.from(byPerson.values()).sort((a, b) =>
    a.name.localeCompare(b.name, undefined, { sensitivity: 'base' })
  );

  for (const person of people) {
    person.sets.sort((a, b) => {
      const laneDiff = Number(a.lane) - Number(b.lane);
      if (laneDiff !== 0) return laneDiff;
      return a.shortName.localeCompare(b.shortName);
    });
  }

  unassigned.sort((a, b) => {
    const laneDiff = Number(a.lane) - Number(b.lane);
    if (laneDiff !== 0) return laneDiff;
    return a.shortName.localeCompare(b.shortName);
  });

  return { people, unassigned, totalManifest: rows.length };
}

function assignmentStats() {
  const { people, unassigned, totalManifest } = buildAssignmentGroups();
  const assignedCount = totalManifest - unassigned.length;
  return {
    peopleCount: people.length,
    assignedCount,
    unassignedCount: unassigned.length,
    totalManifest,
  };
}

      rowEl.appendChild(statusEl);
    }
    statusEl.textContent = msg;
    statusEl.className = 'assign-set-status' + (kind ? ' ' + kind : '');
  };

  if (btn) {
    btn.disabled = true;
    btn.textContent = '…';
  }
  if (assignBtn) assignBtn.disabled = true;
  if (select) select.disabled = true;
  setStatus('Unassigning…');

  try {
    await hubSectionMutate(dbkey, lane, 'unassign', {});
    setStatus('Unassigned', 'ok');
  } catch (err) {
    setStatus(err.message || 'Unassign failed', 'error');
    if (btn) {
      btn.disabled = false;

async function handleInlineAssignment(rowEl) {
  const dbkey = rowEl.getAttribute('data-dbkey');

      statusEl.className = 'assign-set-status';

function renderAssignmentsView() {
  const root = document.getElementById('assignments-view');
  if (!root) return;

  if (!liveVisitId) {
    root.innerHTML =
      '<div class="assignments-empty">Open the hub with <code>?visit=…</code> on a live reset to see who is assigned to each set.</div>';
    return;
  }

  const { people, unassigned } = buildAssignmentGroups();
  const stats = assignmentStats();

  let html =
    '<div class="assignments-summary">' +
      '<div class="assignments-stat"><div class="assignments-stat-value">' + stats.peopleCount + '</div><div class="assignments-stat-label">People assigned</div></div>' +
      '<div class="assignments-stat"><div class="assignments-stat-value">' + stats.assignedCount + '</div><div class="assignments-stat-label">Sets assigned</div></div>' +
      '<div class="assignments-stat"><div class="assignments-stat-value">' + stats.unassignedCount + '</div><div class="assignments-stat-label">Unassigned</div></div>' +
      '<div class="assignments-stat"><div class="assignments-stat-value">' + stats.totalManifest + '</div><div class="assignments-stat-label">On manifest</div></div>' +
    '</div>';

  if (!people.length && !unassigned.length) {
    html += '<div class="assignments-empty">No manifest sets found.</div>';
    root.innerHTML = html;
    return;
  }

  for (const person of people) {
    html +=
      '<section class="assign-person-block">' +
        '<div class="assign-person-head">' +
          '<div class="assign-person-name">' + escapeHtml(person.name) + '</div>' +
          '<div class="assign-person-count">' + person.sets.length + ' set' + (person.sets.length !== 1 ? 's' : '') + '</div>' +
        '</div>' +
        '<ul class="assign-set-list">' +
          person.sets.map(renderAssignmentSetRowHtml).join('') +
        '</ul>' +
      '</section>';
  }

  if (unassigned.length) {
    html +=
      '<section class="assign-person-block assign-unassigned-block">' +
        '<div class="assign-person-head">' +
          '<div class="assign-person-name">Unassigned</div>' +
          '<div class="assign-person-count">' + unassigned.length + ' set' + (unassigned.length !== 1 ? 's' : '') + '</div>' +
        '</div>' +
        '<ul class="assign-set-list">' +
          unassigned.map(renderAssignmentSetRowHtml).join('') +
        '</ul>' +
      '</section>';
  }

  root.innerHTML = html;
}

function assigneeShortLabel(lane, dbkey) {
  const name = sectionAssigneeText(lane, dbkey);
  if (name === 'Unassigned') return '';
  const parts = name.trim().split(/\s+/);
  return parts[0] || name;
}

function updateMapAssigneeBadges() {
  document.querySelectorAll('.fixture.interactive[data-dbkey]').forEach(el => {
    const dk = el.getAttribute('data-dbkey');
    const lane = el.getAttribute('data-lane');
    const label = assigneeShortLabel(lane, dk);
    let metaRow = el.querySelector('.fx-meta-row');
    if (!metaRow) {
      metaRow = document.createElement('div');
      metaRow.className = 'fx-meta-row fx-meta-row--badge-only';
      metaRow.innerHTML = '<div class="fx-type-tag fx-type-tag--empty" aria-hidden="true"></div>';
      const dbkeyEl = el.querySelector('.fx-dbkey');
      if (dbkeyEl) el.insertBefore(metaRow, dbkeyEl);
      else el.appendChild(metaRow);
    }
    let badge = metaRow.querySelector('.fx-assignee');
    const baseTitle = el.getAttribute('data-base-title') || el.getAttribute('title') || '';
    if (!el.getAttribute('data-base-title')) {
      el.setAttribute('data-base-title', baseTitle);
    }
    const assignee = sectionAssigneeText(lane, dk);
    el.setAttribute(
      'title',
      assignee === 'Unassigned' ? baseTitle : (baseTitle + ' · ' + assignee)
    );
    if (!label) {
      if (badge) badge.remove();
      return;
    }
    if (!badge) {
      badge = document.createElement('div');
      badge.className = 'fx-assignee assignee-chip';
      metaRow.appendChild(badge);
    }
    badge.textContent = label;
    badge.title = assignee;
  });
}

function canShowPogMarkDone(lane, dbkey) {
  if (!liveVisitId || hubContext.myRank < 1) return false;
  if (getFixtureState(lane, dbkey) !== 'in_progress') return false;
  return hubContext.myRank >= 2 || isAssignedRepForFixture(lane, dbkey);
}

function canShowPogSignoff(lane, dbkey) {
  if (!liveVisitId || hubContext.myRank < 2) return false;
  return getFixtureState(lane, dbkey) === 'done_pending_signoff';
}

function pogWorkingDbkey() {
  return pogWorkingFixture?.dbkey || null;
}

function defaultPogFlagLocation() {
  if (!pogWorkingFixture) return undefined;
  return 'Lane ' + pogWorkingFixture.lane + ' · ' + shortName(pogWorkingFixture.name);
}

function setPogWvActionStatus(msg, kind) {
  const el = document.getElementById('pog-wv-action-status');

  el.className = 'flag-status' + (kind ? ' ' + kind : '');
}

function setPogWvActionsDisabled(disabled) {

  ).forEach(btn => { btn.disabled = disabled; });

function nisFixtureMeta(fixture) {
  if (!fixture) return {};
  return {
    set_name: fixture.name || undefined,
    manifest_pog_id: fixture.manifest_pog_id || undefined,
    action: fixture.action || undefined,
  };
}

async function submitPogSectionFlag(kind, payload) {
  const dbkey = pogWorkingDbkey();
  const lane = pogWorkingFixture?.lane || '';
  if (!dbkey) throw new Error('No active set');
  const paths = {
    help: '/flag/help',
    nis: '/flag/nis',
    'missing-tag': '/flag/missing-tag',
  };
  const body = { ...(payload || {}), lane };
  if (kind === 'nis') {
    Object.assign(body, nisFixtureMeta(pogWorkingFixture));
  }
  await hubMutatePost('/sections/' + encodeURIComponent(dbkey) + paths[kind], body);
}

function openPogMissingTagForm(prefill) {
  const form = document.getElementById('pog-wv-missing-tag-form');
  const upcEl = document.getElementById('pog-wv-flag-upc');
  const descEl = document.getElementById('pog-wv-flag-desc');
  const locEl = document.getElementById('pog-wv-flag-loc');
  if (upcEl) upcEl.value = (prefill?.upc || '').trim();
  if (descEl) descEl.value = (prefill?.description || '').trim();

function refreshPogWorkingChrome() {
  if (!isPogViewOpen()) return;

  const dbkey = pogWorkingDbkey();
  const lane = pogWorkingFixture?.lane || '';
  const actions = document.getElementById('pog-wv-actions');
  const stateWrap = document.getElementById('pog-wv-state-wrap');
  const completeRow = document.getElementById('pog-wv-complete-row');
  const startBtn = document.getElementById('pog-wv-start');
  const markDoneBtn = document.getElementById('pog-wv-mark-done');
  const signoffBtn = document.getElementById('pog-wv-signoff');
  const modalActions = document.getElementById('pog-product-modal-actions');
  const sub = document.getElementById('pog-wv-subheading');
  const isSearchPeek = !!pogSearchReturnState;
  const terminal = dbkey && isSectionTerminal(lane, dbkey);
  const showLiveActions = !!(liveVisitId && hubContext.myRank >= 1 && dbkey && !isSearchPeek && !terminal);

  if (stateWrap && dbkey) {
    const st = getFixtureState(lane, dbkey);
    let stateHtml =
      '<span class="' + statePillClass(st) + ' pog-wv-state-pill">' +
      escapeHtml(STATE_LABELS[st] || st) +
      '</span>';
    const assignee = sectionAssigneeText(lane, dbkey);
    if (assignee !== 'Unassigned') {
      stateHtml += '<span class="pog-wv-assignee-label"> · ' + escapeHtml(assignee) + '</span>';
    }
    stateWrap.innerHTML = stateHtml;
  } else if (stateWrap) {
    stateWrap.innerHTML = '';
  }

  if (sub && pogWorkingFixture && dbkey) {
    sub.textContent = 'Lane ' + pogWorkingFixture.lane + ' · DBKey ' + dbkey +
      ' · ' + sectionAssigneeText(lane, dbkey);
  }

  if (actions) {
    actions.hidden = !showLiveActions;
    actions.setAttribute('aria-hidden', showLiveActions ? 'false' : 'true');
  }

  if (showLiveActions) {
    setPogWvActionsDisabled(false);
  }

  if (modalActions) {
    modalActions.hidden = !showLiveActions;
  }

  const showStart = dbkey && canShowSectionStart(lane, dbkey);
  const showMarkDone = dbkey && canShowPogMarkDone(lane, dbkey);
  const showSignoff = dbkey && canShowPogSignoff(lane, dbkey);

  if (completeRow) completeRow.hidden = !(showStart || showMarkDone || showSignoff);
  if (startBtn) startBtn.hidden = !showStart;
  if (markDoneBtn) markDoneBtn.hidden = !showMarkDone;
  if (signoffBtn) signoffBtn.hidden = !showSignoff;
  updatePogTagTally();
}

      let location = (document.getElementById('pog-wv-flag-loc')?.value || '').trim();
      if (!location && pogSelectedProduct?.bay && pogSelectedProduct?.fixture && pogSelectedProduct?.prod) {
        location = compactTagLocation(
          pogSelectedProduct.bay,
          pogSelectedProduct.fixture,
          pogSelectedProduct.prod,
          lane,
        );
      }
      await addSectionTagDraftEntry({
        upc,
        description: (document.getElementById('pog-wv-flag-desc')?.value || '').trim() || undefined,
        location: location || undefined,
      });
      setPogWvActionStatus('Added to list', 'ok');
      document.getElementById('pog-wv-flag-upc').value = '';
      document.getElementById('pog-wv-flag-desc').value = '';
      document.getElementById('pog-wv-flag-upc')?.focus();
    } catch (err) {
      setPogWvActionStatus(err.message || 'Failed', 'error');
    } finally {
      setPogWvActionsDisabled(false);
    }
  });

  document.getElementById('pog-wv-flag-tag-submit')?.addEventListener('click', () => submitSectionTagDraftsForPlanogram());
  document.getElementById('pog-wv-flag-tag-clear')?.addEventListener('click', () => clearSectionTagDrafts());

  document.getElementById('pog-wv-mark-done')?.addEventListener('click', async () => {
    const dbkey = pogWorkingDbkey();
    const lane = pogWorkingFixture?.lane || '';
    if (!dbkey) return;
    setPogWvActionsDisabled(true);
    setPogWvActionStatus('Marking done…');
    try {
      await hubSectionMutate(dbkey, lane, 'mark-done', {});
      setPogWvActionStatus('Marked done — pending sign-off', 'ok');
    } catch (err) {
      setPogWvActionStatus(err.message || 'Failed', 'error');
      setPogWvActionsDisabled(false);
    }
  });

  document.getElementById('pog-wv-start')?.addEventListener('click', async () => {
    const dbkey = pogWorkingDbkey();
    const lane = pogWorkingFixture?.lane || '';
    if (!dbkey) return;
    setPogWvActionsDisabled(true);
    setPogWvActionStatus('Starting…');
    try {
      await hubSectionMutate(dbkey, lane, 'start', {});
      setPogWvActionStatus('Started', 'ok');
    } catch (err) {
      setPogWvActionStatus(err.message || 'Failed', 'error');
      setPogWvActionsDisabled(false);
    }
  });

  document.getElementById('pog-wv-signoff')?.addEventListener('click', async () => {
    const dbkey = pogWorkingDbkey();
    const lane = pogWorkingFixture?.lane || '';
    if (!dbkey) return;
    setPogWvActionsDisabled(true);
    setPogWvActionStatus('Signing off…');
    try {
      await hubSectionMutate(dbkey, lane, 'signoff', {});
      setPogWvActionStatus('Signed off', 'ok');
    } catch (err) {
      setPogWvActionStatus(err.message || 'Failed', 'error');
      setPogWvActionsDisabled(false);
    }
  });

  document.getElementById('pog-product-modal-flag-tag')?.addEventListener('click', async () => {
    if (!pogSelectedProduct?.upc) return;
    const tagBtn = document.getElementById('pog-product-modal-flag-tag');
    const lane = pogWorkingFixture?.lane;
    let location = pogSelectedProduct.location;
    if (pogSelectedProduct.bay && pogSelectedProduct.fixture && pogSelectedProduct.prod) {
      location = compactTagLocation(
        pogSelectedProduct.bay,
        pogSelectedProduct.fixture,
        pogSelectedProduct.prod,
        lane,
      );
    }
    if (tagBtn) {
      tagBtn.disabled = true;
      tagBtn.textContent = 'Adding…';
    }
    try {
      await addSectionTagDraftEntry({
        upc: pogSelectedProduct.upc,
        description: pogSelectedProduct.name,
        location,
      });
      const count = sectionTagDrafts.length;
      if (tagBtn) tagBtn.textContent = 'Added · ' + count + ' in list';
      updatePogTagTally({ flash: true });
      setPogWvActionStatus(count + ' missing tag' + (count !== 1 ? 's' : '') + ' in list', 'ok');
      window.setTimeout(() => closePogProductModal(), 500);
    } catch (err) {
      if (tagBtn) {
        tagBtn.disabled = false;
        tagBtn.textContent = 'Add missing tag to list';
      }
      setPogWvActionStatus(err.message || 'Failed', 'error');
    }
  });
}

async function openPogWorkingView(fixture, opts) {
  if (!fixture || !fixture.dbkey) return;

  await stopPogScanner();
  closePogProductModal();

  pogWorkingFixture = fixture;
  pogWorkingLayout = null;

  const overlay = document.getElementById('pog-working-view');
  const heading = document.getElementById('pog-wv-heading');
  const sub = document.getElementById('pog-wv-subheading');
  const crumb = document.getElementById('pog-wv-crumb');
  const content = document.getElementById('pog-wv-content');

  if (heading) heading.textContent = shortName(fixture.name);
  if (sub) sub.textContent = 'Lane ' + fixture.lane + ' · DBKey ' + fixture.dbkey;
  if (crumb) {
    const viewLabel = hubCurrentView === 'list'
      ? 'List'
      : hubCurrentView === 'assignments'
        ? 'Assignments'
        : 'Map';
    crumb.textContent = viewLabel + ' › ' + shortName(fixture.name);
  }
  if (content) content.innerHTML = '<div class="pog-wv-loading">Loading planogram…</div>';

  overlay?.classList.add('open');
  overlay?.setAttribute('aria-hidden', 'false');
  document.body.classList.add('pog-view-open');
  resetLeavePogBackState();
  selectedDbkey = fixture.dbkey;
  selectedLane = fixture.lane;
  hideDetailForPog();
  bindPogWorkingActions();
  refreshPogWorkingChrome();
  loadSectionTagDrafts(fixture.dbkey);
  applyPogMaskOpacity(pogMaskCardOpacity);

  if (!opts?.skipHistory) {
    syncHubUrl({ pog: fixture.dbkey, fixture: fixture.dbkey, lane: fixture.lane, view: hubCurrentView });
  }
  saveHubSession({ pog: fixture.dbkey, fixture: fixture.dbkey, lane: fixture.lane });

  try {
    await ensurePogCatalogLoaded();
    pogWorkingLayout = await fetchPogLayout(fixture.dbkey);
    renderPogWorkingContent(fixture, pogWorkingLayout, null);

    if (opts?.restoreSession && opts.session) {
      const sess = opts.session;
      if (typeof sess.pogMask === 'number') applyPogMaskOpacity(sess.pogMask);
      const input = document.getElementById('pog-wv-search-input');
      if (input && sess.pogSearch) {
        input.value = sess.pogSearch;
        const result = runPogSearch(sess.pogSearch);
        renderPogSearchResults(result);
        if (result.hits.length === 1 && result.hits[0].scope === 'this') {
          highlightPogTile(result.hits[0].upc);
        }
      }
    } else if (opts?.searchHighlightUpc) {
      const input = document.getElementById('pog-wv-search-input');
      const upcDigits = normalizeUpcInput(opts.searchHighlightUpc);
      const query = upcDigits.length >= 4 ? upcDigits.slice(-4) : upcDigits;
      if (input && query) {
        input.value = query;
        const result = runPogSearch(query);
        renderPogSearchResults(result);
      }
      highlightPogTile(opts.searchHighlightUpc);
    }
  } catch (err) {
    renderPogWorkingContent(fixture, null, err);
  }

  if (!opts?.restoreSession && !opts?.searchHighlightUpc) {
    document.getElementById('pog-wv-scroll')?.scrollTo(0, 0);
  }
}

function closePogWorkingView(opts) {
  if (!opts?.skipHistory && !opts?.skipConfirm && isPogViewOpen() && !confirmLeavePog()) {
    hubNavLock = true;
    syncHubUrl({
      pog: pogWorkingFixture?.dbkey || null,
      fixture: selectedDbkey || pogWorkingFixture?.dbkey || null,
      lane: selectedLane || pogWorkingFixture?.lane || null,
    });
    hubNavLock = false;
    return;
  }

  resetLeavePogBackState();
  clearPogSearchReturnState();

  closePogProductModal();
  stopPogScanner();
  const overlay = document.getElementById('pog-working-view');
  overlay?.classList.remove('open');
  overlay?.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('pog-view-open');

  const prevFixture = pogWorkingFixture;
  pogWorkingFixture = null;
  pogWorkingLayout = null;
  pogSelectedProduct = null;
  pogLastNotFoundUpc = null;
  setPogWvActionStatus('');
  document.getElementById('pog-wv-missing-tag-form')?.classList.remove('open');
  document.getElementById('pog-wv-actions')?.setAttribute('hidden', '');

  if (!opts?.skipHistory) {
    const fixtureDbkey = selectedDbkey || prevFixture?.dbkey || null;
    const fixtureLane = selectedLane || prevFixture?.lane || null;
    syncHubUrl({ pog: null, fixture: fixtureDbkey, lane: fixtureLane, view: hubCurrentView });
    if (fixtureDbkey) {
      const fix = findFixture(fixtureDbkey, null, fixtureLane);
      if (fix) openDetail(fixtureDbkey, fix.action, { lane: fix.lane, skipHistory: true });
    }
  } else if (selectedDbkey || prevFixture?.dbkey) {
    selectedDbkey = selectedDbkey || prevFixture?.dbkey;
    selectedLane = selectedLane || prevFixture?.lane || null;
  }
  saveHubSession({ pog: null });
}

function hubUrl(path) {
  return '/api/hub/' + encodeURIComponent(liveVisitId) + path;
}

async function hubPost(path, body) {
  if (!liveVisitId) throw new Error('No live visit');
  const authFetch = window.dumpBinAuthFetch || fetch;
  const resp = await authFetch(hubUrl(path), {
    method: 'POST',
    noBounceOn401: true,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  if (resp.status === 401) throw new Error('Not signed in');
  if (resp.status === 403) throw new Error('Lead or supervisor required');
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('Request failed (' + resp.status + ')'));
  return data;
}

async function hubGet(path) {
  if (!liveVisitId) throw new Error('No live visit');
  const authFetch = window.dumpBinAuthFetch || fetch;
  const resp = await authFetch(hubUrl(path), { noBounceOn401: true });
  if (resp.status === 401) throw new Error('Not signed in');
  if (resp.status === 403) throw new Error('Lead or supervisor required');
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('Request failed (' + resp.status + ')'));
  return data;
}

async function hubDelete(path) {
  if (!liveVisitId) throw new Error('No live visit');
  const authFetch = window.dumpBinAuthFetch || fetch;
  const resp = await authFetch(hubUrl(path), { method: 'DELETE', noBounceOn401: true });
  if (resp.status === 401) throw new Error('Not signed in');
  if (resp.status === 403) throw new Error('Lead or supervisor required');
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('Request failed (' + resp.status + ')'));
  return data;
}

async function refreshHubSnapshot() {
  if (!liveVisitId) return null;
  return loadLiveState(liveVisitId);
}

async function hubMutateAfterPost(postPromise) {
  const result = await postPromise;
  try {
    await refreshHubSnapshot();
  } catch (err) {
    console.error('[Checklane Hub] snapshot refresh after mutation failed:', err);
    throw new Error('Saved, but the screen could not refresh — reload if it looks wrong.');
  }
  ensureHubStream();
  return result;
}

async function hubMutatePost(path, body) {
  return hubMutateAfterPost(hubPost(path, body));
}

async function hubSectionMutate(dbkey, lane, suffix, body) {
  return hubMutateAfterPost(hubSectionPost(dbkey, lane, suffix, body));
}

function clearStreamReconnectTimer() {
  if (!streamReconnectTimer) return;
  clearTimeout(streamReconnectTimer);
  streamReconnectTimer = null;
}

function scheduleHubStreamReconnect(visitId) {
  if (!visitId || String(visitId) !== String(liveVisitId)) return;
  if (streamReconnectTimer) return;
  streamReconnectTimer = setTimeout(() => {
    streamReconnectTimer = null;
    connectHubStream(visitId).catch(err => {
      console.warn('[Checklane Hub] SSE reconnect failed:', err);
      streamReconnectDelayMs = Math.min(streamReconnectDelayMs * 2, HUB_STREAM_RECONNECT_MAX_MS);
      scheduleHubStreamReconnect(visitId);
    });
  }, streamReconnectDelayMs);
}

function ensureHubStream() {
  if (!liveVisitId) return;
  if (streamConnected && streamAbort && !streamAbort.aborted) return;
  streamReconnectDelayMs = 1000;
  connectHubStream(liveVisitId).catch(err => {
    console.warn('[Checklane Hub] SSE ensure connect failed:', err);
    scheduleHubStreamReconnect(liveVisitId);
  });
}

function updateTagBatchBadge() {

  const countEl = document.getElementById('tag-batch-count');
  if (!badge || !countEl) return;

  const count = hubContext.verifiedUnsentTags || 0;

function setTagBatchStatus(msg, kind) {
  const el = document.getElementById('tag-batch-status');
  if (!el) return;
  el.textContent = msg || '';
  el.className = 'flag-status' + (kind ? ' ' + kind : '');
}

function renderTagBatchList() {
  const listEl = document.getElementById('tag-batch-list');
  const sendBtn = document.getElementById('btn-send-tag-batch');
  if (!listEl || !sendBtn) return;

  if (!tagBatchPreview || !tagBatchPreview.tags?.length) {
    listEl.innerHTML = '<p class="hub-panel-empty">No verified tags ready to send.</p>';
    sendBtn.disabled = true;
    return;
  }

  const groups = tagBatchPreview.byAisle || [{ aisleLabel: 'All tags', tags: tagBatchPreview.tags }];
  listEl.innerHTML = groups.map(group => {
    const head = '<div class="tag-batch-aisle-head">' + escapeHtml(group.aisleLabel) + ' · ' + group.tags.length + '</div>';
    const items = group.tags.map(tag => renderTagBatchItemHtml(tag)).join('');
    return '<div class="tag-batch-aisle-group">' + head + items + '</div>';
  }).join('');

  sendBtn.disabled = false;
}

function renderTagBatchItemHtml(tag) {
  const invalid = !tag.valid;
  const upcLine = invalid
    ? ('INVALID UPC — verify: ' + escapeHtml(tag.upc || '—'))
    : escapeHtml(tag.displayDigits || tag.upc || '—');
  const loc = escapeHtml(tag.location || fixtureNameForDbkey(tag.dbkey) || tag.dbkey || '—');
  const plano = tag.dbkey
    ? ('<div class="tag-batch-planogram-head">' + escapeHtml(shortName(fixtureNameForDbkey(tag.dbkey))) + '</div>')
    : '';
  return plano +
    '<div class="tag-batch-item' + (invalid ? ' invalid' : '') + '">' +
      '<div class="tag-batch-item-upc">' + upcLine + '</div>' +
      (invalid && tag.reason ? '<div class="tag-batch-item-desc">' + escapeHtml(tag.reason) + '</div>' : '') +
      '<div class="tag-batch-item-desc">' + escapeHtml(tag.description || '—') + '</div>' +
      '<div class="tag-batch-item-loc">Location: ' + loc + '</div>' +
    '</div>';
}

async function loadSectionTagDrafts(dbkey) {
  if (!liveVisitId || !dbkey) {
    sectionTagDrafts = [];
    sectionTagDraftsDbkey = null;
    renderSectionTagDraftCart();
    return;
  }
  try {
    const data = await hubGet('/sections/' + encodeURIComponent(dbkey) + '/tag-drafts');
    sectionTagDrafts = data.tags || [];
    sectionTagDraftsDbkey = dbkey;
  } catch (err) {
    console.warn('[Checklane Hub] tag drafts load failed:', err);
    sectionTagDrafts = [];
  }
  renderSectionTagDraftCart();
}

function updatePogTagTally(opts) {
  const tally = document.getElementById('pog-wv-tag-tally');
  const countEl = document.getElementById('pog-wv-tag-tally-count');
  const submitBtn = document.getElementById('pog-wv-tag-tally-submit');
  const formSubmitBtn = document.getElementById('pog-wv-flag-tag-submit');
  const count = (sectionTagDrafts || []).length;
  const lane = pogWorkingFixture?.lane || '';
  const dbkey = pogWorkingDbkey();
  const hideForTerminal = dbkey && isSectionTerminal(lane, dbkey);

  if (tally) tally.hidden = hideForTerminal || count === 0;
  if (countEl) countEl.textContent = String(count);
  if (submitBtn) {
    submitBtn.disabled = count === 0;
    submitBtn.textContent = count ? ('Submit ' + count) : 'Submit';
  }
  if (formSubmitBtn && count) {
    formSubmitBtn.textContent = 'Submit all for this planogram (' + count + ')';
  }
  if (opts?.flash && tally && count > 0) {
    tally.classList.remove('pog-wv-tag-tally--flash');
    void tally.offsetWidth;
    tally.classList.add('pog-wv-tag-tally--flash');
  }
}

function renderSectionTagDraftCart() {
  const cart = document.getElementById('pog-wv-tag-draft-cart');
  const empty = document.getElementById('pog-wv-tag-draft-empty');
  const submitBtn = document.getElementById('pog-wv-flag-tag-submit');
  const clearBtn = document.getElementById('pog-wv-flag-tag-clear');
  if (!cart) return;

  const tags = sectionTagDrafts || [];
  if (!tags.length) {
    cart.innerHTML = '<div class="tag-draft-empty" id="pog-wv-tag-draft-empty">No missing tags in this list yet.</div>';
    if (submitBtn) submitBtn.disabled = true;
    if (clearBtn) clearBtn.disabled = true;
    updatePogTagTally();
    return;
  }

  cart.innerHTML = tags.map(tag => {
    const upc = escapeHtml(tag.displayDigits || tag.upc || '—');
    const meta = escapeHtml(tag.description || '') +
      (tag.location ? (' · ' + escapeHtml(tag.location)) : '');
    return (
      '<div class="tag-draft-item" data-tag-draft-id="' + tag.id + '">' +
        '<div class="tag-draft-item-body">' +
          '<div class="tag-draft-item-upc">' + upc + '</div>' +
          (meta ? '<div class="tag-draft-item-meta">' + meta + '</div>' : '') +
        '</div>' +
        '<button type="button" class="tag-draft-remove" data-remove-tag-draft="' + tag.id + '">Remove</button>' +
      '</div>'
    );
  }).join('');

  cart.querySelectorAll('[data-remove-tag-draft]').forEach(btn => {
    btn.addEventListener('click', () => removeSectionTagDraft(Number(btn.getAttribute('data-remove-tag-draft'))));
  });

  if (submitBtn) {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit all for this planogram (' + tags.length + ')';
  }
  if (clearBtn) clearBtn.disabled = false;
  updatePogTagTally();
}

async function addSectionTagDraftEntry({ upc, description, location }) {
  const dbkey = pogWorkingDbkey();
  if (!dbkey) throw new Error('No active planogram');
  await hubMutatePost('/sections/' + encodeURIComponent(dbkey) + '/tag-drafts', {
    upc,
    description,
    location,
  });
  await loadSectionTagDrafts(dbkey);
}

async function removeSectionTagDraft(tagId) {
  const dbkey = sectionTagDraftsDbkey || pogWorkingDbkey();
  if (!dbkey) return;
  setPogWvActionStatus('Removing…');
  try {
    await hubDelete('/sections/' + encodeURIComponent(dbkey) + '/tag-drafts/' + tagId);
    await loadSectionTagDrafts(dbkey);
    setPogWvActionStatus('Removed from list', 'ok');
  } catch (err) {
    setPogWvActionStatus(err.message || 'Remove failed', 'error');
  }
}

async function clearSectionTagDrafts() {
  const dbkey = sectionTagDraftsDbkey || pogWorkingDbkey();
  if (!dbkey || !sectionTagDrafts.length) return;
  setPogWvActionStatus('Clearing list…');
  try {
    for (const tag of sectionTagDrafts.slice()) {
      await hubDelete('/sections/' + encodeURIComponent(dbkey) + '/tag-drafts/' + tag.id);
    }
    await loadSectionTagDrafts(dbkey);
    setPogWvActionStatus('List cleared', 'ok');
  } catch (err) {
    setPogWvActionStatus(err.message || 'Clear failed', 'error');
  }
}

async function submitSectionTagDraftsForPlanogram() {
  const dbkey = sectionTagDraftsDbkey || pogWorkingDbkey();
  if (!dbkey || !sectionTagDrafts.length) return;
  setPogWvActionsDisabled(true);
  setPogWvActionStatus('Submitting ' + sectionTagDrafts.length + ' tag(s)…');
  try {
    const result = await hubMutatePost('/sections/' + encodeURIComponent(dbkey) + '/tag-drafts/submit', {});
    await loadSectionTagDrafts(dbkey);
    setPogWvActionStatus('Submitted ' + (result.count || 0) + ' tag(s) for lead review', 'ok');
    document.getElementById('pog-wv-missing-tag-form')?.classList.remove('open');
  } catch (err) {
    setPogWvActionStatus(err.message || 'Submit failed', 'error');
    setPogWvActionsDisabled(false);
  }
}

async function verifyAllPendingMissingTags() {
  if (!liveVisitId || hubContext.myRank < 2) return;
  setTagBatchStatus('Verifying all pending missing tags…');
  try {
    const result = await hubMutatePost('/missing-tags/verify-bulk', {});
    setTagBatchStatus('Verified ' + (result.count || 0) + ' tag(s)', 'ok');
    await loadTagBatchPreview();
  } catch (err) {
    setTagBatchStatus(err.message || 'Bulk verify failed', 'error');
  }
}

async function loadTagBatchPreview() {
  if (!liveVisitId || hubContext.myRank < 2) return;
  setTagBatchStatus('Loading batch…');
  try {
    tagBatchPreview = await hubGet('/tag-batch/preview');
    hubContext.verifiedUnsentTags = tagBatchPreview.count ?? 0;
    updateTagBatchBadge();
    renderTagBatchList();
    const invalidCount = (tagBatchPreview.tags || []).filter(t => !t.valid).length;
    if (invalidCount) {
      setTagBatchStatus(invalidCount + ' invalid UPC(s) — review before sending.', 'error');
    } else {
      setTagBatchStatus('');
    }
  } catch (err) {
    setTagBatchStatus(err.message || 'Failed to load tag batch', 'error');
  }
}

function toggleTagBatchPanel(open) {
  const panel = document.getElementById('tag-batch-panel');
  if (!panel) return;
  if (open && hubContext.myRank >= 2) {
    panel.classList.add('open');
    loadTagBatchPreview();
  } else {
    panel.classList.remove('open');
    setTagBatchStatus('');
  }
}

async function sendTagBatchEmail() {
  if (!liveVisitId || hubContext.myRank < 2) return;
  const sendBtn = document.getElementById('btn-send-tag-batch');
  if (sendBtn) sendBtn.disabled = true;
  setTagBatchStatus('Sending tag batch…');
  try {
    const result = await hubMutatePost('/send-tag-batch', {});
    setTagBatchStatus('Sent ' + (result.count || 0) + ' tag(s) — check your email.', 'ok');

    hubContext.verifiedUnsentTags = 0;
    updateTagBatchBadge();
    renderTagBatchList();
  } catch (err) {
    setTagBatchStatus(err.message || 'Send failed', 'error');

  }

function renderPendingList() {
  const listEl = document.getElementById('pending-list');
  if (!listEl) return;

  if (hubContext.myRank < 2) {
    listEl.innerHTML = '';
    return;
  }

  if (!hubContext.pendingActions.length) {
    listEl.innerHTML = '<p class="hub-panel-empty">No pending items</p>';
    closePendingDetail();
    return;
  }

  listEl.innerHTML = hubContext.pendingActions.map(item => {
    const section = fixtureNameForDbkey(item.dbkey);
    const selected = item.id === selectedPendingId ? ' selected' : '';
    return (
      '<button type="button" class="pending-item' + selected + '" data-pending-id="' + item.id + '">' +
        '<div class="pending-item-summary">' + escapeHtml(item.summary || item.action_type) + '</div>' +
        '<div class="pending-item-meta">' +
          escapeHtml(section) + ' · ' + escapeHtml(item.raised_by_name || '') +
          (item.raised_at ? ' · ' + escapeHtml(formatRaisedAt(item.raised_at)) : '') +
        '</div>' +
      '</button>'
    );
  }).join('');

  listEl.querySelectorAll('[data-pending-id]').forEach(btn => {
    btn.addEventListener('click', () => openPendingDetail(Number(btn.getAttribute('data-pending-id'))));
  });
}

function closePendingDetail() {
  const detail = document.getElementById('pending-detail');
  if (detail) {
    detail.classList.remove('open');
    detail.innerHTML = '';
  }
}

async function openPendingDetail(pendingId) {
  if (hubContext.myRank < 2) return;
  selectedPendingId = pendingId;
  renderPendingList();

  const summary = hubContext.pendingActions.find(p => p.id === pendingId);
  const detailEl = document.getElementById('pending-detail');
  if (!detailEl || !summary) return;

  detailEl.classList.add('open');
  detailEl.innerHTML = '<p class="hub-panel-empty">Loading details…</p>';

  try {
    let full = pendingDetailCache[pendingId];
    if (!full) {
      const data = await hubGet('/pending');
      data.pending.forEach(row => { pendingDetailCache[row.id] = row; });
      full = pendingDetailCache[pendingId];
    }
    if (!full) throw new Error('Pending item not found');

    const payload = full.payload || {};
    let payloadHtml = '';
    if (full.action_type === 'missing_tag') {
      payloadHtml =
        '<div class="detail-row"><div class="label">UPC</div><div class="value">' + escapeHtml(payload.upc || '—') + '</div></div>' +
        (payload.description ? '<div class="detail-row"><div class="label">Description</div><div class="value">' + escapeHtml(payload.description) + '</div></div>' : '') +
        (payload.location ? '<div class="detail-row"><div class="label">Location</div><div class="value">' + escapeHtml(payload.location) + '</div></div>' : '');
    } else if (full.action_type === 'nis') {
      payloadHtml =
        (payload.set_name ? '<div class="detail-row"><div class="label">Set</div><div class="value">' + escapeHtml(payload.set_name) + '</div></div>' : '') +
        (payload.lane ? '<div class="detail-row"><div class="label">Lane</div><div class="value">' + escapeHtml(payload.lane) + '</div></div>' : '') +
        (payload.manifest_pog_id ? '<div class="detail-row"><div class="label">Manifest POG</div><div class="value"><code>' + escapeHtml(payload.manifest_pog_id) + '</code></div></div>' : '') +
        (payload.action ? '<div class="detail-row"><div class="label">Action</div><div class="value"><code>' + escapeHtml(payload.action) + '</code></div></div>' : '') +
        (payload.note ? '<div class="detail-row"><div class="label">Note</div><div class="value">' + escapeHtml(payload.note) + '</div></div>' : '');
    } else if (payload.note) {
      payloadHtml = '<div class="detail-row"><div class="label">Note</div><div class="value">' + escapeHtml(payload.note) + '</div></div>';
    }

    detailEl.innerHTML =
      '<div class="detail-row"><div class="label">Type</div><div class="value">' + escapeHtml(full.action_type) + '</div></div>' +
      '<div class="detail-row"><div class="label">Section</div><div class="value">' + escapeHtml(fixtureNameForDbkey(full.dbkey)) + '</div></div>' +
      '<div class="detail-row"><div class="label">Raised by</div><div class="value">' + escapeHtml(full.raised_by_name || '') + '</div></div>' +
      payloadHtml +
      '<textarea class="reject-reason" id="reject-reason" placeholder="Optional reason if rejecting"></textarea>' +
      '<div class="verify-actions">' +
        '<button type="button" class="btn-verify" id="btn-verify">Verify</button>' +
        '<button type="button" class="btn-reject" id="btn-reject">Reject</button>' +
      '</div>' +
      '<div class="flag-status" id="pending-action-status"></div>';

    const setStatus = (msg, kind) => {
      const el = document.getElementById('pending-action-status');
      if (el) {
        el.textContent = msg || '';
        el.className = 'flag-status' + (kind ? ' ' + kind : '');
      }
    };

    document.getElementById('btn-verify').addEventListener('click', async () => {
      setStatus('Verifying…');
      try {
        await hubMutatePost('/pending/' + pendingId + '/verify', {});
        delete pendingDetailCache[pendingId];
        setStatus('Verified', 'ok');
      } catch (err) {
        setStatus(err.message || 'Verify failed', 'error');
      }
    });

    document.getElementById('btn-reject').addEventListener('click', async () => {
      const reason = (document.getElementById('reject-reason')?.value || '').trim();
      setStatus('Rejecting…');
      try {
        await hubMutatePost('/pending/' + pendingId + '/reject', { reason: reason || undefined });
        delete pendingDetailCache[pendingId];
        setStatus('Rejected', 'ok');
      } catch (err) {
        setStatus(err.message || 'Reject failed', 'error');
      }
    });
  } catch (err) {
    detailEl.innerHTML = '<p class="flag-status error">' + escapeHtml(err.message || 'Failed to load') + '</p>';
  }
}

function snapshotSectionsToStateMap(sections) {
  const map = {};
  (sections || []).forEach(row => {
    if (row && row.dbkey) {
      map[sectionKey(row.lane || '', row.dbkey)] = row.state || 'not_started';
    }
  });
  return map;
}

async function loadLiveState(visitId) {
  const authFetch = window.dumpBinAuthFetch || fetch;
  const resp = await authFetch(
    '/api/hub/' + encodeURIComponent(visitId) + '/snapshot',
    { noBounceOn401: true }
  );
  if (resp.status === 401) {
    throw new Error('Not signed in — you will be redirected to sign in');
  }
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error || ('Snapshot request failed (' + resp.status + ')'));
  }
  const snapshot = await resp.json();
  applySnapshot(snapshot);
  return snapshot;
}

function parseSseEvents(buffer) {
  const events = [];
  const parts = buffer.split('\n\n');
  const remainder = parts.pop() || '';
  for (const part of parts) {
    if (!part.trim()) continue;
    let eventName = 'message';
    let data = '';
    for (const line of part.split('\n')) {
      if (line.startsWith('event:')) eventName = line.slice(6).trim();
      else if (line.startsWith('data:')) data += line.slice(5).trim();
    }
    if (data) events.push({ event: eventName, data });
  }
  return { events, remainder };
}

async function connectHubStream(visitId) {
  if (streamAbort) {
    streamAbort.aborted = true;
    streamAbort = null;
  }
  clearStreamReconnectTimer();

  const authFetch = window.dumpBinAuthFetch || fetch;
  const controller = { aborted: false };
  streamAbort = controller;
  streamConnected = false;

  const resp = await authFetch(
    '/api/hub/' + encodeURIComponent(visitId) + '/stream',
    {
      noBounceOn401: true,
      headers: { Accept: 'text/event-stream' },
    }
  );

  if (!resp.ok || !resp.body) {
    console.warn('[Checklane Hub] SSE stream unavailable:', resp.status);
    streamAbort = null;
    scheduleHubStreamReconnect(visitId);
    return;
  }

  streamConnected = true;
  streamReconnectDelayMs = 1000;

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  (async () => {
    try {
      while (!controller.aborted) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parsed = parseSseEvents(buffer);
        buffer = parsed.remainder;
        for (const evt of parsed.events) {
          if (evt.event === 'snapshot') {
            try {
              const snapshot = JSON.parse(evt.data);
              pendingDetailCache = {};
              applySnapshot(snapshot);
            } catch (err) {
              console.warn('[Checklane Hub] Bad snapshot event:', err);
            }
          }
        }
      }
    } catch (err) {
      if (!controller.aborted) {
        console.warn('[Checklane Hub] SSE stream ended:', err.message || err);
      }
    } finally {
      streamConnected = false;
      if (streamAbort === controller) streamAbort = null;
      if (!controller.aborted) {
        scheduleHubStreamReconnect(visitId);
      }
    }
  })();
}

function setDataSourceLabel(text) {
  const el = document.getElementById('store-tag');
  if (el) el.textContent = text;
}

async function init() {
  if (window.dumpBinAuthReady) {
    await window.dumpBinAuthReady;
  }
  await loadHubIdentity();
  ensureFixtureTypes(FIXTURES);
  renderLegend();
  renderMap();
  renderList();
  bindPogWorkingActions();
  bindEvents();
  syncHubUrl(readHubUrlState(), true);

  const params = new URLSearchParams(window.location.search);
  const visitId = params.get('visit');

  if (visitId) {
    liveVisitId = visitId;
    setDataSourceLabel('Store 00163 · live visit ' + visitId + ' · loading…');
    try {
      const snapshot = await loadLiveState(visitId);
      await loadHubRoster();
      setDataSourceLabel(
        'Store 00163 · live visit ' + visitId +
        ' · ' + (snapshot.stats?.total ?? 0) + ' sections · rank ' + (snapshot.myRank ?? 1)
      );
      console.log('[Checklane Hub] Live snapshot loaded', snapshot);
      connectHubStream(visitId).catch(err => {
        console.warn('[Checklane Hub] SSE connect failed:', err);
      });
    } catch (err) {
      console.error('[Checklane Hub] Live state failed, falling back to SEED_STATES:', err);
      applyState(SEED_STATES);
      const detail = err && err.message ? err.message : String(err);
      setDataSourceLabel('Store 00163 · live load failed — ' + detail);
    }
  } else {
    applyState(SEED_STATES);
    setDataSourceLabel('Store 00163 · 83 fixtures · 26 lanes · SEED_STATES demo');
  }

  await restoreHubNavigation();
}

init();
</script>
