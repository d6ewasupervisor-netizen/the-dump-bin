<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checklane Reset Hub — Store 00163</title>
<script src="/auth-gate.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242836;
    --border: #2e3345;
    --text: #e8eaf0;
    --text2: #8b90a5;
    --text3: #5a5f73;
    --aisle: #141820;
    --lane-label: #c4c9dc;
    --entrance: #fbbf24;
    --side-l: rgba(52, 211, 153, 0.35);
    --side-r: rgba(244, 114, 182, 0.35);
    --state-not_started: #6b7280;
    --state-assigned: #3b82f6;
    --state-in_progress: #f59e0b;
    --state-needs_attention: #ef4444;
    --state-done_pending_signoff: #14b8a6;
    --state-signed_off: #22c55e;
    --radius: 8px;
    --panel-width: min(360px, 92vw);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(180deg, var(--bg) 85%, transparent);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  .app-header h1 {
    font-size: 1rem;
    font-weight: 700;
    flex: 1 1 180px;
  }

  .app-header .store-tag {
    font-size: 0.75rem;
    color: var(--text2);
    font-weight: 500;
  }

  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    padding: 8px 14px;
    border-radius: var(--radius);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    min-height: 40px;
  }

  .btn:active { opacity: 0.85; }
  .btn.active { background: #334155; border-color: #475569; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    color: var(--text2);
    white-space: nowrap;
  }

  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .legend-swatch.muted-demo {
    background: var(--surface2);
    border: 1px dashed var(--text3);
    opacity: 0.45;
  }

  .main-layout {
    display: flex;
    min-height: calc(100vh - 120px);
  }

  .view-container { flex: 1; min-width: 0; }

  .view-hidden { display: none !important; }

  /* ── Map view — horizontal lane rows stacked vertically ── */
  .map-view {
    padding: 12px 8px 24px;
    overflow-x: auto;
  }

  .map-stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 960px;
    margin: 0 auto;
  }

  .stack-group {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
  }

  .stack-group-header {
    padding: 8px 12px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text2);
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  .stack-group-body {
    display: flex;
    flex-direction: column;
  }

  .lane-row {
    display: flex;
    align-items: stretch;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    min-height: 52px;
  }

  .lane-row:last-child { border-bottom: none; }

  .lane-row-label {
    flex: 0 0 auto;
    min-width: 76px;
    max-width: 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-right: 8px;
    border-right: 1px solid var(--border);
  }

  .lane-num {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--lane-label);
    letter-spacing: 0.04em;
    line-height: 1.1;
  }

  .lane-commodity {
    font-size: 0.62rem;
    color: var(--text2);
    margin-top: 3px;
    line-height: 1.25;
  }

  .lane-row-fixtures {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 4px;
    min-width: 0;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .lane-row-fixtures .fixture {
    flex: 0 0 auto;
  }

  .flow-arrow {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    color: var(--text3);
    font-size: 1.1rem;
    opacity: 0.55;
    padding-left: 2px;
  }

  .flow-arrow::after {
    content: '→';
  }

  /* ── USCAN pod — facing pairs across center aisle ── */
  .uscan-pod {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pod-back-cap {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 4px;
    align-items: stretch;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border);
  }

  .pod-back-cap-label {
    flex: 0 0 auto;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text3);
    align-self: center;
    padding-right: 8px;
    min-width: 52px;
  }

  .pod-facing {
    display: flex;
    flex-direction: column;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .pod-facing-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 4px;
    padding: 6px 8px;
    min-height: 56px;
  }

  .pod-facing-row.row-left {
    background: rgba(52, 211, 153, 0.04);
    border-bottom: 1px dashed var(--border);
  }

  .pod-facing-row.row-right {
    background: rgba(244, 114, 182, 0.04);
  }

  .pod-row-tag {
    flex: 0 0 auto;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text3);
    padding: 0 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pod-facing-row.row-left .pod-row-tag { color: #6ee7b7; }
  .pod-facing-row.row-right .pod-row-tag { color: #f9a8d4; }

  .pod-stand-cell {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 3px;
    min-width: 0;
  }

  .pod-stand-cell .lane-mini-label {
    flex: 0 0 auto;
    font-size: 0.65rem;
    font-weight: 800;
    color: var(--lane-label);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    padding: 0 2px;
    opacity: 0.85;
  }

  .pod-stand-cell .stand-fixtures {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 3px;
    min-width: 0;
  }

  .pod-aisle-band {
    height: 22px;
    flex-shrink: 0;
    background: repeating-linear-gradient(
      90deg,
      var(--aisle) 0px,
      var(--aisle) 10px,
      #1c2030 10px,
      #1c2030 20px
    );
    border-top: 1px dashed var(--border);
    border-bottom: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
  }

  .pod-aisle-band::before { content: 'Pod aisle — customer / cart'; }

  .pod-tail-rows {
    display: flex;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }

  .pod-side-strip {
    flex: 0 0 8px;
    border-radius: 2px;
    align-self: stretch;
  }

  .pod-side-strip.strip-L {
    border-left: 2px dashed #34d399;
    background: var(--side-l);
  }

  .pod-side-strip.strip-R {
    border-right: 2px dashed #f472b6;
    background: var(--side-r);
  }

  .you-are-here {
    text-align: center;
    padding: 16px 12px 24px;
    color: var(--entrance);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .you-are-here::before {
    content: '▲';
    display: block;
    font-size: 1.2rem;
    margin-bottom: 4px;
  }

  /* ── Fixture primitives ── */
  .fixture {
    position: relative;
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    background: var(--surface2);
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    --fixture-color: var(--state-not_started);
    border-left: 4px solid var(--fixture-color);
  }

  .fixture.interactive:active { transform: scale(0.98); }

  .fixture.muted {
    opacity: 0.38;
    border-style: dashed;
    border-color: var(--text3);
    border-left-style: dashed;
    cursor: default;
    pointer-events: none;
  }

  .fixture.state-not_started { --fixture-color: var(--state-not_started); }
  .fixture.state-assigned { --fixture-color: var(--state-assigned); }
  .fixture.state-in_progress { --fixture-color: var(--state-in_progress); }
  .fixture.state-needs_attention {
    --fixture-color: var(--state-needs_attention);
    animation: pulse-attention 1.8s ease-in-out infinite;
  }
  .fixture.state-done_pending_signoff { --fixture-color: var(--state-done_pending_signoff); }
  .fixture.state-signed_off { --fixture-color: var(--state-signed_off); }

  @keyframes pulse-attention {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.35); }
    50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.12); }
  }

  .fx-label {
    font-size: 0.58rem;
    font-weight: 600;
    color: var(--text);
    padding: 3px 5px;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .fx-type-tag {
    font-size: 0.5rem;
    text-transform: uppercase;
    color: var(--text3);
    padding: 0 5px 3px;
    letter-spacing: 0.04em;
  }

  /* Stand types */
  .stand {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 2px;
    padding: 3px;
    min-width: 88px;
  }

  .stand-block {
    background: rgba(0,0,0,0.25);
    border-radius: 3px;
    font-size: 0.48rem;
    font-weight: 700;
    text-align: center;
    padding: 3px 2px;
    color: var(--text2);
    letter-spacing: 0.02em;
  }

  .stand-block.screen { grid-column: 1 / -1; }
  .stand-block.scanner { grid-column: 1; }
  .stand-block.bag { grid-column: 2; }

  /* Side shelf */
  .side-shelf-prim {
    width: 36px;
    min-height: 56px;
    border: 2px dashed;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 0.5rem;
    font-weight: 700;
    padding: 4px 2px;
  }

  .side-shelf-prim.side-L {
    border-color: #34d399;
    background: var(--side-l);
    color: #6ee7b7;
  }

  .side-shelf-prim.side-R {
    border-color: #f472b6;
    background: var(--side-r);
    color: #f9a8d4;
  }

  /* Horizontal bar types */
  .h-bar {
    min-height: 22px;
    display: flex;
    align-items: center;
  }

  .h-bar .fx-label { -webkit-line-clamp: 1; padding: 2px 6px; }

  /* Block types */
  .block-prim { min-height: 26px; }
  .block-prim.size-sm { min-height: 22px; }
  .block-prim.size-md { min-height: 30px; }
  .block-prim.size-lg { min-height: 38px; }

  /* ── List view ── */
  .list-view {
    padding: 12px 16px 80px;
    overflow-x: auto;
  }

  .list-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }

  .list-table th,
  .list-table td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }

  .list-table th {
    color: var(--text2);
    font-weight: 600;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  .list-table th:hover { color: var(--text); }
  .list-table tr.row-muted { opacity: 0.45; }
  .list-table tr.row-clickable { cursor: pointer; }
  .list-table tr.row-clickable:hover { background: var(--surface); }

  .state-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #fff;
    background: var(--pill-color, var(--state-not_started));
  }

  .state-pill.muted-pill {
    background: var(--surface2);
    color: var(--text3);
    border: 1px dashed var(--text3);
  }

  /* ── Detail panel ── */
  .detail-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: var(--panel-width);
    height: 100%;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 200;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
    box-shadow: -8px 0 24px rgba(0,0,0,0.4);
  }

  .detail-panel.open { transform: translateX(0); }

  .detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .detail-header h2 {
    font-size: 0.95rem;
    font-weight: 700;
  }

  .detail-close {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
  }

  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .detail-row {
    margin-bottom: 12px;
  }

  .detail-row .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text3);
    margin-bottom: 3px;
  }

  .detail-row .value {
    font-size: 0.85rem;
    color: var(--text);
    word-break: break-word;
  }

  .state-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 16px;
  }

  .state-btn {
    font-size: 0.68rem;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-weight: 600;
  }

  .state-btn:active { opacity: 0.8; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pending-badge {
    appearance: none;
    border: 1px solid #f59e0b;
    background: rgba(245, 158, 11, 0.15);
    color: #fbbf24;
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    min-height: 40px;
    display: none;
  }

  .pending-badge.visible { display: inline-flex; align-items: center; gap: 6px; }
  .pending-badge .count {
    background: #f59e0b;
    color: #1a1d27;
    border-radius: 999px;
    min-width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    padding: 0 6px;
  }

  .tag-batch-badge {
    appearance: none;
    border: 1px solid #14b8a6;
    background: rgba(20, 184, 166, 0.15);
    color: #5eead4;
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    min-height: 40px;
    display: none;
  }

  .tag-batch-badge.visible { display: inline-flex; align-items: center; gap: 6px; }
  .tag-batch-badge .count {
    background: #14b8a6;
    color: #1a1d27;
    border-radius: 999px;
    min-width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    padding: 0 6px;
  }

  .tag-batch-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 62vh;
    background: var(--surface);
    border-top: 1px solid var(--border);
    z-index: 215;
    transform: translateY(100%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.45);
  }

  .tag-batch-panel.open { transform: translateY(0); }

  .tag-batch-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 12px 12px;
  }

  .tag-batch-item {
    border: 1px solid var(--border);
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 8px;
  }

  .tag-batch-item.invalid {
    border-color: #ef4444;
    background: rgba(239, 68, 68, 0.08);
  }

  .tag-batch-item-upc {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 4px;
  }

  .tag-batch-item.invalid .tag-batch-item-upc { color: #fca5a5; }

  .tag-batch-item-desc {
    font-size: 0.82rem;
    color: var(--text2);
    margin-bottom: 4px;
  }

  .tag-batch-item-loc {
    font-size: 0.72rem;
    color: var(--text3);
  }

  .tag-batch-footer {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .btn-send-tag-batch {
    width: 100%;
    min-height: 48px;
    background: #14b8a6;
    border: 1px solid #0d9488;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    border-radius: var(--radius);
    cursor: pointer;
  }

  .btn-send-tag-batch:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .flag-actions {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .flag-actions .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text3);
  }

  .flag-btn {
    appearance: none;
    width: 100%;
    min-height: 48px;
    padding: 12px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
  }

  .flag-btn:active { opacity: 0.85; }
  .flag-btn.flag-help { border-color: #ef4444; color: #fca5a5; }
  .flag-btn.flag-tag { border-color: #3b82f6; color: #93c5fd; }
  .flag-btn.flag-nis { border-color: #f59e0b; color: #fcd34d; }
  .flag-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .missing-tag-form {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: var(--surface2);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }

  .missing-tag-form.open { display: flex; }

  .missing-tag-form label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text3);
  }

  .missing-tag-form input,
  .missing-tag-form textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
    min-height: 44px;
  }

  .missing-tag-form textarea { min-height: 56px; resize: vertical; font-size: 0.85rem; }

  .form-actions { display: flex; gap: 8px; margin-top: 4px; }

  .form-actions .btn-submit {
    flex: 1;
    min-height: 44px;
    background: #3b82f6;
    border-color: #2563eb;
    color: #fff;
  }

  .flag-status {
    font-size: 0.78rem;
    color: var(--text2);
    min-height: 1.2em;
  }

  .flag-status.error { color: #fca5a5; }
  .flag-status.ok { color: #86efac; }

  .pending-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function shortName(name) {
  return name.replace(/^CKLN\s+/i, '').slice(0, 42);
}

function classifyFixture(fixture) {
  if (fixture.type != null && fixture.type !== '') return fixture.type;

  const name = (fixture.name || '').toUpperCase();
  const action = (fixture.action || '').toUpperCase();

  if (name.includes('USCAN') && name.includes('KIT')) return 'uscan_stand';
  if (name.includes('BELTED') && name.includes('SCO')) return 'belted_sco';
  if (name.includes('SIDE SHELF') || name.includes('RETRO FIT')) return 'side_shelf';
  if (name.includes('QUE')) return 'queue';
  if (name.includes('TAIL')) return 'liberty_tail';
  if (name.includes('ENDCAP')) return 'endcap';
  if (name.includes('COOLER')) return 'cooler';
  if (name.includes('REGISTER')) return 'register';
  if (name.includes('REUSABLE BAG') || name.includes('TOTES')) return 'bag_rack';
  if (name.includes('CAO')) return 'cao_long';
  if (name.includes('CHECKSTAND')) return 'checkstand';
  if (name.includes('CIGARETTE') || name.includes('WA PACKS')) return 'cigarette';
  if (name.includes('SHIPPER') || name.includes('RUG') || name.includes('BATTERY')) return 'misc_display';

  if (action.startsWith('C082')) return 'cooler';
  if (action.startsWith('C121')) return 'cigarette';
  if (action.startsWith('C889')) return 'bag_rack';
  if (action.startsWith('C901') || action.startsWith('C218') || action.startsWith('C808')) return 'misc_display';
  if (action.startsWith('C201')) return 'register';

  return 'unclassified';
}

function ensureFixtureTypes(fixtures) {
  fixtures.forEach(f => {
    if (f.type == null || f.type === '') f.type = classifyFixture(f);
  });
}

function orderFixturesInLane(fixtures, inputIndex) {
  const priority = new Map(FIXTURE_ORDER.map((t, i) => [t, i]));
  return fixtures.slice().sort((a, b) => {
    const pa = priority.has(a.type) ? priority.get(a.type) : FIXTURE_ORDER.length;
    const pb = priority.has(b.type) ? priority.get(b.type) : FIXTURE_ORDER.length;
    if (pa !== pb) return pa - pb;
    return (inputIndex.get(a) ?? 0) - (inputIndex.get(b) ?? 0);
  });
}

function generateLayout(fixtures) {
  const inputIndex = new Map(fixtures.map((f, i) => [f, i]));
  const byLane = {};

  fixtures.forEach(f => {
    if (!byLane[f.lane]) byLane[f.lane] = [];
    byLane[f.lane].push(f);
  });

  const lanes = Object.keys(byLane).sort((a, b) => Number(b) - Number(a));

  return {
    lanes: lanes.map(lane => {
      const all = byLane[lane];
      const left = all.filter(f => f.type === 'side_shelf' && f.side === 'L');
      const right = all.filter(f => f.type === 'side_shelf' && f.side === 'R');
      const main = all.filter(f => f.type !== 'side_shelf' || f.side === 'E');
      return {
        lane,
        left,
        fixtures: orderFixturesInLane(main, inputIndex),
        right
      };
    })
  };
}

function reportLayout(layout, fixtures) {
  const typeCounts = {};
  const unclassified = [];

  fixtures.forEach(f => {
    typeCounts[f.type] = (typeCounts[f.type] || 0) + 1;
    if (f.type === 'unclassified') unclassified.push({ lane: f.lane, name: f.name });
  });

  console.log('[Checklane Hub] Layout report');
  console.log('  Total fixtures:', fixtures.length);
  console.log('  Lanes:', layout.lanes.length);
  console.log('  Count per type:', typeCounts);
  if (unclassified.length) {
    console.warn('[Checklane Hub] UNCLASSIFIED:', unclassified);
  } else {
    console.log('  UNCLASSIFIED: none');
  }
}

function fixtureKey(f) {

function fixtureNameForDbkey(dbkey) {
  const f = FIXTURES.find(x => x.dbkey === String(dbkey));

function formatRaisedAt(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  } catch (_) {
    return iso;
  }
}

function applySnapshot(snapshot) {
  const stateMap = snapshotSectionsToStateMap(snapshot.sections);
  applyState(stateMap);
  hubContext.myRank = snapshot.myRank ?? 1;
  hubContext.pendingActions = snapshot.pendingActions || [];
  hubContext.verifiedUnsentTags = snapshot.stats?.verifiedUnsentTags ?? 0;
  updatePendingBadge();
  updateTagBatchBadge();
  renderPendingList();
  if (selectedPendingId && !hubContext.pendingActions.some(p => p.id === selectedPendingId)) {
    selectedPendingId = null;
    closePendingDetail();
  }
}

function renderStandInner(type) {
  const label = type === 'belted_sco' ? 'SCO' : type === 'checkstand' ? 'CS' : 'USCAN';
  return (
    '<div class="stand">' +
      '<div class="stand-block screen">SCREEN</div>' +
      '<div class="stand-block scanner">SCANNER</div>' +
      '<div class="stand-block bag">BAG</div>' +
      '<div class="fx-type-tag">' + label + '</div>' +
    '</div>'
  );
}

function renderFixtureEl(f) {
  const dbkeyAttr = f.dbkey || '';
  const muted = !f.on_manifest;
  const classes = ['fixture'];
  if (!muted) classes.push('interactive');
  if (muted) classes.push('muted');

  let inner = '';
  const t = f.type;

  if (t === 'uscan_stand' || t === 'belted_sco' || t === 'checkstand' || t === 'register') {
    inner = renderStandInner(t);
  } else if (t === 'side_shelf') {
    inner =
      '<div class="side-shelf-prim side-' + f.side + '">' +
        escapeHtml(shortName(f.name)) +
      '</div>';
  } else if (t === 'queue' || t === 'cigarette' || t === 'bag_rack' || t === 'misc_display' || t === 'unclassified') {
    inner =
      '<div class="h-bar">' +
        '<div class="fx-label">' + escapeHtml(shortName(f.name)) + '</div>' +
      '</div>' +
      '<div class="fx-type-tag">' + escapeHtml(t === 'unclassified' ? '?' : t.replace('_', ' ')) + '</div>';
  } else {
    let size = 'size-md';
    if (t === 'liberty_tail' || t === 'cao_long') size = 'size-lg';
    else if (t === 'endcap') size = 'size-sm';
    inner =
      '<div class="block-prim ' + size + '">' +
        '<div class="fx-label">' + escapeHtml(shortName(f.name)) + '</div>' +
        '<div class="fx-type-tag">' + escapeHtml(t.replace('_', ' ')) + '</div>' +
      '</div>';
  }

  return (
    '<div class="' + classes.join(' ') + '" ' +
      'data-dbkey="' + escapeHtml(dbkeyAttr) + '" ' +
      'data-action="' + escapeHtml(f.action) + '" ' +
      'data-lane="' + escapeHtml(f.lane) + '" ' +
      'title="' + escapeHtml(f.name) + '">' +
      inner +
    '</div>'
  );
}

function flowArrowHtml() {
  return '<div class="flow-arrow" title="Customer flow toward front (right)" aria-hidden="true"></div>';
}

function renderHorizontalLaneRow(laneRow) {
  const lane = laneRow.lane;

    (laneRow.left || []).map(renderFixtureEl).join('') +
    (laneRow.fixtures || []).map(renderFixtureEl).join('') +
    (laneRow.right || []).map(renderFixtureEl).join('');

  return (
    '<div class="lane-row" data-lane="' + escapeHtml(lane) + '">' +
      '<div class="lane-row-label">' +
        '<span class="lane-num">' + escapeHtml(lane) + '</span>' +
      '</div>' +
      '<div class="lane-row-fixtures">' + fixtureHtml + '</div>' +
      flowArrowHtml() +
    '</div>'
  );
}

function statePillHtml(f) {
  if (!f.on_manifest) {
    return '<span class="state-pill muted-pill">Not scheduled</span>';
  }
  const st = getFixtureState(f.dbkey);
  return '<span class="state-pill" style="--pill-color:var(' + STATE_CSS[st] + ')">' +
    escapeHtml(STATE_LABELS[st]) + '</span>';
}

function renderList() {
  const rows = FIXTURES.slice().sort((a, b) => {
    let va, vb;
    switch (listSort.col) {
      case 'lane': va = Number(a.lane); vb = Number(b.lane); break;
      case 'name': va = a.name.toLowerCase(); vb = b.name.toLowerCase(); break;
      case 'type': va = a.type; vb = b.type; break;
      case 'state':
        va = a.on_manifest ? getFixtureState(a.dbkey) : 'zzz';
        vb = b.on_manifest ? getFixtureState(b.dbkey) : 'zzz';
        break;
      default: va = a.lane; vb = b.lane;
    }
    if (va < vb) return listSort.asc ? -1 : 1;
    if (va > vb) return listSort.asc ? 1 : -1;
    return 0;
  });

  const arrow = col => listSort.col === col ? (listSort.asc ? ' ▲' : ' ▼') : '';

  const body = rows.map(f => {
    const clickable = f.on_manifest && f.dbkey;
    return (
      '<tr class="' + (f.on_manifest ? '' : 'row-muted') +
        (clickable ? ' row-clickable' : '') + '" ' +
        'data-list-key="' + escapeHtml(fixtureKey(f)) + '" ' +
        (clickable ? 'data-dbkey="' + escapeHtml(f.dbkey) + '" data-action="' + escapeHtml(f.action) + '"' : '') +
      '>' +
        '<td>' + escapeHtml(f.lane) + '</td>' +
        '<td>' + escapeHtml(f.name) + '</td>' +
        '<td>' + escapeHtml(f.type) + '</td>' +
        '<td>' + statePillHtml(f) + '</td>' +
      '</tr>'
    );
  }).join('');

  document.getElementById('list-view').innerHTML =
    '<table class="list-table">' +
      '<thead><tr>' +
        '<th data-sort="lane">Lane' + arrow('lane') + '</th>' +
        '<th data-sort="name">Name' + arrow('name') + '</th>' +
        '<th data-sort="type">Type' + arrow('type') + '</th>' +
        '<th data-sort="state">State' + arrow('state') + '</th>' +
      '</tr></thead>' +
      '<tbody>' + body + '</tbody>' +
    '</table>';
}

/* ═══════════════════════════════════════════════════════════════════════════
   STATE-BINDING SEAM — Step 3 plugs live data in here only.
   Do not hardcode state colors at render time; always go through applyState().
   ═══════════════════════════════════════════════════════════════════════════ */
function applyState(states) {
  fixtureStates = { ...states };

  const stateClasses = WORK_STATES.map(s => 'state-' + s);

  document.querySelectorAll('.fixture[data-dbkey]').forEach(el => {
    el.classList.remove(...stateClasses);

    if (el.classList.contains('muted')) return;

    const dbkey = el.getAttribute('data-dbkey');
    const state = (dbkey && fixtureStates[dbkey]) ? fixtureStates[dbkey] : 'not_started';
    el.classList.add('state-' + state);
  });

  updateListStateCells();
  if (selectedDbkey) refreshDetailPanel();
}

function setFixtureState(dbkey, newState) {
  if (!dbkey || !WORK_STATES.includes(newState)) return;
  fixtureStates[dbkey] = newState;
  applyState(fixtureStates);
}

function openDetail(dbkey, action) {
  const fixture = FIXTURES.find(f => f.dbkey === dbkey && f.action === action) ||
    FIXTURES.find(f => f.dbkey === dbkey);
  if (!fixture || !fixture.on_manifest) return;

  selectedDbkey = dbkey;
  refreshDetailPanel(fixture);
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('overlay').classList.add('visible');
  document.getElementById('main-layout').classList.add('panel-open');
}

function closeDetail() {
  selectedDbkey = null;
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('main-layout').classList.remove('panel-open');
}

function refreshDetailPanel(fixture) {
  if (!fixture && selectedDbkey) {
    fixture = FIXTURES.find(f => f.dbkey === selectedDbkey);
  }
  if (!fixture) return;

  const isLive = !!liveVisitId;
  let html =
    '<div class="detail-row"><div class="label">Name</div><div class="value">' + escapeHtml(fixture.name) + '</div></div>' +
    '<div class="detail-row"><div class="label">Lane</div><div class="value">' + escapeHtml(fixture.lane) + '</div></div>' +
    '<div class="detail-row"><div class="label">Type</div><div class="value">' + escapeHtml(fixture.type) + '</div></div>' +
    '<div class="detail-row"><div class="label">Action</div><div class="value"><code>' + escapeHtml(fixture.action) + '</code></div></div>' +
    '<div class="detail-row"><div class="label">DBKey</div><div class="value">' + escapeHtml(fixture.dbkey || '—') + '</div></div>' +
    '<div class="detail-row"><div class="label">On manifest</div><div class="value">' + (fixture.on_manifest ? 'Yes' : 'No') + '</div></div>' +
    '<div class="detail-row"><div class="label">Current state</div><div class="value">' + statePillHtml(fixture) + '</div></div>';

  if (!isLive) {
    const stateBtns = WORK_STATES.map(s =>
      '<button type="button" class="state-btn" data-state="' + s + '">' +
        escapeHtml(STATE_LABELS[s]) +
      '</button>'
    ).join('');
    html += '<div class="detail-row"><div class="label">Change state</div><div class="state-buttons" id="state-buttons">' + stateBtns + '</div></div>';
  } else if (hubContext.myRank >= 1) {
    html +=
      '<div class="flag-actions" id="flag-actions">' +
        '<div class="label">Raise flag (rep)</div>' +
        '<button type="button" class="flag-btn flag-help" id="flag-help">Needs help</button>' +
        '<button type="button" class="flag-btn flag-tag" id="flag-tag-toggle">Missing tag</button>' +
        '<div class="missing-tag-form" id="missing-tag-form">' +
          '<label for="flag-upc">UPC</label>' +
          '<input type="text" id="flag-upc" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Scan or enter UPC">' +
          '<label for="flag-desc">Description (optional)</label>' +
          '<input type="text" id="flag-desc" autocomplete="off" placeholder="Product name">' +
          '<label for="flag-loc">Location (optional)</label>' +
          '<input type="text" id="flag-loc" autocomplete="off" placeholder="Shelf / position">' +
          '<div class="form-actions">' +
            '<button type="button" class="btn btn-submit" id="flag-tag-submit">Submit missing tag</button>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="flag-btn flag-nis" id="flag-nis">Not in store</button>' +
        '<div class="flag-status" id="flag-status"></div>' +
      '</div>';
  }

  document.getElementById('detail-body').innerHTML = html;

  if (!isLive) {
    document.getElementById('state-buttons').addEventListener('click', e => {
      const btn = e.target.closest('[data-state]');
      if (!btn || !fixture.dbkey) return;
      setFixtureState(fixture.dbkey, btn.getAttribute('data-state'));
    });
    return;
  }

  const statusEl = document.getElementById('flag-status');
  const setFlagStatus = (msg, kind) => {
    if (!statusEl) return;
    statusEl.textContent = msg || '';
    statusEl.className = 'flag-status' + (kind ? ' ' + kind : '');
  };

  const disableFlags = (disabled) => {
    document.querySelectorAll('#flag-actions .flag-btn, #flag-tag-submit').forEach(btn => {
      btn.disabled = disabled;
    });
  };

  document.getElementById('flag-help')?.addEventListener('click', async () => {
    disableFlags(true);
    setFlagStatus('Raising help flag…');
    try {
      await hubPost('/sections/' + encodeURIComponent(fixture.dbkey) + '/flag/help', {});
      setFlagStatus('Flag raised — waiting for live update…', 'ok');
    } catch (err) {
      setFlagStatus(err.message || 'Failed', 'error');
      disableFlags(false);
    }
  });

  document.getElementById('flag-nis')?.addEventListener('click', async () => {
    disableFlags(true);
    setFlagStatus('Raising not-in-store flag…');
    try {
      await hubPost('/sections/' + encodeURIComponent(fixture.dbkey) + '/flag/nis', {});
      setFlagStatus('Flag raised — waiting for live update…', 'ok');
    } catch (err) {
      setFlagStatus(err.message || 'Failed', 'error');
      disableFlags(false);
    }
  });

  document.getElementById('flag-tag-toggle')?.addEventListener('click', () => {
    document.getElementById('missing-tag-form')?.classList.toggle('open');
    const upc = document.getElementById('flag-upc');
    if (upc) setTimeout(() => upc.focus(), 50);
  });

  document.getElementById('flag-tag-submit')?.addEventListener('click', async () => {
    const upc = (document.getElementById('flag-upc')?.value || '').trim();
    if (!upc) {
      setFlagStatus('UPC is required', 'error');
      document.getElementById('flag-upc')?.focus();
      return;
    }
    disableFlags(true);
    setFlagStatus('Raising missing-tag flag…');
    try {
      await hubPost('/sections/' + encodeURIComponent(fixture.dbkey) + '/flag/missing-tag', {
        upc,
        description: (document.getElementById('flag-desc')?.value || '').trim() || undefined,
        location: (document.getElementById('flag-loc')?.value || '').trim() || undefined,
      });
      setFlagStatus('Flag raised — waiting for live update…', 'ok');
    } catch (err) {
      setFlagStatus(err.message || 'Failed', 'error');
      disableFlags(false);
    }
  });
}

function setView(view) {
  const isMap = view === 'map';
  document.getElementById('map-view').classList.toggle('view-hidden', !isMap);
  document.getElementById('list-view').classList.toggle('view-hidden', isMap);
  document.getElementById('btn-map').classList.toggle('active', isMap);
  document.getElementById('btn-list').classList.toggle('active', !isMap);
}

function bindEvents() {
  document.getElementById('btn-map').addEventListener('click', () => setView('map'));
  document.getElementById('btn-list').addEventListener('click', () => setView('list'));

  document.getElementById('map-view').addEventListener('click', e => {
    const el = e.target.closest('.fixture.interactive[data-dbkey]');
    if (!el) return;
    const dbkey = el.getAttribute('data-dbkey');
    const action = el.getAttribute('data-action');
    if (dbkey) openDetail(dbkey, action);
  });

  document.getElementById('list-view').addEventListener('click', e => {
    const th = e.target.closest('th[data-sort]');
    if (th) {
      const col = th.getAttribute('data-sort');
      if (listSort.col === col) listSort.asc = !listSort.asc;
      else { listSort.col = col; listSort.asc = true; }
      renderList();
      applyState(fixtureStates);
      return;
    }
    const row = e.target.closest('tr.row-clickable[data-dbkey]');
    if (!row) return;
    openDetail(row.getAttribute('data-dbkey'), row.getAttribute('data-action'));
  });

  document.getElementById('detail-close').addEventListener('click', closeDetail);
  document.getElementById('overlay').addEventListener('click', closeDetail);

  document.getElementById('pending-badge').addEventListener('click', () => {
    if (hubContext.myRank >= 2) {
      toggleTagBatchPanel(false);
      togglePendingPanel(true);
    }
  });
  document.getElementById('pending-close').addEventListener('click', () => togglePendingPanel(false));

  document.getElementById('tag-batch-badge').addEventListener('click', () => {
    if (hubContext.myRank >= 2) {
      togglePendingPanel(false);
      toggleTagBatchPanel(true);
    }
  });
  document.getElementById('tag-batch-close').addEventListener('click', () => toggleTagBatchPanel(false));
  document.getElementById('btn-send-tag-batch').addEventListener('click', () => sendTagBatchEmail());
}

function hubUrl(path) {
  return '/api/hub/' + encodeURIComponent(liveVisitId) + path;
}

async function hubPost(path, body) {
  if (!liveVisitId) throw new Error('No live visit');
  const authFetch = window.dumpBinAuthFetch || fetch;
  const resp = await authFetch(hubUrl(path), {
    method: 'POST',
    noBounceOn401: true,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  if (resp.status === 401) throw new Error('Not signed in');
  if (resp.status === 403) throw new Error('Lead or supervisor required');
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('Request failed (' + resp.status + ')'));
  return data;
}

async function hubGet(path) {
  if (!liveVisitId) throw new Error('No live visit');
  const authFetch = window.dumpBinAuthFetch || fetch;
  const resp = await authFetch(hubUrl(path), { noBounceOn401: true });
  if (resp.status === 401) throw new Error('Not signed in');
  if (resp.status === 403) throw new Error('Lead or supervisor required');
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('Request failed (' + resp.status + ')'));
  return data;
}

function updatePendingBadge() {
  const badge = document.getElementById('pending-badge');
  const countEl = document.getElementById('pending-count');
  if (!badge || !countEl) return;

  const count = hubContext.pendingActions.length;
  countEl.textContent = String(count);

  if (liveVisitId && hubContext.myRank >= 2) {
    badge.classList.add('visible');
  } else {
    badge.classList.remove('visible');
    togglePendingPanel(false);
  }
}

function togglePendingPanel(open) {
  const panel = document.getElementById('pending-panel');
  if (!panel) return;
  if (open && hubContext.myRank >= 2) {
    panel.classList.add('open');
    renderPendingList();
  } else {
    panel.classList.remove('open');
    selectedPendingId = null;
    closePendingDetail();
  }
}

function updateTagBatchBadge() {
  const badge = document.getElementById('tag-batch-badge');
  const countEl = document.getElementById('tag-batch-count');
  if (!badge || !countEl) return;

  const count = hubContext.verifiedUnsentTags || 0;
  countEl.textContent = String(count);

  if (liveVisitId && hubContext.myRank >= 2) {
    badge.classList.add('visible');
  } else {
    badge.classList.remove('visible');
    toggleTagBatchPanel(false);
  }
}

function setTagBatchStatus(msg, kind) {
  const el = document.getElementById('tag-batch-status');
  if (!el) return;
  el.textContent = msg || '';
  el.className = 'flag-status' + (kind ? ' ' + kind : '');
}

function renderTagBatchList() {
  const listEl = document.getElementById('tag-batch-list');
  const sendBtn = document.getElementById('btn-send-tag-batch');
  if (!listEl || !sendBtn) return;

  if (!tagBatchPreview || !tagBatchPreview.tags?.length) {
    listEl.innerHTML = '<p style="color:var(--text2);font-size:0.85rem;padding:8px;">No verified tags ready to send.</p>';
    sendBtn.disabled = true;
    return;
  }

  listEl.innerHTML = tagBatchPreview.tags.map(tag => {
    const invalid = !tag.valid;
    const upcLine = invalid
      ? ('INVALID UPC — verify: ' + escapeHtml(tag.upc || '—'))
      : escapeHtml(tag.displayDigits || tag.upc || '—');
    const loc = escapeHtml(tag.location || fixtureNameForDbkey(tag.dbkey) || tag.dbkey || '—');
    return (
      '<div class="tag-batch-item' + (invalid ? ' invalid' : '') + '">' +
        '<div class="tag-batch-item-upc">' + upcLine + '</div>' +
        (invalid && tag.reason ? '<div class="tag-batch-item-desc">' + escapeHtml(tag.reason) + '</div>' : '') +
        '<div class="tag-batch-item-desc">' + escapeHtml(tag.description || '—') + '</div>' +
        '<div class="tag-batch-item-loc">Location: ' + loc + '</div>' +
      '</div>'
    );
  }).join('');

  sendBtn.disabled = false;
}

async function loadTagBatchPreview() {
  if (!liveVisitId || hubContext.myRank < 2) return;
  setTagBatchStatus('Loading batch…');
  try {
    tagBatchPreview = await hubGet('/tag-batch/preview');
    hubContext.verifiedUnsentTags = tagBatchPreview.count ?? 0;
    updateTagBatchBadge();
    renderTagBatchList();
    const invalidCount = (tagBatchPreview.tags || []).filter(t => !t.valid).length;
    if (invalidCount) {
      setTagBatchStatus(invalidCount + ' invalid UPC(s) — review before sending.', 'error');
    } else {
      setTagBatchStatus('');
    }
  } catch (err) {
    setTagBatchStatus(err.message || 'Failed to load tag batch', 'error');
  }
}

function toggleTagBatchPanel(open) {
  const panel = document.getElementById('tag-batch-panel');
  if (!panel) return;
  if (open && hubContext.myRank >= 2) {
    panel.classList.add('open');
    loadTagBatchPreview();
  } else {
    panel.classList.remove('open');
    setTagBatchStatus('');
  }
}

async function sendTagBatchEmail() {
  if (!liveVisitId || hubContext.myRank < 2) return;
  const sendBtn = document.getElementById('btn-send-tag-batch');
  if (sendBtn) sendBtn.disabled = true;
  setTagBatchStatus('Sending tag batch…');
  try {
    const result = await hubPost('/send-tag-batch', {});
    setTagBatchStatus('Sent ' + (result.count || 0) + ' tag(s) — check your email.', 'ok');
    tagBatchPreview = { tags: [], count: 0 };
    hubContext.verifiedUnsentTags = 0;
    updateTagBatchBadge();
    renderTagBatchList();
  } catch (err) {
    setTagBatchStatus(err.message || 'Send failed', 'error');
    if (sendBtn) sendBtn.disabled = false;
  }
}

function renderPendingList() {
  const listEl = document.getElementById('pending-list');
  if (!listEl) return;

  if (hubContext.myRank < 2) {
    listEl.innerHTML = '';
    return;
  }

  if (!hubContext.pendingActions.length) {
    listEl.innerHTML = '<p style="color:var(--text2);font-size:0.85rem;padding:8px;">No pending items</p>';
    closePendingDetail();
    return;
  }

  listEl.innerHTML = hubContext.pendingActions.map(item => {
    const section = fixtureNameForDbkey(item.dbkey);
    const selected = item.id === selectedPendingId ? ' selected' : '';
    return (
      '<button type="button" class="pending-item' + selected + '" data-pending-id="' + item.id + '">' +
        '<div class="pending-item-summary">' + escapeHtml(item.summary || item.action_type) + '</div>' +
        '<div class="pending-item-meta">' +
          escapeHtml(section) + ' · ' + escapeHtml(item.raised_by_name || '') +
          (item.raised_at ? ' · ' + escapeHtml(formatRaisedAt(item.raised_at)) : '') +
        '</div>' +
      '</button>'
    );
  }).join('');

  listEl.querySelectorAll('[data-pending-id]').forEach(btn => {
    btn.addEventListener('click', () => openPendingDetail(Number(btn.getAttribute('data-pending-id'))));
  });
}

function closePendingDetail() {
  const detail = document.getElementById('pending-detail');
  if (detail) {
    detail.classList.remove('open');
    detail.innerHTML = '';
  }
}

async function openPendingDetail(pendingId) {
  if (hubContext.myRank < 2) return;
  selectedPendingId = pendingId;
  renderPendingList();

  const summary = hubContext.pendingActions.find(p => p.id === pendingId);
  const detailEl = document.getElementById('pending-detail');
  if (!detailEl || !summary) return;

  detailEl.classList.add('open');
  detailEl.innerHTML = '<p style="color:var(--text2);font-size:0.85rem;">Loading details…</p>';

  try {
    let full = pendingDetailCache[pendingId];
    if (!full) {
      const data = await hubGet('/pending');
      data.pending.forEach(row => { pendingDetailCache[row.id] = row; });
      full = pendingDetailCache[pendingId];
    }
    if (!full) throw new Error('Pending item not found');

    const payload = full.payload || {};
    let payloadHtml = '';
    if (full.action_type === 'missing_tag') {
      payloadHtml =
        '<div class="detail-row"><div class="label">UPC</div><div class="value">' + escapeHtml(payload.upc || '—') + '</div></div>' +
        (payload.description ? '<div class="detail-row"><div class="label">Description</div><div class="value">' + escapeHtml(payload.description) + '</div></div>' : '') +
        (payload.location ? '<div class="detail-row"><div class="label">Location</div><div class="value">' + escapeHtml(payload.location) + '</div></div>' : '');
    } else if (payload.note) {
      payloadHtml = '<div class="detail-row"><div class="label">Note</div><div class="value">' + escapeHtml(payload.note) + '</div></div>';
    }

    detailEl.innerHTML =
      '<div class="detail-row"><div class="label">Type</div><div class="value">' + escapeHtml(full.action_type) + '</div></div>' +
      '<div class="detail-row"><div class="label">Section</div><div class="value">' + escapeHtml(fixtureNameForDbkey(full.dbkey)) + '</div></div>' +
      '<div class="detail-row"><div class="label">Raised by</div><div class="value">' + escapeHtml(full.raised_by_name || '') + '</div></div>' +
      payloadHtml +
      '<textarea class="reject-reason" id="reject-reason" placeholder="Optional reason if rejecting"></textarea>' +
      '<div class="verify-actions">' +
        '<button type="button" class="btn-verify" id="btn-verify">Verify</button>' +
        '<button type="button" class="btn-reject" id="btn-reject">Reject</button>' +
      '</div>' +
      '<div class="flag-status" id="pending-action-status"></div>';

    const setStatus = (msg, kind) => {
      const el = document.getElementById('pending-action-status');
      if (el) {
        el.textContent = msg || '';
        el.className = 'flag-status' + (kind ? ' ' + kind : '');
      }
    };

    document.getElementById('btn-verify').addEventListener('click', async () => {
      setStatus('Verifying…');
      try {
        await hubPost('/pending/' + pendingId + '/verify', {});
        delete pendingDetailCache[pendingId];
        setStatus('Verified — waiting for live update…', 'ok');
      } catch (err) {
        setStatus(err.message || 'Verify failed', 'error');
      }
    });

    document.getElementById('btn-reject').addEventListener('click', async () => {
      const reason = (document.getElementById('reject-reason')?.value || '').trim();
      setStatus('Rejecting…');
      try {
        await hubPost('/pending/' + pendingId + '/reject', { reason: reason || undefined });
        delete pendingDetailCache[pendingId];
        setStatus('Rejected — waiting for live update…', 'ok');
      } catch (err) {
        setStatus(err.message || 'Reject failed', 'error');
      }
    });
  } catch (err) {
    detailEl.innerHTML = '<p class="flag-status error">' + escapeHtml(err.message || 'Failed to load') + '</p>';
  }
}

function snapshotSectionsToStateMap(sections) {
  const map = {};
  (sections || []).forEach(row => {
    if (row && row.dbkey) map[String(row.dbkey)] = row.state || 'not_started';
  });
  return map;
}

async function loadLiveState(visitId) {
  const authFetch = window.dumpBinAuthFetch || fetch;
  const resp = await authFetch(
    '/api/hub/' + encodeURIComponent(visitId) + '/snapshot',
    { noBounceOn401: true }
  );
  if (resp.status === 401) {
    throw new Error('Not signed in — you will be redirected to sign in');
  }
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error || ('Snapshot request failed (' + resp.status + ')'));
  }
  const snapshot = await resp.json();
  applySnapshot(snapshot);
  return snapshot;
}

function parseSseEvents(buffer) {
  const events = [];
  const parts = buffer.split('\n\n');
  const remainder = parts.pop() || '';
  for (const part of parts) {
    if (!part.trim()) continue;
    let eventName = 'message';
    let data = '';
    for (const line of part.split('\n')) {
      if (line.startsWith('event:')) eventName = line.slice(6).trim();
      else if (line.startsWith('data:')) data += line.slice(5).trim();
    }
    if (data) events.push({ event: eventName, data });
  }
  return { events, remainder };
}

async function connectHubStream(visitId) {
  if (streamAbort) {
    streamAbort.aborted = true;
    streamAbort = null;
  }

  const authFetch = window.dumpBinAuthFetch || fetch;
  const controller = { aborted: false };
  streamAbort = controller;

  const resp = await authFetch(
    '/api/hub/' + encodeURIComponent(visitId) + '/stream',
    {
      noBounceOn401: true,
      headers: { Accept: 'text/event-stream' },
    }
  );

  if (!resp.ok || !resp.body) {
    console.warn('[Checklane Hub] SSE stream unavailable:', resp.status);
    return;
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  (async () => {
    try {
      while (!controller.aborted) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parsed = parseSseEvents(buffer);
        buffer = parsed.remainder;
        for (const evt of parsed.events) {
          if (evt.event === 'snapshot') {
            try {
              const snapshot = JSON.parse(evt.data);
              pendingDetailCache = {};
              applySnapshot(snapshot);
            } catch (err) {
              console.warn('[Checklane Hub] Bad snapshot event:', err);
            }
          }
        }
      }
    } catch (err) {
      if (!controller.aborted) {
        console.warn('[Checklane Hub] SSE stream ended:', err.message || err);
      }
    }
  })();
}

function setDataSourceLabel(text) {
  const el = document.getElementById('store-tag');
  if (el) el.textContent = text;
}

async function init() {
  if (window.dumpBinAuthReady) {
    await window.dumpBinAuthReady;
  }
  ensureFixtureTypes(FIXTURES);
  renderLegend();
  renderMap();
  renderList();
  bindEvents();

  const params = new URLSearchParams(window.location.search);
  const visitId = params.get('visit');

  if (visitId) {
    liveVisitId = visitId;
    setDataSourceLabel('Store 00163 · live visit ' + visitId + ' · loading…');
    try {
      const snapshot = await loadLiveState(visitId);
      setDataSourceLabel(
        'Store 00163 · live visit ' + visitId +
        ' · ' + (snapshot.stats?.total ?? 0) + ' sections · rank ' + (snapshot.myRank ?? 1)
      );
      console.log('[Checklane Hub] Live snapshot loaded', snapshot);
      connectHubStream(visitId).catch(err => {
        console.warn('[Checklane Hub] SSE connect failed:', err);
      });
    } catch (err) {
      console.error('[Checklane Hub] Live state failed, falling back to SEED_STATES:', err);
      applyState(SEED_STATES);
      const detail = err && err.message ? err.message : String(err);
      setDataSourceLabel('Store 00163 · live load failed — ' + detail);
    }
  } else {
    applyState(SEED_STATES);
    setDataSourceLabel('Store 00163 · 83 fixtures · 26 lanes · SEED_STATES demo');
  }
}

init();
