<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EOD Summary Board</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/favicon.png?v=2">
  <link rel="stylesheet" href="/eod-board/assets/eod-board.css?v=1" />
  <script src="/auth-gate.js"></script>
</head>
<body>
  <header class="brand-bar">
    <div class="brand-inner">
      <h1>EOD Summary Board</h1>
      <span class="muted" id="rangeLabel"></span>
    </div>
  </header>
  <main class="layout">
    <section class="card list-card">
      <label class="search">
        <input id="search" type="search" placeholder="Store or lead" autocomplete="off" />
      </label>
      <div id="eodList" class="eod-list"><p class="muted">Loading…</p></div>
    </section>
    <section class="card detail-card" id="detail">
      <p class="muted" id="detailEmpty">Select an EOD.</p>
      <div id="detailBody" hidden></div>
    </section>
  </main>
  <script src="/eod-board/assets/eod-board.js?v=1"></script>
</body>
</html>
