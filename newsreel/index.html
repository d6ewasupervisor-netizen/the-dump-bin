<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>News reel</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=2">
  <link rel="stylesheet" href="newsreel.css?v=4">
  <script src="/auth-gate.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
  <link rel="stylesheet" href="/shared/pdf-viewer/materials-pdf-viewer.css?v=1.1.6">
  <script src="/shared/pdf-viewer/materials-pdf-viewer.js?v=1.1.6"></script>
  <script src="/shared/doc-share/share-compose.js?v=1"></script>
  <script src="week-roller.js?v=3"></script>
</head>
<body>
  <div class="reel-app">
    <div class="reel-top">
      <nav class="reel-switch" aria-label="Reel">
        <a id="linkKompass" href="/newsreel/?reel=kompass">Kompass</a>
        <a id="linkCp" href="/newsreel/?reel=cp">Central Pet</a>
      </nav>
    </div>
    <div class="filters">
      <input id="q" type="search" placeholder="Search" autocomplete="off">
      <input id="store" inputmode="numeric" placeholder="Store" autocomplete="off">
      <select id="district"><option value="">District</option><option>6</option><option>8</option><option>9</option></select>
      <input id="day" type="date">
    </div>
    <div class="reel-body">
      <div id="cards" class="cards"></div>
      <div id="roller" class="roller"></div>
    </div>
  </div>
  <div id="overlay" class="overlay" hidden>
    <button type="button" id="back" class="reel-back">Back to newsreel</button>
    <h1 id="detailTitle"></h1>
    <p id="detailMeta" class="card-meta"></p>
    <div class="reel-actions">
      <button type="button" id="openPdf">PDF</button>
      <button type="button" id="shareBtn">Share</button>
      <button type="button" id="printBtn">Print at store</button>
    </div>
    <div id="detailHtml" class="detail-html"></div>
  </div>
  <script src="newsreel.js?v=5"></script>
</body>
</html>
