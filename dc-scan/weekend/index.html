<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>Weekend DC Scan coverage</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<script src="/auth-gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e13;--bg2:#111820;--card:#151d28;--border:#243044;
  --text:#f0f4f8;--muted:#6b7d94;--sub:#a8b8cc;
  --accent:#4da6ff;--green:#00e87a;--green-bg:rgba(0,232,122,.12);
  --amber:#ffcc00;--red:#ff4757;
  --r:14px;--rs:10px;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.45;}
.boot-status{padding:24px 16px;color:var(--sub);}
.boot-status.err{color:var(--red);}
.wrap{max-width:760px;margin:0 auto;padding:calc(12px + var(--st)) 12px calc(28px + var(--sb));}
.top-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.top-bar h1{font-size:clamp(1.2rem,4.5vw,1.5rem);font-weight:800;letter-spacing:-.02em;}
.top-bar p{color:var(--sub);font-size:12px;margin-top:3px;}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted);}
.live.on i{background:var(--green);box-shadow:0 0 0 3px rgba(0,232,122,.18);}
.live.on{color:var(--green);}
.me-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--sub);}
.me-bar strong{color:var(--text);word-break:break-all;}
.me-bar button{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--sub);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;min-height:40px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:10px 6px;text-align:center;}
.stat .n{font-size:1.35rem;font-weight:800;line-height:1.1;}
.stat .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;font-weight:700;}
.stat.open .n{color:var(--amber);}
.stat.claimed .n{color:var(--accent);}
.stat.mine .n{color:var(--green);}
.msg{font-size:13px;margin-bottom:12px;padding:9px 11px;border-radius:var(--rs);display:none;}
.msg.show{display:block;}
.msg.ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,232,122,.3);}
.msg.err{background:rgba(255,71,87,.12);color:var(--red);border:1px solid rgba(255,71,87,.3);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;}
.store-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px;}
.store-card.open{border-style:dashed;}
.store-card.mine{border-color:rgba(0,232,122,.5);background:var(--green-bg);}
.store-card.taken{border-color:rgba(77,166,255,.4);}
.card-fm{font-size:20px;font-weight:800;}
.card-city{font-size:13px;color:var(--sub);margin-bottom:8px;}
.badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:5px;}
.badge.open{background:var(--bg2);color:var(--muted);}
.badge.taken{background:rgba(77,166,255,.15);color:var(--accent);}
.badge.mine{background:var(--green-bg);color:var(--green);}
.card-who{font-size:14px;font-weight:800;margin-top:8px;}
.card-day{font-size:13px;color:var(--sub);}
.card-actions{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.card-actions select{min-height:44px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font:inherit;font-size:14px;padding:0 10px;}
.card-actions button{min-height:44px;border:none;border-radius:8px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;}
.btn-take{background:var(--amber);color:#1a1400;}
.btn-release{background:var(--bg2);color:var(--text);border:1px solid var(--border)!important;}
button:disabled{opacity:.55;cursor:wait;}
</style>
</head>
<body>
<div id="boot-status" class="boot-status">Loading…</div>
<div id="app" class="wrap" hidden>
  <div class="top-bar">
    <div>
      <h1>Weekend DC Scan coverage</h1>
      <p id="week-line">P11W1 · Display Compliance · Closes Mon 11/16 9 AM</p>
    </div>
    <span class="live" id="live"><i></i><span id="live-text">Live</span></span>
  </div>
  <div class="me-bar">
    <span>Signed in as <strong id="me-email">—</strong> <span id="me-role"></span></span>
    <button type="button" id="sign-out-btn">Sign out</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="msg" id="msg"></div>
  <div class="grid" id="grid"></div>
</div>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const POLL_MS = 5000;
  let snap = null;
  let busy = false;
  let lastOk = 0;

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function showMsg(text, ok) {
    const el = $('msg');
    el.textContent = text || '';
    el.className = 'msg' + (text ? ' show ' + (ok ? 'ok' : 'err') : '');
  }

  function setLive(ok) {
    if (ok) lastOk = Date.now();
    const on = Date.now() - lastOk < POLL_MS * 3;
    $('live').className = 'live' + (on ? ' on' : '');
    $('live-text').textContent = on ? 'Live' : 'Reconnecting';
  }

  async function api(path, opts) {
    const r = await window.dumpBinAuthFetch('/api/dc-scan-weekend' + path, opts || {});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    return d;
  }

  function dayOptions(selected) {
    const days = (snap && snap.days) || [];
    return days
      .filter((d) => d.mine && (d.open || d.key === selected))
      .map((d) => '<option value="' + esc(d.key) + '"' + (d.key === selected ? ' selected' : '') + '>' + esc(d.label) + '</option>')
      .join('');
  }

  function cardHtml(store) {
    const claim = store.claim;
    const me = (snap && snap.me) || {};
    const closed = Boolean(snap && snap.closed);
    const cls = !claim ? 'open' : (claim.mine ? 'mine' : 'taken');
    const badge = !claim ? 'Open' : (claim.mine ? 'Yours' : 'Taken');
    let actions = '';
    if (!closed && !claim && me.canClaim) {
      const opts = dayOptions('');
      if (opts) {
        actions = '<div class="card-actions">'
          + '<select data-day-for="' + esc(store.id) + '" aria-label="Day for FM ' + esc(store.id) + '"><option value="">Pick a day</option>' + opts + '</select>'
          + '<button type="button" class="btn-take" data-take="' + esc(store.id) + '">Lock it in</button>'
          + '</div>';
      }
    } else if (!closed && claim && claim.mine) {
      actions = '<div class="card-actions">'
        + '<select data-move="' + esc(store.id) + '" aria-label="Day for FM ' + esc(store.id) + '">' + dayOptions(claim.day) + '</select>'
        + '<button type="button" class="btn-release" data-release="' + esc(store.id) + '">Release</button>'
        + '</div>';
    } else if (!closed && claim && me.isSupervisor) {
      actions = '<div class="card-actions"><button type="button" class="btn-release" data-release="' + esc(store.id) + '">Release</button></div>';
    }
    return '<article class="store-card ' + cls + '">'
      + '<div class="card-fm">FM ' + esc(store.id) + '</div>'
      + '<div class="card-city">' + esc(store.city) + '</div>'
      + '<span class="badge ' + cls + '">' + badge + '</span>'
      + (claim ? '<div class="card-who">' + esc(claim.name) + '</div><div class="card-day">' + esc(claim.dayLabel) + '</div>' : '')
      + actions
      + '</article>';
  }

  function render(snapshot) {
    const active = document.activeElement;
    if (!busy && active && active.tagName === 'SELECT' && active.closest('#grid')) {
      snap = snapshot;
      renderStats();
      return;
    }
    snap = snapshot;
    renderStats();
    $('me-role').textContent = snapshot.me && snapshot.me.canClaim ? '' : '· View only';
    if (snapshot.closed) $('week-line').textContent = snapshot.weekKey + ' · Display Compliance · Closed';
    $('grid').innerHTML = snapshot.stores.map(cardHtml).join('');
  }

  function renderStats() {
    const c = snap.counts || { open: 0, claimed: 0, mine: 0 };
    $('stats').innerHTML = [
      ['open', c.open, 'Open'],
      ['claimed', c.claimed, 'Taken'],
      ['mine', c.mine, 'Yours'],
    ].map(([cls, n, l]) => '<div class="stat ' + cls + '"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>').join('');
  }

  async function refresh() {
    try {
      const d = await api('/');
      setLive(true);
      if (!busy) render(d.snapshot);
    } catch (_) {
      setLive(false);
    }
  }

  async function act(path, body) {
    if (busy) return;
    busy = true;
    showMsg('', true);
    try {
      const d = await api(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      busy = false;
      if (document.activeElement) document.activeElement.blur();
      render(d.snapshot);
      showMsg(d.message || '', true);
    } catch (err) {
      busy = false;
      showMsg(err.message || 'Failed', false);
      refresh();
    }
  }

  document.body.addEventListener('click', (ev) => {
    const take = ev.target.closest('[data-take]');
    const release = ev.target.closest('[data-release]');
    if (take) {
      const id = take.getAttribute('data-take');
      const sel = document.querySelector('[data-day-for="' + id + '"]');
      const day = sel ? sel.value : '';
      if (!day) { showMsg('Pick a day for FM ' + id + '.', false); return; }
      act('/claim', { storeId: id, day });
    }
    if (release) {
      const id = release.getAttribute('data-release');
      if (window.confirm('Release FM ' + id + '?')) act('/release', { storeId: id });
    }
  });

  document.body.addEventListener('change', (ev) => {
    const move = ev.target.closest('[data-move]');
    if (move) act('/claim', { storeId: move.getAttribute('data-move'), day: move.value });
  });

  $('sign-out-btn').addEventListener('click', () => {
    try {
      localStorage.removeItem('dumpBinSession');
      localStorage.removeItem('eodSession');
    } catch (_) {}
    location.href = '/signin.html?next=' + encodeURIComponent('/dc-scan/weekend/');
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refresh();
  });

  async function boot() {
    try {
      await (window.dumpBinAuthReady || Promise.resolve());
      const mr = await window.dumpBinAuthFetch('/api/me');
      const md = await mr.json();
      if (!mr.ok) throw new Error(md.error || 'Not signed in');
      $('me-email').textContent = md.email || '—';
      $('app').hidden = false;
      $('boot-status').hidden = true;
      const d = await api('/');
      setLive(true);
      render(d.snapshot);
      setInterval(refresh, POLL_MS);
      setInterval(() => setLive(false), POLL_MS);
    } catch (err) {
      $('boot-status').textContent = (err && err.message) || 'Load failed. Sign in and refresh.';
      $('boot-status').className = 'boot-status err';
      $('boot-status').hidden = false;
    }
  }

  boot();
})();
</script>
</body>
</html>
