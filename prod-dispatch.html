<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROD photo review — The Dump Bin</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">

  <style>
    :root {
      --bg: #111827;
      --surface: #1a2332;
      --text: #e8ecf1;
      --muted: #9ca3af;
      --accent: #88c4ed;
      --ok: #22c55e;
      --bad: #ef4444;
      --radius: 12px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      padding: 20px 16px 48px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.35rem; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
    .sub { font-size: 0.9rem; color: var(--muted); margin-bottom: 22px; }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid rgba(136, 196, 237, 0.15);
      margin-bottom: 16px;
    }
    dl { display: grid; gap: 10px; }
    dt { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    dd { font-size: 1rem; word-break: break-word; }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .photo-grid img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      display: block;
      background: #0b1220;
    }
    .photo-cap { font-size: 0.75rem; color: var(--muted); margin-top: 4px; text-align: center; }
    .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
    @media (min-width: 400px) {
      .actions { flex-direction: row; }
      .actions button { flex: 1; }
    }
    button {
      font: inherit;
      border: none;
      border-radius: 10px;
      padding: 14px 18px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-approve { background: var(--ok); color: #fff; }
    .btn-deny { background: var(--bad); color: #fff; }
    .loading, .err { text-align: center; padding: 28px 12px; color: var(--muted); }
    .err { color: #fca5a5; }
    .outcome {
      margin-top: 20px;
      padding: 16px;
      border-radius: var(--radius);
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      display: none;
    }
    .outcome.visible { display: block; }
    .outcome.denied {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
    }
    .logo { display: block; width: 120px; margin: 0 auto 20px; opacity: 0.95; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/logo.png" alt="">
    <h1>PROD photo upload review</h1>
    <p class="sub" id="sub">Loading…</p>

    <div id="loading" class="loading">Loading request…</div>
    <div id="error" class="err" style="display:none;"></div>

    <div id="main" style="display:none;">
      <div class="card">
        <dl id="detail"></dl>
      </div>
      <div class="card" id="photos-card" style="display:none;">
        <h2 style="font-size:1rem;margin-bottom:4px;">Bay photos</h2>
        <p style="font-size:0.85rem;color:var(--muted);">These will upload to the matching PROD category reset (by DBKey) when you approve.</p>
        <div class="photo-grid" id="photo-grid"></div>
      </div>
      <div class="card">
        <div class="actions" id="actions">
          <button type="button" class="btn-approve" id="btn-approve">Approve PROD upload</button>
          <button type="button" class="btn-deny" id="btn-deny">Deny</button>
        </div>
        <div class="outcome" id="outcome"><p id="outcome-text"></p></div>
      </div>
    </div>
  </div>

  <script>
(function () {
  const API_BASE = 'https://eod-api.the-dump-bin.com';
  const params = new URLSearchParams(window.location.search);
  const type = params.get('type');
  const id = params.get('id');
  const token = params.get('token');

  const $ = (id) => document.getElementById(id);
  const loadingEl = $('loading');
  const errorEl = $('error');
  const mainEl = $('main');
  const subEl = $('sub');
  const detailEl = $('detail');
  const actionsEl = $('actions');
  const btnApprove = $('btn-approve');
  const btnDeny = $('btn-deny');
  const outcomeEl = $('outcome');
  const outcomeText = $('outcome-text');
  const photoGrid = $('photo-grid');
  const photosCard = $('photos-card');

  function showError(msg) {
    loadingEl.style.display = 'none';
    mainEl.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = msg;
    subEl.textContent = 'Something went wrong';
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function row(term, htmlInner) {
    return '<dt>' + esc(term) + '</dt><dd>' + htmlInner + '</dd>';
  }

  if (!type || !id || !token || type !== 'prod') {
    showError('This link is missing required parameters (type=prod, id, token). Open the link from your email.');
    return;
  }

  subEl.textContent = 'Checklanes set sign-off → PROD';

  async function load() {
    const url = API_BASE + '/api/decide/' + encodeURIComponent(type) + '/' + encodeURIComponent(id) + '?token=' + encodeURIComponent(token);
    const r = await fetch(url, { credentials: 'omit' });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const err = data.error || ('HTTP ' + r.status);
      showError(err === 'expired_token' ? 'This review link has expired.' : 'Could not load request (' + err + ').');
      return;
    }
    loadingEl.style.display = 'none';
    mainEl.style.display = 'block';

    const st = data.status;
    const parts = [
      row('Status', '<strong>' + esc(st) + '</strong>'),
      row('Store', '#' + esc(data.storeNumber)),
      row('Visit', esc(data.visitId)),
      row('Lane', esc(data.lane || '—')),
      row('DBKey', esc(data.dbkey)),
    ];
    if (data.setName) parts.push(row('Set', esc(data.setName)));
    if (data.manifestPogId) parts.push(row('Manifest POG', esc(data.manifestPogId)));
    if (data.actionCode) parts.push(row('Action', esc(data.actionCode)));
    if (data.signedOffByName) parts.push(row('Signed off by', esc(data.signedOffByName)));
    if (data.matchedResetName) parts.push(row('PROD reset', esc(data.matchedResetName)));
    detailEl.innerHTML = parts.join('');

    photoGrid.innerHTML = '';
    if (Array.isArray(data.photos) && data.photos.length) {
      photosCard.style.display = 'block';
      data.photos.forEach(function (p) {
        const wrap = document.createElement('div');
        const img = document.createElement('img');
        img.src = API_BASE + p.url;
        img.alt = 'Bay ' + p.bay_num;
        img.loading = 'lazy';
        const cap = document.createElement('div');
        cap.className = 'photo-cap';
        cap.textContent = 'Bay ' + p.bay_num;
        wrap.appendChild(img);
        wrap.appendChild(cap);
        photoGrid.appendChild(wrap);
      });
    } else {
      photosCard.style.display = 'none';
    }

    const closed = st === 'approved' || st === 'denied' || st === 'uploaded' || st === 'upload_failed' || st === 'expired';
    if (closed) {
      actionsEl.style.display = 'none';
      outcomeEl.classList.add('visible');
      if (st === 'expired') {
        outcomeEl.classList.add('denied');
        outcomeText.textContent = 'This request has expired.';
      } else if (st === 'denied') {
        outcomeEl.classList.add('denied');
        outcomeText.textContent = 'PROD upload was denied.';
      } else if (st === 'uploaded') {
        outcomeEl.classList.remove('denied');
        outcomeText.textContent = 'Approved — photos were uploaded to PROD.';
      } else if (st === 'upload_failed') {
        outcomeEl.classList.add('denied');
        outcomeText.textContent = 'Approved but upload failed. Check SAS session on the API host and retry from the hub if needed.';
      } else {
        outcomeText.textContent = 'This request was already decided.';
      }
    } else {
      actionsEl.style.display = 'flex';
      outcomeEl.classList.remove('visible', 'denied');
    }
  }

  async function postDecision(decision) {
    btnApprove.disabled = true;
    btnDeny.disabled = true;
    const url = API_BASE + '/api/decide/' + encodeURIComponent(type) + '/' + encodeURIComponent(id);
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'omit',
      body: JSON.stringify({ decision, token }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      btnApprove.disabled = false;
      btnDeny.disabled = false;
      const err = data.error || ('HTTP ' + r.status);
      alert(err === 'sas_inactive' ? 'SAS session is offline on the API host. Refresh morning-auth and try again.' : 'Could not submit: ' + err);
      return;
    }
    await load();
  }

  btnApprove.addEventListener('click', () => postDecision('approved'));
  btnDeny.addEventListener('click', () => postDecision('denied'));

  load().catch((e) => showError(e.message || 'Network error'));
})();
  </script>
</body>
</html>
