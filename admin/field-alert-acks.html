<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field alert acknowledgements</title>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="/auth-gate.js"></script>
<style>
:root{--navy:#0B2545;--sky:#4A7FB5;--red:#C8102E;--bg:#F4F6F9;--surface:#fff;--line:#D8DEE7;--text2:#4B5668;--text3:#7C8798;--radius:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Carlito,Calibri,"Segoe UI",sans-serif;background:var(--bg);color:#0B2545;font-size:15px;line-height:1.45}
.top{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:18px;font-weight:700}
.top a{color:#9fd0ff}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);display:block;margin-bottom:4px}
select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);min-width:150px}
.btn{padding:9px 14px;border-radius:var(--radius);border:1px solid transparent;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}
.btn.secondary{background:#fff;color:var(--navy);border-color:var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--navy);color:#fff;text-align:left;padding:6px 8px;border:1px solid var(--line);white-space:nowrap}
td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
tr.alert-head td{background:#eef3fa;font-weight:700}
.chain{color:var(--text2);font-weight:400;font-size:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700}
.tag.info{background:#e3f2fd}.tag.action{background:#fff3cd;color:#7a5b00}.tag.urgent{background:#fde2e2;color:#9b1c1c}
.no{color:var(--red);font-weight:700}
#status{font-size:13px;color:var(--text3);margin:8px 0}
</style>
</head>
<body>
<div class="top">
  <h1>Field alert acknowledgements</h1>
  <div><a href="/dump-bin/">Dump Bin</a> · <a href="/admin/district-helper.html">District Helper</a></div>
</div>
<div class="wrap">
  <div class="card">
    <div class="filters">
      <div><label for="district">District</label>
        <select id="district"><option value="">All</option><option value="6">D6</option><option value="8">D8</option></select></div>
      <div><label for="severity">Severity</label>
        <select id="severity"><option value="">All</option><option value="info">info</option><option value="action">action</option><option value="urgent">urgent</option></select></div>
      <div><label for="status">Status</label>
        <select id="status"><option value="open" selected>Not yet acknowledged</option><option value="understood">Acknowledged</option><option value="">All</option></select></div>
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn secondary" id="exportPdf">Export PDF</button>
    </div>
    <div id="status">Loading…</div>
  </div>
  <div class="card" style="overflow-x:auto">
    <table id="report"><thead><tr>
      <th>Alert</th><th>Recipient</th><th>District</th><th>Role</th><th>Delivered</th><th>Opened</th><th>Understood</th><th>SMS</th><th>Escalated</th>
    </tr></thead><tbody></tbody></table>
  </div>
</div>
<script>
(function () {
  'use strict';
  const API_BASE = 'https://eod-api.the-dump-bin.com';

  function sessionToken() {
    try {
      if (window.dumpBinAuth && typeof window.dumpBinAuth.getSession === 'function') return window.dumpBinAuth.getSession() || '';
      return localStorage.getItem('dumpBinSession') || '';
    } catch (e) { return ''; }
  }

  function qs() {
    const p = new URLSearchParams();
    const district = document.getElementById('district').value;
    const severity = document.getElementById('severity').value;
    const status = document.getElementById('status').value;
    if (district) p.set('district', district);
    if (severity) p.set('severity', severity);
    if (status) p.set('status', status);
    return p.toString();
  }

  function fmt(v) {
    if (!v) return '—';
    const d = new Date(v);
    return isNaN(d.getTime()) ? String(v) : d.toLocaleString();
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&', '<': '<', '>': '>', '"': '"' }[c]));
  }

  async function load() {
    const el = document.getElementById('status');
    el.textContent = 'Loading…';
    try {
      const token = sessionToken();
      const r = await fetch(`${API_BASE}/api/field-alerts/report?${qs()}`, {
        headers: token ? { Authorization: 'Bearer ' + token } : {},
      });
      if (r.status === 401) { window.location.href = '/?next=' + encodeURIComponent(location.pathname); return; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      render(data.rows || []);
      el.textContent = `${(data.rows || []).length} rows · default sort: not yet acknowledged first`;
    } catch (err) {
      el.textContent = 'Failed to load: ' + err.message;
    }
  }

  function render(rows) {
    const tbody = document.querySelector('#report tbody');
    const byAlert = new Map();
    for (const row of rows) {
      if (!byAlert.has(row.id)) byAlert.set(row.id, []);
      byAlert.get(row.id).push(row);
    }
    const html = [];
    for (const [alertId, list] of byAlert) {
      const head = list[0] || {};
      const chain = head.supersedes_alert_id
        ? `<span class="chain">corrects ${esc(String(head.supersedes_alert_id).slice(0, 8))}… · chain ${esc(head.source_review_id || '-')}</span>`
        : (head.source_review_id ? `<span class="chain">chain ${esc(head.source_review_id)}</span>` : '');
      html.push(`<tr class="alert-head"><td colspan="9">${esc(head.title || alertId)} <span class="tag ${esc(head.severity || 'action')}">${esc(head.severity || 'action')}</span> ${chain}</td></tr>`);
      for (const row of list) {
        const sms = row.sms_failure
          ? `<span class="no">${esc(row.sms_failure)}</span>`
          : `${row.sms_reminders_sent || 0} sent${row.last_sms_at ? ' @ ' + esc(fmt(row.last_sms_at)) : ''}`;
        const opened = row.opened_at ? `${esc(fmt(row.opened_at))} (${esc(row.open_channel || '?')})` : '<span class="no">no</span>';
        const understood = row.understood_at ? esc(fmt(row.understood_at)) : '<span class="no">NO</span>';
        html.push(`<tr>
          <td>${esc(String(alertId).slice(0, 8))}…</td>
          <td>${esc(row.display_name || row.email)}</td>
          <td>${row.district != null ? 'D' + esc(row.district) : '—'}</td>
          <td>${esc(row.notice_role || '')}</td>
          <td>${row.delivered_at ? esc(fmt(row.delivered_at)) : '—'}</td>
          <td>${opened}</td>
          <td>${understood}</td>
          <td>${sms}</td>
          <td>${row.escalated_at ? esc(fmt(row.escalated_at)) : '—'}</td>
        </tr>`);
      }
    }
    tbody.innerHTML = html.join('') || '<tr><td colspan="9">No rows.</td></tr>';
  }

  async function exportPdf() {
    const token = sessionToken();
    const r = await fetch(`${API_BASE}/api/field-alerts/report?${qs()}&format=pdf`, {
      headers: token ? { Authorization: 'Bearer ' + token } : {},
    });
    if (!r.ok) { alert('Export failed (HTTP ' + r.status + ')'); return; }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'field-alert-acks.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  document.getElementById('refresh').addEventListener('click', load);
  document.getElementById('exportPdf').addEventListener('click', exportPdf);
  for (const id of ['district', 'severity', 'status']) {
    document.getElementById(id).addEventListener('change', load);
  }
  load();
})();
</script>
</body>
</html>
