<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Field notice console</title>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="/auth-gate.js"></script>
<style>
:root{--navy:#0B2545;--sky:#4A7FB5;--red:#C8102E;--bg:#F4F6F9;--surface:#fff;--line:#D8DEE7;--text2:#4B5668;--text3:#7C8798;--radius:8px;--ok:#15803d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Carlito,Calibri,"Segoe UI",sans-serif;background:var(--bg);color:#0B2545;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font-size:17px;font-weight:700;line-height:1.25}
.top .who{font-size:13px;color:#c7dcf5;text-align:right}
.top a{color:#9fd0ff;display:inline-flex;align-items:center;min-height:44px;padding:0 6px;margin:-12px -6px -12px 0}
.tabs{display:flex;gap:8px;background:var(--navy);padding:0 12px 10px}
.tab{flex:1;min-height:44px;border:1px solid #33507a;background:#13325b;color:#dbe8f7;border-radius:999px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;padding:0 12px}
.tab[aria-selected="true"]{background:#fff;color:var(--navy);border-color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:14px 12px calc(32px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.filters label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);display:block;margin-bottom:4px}
select,.btn{font:inherit;font-size:16px;min-height:44px;border-radius:var(--radius);border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 10px;width:100%}
.btn{background:var(--navy);color:#fff;font-weight:700;border-color:transparent;cursor:pointer}
.btn.secondary{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.danger{background:#fff;color:var(--red);border-color:#f3c6cd}
.row-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
#status{font-size:13px;color:var(--text3);margin:2px 2px 10px;min-height:1.2em}
.notice{border-left:4px solid var(--sky)}
.notice.sev-urgent{border-left-color:var(--red)}
.notice.sev-info{border-left-color:var(--text3)}
.notice-head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.notice-title{font-weight:700;font-size:16px;line-height:1.3;flex:1}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pill.info{background:#e3f2fd;color:#0b4d7a}
.pill.action{background:#fff3cd;color:#7a5b00}
.pill.urgent{background:#fde2e2;color:#9b1c1c}
.pill.live{background:#e7f6ec;color:var(--ok)}
.pill.expired{background:#eef1f5;color:var(--text2)}
.pill.revoked{background:#fde2e2;color:#9b1c1c}
.pill.superseded{background:#ede9fe;color:#5b21b6}
.meta{font-size:13px;color:var(--text2);margin-top:6px}
.chain{font-size:12px;color:var(--text3);margin-top:2px}
.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.count{background:#f7f9fc;border:1px solid #e6ecf3;border-radius:6px;padding:7px 9px}
.count b{display:block;font-size:17px;line-height:1.1}
.count span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2)}
.count.bad b{color:var(--red)}
.count.good b{color:var(--ok)}
.rcpt{border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;margin-bottom:10px;background:#fff}
.rcpt.unconfirmed{border-left:4px solid var(--red)}
.rcpt .who{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rcpt .name{font-weight:700;font-size:15px;line-height:1.3}
.rcpt .sub{font-size:12px;color:var(--text3)}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:2px 10px;font-size:13px;margin-top:8px}
.kv dt{color:var(--text2)}
.kv dd{word-break:break-word}
.bad{color:var(--red);font-weight:700}
.ok{color:var(--ok);font-weight:700}
.onbehalf{color:#5b21b6;font-weight:700}
.cause{margin-bottom:12px}
.cause-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cause h3{font-size:15px}
.cause .n{font-weight:700;color:var(--red)}
.hint{font-size:13px;color:var(--text2);background:#f7f9fc;border-radius:6px;padding:8px 10px;margin:8px 0}
.chip{display:inline-block;background:#eef3fa;color:var(--navy);border-radius:999px;padding:1px 8px;font-size:12px;margin-right:6px}
.empty{color:var(--text3);font-size:14px;padding:8px 2px}
.rcpt .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rcpt .acts .btn{font-size:15px}
.note{margin:0 2px 10px;font-size:14px;font-weight:700;color:var(--ok)}
.note.bad{color:var(--red)}
dialog{border:0;padding:0;border-radius:12px 12px 0 0;width:100%;max-width:560px;margin:auto auto 0;background:#fff;color:var(--navy)}
dialog::backdrop{background:rgba(11,37,69,.45)}
@media (min-width:720px){dialog{border-radius:12px;margin:auto}}
#sheet-form{padding:16px;max-height:88vh;overflow:auto}
#sheet-title{font-size:17px;margin-bottom:6px}
#sheet-intro{font-size:14px;color:var(--text2);margin-bottom:12px}
#sheet-fields{margin-bottom:12px}
#sheet-fields label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:10px 0 4px}
#sheet-fields textarea{font:inherit;font-size:16px;width:100%;min-height:96px;padding:10px;border:1px solid var(--line);border-radius:var(--radius)}
#sheet-fields input,#sheet-fields select{font:inherit;font-size:16px;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);width:100%;background:#fff;color:var(--navy)}
#sheet-error{color:var(--red);font-weight:700;font-size:14px;min-height:1.2em;margin-top:8px}
.difflist{background:#f7f9fc;border-radius:6px;padding:10px;font-size:13px}
.difflist dt{font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.05em;color:var(--text2);margin-top:8px}
.difflist dd{white-space:pre-wrap;word-break:break-word}
.difflist .to{color:#0b6b2f}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:0 0 6px}
#view-compose label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:10px 0 4px}
#view-compose input[type=text],#view-compose textarea{font:inherit;font-size:16px;width:100%;min-height:44px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--navy)}
#view-compose textarea{min-height:64px}
#view-compose input[type=file]{font-size:16px;width:100%;min-height:44px;padding:8px 0}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg-btn{font:inherit;font-size:15px;font-weight:700;min-height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;padding:0 10px}
.seg-btn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg-btn:disabled{opacity:.55;cursor:not-allowed}
.picklist{display:flex;flex-direction:column;margin-top:10px;max-height:320px;overflow:auto}
#view-compose .picklist label{display:flex;gap:10px;align-items:center;min-height:44px;border-top:1px solid #eef1f5;margin:0;text-transform:none;letter-spacing:0;font-size:16px;font-weight:400;color:var(--navy)}
#view-compose .picklist input{width:20px;height:20px;flex:0 0 auto;margin:0}
.row-check{display:flex!important;align-items:center;gap:10px;min-height:44px;text-transform:none!important;letter-spacing:0!important;font-size:16px!important;font-weight:700!important;color:var(--navy)!important;margin:0!important}
.row-check input{width:22px;height:22px}
.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:8px 10px;font-size:13px;color:#92400e;margin-top:6px}
.phone{max-width:390px;margin:12px auto 0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0f172a;padding:10px}
.phone-card{background:#fff;border-radius:12px;overflow:hidden}
.phone-head{padding:12px 14px;color:#fff;font-weight:700;font-size:15px;line-height:1.3}
.phone-head.info{background:#0b4d7a}
.phone-head.action{background:#b45309}
.phone-head.urgent{background:#C8102E}
.phone-body{padding:12px 14px;font-size:14px;color:#1f2937;max-height:320px;overflow:auto}
.phone-body p{margin:0 0 10px}
.phone-foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#f9fafb;font-size:13px;color:var(--text2)}
.smsbox{margin-top:12px;background:#eef3fa;border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap;word-break:break-word}
@media (min-width:720px){
  .filters{grid-template-columns:repeat(4,minmax(0,1fr))}
  .counts{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="top">
  <h1>Field notice console</h1>
  <div class="who"><span id="me">Loading…</span><br><a href="/dump-bin/">Dump Bin</a></div>
</div>
<div class="tabs" role="tablist">
  <button class="tab" id="tab-notices" role="tab" aria-selected="true">Notices</button>
  <button class="tab" id="tab-failures" role="tab" aria-selected="false">Failures</button>
  <button class="tab" id="tab-compose" role="tab" aria-selected="false">Compose</button>
</div>

<div class="wrap">
  <section id="view-compose" hidden>
    <div class="card">
      <div class="filters" style="grid-template-columns:1fr">
        <div><label for="c-title">Title</label>
          <input id="c-title" type="text" maxlength="200" placeholder="Short headline"></div>
      </div>
      <div id="c-bullets">
        <label for="c-b1">Bullet 1</label><textarea id="c-b1"></textarea>
        <label for="c-b2">Bullet 2</label><textarea id="c-b2"></textarea>
        <label for="c-b3">Bullet 3</label><textarea id="c-b3"></textarea>
        <label for="c-b4">Bullet 4</label><textarea id="c-b4"></textarea>
      </div>
      <div class="chain" id="c-bullet-note">2–4 bullets</div>
    </div>

    <div class="card">
      <label class="lbl">Severity</label>
      <div class="seg" id="c-severity">
        <button type="button" class="seg-btn" data-sev="info">info</button>
        <button type="button" class="seg-btn" data-sev="action" aria-pressed="true">action</button>
        <button type="button" class="seg-btn" data-sev="urgent">urgent</button>
      </div>
      <div id="c-matrix" class="hint"></div>
    </div>

    <div class="card">
      <label class="lbl">Audience</label>
      <div class="seg" id="c-aud-type">
        <button type="button" class="seg-btn" data-aud="districts" aria-pressed="true">District</button>
        <button type="button" class="seg-btn" data-aud="routes">Route</button>
        <button type="button" class="seg-btn" data-aud="stores">Store</button>
        <button type="button" class="seg-btn" data-aud="emails">Person</button>
      </div>
      <div id="c-aud-list" class="picklist"></div>
      <div id="c-aud-summary" class="chain"></div>
      <div id="c-aud-warnings"></div>
    </div>

    <div class="card">
      <label class="lbl">Document</label>
      <select id="c-doc-existing"><option value="">No document</option></select>
      <label for="c-doc-file" style="margin-top:10px">Upload a PDF</label>
      <input id="c-doc-file" type="file" accept="application/pdf">
      <div id="c-doc-status" class="chain"></div>
    </div>

    <div class="card">
      <label class="lbl">Channel</label>
      <div class="seg" id="c-channel">
        <button type="button" class="seg-btn" data-ch="eod_field_app" aria-pressed="true">Field app</button>
        <button type="button" class="seg-btn" data-ch="cp_scheduler" disabled>CP scheduler (pending)</button>
      </div>
    </div>

    <div class="card">
      <div class="row-actions" style="margin-top:0">
        <button class="btn" id="c-preview">Preview</button>
        <button class="btn secondary" id="c-reset">Clear</button>
      </div>
      <div id="c-preview-out"></div>
    </div>

    <div class="card">
      <label class="row-check"><input type="checkbox" id="c-approve"> I approve this notice</label>
      <label for="c-approval-note" style="margin-top:8px">Note (optional)</label>
      <input id="c-approval-note" type="text">
      <button class="btn" id="c-send" disabled style="margin-top:12px">Send notice</button>
      <div id="c-send-note" class="note" hidden></div>
    </div>
  </section>

  <section id="view-list">
    <div class="card">
      <div class="filters">
        <div><label for="f-district">District</label><select id="f-district"></select></div>
        <div><label for="f-route">Route</label><select id="f-route"></select></div>
        <div><label for="f-severity">Severity</label>
          <select id="f-severity">
            <option value="">All</option><option value="info">info</option>
            <option value="action">action</option><option value="urgent">urgent</option>
          </select></div>
        <div><label for="f-status">Status</label>
          <select id="f-status">
            <option value="">All</option><option value="live">Live</option>
            <option value="expired">Expired</option><option value="revoked">Revoked</option>
            <option value="superseded">Superseded</option>
          </select></div>
      </div>
      <div class="row-actions">
        <button class="btn" id="refresh">Refresh</button>
        <button class="btn secondary" id="export-list">Export PDF</button>
      </div>
    </div>
    <div id="status">Loading…</div>
    <div id="list"></div>
  </section>

  <section id="view-detail" hidden>
    <div class="card">
      <div class="row-actions" style="margin-top:0">
        <button class="btn secondary" id="back">All notices</button>
        <button class="btn secondary" id="export-detail">Export PDF</button>
      </div>
      <div class="filters" style="margin-top:10px">
        <div><label for="d-district">District</label><select id="d-district"></select></div>
        <div><label for="d-route">Route</label><select id="d-route"></select></div>
      </div>
    </div>
    <div id="note" class="note" hidden></div>
    <div id="detail"></div>
    <div id="detail-audit"></div>
  </section>

  <section id="view-failures" hidden>
    <div class="card">
      <div class="row-actions" style="margin-top:0">
        <button class="btn" id="refresh-failures">Refresh</button>
        <button class="btn secondary" id="export-failures">Export PDF</button>
      </div>
    </div>
    <div id="failures"></div>
  </section>
</div>
<dialog id="sheet" aria-labelledby="sheet-title">
  <form id="sheet-form" method="dialog">
    <h2 id="sheet-title"></h2>
    <p id="sheet-intro"></p>
    <div id="sheet-fields"></div>
    <div id="sheet-diff"></div>
    <div id="sheet-error"></div>
    <div class="row-actions">
      <button type="button" class="btn secondary" id="sheet-cancel">Cancel</button>
      <button type="submit" class="btn" id="sheet-go">Confirm</button>
    </div>
  </form>
</dialog>
<script src="/admin/field-alert-acks.js"></script>
</body>
</html>
