<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meat Pusher Review</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=2">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700&amp;display=swap">
  <link rel="stylesheet" href="/meat-pusher-survey/review/assets/review.css?v=11">
  <script src="/auth-gate.js"></script>
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <h1>Meat Pusher Review</h1>
      <div class="bar-actions">
        <button type="button" id="printBtn">Print PDF</button>
        <button type="button" id="xlsxBtn">Export XLSX</button>
        <button type="button" id="share">Copy management link</button>
      </div>
    </div>
  </header>
  <p id="status" class="status" role="status"></p>
  <div id="toolbar" class="toolbar" hidden>
    <div id="groupChips" class="chip-row"></div>
    <div id="statusChips" class="chip-row"></div>
    <div class="toolbar-foot">
      <span id="filterSummary" class="filter-summary"></span>
      <label class="select-all-label"><input type="checkbox" id="selectAll"> Select all filtered</label>
      <span id="selCount" class="sel-count"></span>
      <label class="import-label">
        <input type="file" id="importFile" accept=".xlsx,.csv" hidden>
        <button type="button" class="import-btn" id="importBtn">Upload updated sheet</button>
      </label>
      <span id="importStatus" class="import-status"></span>
    </div>
  </div>
  <div id="conflictModal" class="conflict-modal" hidden></div>
  <div id="tabBar" class="tab-bar">
    <button type="button" class="tab on" data-tab="review">Review</button>
    <button type="button" class="tab" data-tab="outreach">Outreach</button>
  </div>
  <div id="tabReview" class="layout">
    <aside id="stores" class="stores"></aside>
    <section id="detail"></section>
  </div>
  <div id="tabOutreach" class="outreach-pane" hidden>
    <div class="outreach-grid">
      <aside class="outreach-sidebar">
        <h2 class="sidebar-head">ISE · Blitz · Cut-In</h2>
        <p id="outFilterLine" class="sub"></p>
        <label class="filter-label">From <input type="date" id="outStart"></label>
        <label class="filter-label">To <input type="date" id="outEnd"></label>
        <button type="button" class="btn-pull" id="pullLeads">Pull leads for filtered stores</button>
        <button type="button" class="btn-link" id="pullLeadsRefresh">Re-pull (skip cache)</button>
        <p id="pullStatus" class="pull-status" role="status"></p>
        <hr class="out-hr">
        <h2 class="sidebar-head">Assignments</h2>
        <label class="filter-label">Email status
          <select id="asgStatus">
            <option value="">All</option>
            <option value="assigned">Assigned, not emailed</option>
            <option value="invited">Emailed</option>
            <option value="done">Done</option>
          </select>
        </label>
        <button type="button" class="btn-pull" id="loadAssignments">Refresh</button>
      </aside>
      <div class="outreach-main">
        <div id="outStores"></div>
        <div id="summaryBar" class="summary-bar" hidden>
          <span class="summary-title">Management summary</span>
          <button type="button" id="summaryPreview">Preview</button>
          <button type="button" id="summarySend" class="primary">Email Amanda</button>
        </div>
        <div id="summaryBox" class="summary-box" hidden></div>
        <div id="asgResults"></div>
      </div>
    </div>
  </div>
  <footer>Retail Odyssey</footer>
  <script src="/meat-pusher-survey/review/assets/review.js?v=17"></script>
</body>
</html>
