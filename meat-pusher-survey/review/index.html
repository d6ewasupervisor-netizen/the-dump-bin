<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meat Pusher Review</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=2">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700&amp;display=swap">
  <link rel="stylesheet" href="/meat-pusher-survey/review/assets/review.css?v=7">
  <script src="/auth-gate.js"></script>
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <h1>Meat Pusher Review</h1>
      <div class="bar-actions">
        <button type="button" id="printBtn">Print PDF</button>
        <button type="button" id="xlsxBtn">Export XLSX</button>
        <button type="button" id="share">Copy management link</button>
      </div>
    </div>
  </header>
  <p id="status" class="status" role="status"></p>
  <div id="toolbar" class="toolbar" hidden>
    <label class="filter-label">Supervisor
      <select id="filterSup">
        <option value="">All supervisors</option>
      </select>
    </label>
    <label class="filter-label">Status
      <select id="filterStatus">
        <option value="">All</option>
        <option value="done">Done</option>
        <option value="revisit">Needs revisit</option>
        <option value="open">Not started</option>
      </select>
    </label>
    <label class="select-all-label">
      <input type="checkbox" id="selectAll">
      Select all filtered
    </label>
    <span id="selCount" class="sel-count"></span>
    <label class="import-label">
      <input type="file" id="importFile" accept=".xlsx,.csv" hidden>
      <button type="button" class="import-btn" id="importBtn">Upload updated sheet</button>
    </label>
    <span id="importStatus" class="import-status"></span>
  </div>
  <div id="conflictModal" class="conflict-modal" hidden></div>
  <div id="tabBar" class="tab-bar">
    <button type="button" class="tab on" data-tab="review">Review</button>
    <button type="button" class="tab" data-tab="outreach">Outreach</button>
  </div>
  <div id="tabReview" class="layout">
    <aside id="stores" class="stores"></aside>
    <section id="detail"></section>
  </div>
  <div id="tabOutreach" class="outreach-pane" hidden>
    <div class="outreach-grid">
      <aside class="outreach-sidebar">
        <h2 class="sidebar-head">Pull from SAS PROD</h2>
        <label class="filter-label">District
          <select id="outDistrict">
            <option value="">All districts</option>
            <option>D1</option><option>D2</option><option>D3</option>
            <option>D4</option><option>D5</option><option>D6</option>
            <option>D7</option><option>D8</option><option>D9</option><option>D10</option>
          </select>
        </label>
        <label class="filter-label">Date range
          <input type="date" id="outStart">
          <input type="date" id="outEnd" style="margin-top:4px">
        </label>
        <button type="button" class="btn-pull" id="pullSas">Pull from PROD</button>
        <p id="pullStatus" class="pull-status" role="status"></p>
        <hr class="out-hr">
        <h2 class="sidebar-head">Assignments</h2>
        <label class="filter-label">Filter by district
          <select id="asgDistrict">
            <option value="">All</option>
          </select>
        </label>
        <label class="filter-label">Filter by status
          <select id="asgStatus">
            <option value="">All</option>
            <option value="assigned">Assigned</option>
            <option value="invited">Invited</option>
            <option value="done">Done</option>
          </select>
        </label>
        <button type="button" class="btn-pull" id="loadAssignments">Refresh assignments</button>
      </aside>
      <div class="outreach-main">
        <div id="sasResults"></div>
        <div id="asgResults"></div>
      </div>
    </div>
  </div>
  <footer>Retail Odyssey</footer>
  <script src="/meat-pusher-survey/review/assets/review.js?v=12"></script>
</body>
</html>
