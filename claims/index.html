<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Injury Reporting — Retail Odyssey</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">

    <script src="/auth-gate.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /*
        Retail Odyssey form shell — tokens mirror main site (/styles.css) for reuse on other claim forms.
        Do not rename --brand-* vars without coordinating steps 9.6 / 10.
      */
      :root {
        --brand-bg-deep: #141c27;
        --brand-bg: #1e2a38;
        --brand-surface: #1f2d3d;
        --brand-surface-hover: #2a3a4e;
        --brand-primary: #4a7fb5;
        --brand-primary-light: #8ab4d6;
        --brand-accent: #c9a84c;
        --brand-accent-light: #e2cc7a;
        --brand-text: #e8ecf1;
        --brand-text-muted: #8fa3b8;
        --brand-border: #2f4562;
        --brand-danger: #e74c3c;
        --brand-focus-ring: rgba(74, 127, 181, 0.35);
        --brand-radius: 10px;
        --brand-radius-lg: 16px;
        --brand-shadow-card: 0 4px 24px rgba(0, 0, 0, 0.45);
        --brand-font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        --brand-nav-height: 60px;
        --brand-input-min-h: 2.625rem;
        --brand-max-form: 48rem;
        --brand-required: var(--brand-accent);

        color-scheme: dark;
      }

      html {
        scroll-behavior: smooth;
      }

      body.form-shell-body {
        font-family: var(--brand-font);
        background-color: var(--brand-bg-deep);
        background-image: url("/background.png");
        background-repeat: repeat;
        background-attachment: fixed;
        color: var(--brand-text);
        -webkit-font-smoothing: antialiased;
      }

      .form-shell-body a {
        color: var(--brand-primary-light);
        text-decoration: none;
        transition: color 0.2s ease;
      }
      .form-shell-body a:hover {
        color: var(--brand-accent-light);
      }

      /* Site nav (matches claims chooser — inlined; no /styles.css) */
      .site-nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--brand-bg-deep);
        border-bottom: 2px solid var(--brand-border);
        border-image: linear-gradient(
            90deg,
            transparent,
            var(--brand-accent) 30%,
            var(--brand-accent) 70%,
            transparent
          )
          1;
        height: var(--brand-nav-height);
        display: flex;
        align-items: center;
        padding: 0 20px;
      }

      .site-nav__inner {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .site-nav__logo {
        height: 36px;
        width: auto;
      }

      .site-nav__link {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--brand-text-muted);
        padding: 6px 14px;
        border-radius: var(--brand-radius);
        transition: color 0.2s ease, background 0.2s ease;
      }

      .site-nav__link:hover {
        color: var(--brand-text);
        background: var(--brand-surface);
      }

      @media (max-width: 768px) {
        .site-nav {
          padding: 0 14px;
        }
        .site-nav__logo {
          height: 30px;
        }
        .site-nav__link {
          padding: 6px 10px;
          font-size: 0.85rem;
        }
      }

      .claims-back-strip {
        max-width: 1100px;
        margin: 0 auto;
        padding: 12px 20px 4px;
      }

      @media (max-width: 768px) {
        .claims-back-strip {
          padding: 12px 14px 4px;
        }
      }

      .claims-back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--brand-primary-light);
      }

      .claims-back-link:hover {
        color: var(--brand-accent-light);
      }

      .form-shell-main {
        max-width: var(--brand-max-form);
        margin-left: auto;
        margin-right: auto;
        padding-left: 1rem;
        padding-right: 1rem;
        padding-bottom: 3.5rem;
      }

      @media (min-width: 640px) {
        .form-shell-main {
          padding-left: 1.5rem;
          padding-right: 1.5rem;
        }
      }

      .form-brand-logo-wrap {
        text-align: center;
        padding-top: 0.5rem;
      }

      .form-brand-logo {
        display: inline-block;
        width: auto;
        max-height: 60px;
        height: auto;
        vertical-align: middle;
      }

      @media (min-width: 768px) {
        .form-brand-logo {
          max-height: 96px;
        }
      }

      .form-shell-title {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--brand-accent);
        text-align: center;
        margin-top: 1.25rem;
      }

      @media (min-width: 768px) {
        .form-shell-title {
          font-size: 1.75rem;
          margin-top: 1.5rem;
        }
      }

      .form-shell-lede {
        text-align: center;
        font-size: 0.975rem;
        line-height: 1.55;
        color: var(--brand-text-muted);
        margin-top: 0.625rem;
        max-width: 36rem;
        margin-left: auto;
        margin-right: auto;
      }

      .req {
        color: var(--brand-required);
        font-weight: 700;
      }

      .ro-card-section {
        background: linear-gradient(135deg, var(--brand-surface) 0%, #1a2535 100%);
        border: 1px solid var(--brand-border);
        border-radius: var(--brand-radius-lg);
        padding: 1.5rem 1.25rem;
        box-shadow: var(--brand-shadow-card);
      }

      @media (min-width: 640px) {
        .ro-card-section {
          padding: 1.75rem 1.5rem;
        }
      }

      .ro-section-title {
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--brand-text);
        letter-spacing: 0.02em;
      }

      .ro-section-sub {
        margin-top: 0.375rem;
        font-size: 0.8125rem;
        line-height: 1.45;
        color: var(--brand-text-muted);
      }

      .ro-subsection-heading {
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--brand-accent);
        margin-top: 1.75rem;
        margin-bottom: 0.875rem;
        padding-bottom: 0.375rem;
        border-bottom: 1px solid var(--brand-border);
      }

      .ro-divider-soft {
        border: none;
        border-top: 1px solid var(--brand-border);
        margin: 1.75rem 0;
        opacity: 0.85;
      }

      .ro-label {
        display: block;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--brand-text-muted);
        margin-bottom: 0.25rem;
      }

      .ro-input,
      .ro-select,
      .ro-textarea {
        display: block;
        width: 100%;
        min-height: var(--brand-input-min-h);
        padding: 0.5625rem 0.75rem;
        font-size: 0.9375rem;
        font-family: var(--brand-font);
        color: var(--brand-text);
        background: var(--brand-bg);
        border: 1px solid var(--brand-border);
        border-radius: var(--brand-radius);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .ro-textarea {
        min-height: 6rem;
        resize: vertical;
      }

      .ro-select {
        appearance: none;
        background-image: linear-gradient(
            45deg,
            transparent 50%,
            var(--brand-text-muted) 50%
          ),
          linear-gradient(135deg, var(--brand-text-muted) 50%, transparent 50%);
        background-position: calc(100% - 1rem) 50%, calc(100% - 0.6875rem) 50%;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
        padding-right: 2rem;
      }

      .ro-input:focus,
      .ro-select:focus,
      .ro-textarea:focus {
        outline: none;
        border-color: var(--brand-primary);
        box-shadow: 0 0 0 3px var(--brand-focus-ring),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      #body-part-grid .body-part-chip {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0;
        padding: 0.75rem 0.8125rem;
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--brand-text);
        background: rgba(30, 42, 56, 0.65);
        border: 1px solid var(--brand-border);
        border-radius: var(--brand-radius);
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      }

      #body-part-grid .body-part-chip:hover {
        border-color: var(--brand-primary);
        background: var(--brand-surface-hover);
      }

      #body-part-grid .body-part-chip:has(input:focus-visible) {
        outline: 2px solid var(--brand-primary);
        outline-offset: 2px;
      }

      #body-part-grid .body-part-chip:has(input:checked) {
        border-color: var(--brand-accent);
        background: rgba(201, 168, 76, 0.1);
        box-shadow: inset 0 0 0 1px rgba(201, 168, 76, 0.25);
      }

      #body-part-grid .body-part-chip input[type="checkbox"] {
        flex-shrink: 0;
        width: 1rem;
        height: 1rem;
        accent-color: var(--brand-primary);
        border-radius: 4px;
      }

      .ro-legend {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--brand-text-muted);
        padding: 0;
      }

      .ro-hint {
        margin-top: 0.375rem;
        font-size: 0.6875rem;
        color: var(--brand-text-muted);
      }

      .ro-radio-pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.625rem;
      }

      .ro-radio-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.875rem;
        border-radius: 9999px;
        border: 1px solid var(--brand-border);
        background: rgba(30, 42, 56, 0.45);
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--brand-text);
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease;
      }

      .ro-radio-pill:hover {
        border-color: var(--brand-primary);
        background: var(--brand-surface-hover);
      }

      .ro-radio-pill input[type="radio"] {
        accent-color: var(--brand-primary);
        width: 1rem;
        height: 1rem;
      }

      .ro-btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 0.875rem;
        font-size: 0.875rem;
        font-weight: 600;
        font-family: var(--brand-font);
        color: var(--brand-text);
        background: var(--brand-surface-hover);
        border: 1px solid var(--brand-border);
        border-radius: var(--brand-radius);
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .ro-btn-secondary:hover {
        background: var(--brand-border);
        border-color: var(--brand-primary);
      }

      .ro-btn-secondary:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--brand-focus-ring);
      }

      .ro-btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.625rem 1.25rem;
        font-size: 0.9375rem;
        font-weight: 600;
        font-family: var(--brand-font);
        color: #fff;
        border: none;
        border-radius: var(--brand-radius);
        cursor: pointer;
        background: linear-gradient(135deg, var(--brand-primary) 0%, #3d6d9e 100%);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        transition: transform 0.08s ease, filter 0.2s ease, box-shadow 0.2s ease;
      }

      .ro-btn-primary:hover:not(:disabled) {
        filter: brightness(1.06);
      }

      .ro-btn-primary:active:not(:disabled) {
        transform: scale(0.98);
      }

      .ro-btn-primary:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--brand-focus-ring), 0 6px 20px rgba(0, 0, 0, 0.25);
      }

      .ro-btn-primary:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .witness-row.ro-witness-panel {
        background: rgba(30, 42, 56, 0.5);
        border: 1px solid var(--brand-border);
      }

      .ro-remove-btn {
        color: var(--brand-danger);
      }

      .ro-remove-btn:hover {
        background: rgba(231, 76, 60, 0.1);
      }

      .remove-witness:focus-visible {
        outline: 2px solid var(--brand-danger);
        outline-offset: 2px;
      }

      .ro-card-section > h2 + .ro-subsection-heading {
        margin-top: 1.25rem;
      }

      fieldset.border-0 {
        border: none;
      }

      fieldset.border-0 > legend {
        float: none;
      }

      @media (max-width: 768px) {
        .ro-input,
        .ro-select,
        .ro-textarea {
          font-size: 16px; /* iOS: avoid zoom on focus */
          min-height: 2.75rem;
          padding-left: 0.875rem;
          padding-right: 0.875rem;
        }
      }

      /* Injury reporting — chooser only (inherits same shell CSS as self form) */
      .form-shell-main--chooser {
        max-width: 1100px;
      }

      .claims-route-grid {
        margin-top: 2rem;
        display: grid;
        gap: 1.25rem;
        grid-template-columns: minmax(0, 1fr);
      }

      @media (min-width: 768px) {
        .claims-route-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 1.35rem;
        }
      }

      .form-shell-body a.ro-card-section.claims-route-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        height: 100%;
        padding-top: 1.75rem;
        padding-bottom: 1.75rem;
        color: inherit;
        text-decoration: none;
        transition: transform 0.22s ease, border-color 0.25s ease, box-shadow 0.28s ease;
      }

      .form-shell-body a.ro-card-section.claims-route-card:hover {
        color: inherit;
        transform: translateY(-4px);
        border-color: var(--brand-accent);
        box-shadow:
          0 0 24px rgba(201, 168, 76, 0.2),
          0 0 60px rgba(74, 127, 181, 0.08),
          var(--brand-shadow-card);
      }

      .form-shell-body a.ro-card-section.claims-route-card:active {
        transform: translateY(-2px);
      }

      .form-shell-body a.ro-card-section.claims-route-card:focus-visible {
        outline: none;
        transform: translateY(-2px);
        border-color: var(--brand-primary);
        box-shadow:
          0 0 0 3px var(--brand-focus-ring),
          0 0 28px rgba(74, 127, 181, 0.15),
          var(--brand-shadow-card);
      }

      .claims-route-card__icon {
        font-size: 2.25rem;
        line-height: 1;
        color: var(--brand-accent);
        margin-bottom: 0.875rem;
      }

      .claims-route-card__title {
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--brand-text);
      }

      .claims-route-card__desc {
        margin-top: 0.625rem;
        font-size: 0.9rem;
        line-height: 1.45;
        color: var(--brand-text-muted);
      }
    </style>
  </head>
  <body class="form-shell-body min-h-screen antialiased">
    <nav class="site-nav" aria-label="Site">
      <div class="site-nav__inner">
        <img src="/logo-banner.png" alt="Retail Odyssey Company" class="site-nav__logo" />
        <a href="/" class="site-nav__link">Home</a>
      </div>
    </nav>

    <main class="form-shell-main form-shell-main--chooser">
      <div class="form-brand-logo-wrap">
        <img
          class="form-brand-logo"
          src="/new%20logo%203.png"
          alt="Retail Odyssey"
          decoding="async"
        />
      </div>
      <h1 class="form-shell-title">Injury Reporting</h1>
      <p class="form-shell-lede">Choose the type of report you need to submit.</p>

      <div class="claims-route-grid">
        <a href="/claims/self/" class="ro-card-section claims-route-card">
          <span class="claims-route-card__icon" aria-hidden="true">🩹</span>
          <span class="claims-route-card__title">Self-Report</span>
          <span class="claims-route-card__desc">I was injured at work.</span>
        </a>

        <a href="/claims/witness/" class="ro-card-section claims-route-card">
          <span class="claims-route-card__icon" aria-hidden="true">👁️</span>
          <span class="claims-route-card__title">Witness or Statement</span>
          <span class="claims-route-card__desc"
            >I witnessed an injury, was told about one, or was asked to provide a statement.</span
          >
        </a>

        <a
          id="manager-card"
          href="/claims/investigation/"
          class="ro-card-section claims-route-card"
          style="display: none;"
        >
          <span class="claims-route-card__icon" aria-hidden="true">📋</span>
          <span class="claims-route-card__title">Manager Investigation</span>
          <span class="claims-route-card__desc">Manager use only — gathering information on an existing claim.</span>
        </a>
      </div>
    </main>
    <script type="module">
      import { getAccessIdentity, isManager } from '/claims/managers.js';

      const identity = await getAccessIdentity();
      const managerCard = document.getElementById('manager-card');

      if (managerCard && isManager(identity?.email)) {
        managerCard.style.display = '';
      }
    </script>
  </body>
</html>
