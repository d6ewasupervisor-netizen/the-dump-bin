<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Injury Reporting — Retail Odyssey</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <nav class="site-nav">
    <div class="site-nav__inner">
      <img src="/logo-banner.png" alt="Retail Odyssey Company" class="site-nav__logo">
      <a href="/" class="site-nav__link">Home</a>
    </div>
  </nav>

  <main class="page-wrap">
    <section class="hero">
      <h1 class="hero__title">Injury Reporting</h1>
      <p class="hero__sub">Choose the type of report you need to submit.</p>
    </section>

    <div class="card-grid">

      <a href="/claims/self/" class="card">
        <span class="card__icon">🩹</span>
        <span class="card__title">Self-Report</span>
        <span class="card__desc">I was injured at work.</span>
      </a>

      <a href="/claims/witness/" class="card">
        <span class="card__icon">👁️</span>
        <span class="card__title">Witness or Statement</span>
        <span class="card__desc">I witnessed an injury, was told about one, or was asked to provide a statement.</span>
      </a>

      <a href="/claims/investigation/" class="card">
        <span class="card__icon">📋</span>
        <span class="card__title">Manager Investigation</span>
        <span class="card__desc">Manager use only — gathering information on an existing claim.</span>
      </a>

    </div>
  </main>

</body>
</html>
