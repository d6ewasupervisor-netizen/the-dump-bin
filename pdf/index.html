<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dump Bin — PDF</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=2">
  <script src="/auth-gate.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
  <link rel="stylesheet" href="/shared/pdf-viewer/materials-pdf-viewer.css?v=1.1.3">
  <script src="/shared/pdf-viewer/materials-pdf-viewer.js?v=1.1.3"></script>
  <style>
    html, body { margin: 0; height: 100%; height: 100dvh; background: #0b1220; overflow: hidden; }
    #mpvBootError {
      display: none;
      color: #fecaca;
      font-family: ui-sans-serif, system-ui, sans-serif;
      padding: 2rem;
      max-width: 36rem;
      margin: 0 auto;
      line-height: 1.5;
    }
    #mpvBootError a { color: #93c5fd; }
  </style>
</head>
<body>
  <div id="mpvBootError"></div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var file = params.get('file') || params.get('url') || '';
      var name = params.get('name') || '';
      var page = params.get('page');
      var errEl = document.getElementById('mpvBootError');

      function showError(msg, href) {
        errEl.style.display = 'block';
        errEl.innerHTML = '<p>' + msg + '</p>' +
          (href ? '<p><a href="' + href + '" target="_blank" rel="noopener">Open original file</a></p>' : '') +
          '<p><a href="/dump-bin/">Back to Dump Bin</a></p>';
      }

      if (!file) {
        showError('No PDF was specified.');
        return;
      }

      if (!window.MaterialsPdfViewer || !window.pdfjsLib) {
        showError('The document viewer failed to load.', file);
        return;
      }

      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      var title = name || (window.MaterialsPdfViewer.filenameFromUrl
        ? window.MaterialsPdfViewer.filenameFromUrl(file)
        : 'Document');
      document.title = title + ' — Dump Bin';

      window.MaterialsPdfViewer.open({
        title: title,
        fileName: title,
        url: file,
        page: page,
        standalone: true,
        embedded: (function () {
          try { return window.self !== window.top; } catch (e) { return true; }
        })(),
        onToast: function (msg) {
          try { console.info('[pdf-viewer]', msg); } catch (_) {}
        },
      }).catch(function (err) {
        showError((err && err.message) || 'Could not open this PDF.', file);
      });
    })();
  </script>
</body>
</html>
