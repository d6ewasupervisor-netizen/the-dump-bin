<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>KOMPASS EOD</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css?v=3.4.20">
  <script>
    (function () {
      var t = '';
      try { t = localStorage.getItem('eodFieldTheme') || ''; } catch (_) {}
      if (t !== 'dark' && t !== 'inverse' && t !== 'light' && t !== 'gray' && t !== 'gray-matter' && t !== 'holiday' && t !== 'blackout') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script>
    (function () {
      var host = location.hostname || '';
      if (host === 'the-dump-bin.com' || host.endsWith('.the-dump-bin.com')) {
        document.write('<script src="/auth-gate.js?v=20260903-embed-badge"><\/script>');
      } else {
        document.write('<script src="js/auth-shim.js?v=3.4.20"><\/script>');
      }
    })();
  </script>
</head>
<body>
  <div class="eod-test-banner eod-test-banner-top" aria-hidden="true"><span class="eod-test-track">TEST ? TEST ? TEST ? TEST ? TEST ? TEST ? TEST ? TEST ? </span></div>

  <div class="app-shell">
    <div class="app-pane">
    <div class="pilot-banner" hidden aria-hidden="true"></div>
    <div id="chromeOperatorTray" class="chrome-operator-tray" hidden>
      <button type="button" class="theme-cycle-btn" id="themeCycleBtn" title="Theme: dark ? tap to cycle">Inverse</button>
      <span class="eod-version-badge" id="eodVersionBadge" title="Tap to toggle test mode ? long-press to force Update">v3.4.20</span>
    </div>
    <div id="updateBanner" class="eod-update-banner" hidden></div>
    <div id="authBanner" class="auth-banner" hidden></div>
    <div id="connToast" class="conn-toast" hidden></div>

    <div id="pilotSignIn" class="card pilot-signin" hidden>
      <h1>Sign in</h1>
      <p class="muted">
        On localhost, Dump Bin login does not carry over. Prefer
        <a class="pilot-hosted-link" href="https://the-dump-bin.com/eod-field-app/">the hosted app</a>.
      </p>
      <div id="pilotAuthStatus" class="notice notice-error" hidden></div>
      <div class="field">
        <label for="pilotAuthEmail">Email</label>
        <input type="email" id="pilotAuthEmail" autocomplete="username" placeholder="you@example.com">
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="pilotAuthSmsBtn">Text me a PIN</button>
        <button type="button" class="btn btn-secondary" id="pilotAuthEmailBtn">Email me a link</button>
      </div>
      <div class="field" id="pilotAuthPinRow" hidden style="margin-top:12px;">
        <label for="pilotAuthPin">6-digit PIN</label>
        <input type="text" id="pilotAuthPin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
        <button type="button" class="btn btn-success btn-block" id="pilotAuthVerifyBtn" style="margin-top:8px;">Verify &amp; sign in</button>
      </div>
      <hr style="border:0;border-top:1px solid #334155;margin:16px 0;">
      <div class="field">
        <label for="pilotAuthPaste">Or paste session JWT / magic-link URL</label>
        <textarea id="pilotAuthPaste" rows="3" placeholder="eyJ? or full magic-link URL"></textarea>
        <button type="button" class="btn btn-secondary btn-block" id="pilotAuthPasteBtn" style="margin-top:8px;">Use pasted token</button>
      </div>
      <button type="button" class="btn btn-secondary" id="pilotAuthSignOut" style="margin-top:8px;">Sign out</button>
    </div>

    <header id="appChrome" hidden>
      <div class="chrome-row chrome-row-top">
        <div class="chrome-store" id="chromeStore">No store</div>
        <button type="button" class="chrome-scan-btn" id="chromeScanBtn" title="Scan UPC" aria-label="Scan UPC">
          <svg class="chrome-scan-ico" viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <clipPath id="chromeScanLensClip">
                <circle cx="16.05" cy="11" r="4.55"/>
              </clipPath>
            </defs>
            <g class="chrome-scan-bars">
              <rect x="1.35" y="4.4" width="1.15" height="15.2"/>
              <rect x="3.15" y="4.4" width="0.7" height="15.2"/>
              <rect x="4.55" y="4.4" width="1.55" height="15.2"/>
              <rect x="6.65" y="4.4" width="0.7" height="15.2"/>
              <rect x="8" y="4.4" width="1.2" height="15.2"/>
              <rect x="9.9" y="4.4" width="0.6" height="15.2"/>
              <rect x="11.15" y="4.4" width="1.45" height="15.2"/>
              <rect x="13.2" y="4.4" width="0.7" height="15.2"/>
              <rect x="14.5" y="4.4" width="1.15" height="15.2"/>
              <rect x="16.25" y="4.4" width="0.65" height="15.2"/>
              <rect x="17.5" y="4.4" width="1.35" height="15.2"/>
            </g>
            <circle class="chrome-scan-lens" cx="16.05" cy="11" r="5.15"/>
            <g class="chrome-scan-bars chrome-scan-bars-mag" clip-path="url(#chromeScanLensClip)">
              <g transform="translate(16.05 11) scale(1.18) translate(-16.05 -11)">
                <rect x="1.35" y="4.4" width="1.15" height="15.2"/>
                <rect x="3.15" y="4.4" width="0.7" height="15.2"/>
                <rect x="4.55" y="4.4" width="1.55" height="15.2"/>
                <rect x="6.65" y="4.4" width="0.7" height="15.2"/>
                <rect x="8" y="4.4" width="1.2" height="15.2"/>
                <rect x="9.9" y="4.4" width="0.6" height="15.2"/>

                <rect x="13.2" y="4.4" width="0.7" height="15.2"/>
                <rect x="14.5" y="4.4" width="1.15" height="15.2"/>
                <rect x="16.25" y="4.4" width="0.65" height="15.2"/>
                <rect x="17.5" y="4.4" width="1.35" height="15.2"/>
              </g>
            </g>
            <path class="chrome-scan-gleam" d="M12.95 7.45a4.6 4.6 0 0 1 5.7 1.05"/>
            <circle class="chrome-scan-ring" cx="16.05" cy="11" r="5.15"/>
            <path class="chrome-scan-handle" d="M19.7 14.65 22.35 18.15"/>
          </svg>
        </button>
        <span class="pill warn" id="chromeGate" hidden>Confirm</span>
        <div class="chrome-conn" id="chromeConn">
        <div class="chrome-dots" id="chromeDots" aria-label="Connection status">
          <button type="button" class="conn-dot" id="sasConnDot" data-state="unknown" title="SAS auth: checking?">
            <span class="dot"></span>SAS
          </button>
          <button type="button" class="conn-dot" id="reboticsConnDot" data-state="unknown" title="SI / Rebotics auth: checking?">
            <span class="dot"></span>SI
          </button>
        </div>
        </div>
      </div>
      <div class="chrome-row chrome-row-meta">
        <div class="chrome-meta" id="chromeMeta"></div>
      </div>
      <div class="chrome-workflow" id="chromeWorkflow" aria-label="Current section">
        <button type="button" class="chrome-next" id="chromeNextAction" hidden></button>
      </div>
    </header>

    <div id="eodForceLiveRow" class="force-live-row" hidden>
      <label>
        <input type="checkbox" id="eodForceLiveCb">
        Live delivery path (real recipients ? test mode only)
      </label>
    </div>

    <main id="appMount" tabindex="-1"></main>
    <div id="eodStatusLive" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="sectionNavHost"></div>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="Primary">
      <button type="button" class="nav-collapse-btn" id="navCollapseBtn" aria-expanded="true" title="Collapse navigation">«</button>
      <button type="button" id="navOverlayBack" hidden aria-label="Back">
        <span class="nav-ico" aria-hidden="true">←</span>
        <span class="nav-label">Back</span>
      </button>
      <button type="button" data-nav="visit" data-slot="stage"><img class="nav-ico-img" src="icons/nav/visit.png?v=3.4.20" alt="" width="28" height="28"><span class="nav-label">Visit</span></button>
      <button type="button" data-nav="signoff"><img class="nav-ico-img" src="icons/nav/categories.png?v=3.4.20" alt="" width="28" height="28"><span class="nav-label">Categories</span></button>
      <button type="button" data-nav="signatures" data-slot="stage"><img class="nav-ico-img" src="icons/nav/signatures.png?v=3.4.20" alt="" width="28" height="28"><span class="nav-label">Signatures</span></button>
      <button type="button" data-nav="send" data-slot="stage"><img class="nav-ico-img" src="icons/nav/send.png?v=3.4.20" alt="" width="28" height="28"><span class="nav-label">Send</span></button>
      <button type="button" data-nav="crew" data-slot="extra"><img class="nav-ico-img" src="icons/nav/crew.png?v=3.4.20" alt="" width="28" height="28"><span class="nav-label">Crew</span></button>
      <button type="button" data-nav="dumpbin" data-slot="extra"><img class="nav-ico-img" src="icons/nav/dumpbin.png?v=3.4.20" alt="" width="28" height="28"><span class="nav-label">Dump Bin</span></button>
      <button type="button" data-nav="helpdesk" data-slot="extra"><img class="nav-ico-img" src="icons/nav/helpdesk.png?v=3.4.20" alt="" width="28" height="28"><span class="nav-label">Helpdesk</span></button>
      <button type="button" data-nav="more" data-slot="phone-more" aria-label="More">
        <svg class="nav-ico-img nav-hamburger" viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">

          <rect x="6" y="8" width="16" height="2.4" rx="1.2" fill="#fff"/>

          <rect x="6" y="17.6" width="16" height="2.4" rx="1.2" fill="#fff"/>
        </svg>
        <span class="nav-label">More</span>
      </button>
    </nav>

      <img class="eod-buffering-gif" src="assets/buffering.gif?v=3.4.20" alt="" width="104" height="104" decoding="async">
      <div class="eod-buffering-check" aria-hidden="true">&#10003;</div>
      <div class="eod-buffering-title" id="eodBusyTitle">buffering</div>
      <div class="eod-buffering-subtitle" id="eodBusySubtitle" hidden></div>
      <button type="button" class="btn btn-secondary eod-buffering-cancel" id="eodBusyCancel" hidden>Cancel</button>
    </div>
  </div>

  <div id="instaworkBufferOverlay" class="iw-overlay" data-state="saving">

      <div id="iwOverlayTitle" class="iw-overlay-title">Saving InstaWork sign-out sheet&hellip;</div>
