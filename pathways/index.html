<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pathways</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/pathways/assets/pathways.css?v=6" />
  <script src="/auth-gate.js"></script>
</head>
<body>
  <header class="brand-bar">
    <div class="brand-inner">
      <h1>Pathways</h1>
      <span class="muted" id="when"></span>
    </div>
  </header>
  <main class="wrap">
    <div class="tabs">
      <button type="button" id="tabCompliance" class="tab active">Compliance</button>
      <button type="button" id="tabPayouts" class="tab">Payouts</button>
      <button type="button" id="tabTerminated" class="tab">Terminated</button>
    </div>
    <div class="actions">
      <button type="button" id="pullNow" class="action">Pull now</button>
    </div>
    <pre id="log" class="log" hidden></pre>
    <p class="error" id="error" hidden></p>
    <section id="compliance"></section>
    <section id="payouts" hidden></section>
    <section id="terminated" hidden></section>
  </main>
  <script src="/pathways/assets/pathways.js?v=6"></script>
</body>
</html>
