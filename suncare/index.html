<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F5A623">
  <meta name="description" content="Suncare POG Lookup for field merchandising teams">
  <title>Suncare POG Lookup</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Site-wide nav (inline styles to avoid conflicts with suncare styles.css) -->
  <nav style="position:sticky;top:0;z-index:9999;background:#2c2c2c;border-bottom:1px solid #505050;height:48px;display:flex;align-items:center;padding:0 16px;">
    <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
      <img src="/logo.png" alt="Home" style="height:28px;width:auto;">
      <span style="color:#b0b0b0;font-size:.85rem;font-weight:600;font-family:system-ui,sans-serif;">Home</span>
    </a>
  </nav>

  <div id="app">
    <!-- Views will be injected here -->
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs';
    window.pdfjsLib = pdfjsLib;
    window.dispatchEvent(new Event('pdfjsReady'));
  </script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker: Registered (Scope: ' + reg.scope + ')'))
          .catch(err => console.log('Service Worker: Error: ' + err));
      });
    }
  </script>
  <script data-goatcounter="https://d6ewa-supervisor.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
