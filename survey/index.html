<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f5c8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Division 701 Store Survey · Retail Odyssey</title>
<link rel="icon" href="/survey/assets/ro-logo.png">
<script src="/auth-gate.js"></script>
<style>
  :root{
    --ink:#1a2430; --ink-soft:#5c6b7a; --line:#d5dde6; --paper:#eef2f6; --card:#fff;
    --accent:#0f5c8c; --accent-deep:#0a4063; --accent-soft:#e3eef6; --good:#2e7d52; --saved:#2e7d52; --danger:#b3402a;
    --tap:48px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;overscroll-behavior:none}
  body{
    margin:0;min-height:100%;background:var(--paper);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:16px;line-height:1.4;
    overscroll-behavior-y:none;touch-action:pan-y;
    padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));
  }
  .brandbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,#fff,#f7fafc);
    border-bottom:2px solid var(--accent);
    padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top,0px));
  }
  .brandbar .top{display:flex;align-items:center;gap:10px}
  .brand-logo{height:34px;width:auto}
  .brand-titles{flex:1;min-width:0}
  .brand-titles .co{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .brand-titles h1{font-size:14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #save-state{font-size:11px;color:var(--ink-soft);text-align:right;max-width:34%}
  #save-state.saved{color:var(--saved);font-weight:600}
  #save-state.warn{color:var(--danger);font-weight:600}
  .progress{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#1a8fbf);width:0;transition:width .2s}
  main{max-width:560px;margin:0 auto;padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .qtext{font-weight:600;margin-bottom:12px;line-height:1.35;font-size:17px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opts.row{flex-direction:row;flex-wrap:wrap}
  .opt{
    border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;
    font-size:16px;cursor:pointer;min-height:var(--tap);text-align:left;
    touch-action:manipulation;user-select:none;width:100%;
  }
  .opts.row .opt{width:auto;min-width:88px;text-align:center}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600;color:var(--accent-deep)}
  textarea,input[type=text],select{
    width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;
    font-size:16px;font-family:inherit;background:#fff;
  }
  select{min-height:var(--tap)}
  textarea{min-height:72px;resize:vertical}
  .hint{font-size:13px;color:var(--ink-soft);margin-top:8px}
  .note{font-size:13px;color:var(--ink-soft);background:#f0f6fa;border:1px solid #d0e0ec;border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.45}
  .chip{
    display:inline-block;border:1px dashed var(--accent);color:var(--accent);
    border-radius:16px;padding:8px 12px;font-size:13px;cursor:pointer;background:#fff;
    margin:4px 4px 0 0;touch-action:manipulation;
  }
  details.comment{margin-top:12px}
  details.comment summary{font-size:14px;color:var(--accent);cursor:pointer;list-style:none;min-height:40px;display:flex;align-items:center}
  details.comment summary::before{content:"+ ";font-weight:700}
  details.comment[open] summary::before{content:"− "}
  .photo-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .photo-row img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .photo-add{
    border:1.5px dashed var(--line);border-radius:10px;width:72px;height:72px;
    display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink-soft);background:#fff;cursor:pointer;
  }
  .thumb{position:relative}
  .thumb button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--danger);color:#fff;border:0;font-size:16px}
  nav.stepnav{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:rgba(255,255,255,.97);border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
    display:flex;gap:10px;align-items:center;
  }
  nav.stepnav button{
    min-height:44px;font-size:15px;font-weight:600;border-radius:10px;border:0;cursor:pointer;touch-action:manipulation;
    padding:0 16px;
  }
  #btn-back{background:#fff;border:1.5px solid var(--accent);color:var(--accent);flex:0 0 auto}
  #btn-next{background:var(--accent);color:#fff;flex:1}
  #btn-next:disabled{background:#9bb6c9;cursor:not-allowed}
  #btn-next.submit{background:var(--good)}
  .store-grid{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;-webkit-overflow-scrolling:touch}
  .store-row{
    display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);
    border-radius:12px;background:#fff;cursor:pointer;min-height:var(--tap);
  }
  .store-row.suggested{border-color:#9ec3dc;background:#f5fafd}
  .store-row.selected{border-color:var(--accent);background:var(--accent-soft)}
  .store-row input{width:20px;height:20px;flex-shrink:0}
  .eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .filters label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:4px}
  .sel-section{margin-top:4px}
  .sel-section + .sel-section{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .sel-section h2{
    font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin:0 0 10px;
  }
  .sel-list{display:flex;flex-direction:column;gap:8px}
  .sel-item{
    display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;
    border:1.5px solid var(--accent);border-radius:12px;background:var(--accent-soft);min-height:var(--tap);
  }
  .sel-item .meta{flex:1;min-width:0}
  .sel-item .meta strong{display:block}
  .sel-item .tag{
    display:inline-block;font-size:11px;font-weight:600;color:var(--accent-deep);
    background:#fff;border:1px solid #9ec3dc;border-radius:999px;padding:2px 8px;margin-top:4px;
  }
  .sel-item .tag.draft{border-color:#c9b27a;color:#7a5c12}
  .sel-item .tag.submitted{border-color:#7ab894;color:var(--good)}
  .sel-remove{
    flex-shrink:0;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;color:var(--danger);font-size:20px;line-height:1;cursor:pointer;touch-action:manipulation;
  }
  .sel-empty{font-size:14px;color:var(--ink-soft);padding:8px 0}
  .add-store{display:flex;flex-direction:column;gap:10px}
  .add-store label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:4px}
  .add-store .add-row{display:flex;gap:8px;align-items:stretch}
  .add-store .add-row select{flex:1}
  #btn-add-store{
    min-height:var(--tap);padding:0 16px;border:0;border-radius:12px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  #btn-add-store:disabled{background:#9bb6c9;cursor:not-allowed}
  .suggest-wrap{position:relative}
  .suggest-list{
    position:absolute;left:0;right:0;top:100%;z-index:8;background:#fff;border:1px solid var(--line);
    border-radius:10px;max-height:180px;overflow:auto;display:none;box-shadow:0 8px 20px rgba(0,0,0,.1);
  }
  .suggest-list.open{display:block}
  .suggest-list button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:12px;font-size:15px;border-bottom:1px solid var(--line)}
  .cross-bar{margin-top:10px}
  .meta-line{font-size:13px;color:var(--ink-soft);margin-bottom:8px}
  button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="brandbar">
  <div class="top">
    <img class="brand-logo" src="/survey/assets/ro-logo.png" alt="Retail Odyssey" width="120" height="34">
    <div class="brand-titles">
      <div class="co">Retail Odyssey</div>
      <h1 id="hdr-title">Store Survey</h1>
    </div>
    <span id="save-state" role="status" aria-live="polite"></span>
  </div>
  <div class="progress" aria-hidden="true"><i id="prog"></i></div>
</header>
<main id="main"></main>
<nav class="stepnav" id="stepnav" hidden>
  <button type="button" id="btn-back">Back</button>
  <button type="button" id="btn-next" disabled>Next</button>
</nav>

<script>
(function () {
'use strict';

const ASSET = '/survey/assets';
const SECTION_ART = {};
'ABCDEFGHIJK'.split('').forEach((id) => { SECTION_ART[id] = ASSET + '/section-' + id + '.jpg'; });

function resolveApiBase() {
  const h = (location.hostname || '').toLowerCase();
  if (h === 'localhost' || h === '127.0.0.1') return 'http://localhost:3001';
  return 'https://eod-api.the-dump-bin.com';
}
const API = resolveApiBase();
const sessionTok = () =>
  (window.dumpBinAuth && window.dumpBinAuth.getSession && window.dumpBinAuth.getSession())
  || localStorage.getItem('dumpBinSession')
  || '';

const authHeaders = () => ({
  Authorization: 'Bearer ' + sessionTok(),
  'Content-Type': 'application/json',
});

async function api(path, opts = {}) {
  const r = await fetch(API + path, { headers: authHeaders(), ...opts });
  if (r.status === 401) {
    location.href = '/signin.html?next=' + encodeURIComponent(location.pathname + location.search);
    throw new Error('auth');
  }
  return r.json();
}

const $ = (s) => document.querySelector(s);
const main = $('#main');

// Phase: 'pick' | 'survey' | 'done'
let ME = null, SPEC = null, PHASE = 'pick';
let SELECTED_STORE = null; // single store preselect / override
let STORE = null;
let FLAT = []; // flattened visible questions for current store
let QINDEX = 0;
let ANSWERS = {};
let PHOTOS = [];
let BASELINE = {};
let SUGGESTIONS = { byQuestion: {}, crossStoreAnswers: {} };
let dirty = false, saveTimer = null, saving = false;
let addDistrict = '', addStorePick = '';

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }

function flattenQuestions(spec, answers) {
  const out = [];
  for (const sec of spec.sections || []) {
    for (const q of sec.questions || []) {
      out.push({ ...q, section: sec.id, sectionTitle: sec.title });
      for (const b of q.branches || []) {
        const w = Array.isArray(b.when) ? b.when : [b.when];
        const v = answers[q.id];
        if (v != null && w.includes(v)) {
          out.push({ ...b, section: sec.id, sectionTitle: sec.title, parent: q.id });
        }
      }
    }
  }
  return out;
}

function isAnswered(q) {
  if (q.optional) return true;
  const v = ANSWERS[q.id];
  if (v == null || v === '') return false;
  if (Array.isArray(v) && !v.length) return false;
  if (q.detailOn && v === q.detailOn) {
    const d = ANSWERS[q.id + '_d'];
    if (d == null || String(d).trim() === '') return false;
  }
  return true;
}

function setProgress() {
  if (PHASE !== 'survey' || !FLAT.length) {
    $('#prog').style.width = '0';
    return;
  }
  const pct = Math.round(((QINDEX) / Math.max(FLAT.length, 1)) * 100);
  $('#prog').style.width = Math.min(100, pct) + '%';
}

function setSave(msg, cls) {
  const el = $('#save-state');
  el.textContent = msg || '';
  el.className = cls || '';
}

function markDirty() {
  dirty = true;
  setSave('Saving…', '');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveDraft(false), 600);
}

async function saveDraft(submit) {
  if (!STORE) return null;
  clearTimeout(saveTimer);
  if (saving) return null;
  saving = true;
  try {
    const r = await api(`/api/survey/stores/${STORE}/response`, {
      method: 'PUT',
      body: JSON.stringify({
        answers: ANSWERS,
        photos: PHOTOS.map((p) => ({ id: p.id, questionId: p.question_id })),
        submit: !!submit,
      }),
    });
    dirty = false;
    setSave(submit ? 'Submitted ✓' : 'Saved ✓', 'saved');
    return r;
  } catch (e) {
    setSave('Offline — retrying', 'warn');
    saveTimer = setTimeout(() => saveDraft(submit), 4000);
    return null;
  } finally {
    saving = false;
  }
}

// ─── Store picker (today's schedule prefill + district/store override) ───────
function storeMetaMap() {
  const map = new Map();
  const catalog = ME.catalog || { stores: [] };
  const detailList = ME.storeDetails || [];
  for (const s of (catalog.stores || [])) {
    map.set(Number(s.storeNum), {
      storeNum: Number(s.storeNum),
      district: s.district || '?',
      status: null,
      suggested: false,
    });
  }
  for (const s of detailList) {
    const sn = Number(s.storeNum);
    const prev = map.get(sn) || { storeNum: sn, district: s.district || '?', suggested: false };
    map.set(sn, {
      ...prev,
      district: s.district || prev.district || '?',
      status: s.status || null,
      suggested: !!(s.suggested || prev.suggested),
    });
  }
  const suggested = ME.suggestedStores || [];
  for (const sn of suggested) {
    const n = Number(sn);
    const prev = map.get(n) || { storeNum: n, district: '?', status: null };
    map.set(n, { ...prev, suggested: true });
  }
  return map;
}

function formatScheduleDate(iso) {
  if (!iso) return '';
  try {
    const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
  } catch {
    return String(iso);
  }
}

function renderPicker() {
  PHASE = 'pick';
  STORE = null;
  FLAT = [];
  QINDEX = 0;
  setProgress();
  $('#stepnav').hidden = true;
  $('#hdr-title').textContent = 'Store Survey';

  const catalog = ME.catalog || { districts: [], teams: [], stores: [] };
  const scheduleDate = ME.scheduleDate || '';
  const primary = ME.primaryStore != null
    ? Number(ME.primaryStore)
    : (ME.suggestedStores && ME.suggestedStores.length ? Number(ME.suggestedStores[0]) : null);
  if (SELECTED_STORE == null && Number.isFinite(primary)) {
    SELECTED_STORE = primary;
  }
  if (SELECTED_STORE != null) SELECTED_STORE = Number(SELECTED_STORE);

  const meta = storeMetaMap();
  const allStores = catalog.stores || ME.storeDetails || [];
  const districts = (catalog.districts && catalog.districts.length)
    ? catalog.districts
    : [...new Set(allStores.map((s) => s.district).filter(Boolean))].sort();

  // Sync district dropdown to selected store when possible
  if (SELECTED_STORE != null && !addDistrict) {
    const m = meta.get(SELECTED_STORE);
    if (m && m.district && m.district !== '?') addDistrict = String(m.district);
  }
  if (addDistrict && !districts.map(String).includes(String(addDistrict))) addDistrict = '';

  const districtStores = addDistrict
    ? allStores
        .filter((s) => String(s.district) === String(addDistrict))
        .map((s) => Number(s.storeNum))
        .filter((n) => Number.isFinite(n))
        .sort((a, b) => a - b)
    : [];
  if (addStorePick && !districtStores.includes(Number(addStorePick))) {
    addStorePick = (SELECTED_STORE != null && districtStores.includes(SELECTED_STORE))
      ? String(SELECTED_STORE)
      : '';
  } else if (!addStorePick && SELECTED_STORE != null && districtStores.includes(SELECTED_STORE)) {
    addStorePick = String(SELECTED_STORE);
  }

  const distOpts = districts.map((d) =>
    `<option value="${escAttr(d)}" ${String(addDistrict) === String(d) ? 'selected' : ''}>District ${esc(d)}</option>`
  ).join('');
  const storeOpts = districtStores.map((sn) =>
    `<option value="${sn}" ${Number(addStorePick) === sn || SELECTED_STORE === sn ? 'selected' : ''}>Store ${sn}</option>`
  ).join('');

  const fromSchedule = SELECTED_STORE != null && (
    Number(ME.primaryStore) === SELECTED_STORE
    || (ME.suggestedStores || []).map(Number).includes(SELECTED_STORE)
  );
  const mSel = SELECTED_STORE != null ? (meta.get(SELECTED_STORE) || {}) : {};
  const tags = [];
  if (fromSchedule) tags.push('<span class="tag">today\'s schedule</span>');
  if (mSel.status === 'draft') tags.push('<span class="tag draft">draft</span>');
  if (mSel.status === 'submitted') tags.push('<span class="tag submitted">submitted</span>');

  const selectionHtml = SELECTED_STORE != null
    ? `<div class="sel-item" data-store="${SELECTED_STORE}">
          <div class="meta">
            <strong>Store ${SELECTED_STORE}</strong>
            <span class="hint">District ${esc(mSel.district || '?')}</span>
            ${tags.length ? `<div>${tags.join(' ')}</div>` : ''}
          </div>
          <button type="button" class="sel-remove" data-clear="1" aria-label="Clear store selection">×</button>
        </div>`
    : '<div class="sel-empty">No store selected yet. Choose a district and store below.</div>';

  const noteHtml = fromSchedule && SELECTED_STORE != null
    ? `Based on today's schedule${scheduleDate ? ' (' + esc(formatScheduleDate(scheduleDate)) + ')' : ''}, <strong>Store ${SELECTED_STORE}</strong> was pre-selected for you. If this is incorrect, please adjust using the district and store dropdowns below.`
    : scheduleDate
      ? `No store was found on today's schedule${scheduleDate ? ' (' + esc(formatScheduleDate(scheduleDate)) + ')' : ''} for your name. Please select your district and store below.`
      : 'Please select your district and store below.';

  const storeSelectDisabled = !addDistrict;
  const storePlaceholder = !addDistrict
    ? 'Select a district first'
    : (districtStores.length ? 'Select a store' : 'No stores in this district');

  main.innerHTML = `
    <div class="card">
      <div class="eyebrow">Division 701</div>
      <div class="qtext" style="margin-bottom:8px">Which store are you surveying today?</div>
      <div class="note">${noteHtml}</div>

      <div class="sel-section">
        <h2>Your store selection</h2>
        <div class="sel-list" id="sel-list">${selectionHtml}</div>
        <p class="hint" style="margin-top:10px">One store per visit. You can change it any time before you start.</p>
      </div>

      <div class="sel-section">
        <h2>Change store</h2>
        <div class="add-store">
          <div>
            <label for="f-dist">District</label>
            <select id="f-dist">
              <option value="">Select district…</option>
              ${distOpts}
            </select>
          </div>
          <div>
            <label for="f-store">Store in district</label>
            <div class="add-row">
              <select id="f-store" ${storeSelectDisabled ? 'disabled' : ''}>
                <option value="">${esc(storePlaceholder)}</option>
                ${storeOpts}
              </select>
              <button type="button" id="btn-add-store" ${!addStorePick ? 'disabled' : ''}>Use store</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;

  $('#f-dist').onchange = (e) => {
    addDistrict = e.target.value;
    addStorePick = '';
    renderPicker();
  };
  $('#f-store').onchange = (e) => {
    addStorePick = e.target.value;
    const btn = $('#btn-add-store');
    if (btn) btn.disabled = !addStorePick;
  };
  $('#btn-add-store').onclick = () => {
    const sn = Number(addStorePick);
    if (!Number.isFinite(sn)) return;
    SELECTED_STORE = sn;
    renderPicker();
  };
  main.querySelectorAll('[data-clear]').forEach((btn) => {
    btn.onclick = () => {
      SELECTED_STORE = null;
      addStorePick = '';
      renderPicker();
    };
  });

  $('#stepnav').hidden = false;
  $('#btn-back').textContent = 'Clear';
  $('#btn-next').textContent = 'Start survey';
  updatePickerNext();
}

function updatePickerNext() {
  const btn = $('#btn-next');
  if (PHASE === 'pick') {
    btn.disabled = SELECTED_STORE == null;
    btn.className = '';
    btn.textContent = SELECTED_STORE != null
      ? 'Start · Store ' + SELECTED_STORE
      : 'Start survey';
  }
}

async function startSelectedStores() {
  if (SELECTED_STORE == null) return;
  await openStore(SELECTED_STORE);
}

async function openStore(storeNum) {
  STORE = storeNum;
  PHASE = 'survey';
  const ctx = await api(`/api/survey/stores/${storeNum}/context`);
  ANSWERS = ctx.myResponse ? { ...ctx.myResponse.answers } : {};
  const ph = await api(`/api/survey/stores/${storeNum}/photos`);
  PHOTOS = (ph.photos || []).filter((p) => p.respondent === ME.user.email);
  BASELINE = {};
  for (const b of ctx.baseline || []) Object.assign(BASELINE, b.answers || {});
  SUGGESTIONS = ctx.suggestions || ME.suggestions || { byQuestion: {}, crossStoreAnswers: {} };
  rebuildFlat();
  // Resume at first unanswered required question
  QINDEX = 0;
  for (let i = 0; i < FLAT.length; i++) {
    if (!isAnswered(FLAT[i])) { QINDEX = i; break; }
    QINDEX = i;
  }
  if (FLAT.every(isAnswered) && FLAT.length) QINDEX = FLAT.length; // review
  renderQuestion();
}

function rebuildFlat() {
  FLAT = flattenQuestions(SPEC, ANSWERS);
}

// ─── One question at a time (no full-page jump) ──────────────────────────────
function renderQuestion() {
  PHASE = 'survey';
  setProgress();
  $('#stepnav').hidden = false;
  $('#btn-back').textContent = QINDEX <= 0 ? 'Change store' : 'Back';

  if (QINDEX >= FLAT.length) {
    renderReview();
    return;
  }

  const q = FLAT[QINDEX];
  $('#hdr-title').textContent = `Store ${STORE} · ${q.section}`;
  $('#btn-next').textContent = QINDEX >= FLAT.length - 1 ? 'Review' : 'Next';
  $('#btn-next').className = '';
  $('#btn-next').disabled = !isAnswered(q);

  const art = SECTION_ART[q.section] || ASSET + '/ro-logo.png';
  const body = questionBody(q);
  const photo = photoBlock(q);
  const comment = commentBlock(q);
  const cross = crossStoreChips(q);
  const base = baselineChip(q);

  // In-place update: replace main content without scrollTo(0)
  main.innerHTML = `
    <div class="card" id="q-card">
      <div class="meta-line">Question ${QINDEX + 1} of ${FLAT.length} · ${esc(q.sectionTitle || q.section)}</div>
      <div class="eyebrow">Store ${STORE}</div>
      <div class="qtext">${esc(q.id.replace(/^Q/, '') + '. ' + q.text)}${q.optional ? ' <span class="hint">(optional)</span>' : ''}</div>
      ${body}
      ${base}
      ${cross}
      ${photo}
      ${comment}
    </div>`;

  wireQuestion(q);
  // Keep focus near question — only scroll if card is way off screen
  const card = $('#q-card');
  if (card) {
    const rect = card.getBoundingClientRect();
    if (rect.top < 80 || rect.top > window.innerHeight * 0.55) {
      card.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
  }
}

function examplesBlock(examples, label) {
  if (!examples || !examples.length) return '';
  const title = label || 'Examples';
  return `<div class="note" style="margin-top:10px">
    <div style="font-weight:600;margin-bottom:6px">${esc(title)}</div>
    <ul style="margin:0;padding-left:18px">
      ${examples.map((ex) => `<li style="margin-bottom:4px">${esc(ex)}</li>`).join('')}
    </ul>
  </div>`;
}

function questionBody(q) {
  if (q.type === 'yesno' || q.type === 'choice') {
    const opts = q.type === 'yesno' ? ['Yes', 'No'] : (q.options || []);
    const cls = opts.length <= 4 ? 'opts row' : 'opts';
    let html = `<div class="${cls}" role="group">` +
      opts.map((o) =>
        `<button type="button" class="opt" data-q="${q.id}" data-val="${escAttr(o)}" aria-pressed="${ANSWERS[q.id] === o}">${esc(o)}</button>`
      ).join('') + '</div>';
    if (q.detailOn && ANSWERS[q.id] === q.detailOn) {
      const ph = q.detailPlaceholder || 'Please explain / name';
      html += `<div class="suggest-wrap" style="margin-top:10px"><input type="text" data-tq="${q.id}_d" value="${escAttr(ANSWERS[q.id + '_d'] || '')}" placeholder="${escAttr(ph)}" autocomplete="off"></div>`;
      html += examplesBlock(q.detailExamples, q.detailExamplesLabel || 'Suggestions');
    }
    return html;
  }
  if (q.type === 'multiselect') {
    const cur = ANSWERS[q.id] || [];
    return `<div class="opts">` +
      (q.options || []).map((o) =>
        `<button type="button" class="opt" data-mq="${q.id}" data-val="${escAttr(o)}" aria-pressed="${cur.includes(o)}">${esc(o)}</button>`
      ).join('') + '</div>';
  }
  const ph = q.placeholder || 'Type your answer';
  return examplesBlock(q.examples, q.examplesLabel || 'Examples') +
    `<div class="suggest-wrap"><input type="text" data-tq="${q.id}" value="${escAttr(ANSWERS[q.id] || '')}" placeholder="${escAttr(ph)}" autocomplete="off"></div>`;
}

function commentBlock(q) {
  const key = q.id + '_c';
  const val = ANSWERS[key] || '';
  return `<details class="comment" ${val ? 'open' : ''}><summary>Add a comment</summary>
    <textarea data-comment="${q.id}" rows="2" placeholder="Optional notes for this answer">${esc(val)}</textarea>
  </details>`;
}

function photoBlock(q) {
  if (!q.photo) return '';
  const mine = PHOTOS.filter((p) => p.question_id === q.id);
  const tok = encodeURIComponent(sessionTok());
  return `<div class="note" style="margin-top:12px">A short description helps — a photo of the area is greatly appreciated when you can take one.</div>
    <div class="photo-row">
      ${mine.map((p) =>
        `<span class="thumb"><img src="${API}/api/survey/photos/${p.id}?access_token=${tok}" alt=""><button type="button" data-del="${p.id}" aria-label="Remove">×</button></span>`
      ).join('')}
      <button type="button" class="photo-add" data-add="${q.id}" aria-label="Add photo">📷</button>
    </div>`;
}

function baselineChip(q) {
  const b = BASELINE[q.id];
  if (b == null || ANSWERS[q.id] != null) return '';
  return `<div class="hint">2025: <button type="button" class="chip" data-chip="${q.id}" data-val="${escAttr(String(b))}">${esc(String(b))} — use this</button></div>`;
}

function crossStoreChips(q) {
  const cross = SUGGESTIONS.crossStoreAnswers || {};
  const chips = [];
  for (const [sn, ans] of Object.entries(cross)) {
    const v = ans[q.id];
    if (v == null || v === '' || (Array.isArray(v) && !v.length)) continue;
    const label = Array.isArray(v) ? v.join(', ') : String(v);
    if (label.length > 60) continue;
    chips.push(`<button type="button" class="chip" data-cross-store="${sn}" data-cross-q="${q.id}">Same as store ${esc(sn)}: ${esc(label)}</button>`);
  }
  if (!chips.length) return '';
  return `<div class="cross-bar"><div class="hint">Reuse an answer from another store you already surveyed:</div>${chips.join('')}</div>`;
}

function suggestionsFor(qid) {
  return (SUGGESTIONS.byQuestion && SUGGESTIONS.byQuestion[qid]) || [];
}

function wireTypeahead(input, qid) {
  const wrap = input.closest('.suggest-wrap') || input.parentElement;
  let panel = wrap.querySelector('.suggest-list');
  if (!panel) {
    panel = document.createElement('div');
    panel.className = 'suggest-list';
    wrap.appendChild(panel);
  }
  const all = suggestionsFor(qid);
  const show = (filter) => {
    const f = String(filter || '').toLowerCase();
    const opts = all.filter((v) => !f || String(v).toLowerCase().includes(f)).slice(0, 8);
    if (!opts.length) { panel.classList.remove('open'); panel.innerHTML = ''; return; }
    panel.innerHTML = opts.map((v) =>
      `<button type="button" data-val="${escAttr(String(v))}">${esc(String(v))}</button>`
    ).join('');
    panel.classList.add('open');
    panel.querySelectorAll('button').forEach((b) => {
      b.onmousedown = (e) => e.preventDefault();
      b.onclick = () => {
        input.value = b.dataset.val;
        ANSWERS[qid] = b.dataset.val;
        markDirty();
        panel.classList.remove('open');
        refreshNextEnabled();
      };
    });
  };
  input.addEventListener('focus', () => show(input.value));
  input.addEventListener('input', () => {
    ANSWERS[qid] = input.value;
    markDirty();
    show(input.value);
    refreshNextEnabled();
  });
  input.addEventListener('blur', () => setTimeout(() => panel.classList.remove('open'), 120));
}

function wireQuestion(q) {
  main.querySelectorAll('.opt[data-q]').forEach((b) => {
    b.onclick = () => {
      ANSWERS[b.dataset.q] = b.dataset.val;
      markDirty();
      // Re-render only this question card (branches may change) — stay in place
      const prevLen = FLAT.length;
      rebuildFlat();
      // If branch questions inserted after current, keep index on same q
      const idx = FLAT.findIndex((x) => x.id === q.id);
      if (idx >= 0) QINDEX = idx;
      renderQuestion();
      refreshNextEnabled();
    };
  });
  main.querySelectorAll('.opt[data-mq]').forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.mq, val = b.dataset.val;
      let cur = ANSWERS[id] || [];
      if (val === 'None') cur = cur.includes('None') ? [] : ['None'];
      else {
        cur = cur.filter((x) => x !== 'None');
        cur = cur.includes(val) ? cur.filter((x) => x !== val) : [...cur, val];
      }
      ANSWERS[id] = cur;
      markDirty();
      // Update pressed state in place without full rebuild when possible
      renderQuestion();
    };
  });
  main.querySelectorAll('input[data-tq]').forEach((i) => wireTypeahead(i, i.dataset.tq));
  main.querySelectorAll('textarea[data-comment]').forEach((t) => {
    t.oninput = () => { ANSWERS[t.dataset.comment + '_c'] = t.value; markDirty(); };
  });
  main.querySelectorAll('.chip[data-chip]').forEach((c) => {
    c.onclick = () => {
      ANSWERS[c.dataset.chip] = c.dataset.val;
      markDirty();
      rebuildFlat();
      renderQuestion();
    };
  });
  main.querySelectorAll('.chip[data-cross-store]').forEach((c) => {
    c.onclick = () => {
      const sn = c.dataset.crossStore;
      const qid = c.dataset.crossQ;
      const ans = (SUGGESTIONS.crossStoreAnswers || {})[sn] || {};
      if (ans[qid] != null) {
        ANSWERS[qid] = Array.isArray(ans[qid]) ? [...ans[qid]] : ans[qid];
        if (ans[qid + '_d'] != null) ANSWERS[qid + '_d'] = ans[qid + '_d'];
        if (ans[qid + '_c'] != null) ANSWERS[qid + '_c'] = ans[qid + '_c'];
        markDirty();
        rebuildFlat();
        renderQuestion();
      }
    };
  });
  main.querySelectorAll('[data-add]').forEach((b) => {
    b.onclick = () => addPhoto(b.dataset.add);
  });
  main.querySelectorAll('[data-del]').forEach((b) => {
    b.onclick = async () => {
      await api('/api/survey/photos/' + b.dataset.del, { method: 'DELETE' });
      PHOTOS = PHOTOS.filter((p) => p.id !== Number(b.dataset.del));
      markDirty();
      renderQuestion();
    };
  });
  refreshNextEnabled();
}

function refreshNextEnabled() {
  if (PHASE !== 'survey' || QINDEX >= FLAT.length) return;
  const q = FLAT[QINDEX];
  $('#btn-next').disabled = !isAnswered(q);
}

function renderReview() {
  $('#hdr-title').textContent = `Store ${STORE} · Review`;
  let answered = 0, total = 0;
  let html = '';
  rebuildFlat();
  FLAT.forEach((q, i) => {
    if (!q.optional) total++;
    const ok = isAnswered(q);
    if (ok && !q.optional) answered++;
    const v = ANSWERS[q.id];
    const disp = !ok
      ? '<span style="color:var(--danger)">Not answered</span>'
      : esc(Array.isArray(v) ? v.join(', ') : String(v ?? ''));
    html += `<button type="button" class="store-row" data-jump="${i}" style="width:100%">
      <span style="flex:1;text-align:left"><strong>${esc(q.id)}</strong> ${esc(q.text.slice(0, 48))}${q.text.length > 48 ? '…' : ''}<br><span class="hint">${disp}</span></span>
    </button>`;
  });
  main.innerHTML = `
    <div class="card">
      <div class="qtext">${answered} of ${total} required answered</div>
      <div class="hint">Tap any question to change it. Submitting updates this store — previous versions are kept in history.</div>
    </div>
    <div class="card" style="padding:8px">${html}</div>`;
  main.querySelectorAll('[data-jump]').forEach((b) => {
    b.onclick = () => { QINDEX = Number(b.dataset.jump); renderQuestion(); };
  });
  $('#btn-back').textContent = 'Back';
  $('#btn-next').textContent = 'Submit store';
  $('#btn-next').className = 'submit';
  $('#btn-next').disabled = false;
  setProgress();
}

function addPhoto(questionId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    setSave('Adding photo…', '');
    try {
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = rej;
        i.src = URL.createObjectURL(file);
      });
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const b64 = cv.toDataURL('image/jpeg', 0.72).split(',')[1];
      const r = await api(`/api/survey/stores/${STORE}/photos`, {
        method: 'POST',
        body: JSON.stringify({ questionId, mime: 'image/jpeg', data: b64 }),
      });
      if (r.ok) {
        PHOTOS.push({ ...r.photo, respondent: ME.user.email });
        markDirty();
        renderQuestion();
      } else setSave(r.error || 'Photo failed', 'warn');
    } catch {
      setSave('Photo failed', 'warn');
    }
  };
  input.click();
}

// ─── Nav ─────────────────────────────────────────────────────────────────────
$('#btn-back').onclick = async () => {
  if (PHASE === 'pick') {
    SELECTED_STORE = null;
    addStorePick = '';
    renderPicker();
    return;
  }
  await saveDraft(false);
  if (QINDEX <= 0) {
    // back to store picker; keep current selection
    renderPicker();
    return;
  }
  QINDEX--;
  // skip orphaned branch questions
  rebuildFlat();
  if (QINDEX >= FLAT.length) QINDEX = FLAT.length - 1;
  renderQuestion();
};

$('#btn-next').onclick = async () => {
  if (PHASE === 'pick') {
    await startSelectedStores();
    return;
  }
  if (QINDEX >= FLAT.length) {
    const r = await saveDraft(true);
    if (r && r.ok) {
      PHASE = 'done';
      $('#stepnav').hidden = true;
      main.innerHTML = `<div class="card">
          <div class="qtext">Store ${STORE} complete. ✓</div>
          <div class="hint">You can reopen this store later to update answers — history is kept automatically.</div>
          <button type="button" class="opt" id="again" style="margin-top:12px">Survey another store</button>
        </div>`;
      $('#again').onclick = () => {
        SELECTED_STORE = null;
        addDistrict = '';
        addStorePick = '';
        renderPicker();
      };
    }
    return;
  }
  const q = FLAT[QINDEX];
  if (!isAnswered(q)) return;
  await saveDraft(false);
  QINDEX++;
  rebuildFlat();
  // After answering, branch list may grow — clamp
  if (QINDEX > FLAT.length) QINDEX = FLAT.length;
  renderQuestion();
};

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && STORE) saveDraft(false);
});
window.addEventListener('beforeunload', (e) => {
  if (dirty && STORE) { e.preventDefault(); e.returnValue = ''; }
});

(async function init() {
  try {
    if (window.dumpBinAuthReady) await window.dumpBinAuthReady;
    const [me, q] = await Promise.all([api('/api/survey/me'), api('/api/survey/questions')]);
    if (!me.ok) {
      main.innerHTML = `<div class="card">${esc(me.error || 'Not on survey roster')}</div>`;
      return;
    }
    ME = me;
    SPEC = q.questionSet.spec;
    SUGGESTIONS = me.suggestions || { byQuestion: {}, crossStoreAnswers: {} };
    renderPicker();
  } catch (e) {
    console.error(e);
    main.innerHTML = `<div class="card">Could not load the survey. Check your connection.</div>`;
  }
})();
})();
</script>
</body>
</html>
