<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f5c8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Division 701 Store Survey · Retail Odyssey</title>
<link rel="icon" href="/survey/assets/ro-logo.png">
<script src="/auth-gate.js"></script>
<style>
  :root, [data-theme="light"]{
    --ink:#1a2430; --ink-soft:#5c6b7a; --line:#d5dde6; --paper:#eef2f6; --card:#fff;
    --accent:#0f5c8c; --accent-deep:#0a4063; --accent-soft:#e3eef6; --good:#2e7d52; --saved:#2e7d52; --danger:#b3402a;
    --bar-bg:linear-gradient(180deg,#fff,#f7fafc);
    --nav-bg:rgba(255,255,255,.97);
    --note-bg:#f0f6fa; --note-line:#d0e0ec;
    --opt-bg:#fff; --input-bg:#fff; --chip-bg:#fff;
    --tap:48px;
  }
  [data-theme="dark"]{
    --ink:#e8eef4; --ink-soft:#9aabba; --line:#2f4052; --paper:#0f1419; --card:#1a2330;
    --accent:#4aa3d9; --accent-deep:#8ec8ea; --accent-soft:#1a3348; --good:#4caf7a; --saved:#4caf7a; --danger:#e0705c;
    --bar-bg:linear-gradient(180deg,#15202b,#121a22);
    --nav-bg:rgba(18,26,34,.97);
    --note-bg:#152636; --note-line:#2a4258;
    --opt-bg:#1e2a38; --input-bg:#121a22; --chip-bg:#1e2a38;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;overscroll-behavior:none}
  body{
    margin:0;min-height:100%;background:var(--paper);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:16px;line-height:1.4;
    overscroll-behavior-y:none;touch-action:pan-y;
    padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));
  }
  .brandbar{
    position:sticky;top:0;z-index:20;
    background:var(--bar-bg);
    border-bottom:2px solid var(--accent);
    padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top,0px));
  }
  .brandbar .top{display:flex;align-items:center;gap:8px}
  .brand-logo{height:34px;width:auto}
  .brand-titles{flex:1;min-width:0}
  .brand-titles .co{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .brand-titles h1{font-size:14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .icon-btn{
    min-width:40px;min-height:40px;padding:0 10px;border-radius:10px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation;
    display:inline-flex;align-items:center;justify-content:center;gap:4px;
  }
  .icon-btn:active{transform:scale(.97)}
  #save-state{font-size:11px;color:var(--ink-soft);text-align:right;max-width:28%}
  #save-state.saved{color:var(--saved);font-weight:600}
  #save-state.warn{color:var(--danger);font-weight:600}
  .progress{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#1a8fbf);width:0;transition:width .2s}
  main{max-width:560px;margin:0 auto;padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .qtext{font-weight:600;margin-bottom:12px;line-height:1.35;font-size:17px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opts.row{flex-direction:row;flex-wrap:wrap}
  .opt{
    border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--opt-bg);
    font-size:16px;cursor:pointer;min-height:var(--tap);text-align:left;color:var(--ink);
    touch-action:manipulation;user-select:none;width:100%;
  }
  .opts.row .opt{width:auto;min-width:88px;text-align:center}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600;color:var(--accent-deep)}
  textarea,input[type=text],select{
    width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;
    font-size:16px;font-family:inherit;background:var(--input-bg);color:var(--ink);
  }
  select{min-height:var(--tap)}
  textarea{min-height:72px;resize:vertical}
  .hint{font-size:13px;color:var(--ink-soft);margin-top:8px}
  .note{font-size:13px;color:var(--ink-soft);background:var(--note-bg);border:1px solid var(--note-line);border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.45}
  .chip{
    display:inline-block;border:1px dashed var(--accent);color:var(--accent);
    border-radius:16px;padding:8px 12px;font-size:13px;cursor:pointer;background:var(--chip-bg);
    margin:4px 4px 0 0;touch-action:manipulation;
  }
  .chip.common{
    border-style:solid;font-weight:600;background:var(--accent-soft);color:var(--accent-deep);
  }
  .common-wrap{margin:0 0 12px}
  details.comment{margin-top:12px}
  details.comment summary{font-size:14px;color:var(--accent);cursor:pointer;list-style:none;min-height:40px;display:flex;align-items:center}
  details.comment summary::before{content:"+ ";font-weight:700}
  details.comment[open] summary::before{content:"− "}
  .photo-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .photo-row img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .photo-add{
    border:1.5px dashed var(--line);border-radius:10px;width:72px;height:72px;
    display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink-soft);background:var(--opt-bg);cursor:pointer;
  }
  .thumb{position:relative}
  .thumb button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--danger);color:#fff;border:0;font-size:16px}
  nav.stepnav{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:var(--nav-bg);border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
    display:flex;gap:10px;align-items:center;
  }
  nav.stepnav button{
    min-height:44px;font-size:15px;font-weight:600;border-radius:10px;border:0;cursor:pointer;touch-action:manipulation;
    padding:0 16px;
  }
  #btn-back{background:var(--card);border:1.5px solid var(--accent);color:var(--accent);flex:0 0 auto}
  #btn-next{background:var(--accent);color:#fff;flex:1}
  #btn-next:disabled{background:#9bb6c9;cursor:not-allowed;opacity:.75}
  #btn-next.submit{background:var(--good)}
  .store-row{
    display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);
    border-radius:12px;background:var(--opt-bg);cursor:pointer;min-height:var(--tap);color:var(--ink);width:100%;text-align:left;
  }
  .store-row.selected{border-color:var(--accent);background:var(--accent-soft)}
  .eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
  .sel-section{margin-top:4px}
  .sel-section + .sel-section{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .sel-section h2{
    font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin:0 0 10px;
  }
  .sel-list{display:flex;flex-direction:column;gap:8px}
  .sel-item{
    display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;
    border:1.5px solid var(--accent);border-radius:12px;background:var(--accent-soft);min-height:var(--tap);
  }
  .sel-item .meta{flex:1;min-width:0}
  .sel-item .meta strong{display:block}
  .sel-item .tag{
    display:inline-block;font-size:11px;font-weight:600;color:var(--accent-deep);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-top:4px;
  }
  .sel-item .tag.draft{border-color:#c9b27a;color:#c9a24a}
  .sel-item .tag.submitted{border-color:#7ab894;color:var(--good)}
  .sel-remove{
    flex-shrink:0;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--card);color:var(--danger);font-size:20px;line-height:1;cursor:pointer;touch-action:manipulation;
  }
  .sel-empty{font-size:14px;color:var(--ink-soft);padding:8px 0}
  .add-store{display:flex;flex-direction:column;gap:10px}
  .add-store label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:4px}
  .add-store .add-row{display:flex;gap:8px;align-items:stretch}
  .add-store .add-row select{flex:1}
  #btn-add-store,#btn-use-store{
    min-height:var(--tap);padding:0 16px;border:0;border-radius:12px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  #btn-add-store:disabled,#btn-use-store:disabled{background:#9bb6c9;cursor:not-allowed}
  .suggest-wrap{position:relative}
  .suggest-list{
    position:absolute;left:0;right:0;top:100%;z-index:8;background:var(--card);border:1px solid var(--line);
    border-radius:10px;max-height:180px;overflow:auto;display:none;box-shadow:0 8px 20px rgba(0,0,0,.2);
  }
  .suggest-list.open{display:block}
  .suggest-list button{display:block;width:100%;text-align:left;border:0;background:var(--card);color:var(--ink);padding:12px;font-size:15px;border-bottom:1px solid var(--line)}
  .cross-bar{margin-top:10px}
  .meta-line{font-size:13px;color:var(--ink-soft);margin-bottom:8px}
  .answer-row{
    display:flex;align-items:flex-start;gap:10px;padding:12px;border:1.5px solid var(--line);
    border-radius:12px;background:var(--opt-bg);cursor:pointer;min-height:var(--tap);width:100%;text-align:left;color:var(--ink);
    margin-bottom:8px;
  }
  .answer-row:active{border-color:var(--accent)}
  .answer-row .num{font-weight:700;color:var(--accent);min-width:2.2em}
  .answer-row .body{flex:1;min-width:0}
  .answer-row .q{font-weight:600;font-size:14px;line-height:1.3}
  .answer-row .a{font-size:13px;color:var(--ink-soft);margin-top:4px;word-break:break-word}
  .answer-row .a.empty{color:var(--danger)}
  .answer-row .edit-hint{font-size:11px;color:var(--accent);margin-top:4px;font-weight:600}
  .stack-actions{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .stack-actions .opt{text-align:center}
  button:focus-visible,.opt:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="brandbar">
  <div class="top">
    <button type="button" class="icon-btn" id="btn-home" title="Home — store selection" aria-label="Home">⌂ Home</button>
    <div class="brand-titles">
      <div class="co">Retail Odyssey</div>
      <h1 id="hdr-title">Store Survey</h1>
    </div>
    <div class="brand-actions">
      <button type="button" class="icon-btn" id="btn-theme" title="Toggle light/dark mode" aria-label="Toggle theme">Dark</button>
      <span id="save-state" role="status" aria-live="polite"></span>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><i id="prog"></i></div>
</header>
<main id="main"></main>
<nav class="stepnav" id="stepnav" hidden>
  <button type="button" id="btn-back">Back</button>
  <button type="button" id="btn-next" disabled>Next</button>
</nav>

<script>
(function () {
'use strict';

const ASSET = '/survey/assets';
const SECTION_ART = {};
'ABCDEFGHIJK'.split('').forEach((id) => { SECTION_ART[id] = ASSET + '/section-' + id + '.jpg'; });
const THEME_KEY = 'surveyTheme';

function resolveApiBase() {
  const h = (location.hostname || '').toLowerCase();
  if (h === 'localhost' || h === '127.0.0.1') return 'http://localhost:3001';
  return 'https://eod-api.the-dump-bin.com';
}
const API = resolveApiBase();
const sessionTok = () =>
  (window.dumpBinAuth && window.dumpBinAuth.getSession && window.dumpBinAuth.getSession())
  || localStorage.getItem('dumpBinSession')
  || '';

const authHeaders = () => ({
  Authorization: 'Bearer ' + sessionTok(),
  'Content-Type': 'application/json',
});

async function api(path, opts = {}) {
  const r = await fetch(API + path, { headers: authHeaders(), ...opts });
  if (r.status === 401) {
    location.href = '/signin.html?next=' + encodeURIComponent(location.pathname + location.search);
    throw new Error('auth');
  }
  return r.json();
}

const $ = (s) => document.querySelector(s);
const main = $('#main');

// Phase: 'pick' | 'answers' | 'survey' | 'done'
let ME = null, SPEC = null, PHASE = 'pick';
let SELECTED_STORE = null;
let STORE = null;
let FLAT = [];
let QINDEX = 0;
let ANSWERS = {};
let PHOTOS = [];
let BASELINE = {};
let SUGGESTIONS = { byQuestion: {}, crossStoreAnswers: {} };
let RESPONSE_META = null; // status, updatedAt from context
let dirty = false, saveTimer = null, saving = false;
let addDistrict = '', addStorePick = '';
let autoAdvanceTimer = null;

// ─── Theme ───────────────────────────────────────────────────────────────────
function getTheme() {
  const t = localStorage.getItem(THEME_KEY);
  if (t === 'dark' || t === 'light') return t;
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
  return 'light';
}
function applyTheme(theme) {
  const t = theme === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem(THEME_KEY, t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = t === 'dark' ? '#121a22' : '#0f5c8c';
  const btn = $('#btn-theme');
  if (btn) btn.textContent = t === 'dark' ? 'Light' : 'Dark';
}
applyTheme(getTheme());
$('#btn-theme').onclick = () => {
  applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
};

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }

function flattenQuestions(spec, answers) {
  const out = [];
  for (const sec of spec.sections || []) {
    for (const q of sec.questions || []) {
      out.push({ ...q, section: sec.id, sectionTitle: sec.title });
      for (const b of q.branches || []) {
        const w = Array.isArray(b.when) ? b.when : [b.when];
        const v = answers[q.id];
        if (v != null && w.includes(v)) {
          out.push({ ...b, section: sec.id, sectionTitle: sec.title, parent: q.id });
        }
      }
    }
  }
  return out;
}

function isAnswered(q) {
  if (q.optional) return true;
  const v = ANSWERS[q.id];
  if (v == null || v === '') return false;
  if (Array.isArray(v) && !v.length) return false;
  if (q.detailOn && v === q.detailOn) {
    const d = ANSWERS[q.id + '_d'];
    if (d == null || String(d).trim() === '') return false;
  }
  return true;
}

function displayAnswer(q) {
  const v = ANSWERS[q.id];
  if (v == null || v === '' || (Array.isArray(v) && !v.length)) return null;
  let s = Array.isArray(v) ? v.join(', ') : String(v);
  if (q.detailOn && v === q.detailOn && ANSWERS[q.id + '_d']) {
    s += ' — ' + ANSWERS[q.id + '_d'];
  }
  if (ANSWERS[q.id + '_c']) s += ' (note)';
  return s;
}

function setProgress() {
  if ((PHASE !== 'survey' && PHASE !== 'answers') || !FLAT.length) {
    $('#prog').style.width = '0';
    return;
  }
  if (PHASE === 'answers') {
    const done = FLAT.filter(isAnswered).length;
    const pct = Math.round((done / Math.max(FLAT.length, 1)) * 100);
    $('#prog').style.width = Math.min(100, pct) + '%';
    return;
  }
  const pct = Math.round(((QINDEX) / Math.max(FLAT.length, 1)) * 100);
  $('#prog').style.width = Math.min(100, pct) + '%';
}

function setSave(msg, cls) {
  const el = $('#save-state');
  el.textContent = msg || '';
  el.className = cls || '';
}

function markDirty() {
  dirty = true;
  setSave('Saving…', '');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveDraft(false), 600);
}

async function saveDraft(submit) {
  if (!STORE) return null;
  clearTimeout(saveTimer);
  if (saving) return null;
  saving = true;
  try {
    const r = await api(`/api/survey/stores/${STORE}/response`, {
      method: 'PUT',
      body: JSON.stringify({
        answers: ANSWERS,
        photos: PHOTOS.map((p) => ({ id: p.id, questionId: p.question_id })),
        submit: !!submit,
      }),
    });
    dirty = false;
    setSave(submit ? 'Submitted ✓' : 'Saved ✓', 'saved');
    // Keep local status in ME so home list stays current
    if (ME && ME.storeDetails) {
      const sn = Number(STORE);
      let found = false;
      ME.storeDetails = ME.storeDetails.map((s) => {
        if (Number(s.storeNum) !== sn) return s;
        found = true;
        return {
          ...s,
          status: submit ? 'submitted' : (s.status === 'submitted' ? 'submitted' : 'draft'),
          updatedAt: new Date().toISOString(),
        };
      });
      if (!found) {
        ME.storeDetails.push({
          storeNum: sn,
          district: null,
          suggested: false,
          status: submit ? 'submitted' : 'draft',
          updatedAt: new Date().toISOString(),
        });
      }
    }
    if (RESPONSE_META) {
      RESPONSE_META.status = submit ? 'submitted' : (RESPONSE_META.status || 'draft');
    }
    return r;
  } catch (e) {
    setSave('Offline — retrying', 'warn');
    saveTimer = setTimeout(() => saveDraft(submit), 4000);
    return null;
  } finally {
    saving = false;
  }
}

async function goHome() {
  clearTimeout(autoAdvanceTimer);
  if (STORE && dirty) await saveDraft(false);
  STORE = null;
  FLAT = [];
  QINDEX = 0;
  ANSWERS = {};
  PHOTOS = [];
  RESPONSE_META = null;
  // Refresh me for latest statuses (best-effort)
  try {
    const me = await api('/api/survey/me');
    if (me && me.ok) {
      ME = me;
      SUGGESTIONS = me.suggestions || SUGGESTIONS;
    }
  } catch (_) { /* keep cached ME */ }
  renderPicker();
}

$('#btn-home').onclick = () => { goHome(); };

// ─── Store picker / home ─────────────────────────────────────────────────────
function storeMetaMap() {
  const map = new Map();
  const catalog = ME.catalog || { stores: [] };
  const detailList = ME.storeDetails || [];
  for (const s of (catalog.stores || [])) {
    map.set(Number(s.storeNum), {
      storeNum: Number(s.storeNum),
      district: s.district || '?',
      status: null,
      suggested: false,
      updatedAt: null,
    });
  }
  for (const s of detailList) {
    const sn = Number(s.storeNum);
    const prev = map.get(sn) || { storeNum: sn, district: s.district || '?', suggested: false };
    map.set(sn, {
      ...prev,
      district: s.district || prev.district || '?',
      status: s.status || null,
      suggested: !!(s.suggested || prev.suggested),
      updatedAt: s.updatedAt || s.updated_at || null,
    });
  }
  const suggested = ME.suggestedStores || [];
  for (const sn of suggested) {
    const n = Number(sn);
    const prev = map.get(n) || { storeNum: n, district: '?', status: null };
    map.set(n, { ...prev, suggested: true });
  }
  return map;
}

function formatScheduleDate(iso) {
  if (!iso) return '';
  try {
    const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
  } catch {
    return String(iso);
  }
}

function formatUpdated(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  } catch {
    return '';
  }
}

function recentStores(meta) {
  const out = [];
  for (const s of (ME.storeDetails || [])) {
    if (!s.status) continue;
    const sn = Number(s.storeNum);
    const m = meta.get(sn) || s;
    out.push({
      storeNum: sn,
      district: m.district || s.district || '?',
      status: s.status,
      updatedAt: s.updatedAt || s.updated_at || null,
      suggested: !!(m.suggested),
    });
  }
  out.sort((a, b) => {
    const ta = a.updatedAt ? new Date(a.updatedAt).getTime() : 0;
    const tb = b.updatedAt ? new Date(b.updatedAt).getTime() : 0;
    return tb - ta;
  });
  return out;
}

function renderPicker() {
  PHASE = 'pick';
  STORE = null;
  FLAT = [];
  QINDEX = 0;
  clearTimeout(autoAdvanceTimer);
  setProgress();
  $('#stepnav').hidden = true;
  $('#hdr-title').textContent = 'Store Survey';

  const catalog = ME.catalog || { districts: [], teams: [], stores: [] };
  const scheduleDate = ME.scheduleDate || '';
  const primary = ME.primaryStore != null
    ? Number(ME.primaryStore)
    : (ME.suggestedStores && ME.suggestedStores.length ? Number(ME.suggestedStores[0]) : null);
  if (SELECTED_STORE == null && Number.isFinite(primary)) {
    SELECTED_STORE = primary;
  }
  if (SELECTED_STORE != null) SELECTED_STORE = Number(SELECTED_STORE);

  const meta = storeMetaMap();
  const allStores = catalog.stores || ME.storeDetails || [];
  const districts = (catalog.districts && catalog.districts.length)
    ? catalog.districts
    : [...new Set(allStores.map((s) => s.district).filter(Boolean))].sort();

  if (SELECTED_STORE != null && !addDistrict) {
    const m = meta.get(SELECTED_STORE);
    if (m && m.district && m.district !== '?') addDistrict = String(m.district);
  }
  if (addDistrict && !districts.map(String).includes(String(addDistrict))) addDistrict = '';

  const districtStores = addDistrict
    ? allStores
        .filter((s) => String(s.district) === String(addDistrict))
        .map((s) => Number(s.storeNum))
        .filter((n) => Number.isFinite(n))
        .sort((a, b) => a - b)
    : [];
  if (addStorePick && !districtStores.includes(Number(addStorePick))) {
    addStorePick = (SELECTED_STORE != null && districtStores.includes(SELECTED_STORE))
      ? String(SELECTED_STORE)
      : '';
  } else if (!addStorePick && SELECTED_STORE != null && districtStores.includes(SELECTED_STORE)) {
    addStorePick = String(SELECTED_STORE);
  }

  const distOpts = districts.map((d) =>
    `<option value="${escAttr(d)}" ${String(addDistrict) === String(d) ? 'selected' : ''}>District ${esc(d)}</option>`
  ).join('');
  const storeOpts = districtStores.map((sn) =>
    `<option value="${sn}" ${Number(addStorePick) === sn || SELECTED_STORE === sn ? 'selected' : ''}>Store ${sn}</option>`
  ).join('');

  const fromSchedule = SELECTED_STORE != null && (
    Number(ME.primaryStore) === SELECTED_STORE
    || (ME.suggestedStores || []).map(Number).includes(SELECTED_STORE)
  );
  const mSel = SELECTED_STORE != null ? (meta.get(SELECTED_STORE) || {}) : {};
  const tags = [];
  if (fromSchedule) tags.push('<span class="tag">today\'s schedule</span>');
  if (mSel.status === 'draft') tags.push('<span class="tag draft">draft</span>');
  if (mSel.status === 'submitted') tags.push('<span class="tag submitted">submitted</span>');

  const selectionHtml = SELECTED_STORE != null
    ? `<div class="sel-item" data-store="${SELECTED_STORE}">
          <div class="meta">
            <strong>Store ${SELECTED_STORE}</strong>
            <span class="hint">District ${esc(mSel.district || '?')}</span>
            ${tags.length ? `<div>${tags.join(' ')}</div>` : ''}
          </div>
          <button type="button" class="sel-remove" data-clear="1" aria-label="Clear store selection">×</button>
        </div>`
    : '<div class="sel-empty">No store selected yet. Choose a district and store below.</div>';

  const noteHtml = fromSchedule && SELECTED_STORE != null
    ? `Based on today's schedule${scheduleDate ? ' (' + esc(formatScheduleDate(scheduleDate)) + ')' : ''}, <strong>Store ${SELECTED_STORE}</strong> was pre-selected for you. If this is incorrect, please adjust using the district and store dropdowns below.`
    : scheduleDate
      ? `No store was found on today's schedule${scheduleDate ? ' (' + esc(formatScheduleDate(scheduleDate)) + ')' : ''} for your name. Please select your district and store below.`
      : 'Please select your district and store below.';

  const storeSelectDisabled = !addDistrict;
  const storePlaceholder = !addDistrict
    ? 'Select a district first'
    : (districtStores.length ? 'Select a store' : 'No stores in this district');

  const recent = recentStores(meta);
  const recentHtml = recent.length
    ? recent.map((s) => {
        const when = formatUpdated(s.updatedAt);
        const st = s.status === 'submitted' ? 'submitted' : 'draft';
        return `<button type="button" class="store-row" data-open-store="${s.storeNum}">
          <span style="flex:1">
            <strong>Store ${s.storeNum}</strong> · D${esc(s.district || '?')}
            <br><span class="hint">${st}${when ? ' · updated ' + esc(when) : ''} · tap to review / edit answers</span>
          </span>
        </button>`;
      }).join('')
    : '<div class="sel-empty">No drafts or submissions yet. Start a store below — you can return here anytime with Home.</div>';

  main.innerHTML = `
    <div class="card">
      <div class="eyebrow">Division 701</div>
      <div class="qtext" style="margin-bottom:8px">Your stores</div>
      <div class="note">${noteHtml}</div>

      <div class="sel-section">
        <h2>Today's store</h2>
        <div class="sel-list" id="sel-list">${selectionHtml}</div>
        <p class="hint" style="margin-top:10px">Open a store to answer questions, leave, and come back later to edit.</p>
      </div>

      <div class="sel-section">
        <h2>In progress &amp; completed</h2>
        <div class="sel-list">${recentHtml}</div>
      </div>

      <div class="sel-section">
        <h2>Change / pick a store</h2>
        <div class="add-store">
          <div>
            <label for="f-dist">District</label>
            <select id="f-dist">
              <option value="">Select district…</option>
              ${distOpts}
            </select>
          </div>
          <div>
            <label for="f-store">Store in district</label>
            <div class="add-row">
              <select id="f-store" ${storeSelectDisabled ? 'disabled' : ''}>
                <option value="">${esc(storePlaceholder)}</option>
                ${storeOpts}
              </select>
              <button type="button" id="btn-use-store" ${!addStorePick ? 'disabled' : ''}>Use store</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;

  $('#f-dist').onchange = (e) => {
    addDistrict = e.target.value;
    addStorePick = '';
    renderPicker();
  };
  $('#f-store').onchange = (e) => {
    addStorePick = e.target.value;
    const btn = $('#btn-use-store');
    if (btn) btn.disabled = !addStorePick;
  };
  $('#btn-use-store').onclick = () => {
    const sn = Number(addStorePick);
    if (!Number.isFinite(sn)) return;
    SELECTED_STORE = sn;
    renderPicker();
  };
  main.querySelectorAll('[data-clear]').forEach((btn) => {
    btn.onclick = () => {
      SELECTED_STORE = null;
      addStorePick = '';
      renderPicker();
    };
  });
  main.querySelectorAll('[data-open-store]').forEach((btn) => {
    btn.onclick = () => {
      SELECTED_STORE = Number(btn.dataset.openStore);
      openStore(SELECTED_STORE, { preferAnswers: true });
    };
  });

  $('#stepnav').hidden = false;
  $('#btn-back').textContent = 'Clear';
  $('#btn-next').textContent = 'Open store';
  updatePickerNext();
}

function updatePickerNext() {
  const btn = $('#btn-next');
  if (PHASE === 'pick') {
    btn.disabled = SELECTED_STORE == null;
    btn.className = '';
    btn.textContent = SELECTED_STORE != null
      ? 'Open · Store ' + SELECTED_STORE
      : 'Open store';
  }
}

async function openStore(storeNum, opts = {}) {
  const preferAnswers = !!opts.preferAnswers;
  const jumpTo = opts.jumpTo != null ? Number(opts.jumpTo) : null;
  STORE = Number(storeNum);
  SELECTED_STORE = STORE;
  clearTimeout(autoAdvanceTimer);
  setSave('Loading…', '');
  const ctx = await api(`/api/survey/stores/${STORE}/context`);
  ANSWERS = ctx.myResponse ? { ...ctx.myResponse.answers } : {};
  RESPONSE_META = ctx.myResponse
    ? { status: ctx.myResponse.status, updatedAt: ctx.myResponse.updated_at || ctx.myResponse.updatedAt }
    : null;
  const ph = await api(`/api/survey/stores/${STORE}/photos`);
  PHOTOS = (ph.photos || []).filter((p) => p.respondent === ME.user.email);
  BASELINE = {};
  for (const b of ctx.baseline || []) Object.assign(BASELINE, b.answers || {});
  SUGGESTIONS = ctx.suggestions || ME.suggestions || { byQuestion: {}, crossStoreAnswers: {} };
  rebuildFlat();
  setSave('', '');

  const hasAnyAnswer = Object.keys(ANSWERS).some((k) => {
    if (k.endsWith('_c') || k.endsWith('_d')) return false;
    const v = ANSWERS[k];
    return v != null && v !== '' && !(Array.isArray(v) && !v.length);
  });

  if (jumpTo != null && Number.isFinite(jumpTo)) {
    QINDEX = Math.max(0, Math.min(jumpTo, FLAT.length));
    renderQuestion();
    return;
  }

  if (preferAnswers || hasAnyAnswer) {
    renderAnswerList();
    return;
  }

  // Fresh store — start survey
  QINDEX = 0;
  renderQuestion();
}

function rebuildFlat() {
  FLAT = flattenQuestions(SPEC, ANSWERS);
}

// ─── Answer list (review / edit hub for a store) ─────────────────────────────
function renderAnswerList() {
  PHASE = 'answers';
  clearTimeout(autoAdvanceTimer);
  rebuildFlat();
  setProgress();
  $('#stepnav').hidden = false;
  $('#hdr-title').textContent = `Store ${STORE} · Answers`;

  let answered = 0, total = 0;
  let html = '';
  FLAT.forEach((q, i) => {
    if (!q.optional) total++;
    const ok = isAnswered(q);
    if (ok && !q.optional) answered++;
    const disp = displayAnswer(q);
    const label = disp == null
      ? '<span class="a empty">Not answered</span>'
      : `<span class="a">${esc(disp)}</span>`;
    html += `<button type="button" class="answer-row" data-jump="${i}">
      <span class="num">${esc(q.id.replace(/^Q/, ''))}</span>
      <span class="body">
        <div class="q">${esc(q.text)}</div>
        ${label}
        <div class="edit-hint">Tap to edit</div>
      </span>
    </button>`;
  });

  const statusLabel = RESPONSE_META?.status === 'submitted'
    ? 'Submitted'
    : (RESPONSE_META?.status === 'draft' || answered > 0 ? 'Draft saved' : 'Not started');

  main.innerHTML = `
    <div class="card">
      <div class="eyebrow">Store ${STORE}</div>
      <div class="qtext" style="margin-bottom:6px">${answered} of ${total} required answered</div>
      <div class="hint">${statusLabel}. Tap any question to edit. Use Home to switch stores anytime — progress is saved.</div>
      <div class="stack-actions">
        <button type="button" class="opt" id="btn-continue-survey" style="text-align:center;background:var(--accent);color:#fff;border-color:var(--accent)">Continue survey</button>
        <button type="button" class="opt" id="btn-review-end" style="text-align:center">Review &amp; submit</button>
      </div>
    </div>
    <div class="card" style="padding:10px">${html || '<div class="sel-empty">No questions loaded.</div>'}</div>`;

  main.querySelectorAll('[data-jump]').forEach((b) => {
    b.onclick = () => {
      QINDEX = Number(b.dataset.jump);
      renderQuestion();
    };
  });
  $('#btn-continue-survey').onclick = () => {
    // Resume at first unanswered, or review if all done
    QINDEX = 0;
    for (let i = 0; i < FLAT.length; i++) {
      if (!isAnswered(FLAT[i])) { QINDEX = i; break; }
      QINDEX = i;
    }
    if (FLAT.length && FLAT.every(isAnswered)) QINDEX = FLAT.length;
    renderQuestion();
  };
  $('#btn-review-end').onclick = () => {
    QINDEX = FLAT.length;
    renderReview();
  };

  $('#btn-back').textContent = 'Home';
  $('#btn-next').textContent = 'Continue';
  $('#btn-next').className = '';
  $('#btn-next').disabled = false;
}

// ─── One question at a time ──────────────────────────────────────────────────
function renderQuestion(opts = {}) {
  PHASE = 'survey';
  const focusDetail = !!opts.focusDetail;
  const focusText = !!opts.focusText;
  setProgress();
  $('#stepnav').hidden = false;
  $('#btn-back').textContent = QINDEX <= 0 ? 'Answers' : 'Back';

  if (QINDEX >= FLAT.length) {
    renderReview();
    return;
  }

  const q = FLAT[QINDEX];
  $('#hdr-title').textContent = `Store ${STORE} · ${q.section}`;
  $('#btn-next').textContent = QINDEX >= FLAT.length - 1 ? 'Review' : 'Next';
  $('#btn-next').className = '';
  $('#btn-next').disabled = !isAnswered(q);

  const common = commonChip(q);
  const body = questionBody(q);
  const photo = photoBlock(q);
  const comment = commentBlock(q);
  const cross = crossStoreChips(q);
  const base = baselineChip(q);

  main.innerHTML = `
    <div class="card" id="q-card">
      <div class="meta-line">Question ${QINDEX + 1} of ${FLAT.length} · ${esc(q.sectionTitle || q.section)}</div>
      <div class="eyebrow">Store ${STORE}</div>
      <div class="qtext">${esc(q.id.replace(/^Q/, '') + '. ' + q.text)}${q.optional ? ' <span class="hint">(optional)</span>' : ''}</div>
      ${common}
      ${body}
      ${base}
      ${cross}
      ${photo}
      ${comment}
    </div>`;

  wireQuestion(q);
  const card = $('#q-card');
  if (card) {
    const rect = card.getBoundingClientRect();
    if (rect.top < 80 || rect.top > window.innerHeight * 0.55) {
      card.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
  }

  // Focus text fields so mobile keyboard opens
  requestAnimationFrame(() => {
    let target = null;
    if (focusDetail) {
      target = main.querySelector(`input[data-tq="${q.id}_d"]`);
    } else if (focusText || q.type === 'text') {
      target = main.querySelector(`input[data-tq="${q.id}"]`);
    }
    if (target) {
      try {
        target.focus({ preventScroll: false });
        // Place caret at end
        const len = target.value.length;
        if (typeof target.setSelectionRange === 'function') {
          target.setSelectionRange(len, len);
        }
      } catch (_) {
        try { target.focus(); } catch (__) {}
      }
    }
  });
}

function examplesBlock(examples, label) {
  if (!examples || !examples.length) return '';
  const title = label || 'Examples';
  return `<div class="note" style="margin-top:10px">
    <div style="font-weight:600;margin-bottom:6px">${esc(title)}</div>
    <ul style="margin:0;padding-left:18px">
      ${examples.map((ex) => `<li style="margin-bottom:4px">${esc(ex)}</li>`).join('')}
    </ul>
  </div>`;
}

function questionBody(q) {
  if (q.type === 'yesno' || q.type === 'choice') {
    const opts = q.type === 'yesno' ? ['Yes', 'No'] : (q.options || []);
    const cls = opts.length <= 4 ? 'opts row' : 'opts';
    let html = `<div class="${cls}" role="group">` +
      opts.map((o) =>
        `<button type="button" class="opt" data-q="${q.id}" data-val="${escAttr(o)}" aria-pressed="${ANSWERS[q.id] === o}">${esc(o)}</button>`
      ).join('') + '</div>';
    if (q.detailOn && ANSWERS[q.id] === q.detailOn) {
      const ph = q.detailPlaceholder || 'Please explain / name';
      html += `<div class="suggest-wrap" style="margin-top:10px"><input type="text" data-tq="${q.id}_d" value="${escAttr(ANSWERS[q.id + '_d'] || '')}" placeholder="${escAttr(ph)}" autocomplete="off" enterkeyhint="done"></div>`;
      html += examplesBlock(q.detailExamples, q.detailExamplesLabel || 'Suggestions');
    }
    return html;
  }
  if (q.type === 'multiselect') {
    const cur = ANSWERS[q.id] || [];
    return `<div class="opts">` +
      (q.options || []).map((o) =>
        `<button type="button" class="opt" data-mq="${q.id}" data-val="${escAttr(o)}" aria-pressed="${cur.includes(o)}">${esc(o)}</button>`
      ).join('') + '</div>';
  }
  const ph = q.placeholder || 'Type your answer';
  return examplesBlock(q.examples, q.examplesLabel || 'Examples') +
    `<div class="suggest-wrap"><input type="text" data-tq="${q.id}" value="${escAttr(ANSWERS[q.id] || '')}" placeholder="${escAttr(ph)}" autocomplete="off" enterkeyhint="done"></div>`;
}

function commentBlock(q) {
  const key = q.id + '_c';
  const val = ANSWERS[key] || '';
  return `<details class="comment" ${val ? 'open' : ''}><summary>Add a comment</summary>
    <textarea data-comment="${q.id}" rows="2" placeholder="Optional notes for this answer">${esc(val)}</textarea>
  </details>`;
}

function photoBlock(q) {
  if (!q.photo) return '';
  const mine = PHOTOS.filter((p) => p.question_id === q.id);
  const tok = encodeURIComponent(sessionTok());
  return `<div class="note" style="margin-top:12px">A short description helps — a photo of the area is greatly appreciated when you can take one.</div>
    <div class="photo-row">
      ${mine.map((p) =>
        `<span class="thumb"><img src="${API}/api/survey/photos/${p.id}?access_token=${tok}" alt=""><button type="button" data-del="${p.id}" aria-label="Remove">×</button></span>`
      ).join('')}
      <button type="button" class="photo-add" data-add="${q.id}" aria-label="Add photo">📷</button>
    </div>`;
}

function commonInfo(qid) {
  const map = (SUGGESTIONS && SUGGESTIONS.commonByQuestion) || {};
  const c = map[qid];
  if (!c) return null;
  if (typeof c === 'string') return { value: c, n: 0, source: 'good' };
  if (c.value == null || c.value === '') return null;
  return c;
}

/** "Common: Yes" — tappable to apply. Hides once this question is answered. */
function commonChip(q) {
  if (ANSWERS[q.id] != null && ANSWERS[q.id] !== '' && !(Array.isArray(ANSWERS[q.id]) && !ANSWERS[q.id].length)) {
    return '';
  }
  const c = commonInfo(q.id);
  if (!c) return '';
  const val = String(c.value);
  // Multiselect common may be comma-joined; still offer as one-tap when single token matches an option
  let applyVal = val;
  if (q.type === 'multiselect') {
    applyVal = val.includes(',') ? val.split(',').map((s) => s.trim()).filter(Boolean) : [val];
  }
  const label = Array.isArray(applyVal) ? applyVal.join(', ') : applyVal;
  if (!label || label.length > 80) return '';
  const countHint = c.n > 0 ? ` · ${c.n} answers` : '';
  const dataVal = Array.isArray(applyVal) ? applyVal.join('\u001f') : applyVal;
  return `<div class="common-wrap">
    <button type="button" class="chip common" data-common="${escAttr(q.id)}" data-common-val="${escAttr(dataVal)}" data-common-multi="${q.type === 'multiselect' ? '1' : '0'}">
      Common: ${esc(label)}${esc(countHint)}
    </button>
  </div>`;
}

function baselineChip(q) {
  const b = BASELINE[q.id];
  if (b == null || ANSWERS[q.id] != null) return '';
  // Avoid duplicating the same value as Common chip
  const c = commonInfo(q.id);
  if (c && String(c.value) === String(b)) return '';
  return `<div class="hint">2025: <button type="button" class="chip" data-chip="${q.id}" data-val="${escAttr(String(b))}">${esc(String(b))} — use this</button></div>`;
}

function crossStoreChips(q) {
  const cross = SUGGESTIONS.crossStoreAnswers || {};
  const chips = [];
  for (const [sn, ans] of Object.entries(cross)) {
    const v = ans[q.id];
    if (v == null || v === '' || (Array.isArray(v) && !v.length)) continue;
    const label = Array.isArray(v) ? v.join(', ') : String(v);
    if (label.length > 60) continue;
    chips.push(`<button type="button" class="chip" data-cross-store="${sn}" data-cross-q="${q.id}">Same as store ${esc(sn)}: ${esc(label)}</button>`);
  }
  if (!chips.length) return '';
  return `<div class="cross-bar"><div class="hint">Reuse an answer from another store you already surveyed:</div>${chips.join('')}</div>`;
}

function suggestionsFor(qid) {
  return (SUGGESTIONS.byQuestion && SUGGESTIONS.byQuestion[qid]) || [];
}

function wireTypeahead(input, qid) {
  const wrap = input.closest('.suggest-wrap') || input.parentElement;
  let panel = wrap.querySelector('.suggest-list');
  if (!panel) {
    panel = document.createElement('div');
    panel.className = 'suggest-list';
    wrap.appendChild(panel);
  }
  const all = suggestionsFor(qid);
  const show = (filter) => {
    const f = String(filter || '').toLowerCase();
    const opts = all.filter((v) => !f || String(v).toLowerCase().includes(f)).slice(0, 8);
    if (!opts.length) { panel.classList.remove('open'); panel.innerHTML = ''; return; }
    panel.innerHTML = opts.map((v) =>
      `<button type="button" data-val="${escAttr(String(v))}">${esc(String(v))}</button>`
    ).join('');
    panel.classList.add('open');
    panel.querySelectorAll('button').forEach((b) => {
      b.onmousedown = (e) => e.preventDefault();
      b.onclick = () => {
        input.value = b.dataset.val;
        ANSWERS[qid] = b.dataset.val;
        markDirty();
        panel.classList.remove('open');
        refreshNextEnabled();
      };
    });
  };
  input.addEventListener('focus', () => show(input.value));
  input.addEventListener('input', () => {
    ANSWERS[qid] = input.value;
    markDirty();
    show(input.value);
    refreshNextEnabled();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      panel.classList.remove('open');
      input.blur();
      // After text entry, allow advancing if complete
      if (PHASE === 'survey' && isAnswered(FLAT[QINDEX])) {
        goNext(false);
      }
    }
  });
  input.addEventListener('blur', () => setTimeout(() => panel.classList.remove('open'), 120));
}

/** Advance to next question (or review). Auto-save first. */
async function goNext(fromAuto) {
  if (PHASE === 'pick') {
    if (SELECTED_STORE == null) return;
    await openStore(SELECTED_STORE, { preferAnswers: true });
    return;
  }
  if (PHASE === 'answers') {
    QINDEX = 0;
    for (let i = 0; i < FLAT.length; i++) {
      if (!isAnswered(FLAT[i])) { QINDEX = i; break; }
      QINDEX = i;
    }
    if (FLAT.length && FLAT.every(isAnswered)) QINDEX = FLAT.length;
    renderQuestion();
    return;
  }
  if (PHASE === 'survey' && QINDEX >= FLAT.length) {
    const r = await saveDraft(true);
    if (r && r.ok) {
      PHASE = 'done';
      $('#stepnav').hidden = true;
      main.innerHTML = `<div class="card">
          <div class="qtext">Store ${STORE} complete. ✓</div>
          <div class="hint">Answers are saved. Use Home to open another store, or reopen this one to edit anytime.</div>
          <div class="stack-actions">
            <button type="button" class="opt" id="btn-done-answers" style="text-align:center">View answers</button>
            <button type="button" class="opt" id="btn-done-home" style="text-align:center;background:var(--accent);color:#fff;border-color:var(--accent)">Home</button>
          </div>
        </div>`;
      $('#btn-done-answers').onclick = () => renderAnswerList();
      $('#btn-done-home').onclick = () => goHome();
    }
    return;
  }
  if (PHASE !== 'survey') return;
  const q = FLAT[QINDEX];
  if (!isAnswered(q)) return;
  await saveDraft(false);
  QINDEX++;
  rebuildFlat();
  if (QINDEX > FLAT.length) QINDEX = FLAT.length;
  renderQuestion();
}

function wireQuestion(q) {
  main.querySelectorAll('.opt[data-q]').forEach((b) => {
    b.onclick = () => {
      const val = b.dataset.val;
      ANSWERS[b.dataset.q] = val;
      // Clear stale detail if no longer needed
      if (q.detailOn && val !== q.detailOn) {
        delete ANSWERS[q.id + '_d'];
      }
      markDirty();
      rebuildFlat();
      const idx = FLAT.findIndex((x) => x.id === q.id);
      if (idx >= 0) QINDEX = idx;

      const needsDetail = q.detailOn && val === q.detailOn;
      if (needsDetail) {
        // Show text field and focus for keyboard
        renderQuestion({ focusDetail: true });
        return;
      }

      // Yes/No and single-choice: auto-advance when fully answered
      if ((q.type === 'yesno' || q.type === 'choice') && isAnswered(q)) {
        // Brief visual update then advance
        main.querySelectorAll(`.opt[data-q="${q.id}"]`).forEach((el) => {
          el.setAttribute('aria-pressed', el.dataset.val === val ? 'true' : 'false');
        });
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = setTimeout(() => goNext(true), 180);
        return;
      }

      renderQuestion();
      refreshNextEnabled();
    };
  });
  main.querySelectorAll('.opt[data-mq]').forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.mq, val = b.dataset.val;
      let cur = ANSWERS[id] || [];
      if (val === 'None') cur = cur.includes('None') ? [] : ['None'];
      else {
        cur = cur.filter((x) => x !== 'None');
        cur = cur.includes(val) ? cur.filter((x) => x !== val) : [...cur, val];
      }
      ANSWERS[id] = cur;
      markDirty();
      // Multiselect: never auto-advance
      renderQuestion();
    };
  });
  main.querySelectorAll('input[data-tq]').forEach((i) => wireTypeahead(i, i.dataset.tq));
  main.querySelectorAll('textarea[data-comment]').forEach((t) => {
    t.oninput = () => { ANSWERS[t.dataset.comment + '_c'] = t.value; markDirty(); };
  });
  main.querySelectorAll('.chip[data-chip]').forEach((c) => {
    c.onclick = () => {
      ANSWERS[c.dataset.chip] = c.dataset.val;
      markDirty();
      rebuildFlat();
      // Chip is text-like prefills for text questions — don't auto-advance
      renderQuestion({ focusText: true });
    };
  });
  main.querySelectorAll('.chip[data-common]').forEach((c) => {
    c.onclick = () => {
      const qid = c.dataset.common;
      const multi = c.dataset.commonMulti === '1';
      const raw = c.dataset.commonVal || '';
      if (multi) {
        ANSWERS[qid] = raw.split('\u001f').filter(Boolean);
      } else {
        ANSWERS[qid] = raw;
      }
      markDirty();
      rebuildFlat();
      const idx = FLAT.findIndex((x) => x.id === qid);
      if (idx >= 0) QINDEX = idx;
      const cur = FLAT[QINDEX];
      const needsDetail = cur && cur.detailOn && ANSWERS[qid] === cur.detailOn;
      if (needsDetail) {
        renderQuestion({ focusDetail: true });
        return;
      }
      // Auto-advance for yes/no and choice when fully answered
      if (cur && (cur.type === 'yesno' || cur.type === 'choice') && isAnswered(cur)) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = setTimeout(() => goNext(true), 180);
        renderQuestion();
        return;
      }
      if (cur && cur.type === 'text') {
        renderQuestion({ focusText: true });
        return;
      }
      renderQuestion();
    };
  });
  main.querySelectorAll('.chip[data-cross-store]').forEach((c) => {
    c.onclick = () => {
      const sn = c.dataset.crossStore;
      const qid = c.dataset.crossQ;
      const ans = (SUGGESTIONS.crossStoreAnswers || {})[sn] || {};
      if (ans[qid] != null) {
        ANSWERS[qid] = Array.isArray(ans[qid]) ? [...ans[qid]] : ans[qid];
        if (ans[qid + '_d'] != null) ANSWERS[qid + '_d'] = ans[qid + '_d'];
        if (ans[qid + '_c'] != null) ANSWERS[qid + '_c'] = ans[qid + '_c'];
        markDirty();
        rebuildFlat();
        renderQuestion();
        // If fully answered choice after cross-fill, stay for user confirm (no auto)
      }
    };
  });
  main.querySelectorAll('[data-add]').forEach((b) => {
    b.onclick = () => addPhoto(b.dataset.add);
  });
  main.querySelectorAll('[data-del]').forEach((b) => {
    b.onclick = async () => {
      await api('/api/survey/photos/' + b.dataset.del, { method: 'DELETE' });
      PHOTOS = PHOTOS.filter((p) => p.id !== Number(b.dataset.del));
      markDirty();
      renderQuestion();
    };
  });
  refreshNextEnabled();
}

function refreshNextEnabled() {
  if (PHASE !== 'survey' || QINDEX >= FLAT.length) return;
  const q = FLAT[QINDEX];
  $('#btn-next').disabled = !isAnswered(q);
}

function renderReview() {
  PHASE = 'survey';
  $('#hdr-title').textContent = `Store ${STORE} · Review`;
  let answered = 0, total = 0;
  let html = '';
  rebuildFlat();
  FLAT.forEach((q, i) => {
    if (!q.optional) total++;
    const ok = isAnswered(q);
    if (ok && !q.optional) answered++;
    const disp = displayAnswer(q);
    const label = disp == null
      ? '<span style="color:var(--danger)">Not answered</span>'
      : esc(disp);
    html += `<button type="button" class="answer-row" data-jump="${i}">
      <span class="num">${esc(q.id.replace(/^Q/, ''))}</span>
      <span class="body">
        <div class="q">${esc(q.text.slice(0, 72))}${q.text.length > 72 ? '…' : ''}</div>
        <div class="a">${label}</div>
        <div class="edit-hint">Tap to edit</div>
      </span>
    </button>`;
  });
  main.innerHTML = `
    <div class="card">
      <div class="qtext">${answered} of ${total} required answered</div>
      <div class="hint">Tap any question to change it. Submitting updates this store — previous versions are kept in history.</div>
    </div>
    <div class="card" style="padding:10px">${html}</div>`;
  main.querySelectorAll('[data-jump]').forEach((b) => {
    b.onclick = () => { QINDEX = Number(b.dataset.jump); renderQuestion(); };
  });
  $('#btn-back').textContent = 'Answers';
  $('#btn-next').textContent = 'Submit store';
  $('#btn-next').className = 'submit';
  $('#btn-next').disabled = false;
  setProgress();
}

function addPhoto(questionId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    setSave('Adding photo…', '');
    try {
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = rej;
        i.src = URL.createObjectURL(file);
      });
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const b64 = cv.toDataURL('image/jpeg', 0.72).split(',')[1];
      const r = await api(`/api/survey/stores/${STORE}/photos`, {
        method: 'POST',
        body: JSON.stringify({ questionId, mime: 'image/jpeg', data: b64 }),
      });
      if (r.ok) {
        PHOTOS.push({ ...r.photo, respondent: ME.user.email });
        markDirty();
        renderQuestion();
      } else setSave(r.error || 'Photo failed', 'warn');
    } catch {
      setSave('Photo failed', 'warn');
    }
  };
  input.click();
}

// ─── Nav ─────────────────────────────────────────────────────────────────────
$('#btn-back').onclick = async () => {
  clearTimeout(autoAdvanceTimer);
  if (PHASE === 'pick') {
    SELECTED_STORE = null;
    addStorePick = '';
    renderPicker();
    return;
  }
  if (PHASE === 'answers') {
    await goHome();
    return;
  }
  await saveDraft(false);
  if (QINDEX >= FLAT.length) {
    // Review → answer list
    renderAnswerList();
    return;
  }
  if (QINDEX <= 0) {
    renderAnswerList();
    return;
  }
  QINDEX--;
  rebuildFlat();
  if (QINDEX >= FLAT.length) QINDEX = FLAT.length - 1;
  renderQuestion();
};

$('#btn-next').onclick = async () => {
  clearTimeout(autoAdvanceTimer);
  await goNext(false);
};

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && STORE) saveDraft(false);
});
window.addEventListener('beforeunload', (e) => {
  if (dirty && STORE) { e.preventDefault(); e.returnValue = ''; }
});

(async function init() {
  try {
    if (window.dumpBinAuthReady) await window.dumpBinAuthReady;
    const [me, q] = await Promise.all([api('/api/survey/me'), api('/api/survey/questions')]);
    if (!me.ok) {
      main.innerHTML = `<div class="card">${esc(me.error || 'Not on survey roster')}</div>`;
      return;
    }
    ME = me;
    SPEC = q.questionSet.spec;
    SUGGESTIONS = me.suggestions || { byQuestion: {}, crossStoreAnswers: {} };
    renderPicker();
  } catch (e) {
    console.error(e);
    main.innerHTML = `<div class="card">Could not load the survey. Check your connection.</div>`;
  }
})();
})();
</script>
