<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f5c8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Division 701 Store Survey · Retail Odyssey</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/favicon.png?v=2">

<script src="/auth-gate.js"></script>
<script>
(function () {
  var v = localStorage.getItem('surveyHeaderMin');
  var min = v === '1' || (v !== '0' && window.matchMedia && window.matchMedia('(max-width:720px)').matches);
  if (min) document.documentElement.setAttribute('data-header', 'min');
})();
</script>
<style>
  :root, [data-theme="light"]{
    --ink:#1a2430; --ink-soft:#5c6b7a; --line:#d5dde6; --paper:#e8eef5; --card:#fff;
    --accent:#0f5c8c; --accent-deep:#0a4063; --accent-soft:#e3eef6; --good:#2e7d52; --saved:#2e7d52; --danger:#b3402a;
    --bar-bg:linear-gradient(180deg,#fff 0%,#f3f8fc 100%);
    --nav-bg:rgba(255,255,255,.97);
    --note-bg:#f0f6fa; --note-line:#d0e0ec;
    --opt-bg:#fff; --input-bg:#fff; --chip-bg:#fff;
    --glow:rgba(15,92,140,.12);
    --tap:48px;
    --radius:16px;
  }
  [data-theme="dark"]{
    --ink:#e8eef4; --ink-soft:#9aabba; --line:#2f4052; --paper:#0c1218; --card:#172231;
    --accent:#4aa3d9; --accent-deep:#8ec8ea; --accent-soft:#1a3348; --good:#4caf7a; --saved:#4caf7a; --danger:#e0705c;
    --bar-bg:linear-gradient(180deg,#15202b,#101820);
    --nav-bg:rgba(16,24,32,.97);
    --note-bg:#152636; --note-line:#2a4258;
    --opt-bg:#1e2a38; --input-bg:#121a22; --chip-bg:#1e2a38;
    --glow:rgba(74,163,217,.18);
  }
  [data-theme="inverse"]{
    --ink:#f4f8fc; --ink-soft:#b7c6d4; --line:#3d556c; --paper:#062033; --card:#0b3a55;
    --accent:#7fd0ff; --accent-deep:#c5ebff; --accent-soft:#0e4d70; --good:#5fd49a; --saved:#5fd49a; --danger:#ff8f7a;
    --bar-bg:linear-gradient(135deg,#08324a,#0a4566 55%,#0c5a7a);
    --nav-bg:rgba(6,32,51,.96);
    --note-bg:#0a3a55; --note-line:#2a6284;
    --opt-bg:#0e4666; --input-bg:#08324a; --chip-bg:#0e4666;
    --glow:rgba(127,208,255,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* A+/A− scales rem-based content; chrome UI keeps px so the header stays compact */
  html{height:100%;overscroll-behavior:none;font-size:calc(16px * var(--text-scale, 1))}
  body{
    margin:0;min-height:100%;background:
      radial-gradient(1200px 400px at 10% -10%, var(--glow), transparent 55%),
      radial-gradient(900px 360px at 100% 0%, var(--glow), transparent 50%),
      var(--paper);
    color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    font-size:1rem;line-height:1.45;
    overscroll-behavior-y:none;touch-action:pan-y;
    padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));
  }
  .brandbar{
    position:sticky;top:0;z-index:20;
    background:var(--bar-bg);
    border-bottom:2px solid var(--accent);
    padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top,0px));
  }
  .brandbar .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .brand-logo{height:34px;width:auto}
  .brand-titles{flex:1;min-width:0}
  .brand-titles .co{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .brand-titles h1{font-size:14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .header-extras{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
  .header-min-btn{flex-shrink:0}
  html[data-header="min"] .brandbar .header-extras,
  html[data-header="min"] .brandbar .brand-titles .co{display:none}
  html[data-header="min"] .brandbar{padding-bottom:4px}
  html[data-header="min"] .brandbar .top{gap:6px;flex-wrap:nowrap}
  html[data-header="min"] #save-state{max-width:36%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon-btn{
    min-width:40px;min-height:40px;padding:0 10px;border-radius:10px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation;
    display:inline-flex;align-items:center;justify-content:center;gap:4px;
    text-decoration:none;
  }
  .icon-btn:active{transform:scale(.97)}
  a.icon-btn{color:var(--accent)}
  .howto{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:0;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.06);
  }
  .howto > summary{
    list-style:none;cursor:pointer;padding:12px 16px;font-weight:700;font-size:.9375rem;
    min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;
    color:var(--accent-deep);
  }
  .howto > summary::-webkit-details-marker{display:none}
  .howto > summary::after{content:"Show";font-size:.75rem;font-weight:600;color:var(--accent)}
  .howto[open] > summary::after{content:"Hide"}
  .howto .howto-body{padding:0 16px 14px;border-top:1px solid var(--line)}
  .howto ol{margin:10px 0 8px 20px;padding:0}
  .howto li{margin-bottom:6px;font-size:.875rem}
  .howto a{color:var(--accent);font-weight:700}
  #save-state{font-size:11px;color:var(--ink-soft);text-align:right;max-width:28%}
  #save-state.saved{color:var(--saved);font-weight:600}
  #save-state.warn{color:var(--danger);font-weight:600}
  .progress{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#1a8fbf);width:0;transition:width .2s}
  main{max-width:560px;margin:0 auto;padding:12px}
  @media (min-width:720px){
    main{max-width:640px;padding:16px 20px}
    .brand-titles h1{font-size:16px}
  }
  @media (min-width:1024px){
    main{max-width:720px;padding:20px 24px}
    .qtext{font-size:1.125rem}
  }
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
  .card:focus{outline:none}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .qtext{font-weight:600;margin-bottom:12px;line-height:1.35;font-size:1.0625rem}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opts.row{flex-direction:row;flex-wrap:wrap}
  .opt{
    border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--opt-bg);
    font-size:1rem;cursor:pointer;min-height:var(--tap);text-align:left;color:var(--ink);
    touch-action:manipulation;user-select:none;width:100%;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .opt:active{transform:scale(.985)}
  .opts.row .opt{width:auto;min-width:88px;text-align:center}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600;color:var(--accent-deep)}
  textarea,input[type=text],select{
    width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;
    font-size:max(16px, 1rem);font-family:inherit;background:var(--input-bg);color:var(--ink);
    scroll-margin-bottom:calc(96px + env(safe-area-inset-bottom,0px));
    scroll-margin-top:88px;
  }
  select{min-height:var(--tap)}
  textarea{min-height:72px;resize:vertical}
  .hint{font-size:.8125rem;color:var(--ink-soft);margin-top:8px}
  .note{font-size:.8125rem;color:var(--ink-soft);background:var(--note-bg);border:1px solid var(--note-line);border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.45}
  .chip{
    display:inline-block;border:1px dashed var(--accent);color:var(--accent);
    border-radius:16px;padding:8px 12px;font-size:.8125rem;cursor:pointer;background:var(--chip-bg);
    margin:4px 4px 0 0;touch-action:manipulation;
  }
  .chip.common{
    border-style:solid;font-weight:600;background:var(--accent-soft);color:var(--accent-deep);
  }
  .common-wrap{margin:0 0 12px}
  details.comment{margin-top:12px}
  details.comment summary{font-size:.875rem;color:var(--accent);cursor:pointer;list-style:none;min-height:40px;display:flex;align-items:center}
  details.comment summary::before{content:"+ ";font-weight:700}
  details.comment[open] summary::before{content:"− "}
  .photo-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .photo-row img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .photo-add{
    border:1.5px dashed var(--line);border-radius:10px;width:72px;height:72px;
    display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink-soft);background:var(--opt-bg);cursor:pointer;
  }
  .thumb{position:relative}
  .thumb button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--danger);color:#fff;border:0;font-size:16px}
  nav.stepnav{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:var(--nav-bg);border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
    display:flex;gap:10px;align-items:center;
  }
  nav.stepnav button{
    min-height:44px;font-size:.9375rem;font-weight:600;border-radius:10px;border:0;cursor:pointer;touch-action:manipulation;
    padding:0 16px;
  }
  #btn-back{background:var(--card);border:1.5px solid var(--accent);color:var(--accent);flex:0 0 auto}
  #btn-next{background:var(--accent);color:#fff;flex:1}
  #btn-next:disabled{background:#9bb6c9;cursor:not-allowed;opacity:.75}
  #btn-next.submit{background:var(--good)}
  .store-row{
    display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);
    border-radius:12px;background:var(--opt-bg);cursor:pointer;min-height:var(--tap);color:var(--ink);width:100%;text-align:left;
  }
  .store-row.selected{border-color:var(--accent);background:var(--accent-soft)}
  .store-row.completed{opacity:.62;border-style:dashed}
  .store-row.completed strong{color:var(--ink-soft)}
  option.completed{color:#6b7c8a}
  .eyebrow{font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
  .sel-section{margin-top:4px}
  .sel-section + .sel-section{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .sel-section h2{
    font-size:.8125rem;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin:0 0 10px;
  }
  .sel-list{display:flex;flex-direction:column;gap:8px}
  .sel-item{
    display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;
    border:1.5px solid var(--accent);border-radius:12px;background:var(--accent-soft);min-height:var(--tap);
  }
  .sel-item .meta{flex:1;min-width:0}
  .sel-item .meta strong{display:block;font-size:1rem}
  .sel-item .tag{
    display:inline-block;font-size:.6875rem;font-weight:600;color:var(--accent-deep);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-top:4px;
  }
  .sel-item .tag.draft{border-color:#c9b27a;color:#c9a24a}
  .sel-item .tag.submitted{border-color:#7ab894;color:var(--good)}
  .sel-remove{
    flex-shrink:0;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--card);color:var(--danger);font-size:20px;line-height:1;cursor:pointer;touch-action:manipulation;
  }
  .sel-empty{font-size:.875rem;color:var(--ink-soft);padding:8px 0}
  .add-store{display:flex;flex-direction:column;gap:10px}
  .add-store label{font-size:.75rem;color:var(--ink-soft);display:block;margin-bottom:4px}
  .add-store .add-row{display:flex;gap:8px;align-items:stretch}
  .add-store .add-row select{flex:1}
  #btn-add-store,#btn-use-store{
    min-height:var(--tap);padding:0 16px;border:0;border-radius:12px;background:var(--accent);
    color:#fff;font-size:.9375rem;font-weight:600;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  #btn-add-store:disabled,#btn-use-store:disabled{background:#9bb6c9;cursor:not-allowed}
  .suggest-wrap{position:relative}
  .suggest-list{
    position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--card);border:1px solid var(--line);
    border-radius:10px;max-height:min(40vh,220px);overflow:auto;display:none;box-shadow:0 8px 20px rgba(0,0,0,.2);
    -webkit-overflow-scrolling:touch;
  }
  .suggest-list.open{display:block}
  .suggest-list.drop-up{top:auto;bottom:100%;margin-bottom:4px;box-shadow:0 -8px 20px rgba(0,0,0,.18)}
  .suggest-list button{display:block;width:100%;text-align:left;border:0;background:var(--card);color:var(--ink);padding:12px;font-size:.9375rem;border-bottom:1px solid var(--line);min-height:44px}
  .cross-bar{margin-top:10px}
  .meta-line{font-size:.8125rem;color:var(--ink-soft);margin-bottom:8px}
  .answer-row{
    display:flex;align-items:flex-start;gap:10px;padding:12px;border:1.5px solid var(--line);
    border-radius:12px;background:var(--opt-bg);cursor:pointer;min-height:var(--tap);width:100%;text-align:left;color:var(--ink);
    margin-bottom:8px;
  }
  .answer-row:active{border-color:var(--accent)}
  .answer-row .num{font-weight:700;color:var(--accent);min-width:2.2em;font-size:1rem}
  .answer-row .body{flex:1;min-width:0}
  .answer-row .q{font-weight:600;font-size:.875rem;line-height:1.3}
  .answer-row .a{font-size:.8125rem;color:var(--ink-soft);margin-top:4px;word-break:break-word}
  .answer-row .a.empty{color:var(--danger)}
  .answer-row .edit-hint{font-size:.6875rem;color:var(--accent);margin-top:4px;font-weight:600}
  .stack-actions{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .stack-actions .opt{text-align:center}
  button:focus-visible,.opt:focus-visible,.icon-btn:focus-visible,a.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .a11y-bar{display:flex;gap:4px;align-items:center}
  .a11y-bar .icon-btn{min-width:36px;padding:0 8px;font-size:12px}
  .skip-hint{font-size:.75rem;color:var(--ink-soft);margin-top:8px}
  .day-chip{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip-bg);
    border-radius:999px;padding:6px 10px;font-size:.75rem;margin:0 6px 8px 0;color:var(--ink);
  }
  .day-chip strong{color:var(--accent-deep)}
  .schedule-source{font-size:.6875rem;color:var(--ink-soft);margin-top:6px}
  .sel-item.primary{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
  #btn-next.skip-ok{background:var(--accent)}
  @media (max-width:420px){
    .brand-titles .co{display:none}
    #btn-home{padding:0 8px;font-size:12px}
    #btn-help,#btn-feedback{padding:0 8px;font-size:12px}
    .icon-btn{min-width:36px;min-height:36px}
    main{padding:10px}
    .card{padding:14px;border-radius:14px}
  }
</style>
</head>
<body>
<header class="brandbar">
  <div class="top">
    <button type="button" class="icon-btn" id="btn-home" title="Home — store selection" aria-label="Home">⌂ Home</button>
    <div class="brand-titles">
      <div class="co">Retail Odyssey</div>
      <h1 id="hdr-title">Store Survey</h1>
    </div>
    <span id="save-state" role="status" aria-live="polite"></span>
    <div class="header-extras" id="header-extras">
      <button type="button" class="icon-btn" id="btn-feedback" title="Report a problem, send feedback, or contact the Survey Administrator" aria-label="Contact the Survey Administrator">Contact</button>
      <a class="icon-btn" id="btn-help" href="/survey/user-guide.html" target="_blank" rel="noopener noreferrer" title="How to use this survey" aria-label="How to use this survey">Help</a>
      <div class="a11y-bar" role="group" aria-label="Display controls">
        <button type="button" class="icon-btn" id="btn-text-down" title="Smaller text" aria-label="Decrease text size">A−</button>
        <button type="button" class="icon-btn" id="btn-text-up" title="Larger text" aria-label="Increase text size">A+</button>
        <button type="button" class="icon-btn" id="btn-theme" title="Cycle light / dark / inverse" aria-label="Cycle theme">Dark</button>
      </div>
    </div>
    <button type="button" class="icon-btn header-min-btn" id="btn-header-min" title="Minimize header" aria-expanded="true" aria-controls="header-extras">▴</button>
  </div>
  <div class="progress" aria-hidden="true"><i id="prog"></i></div>
</header>
<main id="main"></main>
<nav class="stepnav" id="stepnav" hidden>
  <button type="button" id="btn-back">Back</button>
  <button type="button" id="btn-next" disabled>Next</button>
</nav>

<script src="/survey/feedback-hub.js"></script>
<script>
(function () {
'use strict';

const ASSET = '/survey/assets';
const SECTION_ART = {};
'ABCDEFGHIJK'.split('').forEach((id) => { SECTION_ART[id] = ASSET + '/section-' + id + '.jpg'; });
const THEME_KEY = 'surveyTheme';
const TEXT_KEY = 'surveyTextScale';
const DRAFT_KEY_PREFIX = 'surveyDraft:v1:';
const THEMES = ['light', 'dark', 'inverse'];

function resolveApiBase() {
  const h = (location.hostname || '').toLowerCase();
  if (h === 'localhost' || h === '127.0.0.1') return 'http://localhost:3001';
  return 'https://eod-api.the-dump-bin.com';
}
const API = resolveApiBase();
const sessionTok = () =>
  (window.dumpBinAuth && window.dumpBinAuth.getSession && window.dumpBinAuth.getSession())
  || localStorage.getItem('dumpBinSession')
  || '';

const authHeaders = () => ({
  Authorization: 'Bearer ' + sessionTok(),
  'Content-Type': 'application/json',
});

async function api(path, opts = {}) {
  const r = await fetch(API + path, { headers: authHeaders(), ...opts });
  if (r.status === 401) {
    location.href = '/signin.html?next=' + encodeURIComponent(location.pathname + location.search);
    throw new Error('auth');
  }
  return r.json();
}

const $ = (s) => document.querySelector(s);
const main = $('#main');

if (window.SurveyFeedbackHub) {
  SurveyFeedbackHub.bind({
    app: 'survey',
    endpoint: '/api/survey/feedback',
    api: api,
    getContext: () => ({
      storeNum: STORE || SELECTED_STORE || null,
      storeName: STORE_NAME || '',
      page: PHASE || 'pick',
      user: ME && ME.user,
    }),
  });
}

// Phase: 'pick' | 'answers' | 'survey' | 'done'
let ME = null, SPEC = null, PHASE = 'pick';
let SELECTED_STORE = null;
let STORE = null;
let STORE_NAME = null;
let FLAT = [];
let QINDEX = 0;
let ANSWERS = {};
let PHOTOS = [];
let BASELINE = {};
let SUGGESTIONS = { byQuestion: {}, crossStoreAnswers: {} };
let RESPONSE_META = null; // status, updatedAt, id from context
let MY_SUBMISSIONS = [];
let dirty = false, saveTimer = null, saving = false;
let addDistrict = '', addStorePick = '';
let autoAdvanceTimer = null;

// ─── Theme + text size ───────────────────────────────────────────────────────
function getTheme() {
  const t = localStorage.getItem(THEME_KEY);
  if (THEMES.includes(t)) return t;
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
  return 'light';
}
function applyTheme(theme) {
  const t = THEMES.includes(theme) ? theme : 'light';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem(THEME_KEY, t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    meta.content = t === 'inverse' ? '#062033' : t === 'dark' ? '#0c1218' : '#0f5c8c';
  }
  const btn = $('#btn-theme');
  if (btn) {
    const nextLabel = { light: 'Dark', dark: 'Inverse', inverse: 'Light' };
    btn.textContent = nextLabel[t] || 'Theme';
  }
}
function getTextScale() {
  const n = Number(localStorage.getItem(TEXT_KEY));
  if (Number.isFinite(n) && n >= 0.85 && n <= 1.45) return n;
  return 1;
}
function applyTextScale(scale) {
  const s = Math.min(1.45, Math.max(0.85, Number(scale) || 1));
  document.documentElement.style.setProperty('--text-scale', String(s));
  localStorage.setItem(TEXT_KEY, String(s));
}
/** Flip a floating menu above its anchor when there isn't room below (mobile-safe). */
function placeFloatingMenu(anchorEl, panel, preferredMax = 220) {
  if (!anchorEl || !panel) return;
  panel.classList.remove('drop-up');
  panel.style.maxHeight = '';
  const rect = anchorEl.getBoundingClientRect();
  const vh = window.innerHeight || document.documentElement.clientHeight;
  const bottomChrome = 88; // sticky step nav + safe-area cushion
  const spaceBelow = Math.max(0, vh - rect.bottom - bottomChrome);
  const spaceAbove = Math.max(0, rect.top - 12);
  const want = preferredMax;
  if (spaceBelow < Math.min(want, 160) && spaceAbove > spaceBelow) {
    panel.classList.add('drop-up');
    panel.style.maxHeight = Math.max(120, Math.min(want, spaceAbove)) + 'px';
  } else {
    panel.style.maxHeight = Math.max(120, Math.min(want, Math.max(spaceBelow, 140))) + 'px';
  }
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }

/** District 1, 2, … 9, 10 (not 1, 10, 2). Unassigned last. */
function sortDistrictLabels(list) {
  return [...(list || [])].filter((d) => d != null && String(d).trim() !== '').sort((a, b) => {
    const sa = String(a), sb = String(b);
    if (sa === 'Unassigned' && sb !== 'Unassigned') return 1;
    if (sb === 'Unassigned' && sa !== 'Unassigned') return -1;
    const na = /^\d+$/.test(sa) ? Number(sa) : null;
    const nb = /^\d+$/.test(sb) ? Number(sb) : null;
    if (na != null && nb != null) return na - nb;
    if (na != null) return -1;
    if (nb != null) return 1;
    return sa.localeCompare(sb, undefined, { numeric: true, sensitivity: 'base' });
  });
}

/** Resolve FM store name for a store number (catalog / open-store context). */
function lookupStoreName(storeNum) {
  const n = Number(storeNum);
  if (!Number.isFinite(n)) return null;
  if (STORE != null && Number(STORE) === n && STORE_NAME) return STORE_NAME;
  try {
    const m = storeMetaMap().get(n);
    if (m && m.storeName) return m.storeName;
  } catch (_) { /* meta not ready */ }
  return null;
}

/** Label like "657 · Thor Street" (falls back to "Store 657"). */
function storeLabel(storeNum, opts = {}) {
  const n = Number(storeNum);
  if (!Number.isFinite(n)) return 'Store';
  const name = lookupStoreName(n);
  if (name) return `${n} · ${name}`;
  return opts.plainNumber ? String(n) : `Store ${n}`;
}

/** Substitute {{storeName}} in question text for the open store. */
function fillStoreVars(text, storeNum = STORE) {
  const name = lookupStoreName(storeNum) || 'this store';
  return String(text ?? '').split('{{storeName}}').join(name);
}

function flattenQuestions(spec, answers) {
  const out = [];
  for (const sec of spec.sections || []) {
    for (const q of sec.questions || []) {
      out.push({ ...q, section: sec.id, sectionTitle: sec.title });
      for (const b of q.branches || []) {
        const w = Array.isArray(b.when) ? b.when : [b.when];
        const v = answers[q.id];
        if (v != null && w.includes(v)) {
          out.push({ ...b, section: sec.id, sectionTitle: sec.title, parent: q.id });
        }
      }
    }
  }
  return out;
}

function hasAnswerValue(q) {

  if (v == null || v === '') return false;
  if (Array.isArray(v) && !v.length) return false;

}

function isAnswered(_q) {

function displayAnswer(q) {
  const v = ANSWERS[q.id];
  if (v == null || v === '' || (Array.isArray(v) && !v.length)) return null;
  let s = Array.isArray(v) ? v.join(', ') : String(v);

function setProgress() {

function setSave(msg, cls) {

function isLocked() {
  return !!(RESPONSE_META && RESPONSE_META.status === 'submitted');
}

function markDirty() {
  if (isLocked()) return;
  dirty = true;
  writeLocalDraft();
  setSave('Saving…', '');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveDraft(false), 400);
}

async function saveDraft(submit) {
  if (!STORE) return null;
  if (isLocked() && !submit) return null;
  if (isLocked() && submit) {
    setSave('Already submitted — retake to add a new response', 'warn');
    return { ok: false, locked: true };
  }
  clearTimeout(saveTimer);
  if (saving) return null;
  saving = true;
  try {
    const r = await api(`/api/survey/stores/${STORE}/response`, {
      method: 'PUT',
      body: JSON.stringify({
        answers: ANSWERS,
        photos: PHOTOS.map((p) => ({ id: p.id, questionId: p.question_id })),
        submit: !!submit,
      }),
    });
    if (r && r.locked && !submit) {
      setSave(r.error || 'Locked', 'warn');
      return r;
    }
    dirty = false;
    setSave(submit ? 'Submitted ✓' : 'Saved ✓', 'saved');
    if (submit) clearLocalDraft(STORE);
    else writeLocalDraft();
    // Keep local status in ME so home list stays current
    if (ME && ME.storeDetails) {
      const sn = Number(STORE);
      let found = false;
      ME.storeDetails = ME.storeDetails.map((s) => {
        if (Number(s.storeNum) !== sn) return s;
        found = true;
        const prevCount = Number(s.submissionCount) || 0;
        return {
          ...s,
          status: submit ? 'submitted' : 'draft',
          updatedAt: new Date().toISOString(),
          submissionCount: submit && s.status !== 'submitted' ? prevCount + 1 : prevCount,
        };
      });
      if (!found) {
        ME.storeDetails.push({
          storeNum: sn,
          district: null,
          suggested: false,
          status: submit ? 'submitted' : 'draft',
          updatedAt: new Date().toISOString(),
          submissionCount: submit ? 1 : 0,
        });
      }
    }
    if (RESPONSE_META) {
      RESPONSE_META.status = submit ? 'submitted' : (RESPONSE_META.status || 'draft');
      if (r && r.response) {
        RESPONSE_META.id = r.response.id;
        RESPONSE_META.updatedAt = r.response.updated_at || r.response.updatedAt;
      }
    } else if (r && r.response) {
      RESPONSE_META = {
        id: r.response.id,
        status: r.response.status,
        updatedAt: r.response.updated_at || r.response.updatedAt,
      };
    }
    return r;
  } catch (e) {
    setSave('Offline — retrying', 'warn');
    saveTimer = setTimeout(() => saveDraft(submit), 4000);
    return null;
  } finally {
    saving = false;
  }
}

async function retakeSurvey() {
  if (!STORE) return;
  if (!confirm('Start a new survey for this store? Your previous submitted answers stay on record and will still count in division results.')) {
    return;
  }
  setSave('Starting new survey…', '');
  try {
    const r = await api(`/api/survey/stores/${STORE}/retake`, { method: 'POST', body: '{}' });
    if (!r || !r.ok) {
      setSave((r && r.error) || 'Retake failed', 'warn');
      return;
    }
    ANSWERS = {};
    PHOTOS = [];
    dirty = false;
    RESPONSE_META = {
      id: r.response.id,
      status: 'draft',
      updatedAt: r.response.updated_at || r.response.updatedAt || new Date().toISOString(),
    };
    if (ME && ME.storeDetails) {
      const sn = Number(STORE);
      ME.storeDetails = ME.storeDetails.map((s) =>
        Number(s.storeNum) === sn ? { ...s, status: 'draft', updatedAt: new Date().toISOString() } : s
      );
    }
    setSave('New survey started', 'saved');
    QINDEX = 0;
    rebuildFlat();
    renderQuestion();
  } catch (e) {
    setSave(e.message || 'Retake failed', 'warn');
  }
}

function storeMetaMap() {
  const map = new Map();
  const catalog = ME.catalog || { stores: [] };
  const detailList = ME.storeDetails || [];
  for (const s of (catalog.stores || [])) {
    map.set(Number(s.storeNum), {
      storeNum: Number(s.storeNum),
      district: s.district || '?',
      storeName: s.storeName || s.store_name || null,
      status: null,
      suggested: false,
      updatedAt: null,
    });
  }
  for (const s of detailList) {
    const sn = Number(s.storeNum);
    const prev = map.get(sn) || { storeNum: sn, district: s.district || '?', suggested: false };
    map.set(sn, {
      ...prev,
      district: s.district || prev.district || '?',
      storeName: s.storeName || s.store_name || prev.storeName || null,
      status: s.status || null,
      suggested: !!(s.suggested || prev.suggested),
      updatedAt: s.updatedAt || s.updated_at || null,
    });
  }
  const suggested = ME.suggestedStores || [];
  for (const sn of suggested) {
    const n = Number(sn);
    const prev = map.get(n) || { storeNum: n, district: '?', status: null };
    map.set(n, { ...prev, suggested: true });
  }
  return map;
}

function formatScheduleDate(iso) {
  if (!iso) return '';
  try {
    const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
  } catch {
    return String(iso);
  }
}

function formatUpdated(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  } catch {
    return '';
  }
}

function recentStores(meta) {
  const out = [];
  for (const s of (ME.storeDetails || [])) {
    if (!s.status) continue;
    const sn = Number(s.storeNum);
    const m = meta.get(sn) || s;
    out.push({
      storeNum: sn,
      district: m.district || s.district || '?',
      storeName: m.storeName || s.storeName || s.store_name || null,
      status: s.status,
      updatedAt: s.updatedAt || s.updated_at || null,
      suggested: !!(m.suggested),
    });
  }
  out.sort((a, b) => {
    const ta = a.updatedAt ? new Date(a.updatedAt).getTime() : 0;
    const tb = b.updatedAt ? new Date(b.updatedAt).getTime() : 0;
    return tb - ta;
  });
  return out;
}

/** Today's scheduled store numbers (full day list). Current/primary store first. */
function scheduleStoreNums() {
  const nums = [];
  const seen = new Set();
  const push = (raw) => {
    const n = Number(raw);
    if (!Number.isFinite(n) || seen.has(n)) return;
    seen.add(n);
    nums.push(n);
  };
  const primary = ME.primaryStore != null ? Number(ME.primaryStore) : null;
  if (primary != null) push(primary);
  for (const a of (ME.scheduleToday || [])) push(a.storeNum);
  if (!nums.length) {
    for (const sn of (ME.suggestedStores || [])) push(sn);
  }
  if (!nums.length && ME.primaryStore != null) push(ME.primaryStore);
  return nums;
}

function scheduleWeekByDate() {
  const rows = ME.scheduleWeek || [];
  const map = new Map();
  for (const a of rows) {
    const d = String(a.date || '').slice(0, 10);
    if (!d) continue;
    if (!map.has(d)) map.set(d, []);
    const sn = Number(a.storeNum);
    if (!map.get(d).includes(sn)) map.get(d).push(sn);
  }
  return [...map.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}

/** Submitted stores leave Today's list; drafts stay until submit. */
function isCompletedSurvey(meta, sn) {
  return (meta.get(Number(sn)) || {}).status === 'submitted';

          <a href="/survey/user-guide.html" target="_blank" rel="noopener noreferrer">Store Survey guide</a>.
          Supervisors and managers assigning coverage:
          <a href="/survey-admin/user-guide.html" target="_blank" rel="noopener noreferrer">Survey Admin guide</a>.</p>
      </div>
    </details>
    <div class="card">
      <div class="eyebrow">Division 701</div>
      <div class="qtext" style="margin-bottom:8px">Your stores</div>
      <div class="note">${noteHtml}</div>

      <div class="sel-section">
        <h2>Today's stores</h2>
        <div class="sel-list" id="sel-list">${selectionHtml}</div>
        <p class="hint" style="margin-top:10px">Open a store to answer questions. After you submit, it leaves this list and appears under In progress &amp; completed.</p>
      </div>

      ${weekHtml}

      <div class="sel-section">
        <h2>In progress &amp; completed</h2>
        <div class="sel-list">${recentHtml}</div>
      </div>

      <div class="sel-section">
        <h2>Change / pick a store</h2>
        <div class="add-store">
          <div>
            <label for="f-dist">District</label>
            <select id="f-dist">
              <option value="">Select district…</option>
              ${distOpts}
            </select>
          </div>
          <div>
            <label for="f-store">Store in district</label>
            <div class="add-row">
              <select id="f-store" ${storeSelectDisabled ? 'disabled' : ''}>
                <option value="">${esc(storePlaceholder)}</option>
                ${storeOpts}
              </select>
              <button type="button" id="btn-use-store" ${!addStorePick ? 'disabled' : ''}>Use store</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;

  $('#f-dist').onchange = (e) => {
    addDistrict = e.target.value;
    addStorePick = '';
    renderPicker();
  };
  $('#f-store').onchange = (e) => {
    addStorePick = e.target.value;
    const btn = $('#btn-use-store');
    if (btn) btn.disabled = !addStorePick;
  };
  const howtoEl = $('#survey-howto');
  if (howtoEl) {
    howtoEl.addEventListener('toggle', () => {
      try {
        if (howtoEl.open) localStorage.removeItem('surveyHowtoCollapsed');
        else localStorage.setItem('surveyHowtoCollapsed', '1');
      } catch (_) { /* ignore */ }
    });
  }

  $('#btn-use-store').onclick = () => {
    const sn = Number(addStorePick);
    if (!Number.isFinite(sn)) return;
    if (!confirmCompletedStore(sn, meta)) return;
    SELECTED_STORE = sn;
    // Already submitted → open from In progress path, not Today's list
    if (isCompletedSurvey(meta, sn)) {
      openStore(sn, { preferAnswers: true });
      return;
    }
    renderPicker();
  };
  main.querySelectorAll('[data-clear]').forEach((btn) => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const clearSn = Number(btn.dataset.clearStore);
      if (Number.isFinite(clearSn) && SELECTED_STORE === clearSn) SELECTED_STORE = null;
      else if (!Number.isFinite(clearSn)) SELECTED_STORE = null;
      addStorePick = '';
      renderPicker();
    };
  });
  main.querySelectorAll('[data-select-store]').forEach((el) => {
    el.onclick = (e) => {
      if (e.target.closest('[data-clear]')) return;
      SELECTED_STORE = Number(el.dataset.selectStore);
      renderPicker();
    };
  });
  main.querySelectorAll('[data-open-store]').forEach((btn) => {
    btn.onclick = () => {
      const sn = Number(btn.dataset.openStore);
      if (!confirmCompletedStore(sn, meta)) return;
      SELECTED_STORE = sn;
      openStore(sn, { preferAnswers: true });
    };
  });

  $('#stepnav').hidden = false;
  $('#btn-back').textContent = 'Clear';
  $('#btn-next').textContent = 'Open store';
  updatePickerNext();
}

function updatePickerNext() {
  const btn = $('#btn-next');
  if (PHASE === 'pick') {
    btn.disabled = SELECTED_STORE == null;
    btn.className = '';
    btn.textContent = SELECTED_STORE != null
      ? 'Open · ' + storeLabel(SELECTED_STORE)
      : 'Open store';
  }
}

async function openStore(storeNum, opts = {}) {
  const preferAnswers = !!opts.preferAnswers;
  const jumpTo = opts.jumpTo != null ? Number(opts.jumpTo) : null;
  STORE = Number(storeNum);
  SELECTED_STORE = STORE;
  STORE_NAME = lookupStoreName(STORE);
  clearTimeout(autoAdvanceTimer);
  setSave('Loading…', '');
  const ctx = await api(`/api/survey/stores/${STORE}/context`);
  STORE_NAME = (ctx.store && (ctx.store.storeName || ctx.store.store_name)) || STORE_NAME || null;
  ANSWERS = ctx.myResponse ? { ...ctx.myResponse.answers } : {};
  RESPONSE_META = ctx.myResponse
    ? {
        id: ctx.myResponse.id,
        status: ctx.myResponse.status,
        updatedAt: ctx.myResponse.updated_at || ctx.myResponse.updatedAt,
      }
    : null;
  // Recover unsaved local edits if newer than server draft (refresh / crash / offline)
  if (!RESPONSE_META || RESPONSE_META.status === 'draft') {
    const local = readLocalDraft(STORE);
    if (local && local.answers && typeof local.answers === 'object') {
      const serverAt = RESPONSE_META?.updatedAt ? new Date(RESPONSE_META.updatedAt).getTime() : 0;
      const localAt = Number(local.updatedAt) || 0;
      if (!serverAt || localAt >= serverAt) {
        ANSWERS = { ...ANSWERS, ...local.answers };
        dirty = true;
        setSave('Restored unsaved answers — syncing…', '');
      }
    }
  }
  MY_SUBMISSIONS = ctx.mySubmissions || [];
  const ph = await api(`/api/survey/stores/${STORE}/photos`);
  PHOTOS = (ph.photos || []).filter((p) => p.respondent === ME.user.email);
  BASELINE = {};
  for (const b of ctx.baseline || []) Object.assign(BASELINE, b.answers || {});
  SUGGESTIONS = ctx.suggestions || ME.suggestions || { byQuestion: {}, crossStoreAnswers: {} };
  rebuildFlat();
  if (dirty && !isLocked()) {
    saveDraft(false);
  } else {
    setSave(isLocked() ? 'Submitted — locked' : '', isLocked() ? 'saved' : '');
  }

  const hasAnyAnswer = Object.keys(ANSWERS).some((k) => {
    if (k.endsWith('_c') || k.endsWith('_d')) return false;
    const v = ANSWERS[k];
    return v != null && v !== '' && !(Array.isArray(v) && !v.length);
  });

  if (jumpTo != null && Number.isFinite(jumpTo) && !isLocked()) {
    QINDEX = Math.max(0, Math.min(jumpTo, FLAT.length));
    renderQuestion();
    return;
  }

  if (isLocked() || preferAnswers || hasAnyAnswer) {
    renderAnswerList();
    return;
  }

  // Fresh store — start survey
  QINDEX = 0;
  renderQuestion();
}

function rebuildFlat() {
  FLAT = flattenQuestions(SPEC, ANSWERS);
}

// ─── Answer list (review / edit hub for a store) ─────────────────────────────
function renderAnswerList() {
  PHASE = 'answers';
  clearTimeout(autoAdvanceTimer);
  rebuildFlat();
  setProgress();
  $('#stepnav').hidden = false;
  $('#hdr-title').textContent = `${storeLabel(STORE)} · Answers`;

  let answered = 0, total = 0;
  let html = '';
  FLAT.forEach((q, i) => {
    total++;
    const ok = hasAnswerValue(q);
    if (ok) answered++;
    const disp = displayAnswer(q);
    const label = disp == null
      ? '<span class="a empty">Not answered</span>'
      : `<span class="a">${esc(disp)}</span>`;
    const editHint = isLocked()
      ? '<div class="edit-hint">Locked</div>'
      : '<div class="edit-hint">Tap to edit</div>';
    html += `<button type="button" class="answer-row" data-jump="${i}">
      <span class="num">${esc(q.id.replace(/^Q/, ''))}</span>
      <span class="body">
        <div class="q">${esc(fillStoreVars(q.text))}</div>
        ${label}
        ${editHint}
      </span>
    </button>`;
  });

  const subCount = MY_SUBMISSIONS.length || (isLocked() ? 1 : 0);
  const statusLabel = isLocked()
    ? `Submitted & locked${subCount > 1 ? ` · ${subCount} submissions on record` : ''}`
    : (RESPONSE_META?.status === 'draft' || answered > 0 ? 'Draft saved' : 'Not started');

  const actions = isLocked()
    ? `<button type="button" class="opt" id="btn-retake" style="text-align:center;background:var(--accent);color:#fff;border-color:var(--accent)">Retake survey</button>
       <button type="button" class="opt" id="btn-view-locked" style="text-align:center">Review answers</button>`
    : `<button type="button" class="opt" id="btn-continue-survey" style="text-align:center;background:var(--accent);color:#fff;border-color:var(--accent)">Continue survey</button>
       <button type="button" class="opt" id="btn-review-end" style="text-align:center">Review &amp; submit</button>`;

  main.innerHTML = `
    <div class="card">
      <div class="eyebrow">${esc(storeLabel(STORE))}</div>
      <div class="qtext" style="margin-bottom:6px">${answered} of ${total} answered</div>
      <div class="hint">${statusLabel}. ${isLocked()
        ? 'These answers stay on record. Retake to add a new submission for this store — prior data is not overwritten.'
        : 'Every question is optional — skip any you don’t know. Tap a question to edit. Use Home to switch stores anytime — progress is saved.'}</div>
      <div class="stack-actions">${actions}</div>
    </div>
    <div class="card" style="padding:10px">${html || '<div class="sel-empty">No questions loaded.</div>'}</div>`;

  main.querySelectorAll('[data-jump]').forEach((b) => {
    b.onclick = () => {
      QINDEX = Number(b.dataset.jump);
      renderQuestion();
    };
  });
  const btnRetake = $('#btn-retake');
  if (btnRetake) btnRetake.onclick = () => retakeSurvey();
  const btnViewLocked = $('#btn-view-locked');
  if (btnViewLocked) {
    btnViewLocked.onclick = () => {
      QINDEX = 0;
      renderQuestion();
    };
  }
  const btnContinue = $('#btn-continue-survey');
  if (btnContinue) {
    btnContinue.onclick = () => {
      QINDEX = 0;
      for (let i = 0; i < FLAT.length; i++) {
        if (!hasAnswerValue(FLAT[i])) { QINDEX = i; break; }
        QINDEX = i;
      }
      if (FLAT.length && FLAT.every(hasAnswerValue)) QINDEX = FLAT.length;
      renderQuestion();
    };
  }
  const btnReview = $('#btn-review-end');
  if (btnReview) {
    btnReview.onclick = () => {
      QINDEX = FLAT.length;
      renderReview();
    };
  }

  $('#btn-back').textContent = 'Home';
  $('#btn-next').textContent = isLocked() ? 'Retake' : 'Continue';
  $('#btn-next').className = '';
  $('#btn-next').disabled = false;
}

// ─── One question at a time ──────────────────────────────────────────────────
function renderQuestion(opts = {}) {
  PHASE = 'survey';
  setProgress();
  $('#stepnav').hidden = false;
  $('#btn-back').textContent = QINDEX <= 0 ? 'Answers' : 'Back';

  if (QINDEX >= FLAT.length) {
    renderReview();
    return;
  }

  const q = FLAT[QINDEX];
  $('#hdr-title').textContent = `${storeLabel(STORE)} · ${q.section}`;
  $('#btn-next').textContent = isLocked()
    ? (QINDEX >= FLAT.length - 1 ? 'Done' : 'Next')
    : (QINDEX >= FLAT.length - 1 ? 'Review' : 'Next');
  $('#btn-next').className = '';
  $('#btn-next').disabled = false;

  const common = isLocked() ? '' : commonChip(q);
  const body = questionBody(q);
  const photo = photoBlock(q);
  const comment = commentBlock(q);
  const qDisplay = fillStoreVars(q.text);
  const lockNote = isLocked()
    ? '<div class="note" style="margin-top:8px">Submitted answers are locked. Retake to add a new response for this store.</div>'
    : '';
  const skipHint = !isLocked() && !hasAnswerValue(q)
    ? '<p class="skip-hint">Optional — tap Next if you don’t know or prefer not to answer.</p>'
    : '';

  main.innerHTML = `
    <div class="card" id="q-card" tabindex="-1">
      <div class="meta-line">Question ${QINDEX + 1} of ${FLAT.length} · ${esc(q.sectionTitle || q.section)}${isLocked() ? ' · locked' : ''}</div>
      <div class="eyebrow">${esc(storeLabel(STORE))}</div>
      <div class="qtext">${esc(q.id.replace(/^Q/, '') + '. ' + qDisplay)}</div>
      ${lockNote}
      ${common}
      ${body}
      ${skipHint}
      ${photo}
      ${comment}
    </div>`;

  if (isLocked()) {
    main.querySelectorAll('button.opt, input, textarea, button.photo-add, [data-del]').forEach((el) => {
      el.disabled = true;
      el.style.pointerEvents = 'none';
      el.style.opacity = '0.85';
    });
  } else {
    wireQuestion(q);
  }
  // Keep focus at the top of the card so the question can be read first
  // (do not auto-focus text inputs — that jumps the view and opens the keyboard)
  const card = $('#q-card');
  if (card) {
    card.scrollIntoView({ block: 'start', behavior: 'smooth' });
    requestAnimationFrame(() => {
      try { card.focus({ preventScroll: true }); } catch (_) {
        try { card.focus(); } catch (__) {}
      }
    });
  }
}

function examplesBlock(examples, label) {
  if (!examples || !examples.length) return '';
  const title = label || 'Examples';
  return `<div class="note" style="margin-top:10px">
    <div style="font-weight:600;margin-bottom:6px">${esc(title)}</div>
    <ul style="margin:0;padding-left:18px">
      ${examples.map((ex) => `<li style="margin-bottom:4px">${esc(ex)}</li>`).join('')}
    </ul>
  </div>`;
}

function questionBody(q) {
  if (q.type === 'yesno' || q.type === 'choice') {
    const opts = q.type === 'yesno' ? ['Yes', 'No'] : (q.options || []);
    const cls = opts.length <= 4 ? 'opts row' : 'opts';
    let html = `<div class="${cls}" role="group">` +
      opts.map((o) =>
        `<button type="button" class="opt" data-q="${q.id}" data-val="${escAttr(o)}" aria-pressed="${ANSWERS[q.id] === o}">${esc(o)}</button>`
      ).join('') + '</div>';
    if (q.detailOn && ANSWERS[q.id] === q.detailOn) {
      const ph = q.detailPlaceholder || 'Please explain / name';
      html += `<div class="suggest-wrap" style="margin-top:10px"><input type="text" data-tq="${q.id}_d" value="${escAttr(ANSWERS[q.id + '_d'] || '')}" placeholder="${escAttr(ph)} (optional)" autocomplete="off" enterkeyhint="done"></div>`;
      html += `<p class="skip-hint">Optional — tap Next to continue without explaining.</p>`;
      html += examplesBlock(q.detailExamples, q.detailExamplesLabel || 'Suggestions');
    }
    return html;
  }
  if (q.type === 'multiselect') {
    const cur = ANSWERS[q.id] || [];
    return `<div class="opts">` +
      (q.options || []).map((o) =>
        `<button type="button" class="opt" data-mq="${q.id}" data-val="${escAttr(o)}" aria-pressed="${cur.includes(o)}">${esc(o)}</button>`
      ).join('') + '</div>';
  }
  const ph = q.placeholder || 'Type your answer';
  return examplesBlock(q.examples, q.examplesLabel || 'Examples') +
    `<div class="suggest-wrap"><input type="text" data-tq="${q.id}" value="${escAttr(ANSWERS[q.id] || '')}" placeholder="${escAttr(ph)} (optional)" autocomplete="off" enterkeyhint="done"></div>` +
    `<p class="skip-hint">Optional — tap Next to skip this question.</p>`;
}

function commentBlock(q) {
  const key = q.id + '_c';
  const val = ANSWERS[key] || '';
  return `<details class="comment" ${val ? 'open' : ''}><summary>Add a comment</summary>
    <textarea data-comment="${q.id}" rows="2" placeholder="Optional notes for this answer">${esc(val)}</textarea>
  </details>`;
}

function photoBlock(q) {
  if (!q.photo) return '';
  const mine = PHOTOS.filter((p) => p.question_id === q.id);
  const tok = encodeURIComponent(sessionTok());
  return `<div class="note" style="margin-top:12px">A short description helps — a photo of the area is greatly appreciated when you can take one.</div>
    <div class="photo-row">
      ${mine.map((p) =>
        `<span class="thumb"><img src="${API}/api/survey/photos/${p.id}?access_token=${tok}" alt=""><button type="button" data-del="${p.id}" aria-label="Remove">×</button></span>`
      ).join('')}
      <button type="button" class="photo-add" data-add="${q.id}" aria-label="Add photo">📷</button>
    </div>`;
}

function commonInfo(qid) {
  const map = (SUGGESTIONS && SUGGESTIONS.commonByQuestion) || {};
  const c = map[qid];
  if (!c) return null;
  if (typeof c === 'string') return { value: c, n: 0, source: 'good' };
  if (c.value == null || c.value === '') return null;
  return c;
}

/** "Common: Yes" — tappable to apply. Hides once this question is answered. */
function commonChip(q) {
  if (ANSWERS[q.id] != null && ANSWERS[q.id] !== '' && !(Array.isArray(ANSWERS[q.id]) && !ANSWERS[q.id].length)) {
    return '';
  }
  const c = commonInfo(q.id);
  if (!c) return '';
  const val = String(c.value);
  // Multiselect common may be comma-joined; still offer as one-tap when single token matches an option
  let applyVal = val;
  if (q.type === 'multiselect') {
    applyVal = val.includes(',') ? val.split(',').map((s) => s.trim()).filter(Boolean) : [val];
  }
  const label = Array.isArray(applyVal) ? applyVal.join(', ') : applyVal;
  if (!label || label.length > 80) return '';
  const countHint = c.n > 0 ? ` · ${c.n} answers` : '';
  const dataVal = Array.isArray(applyVal) ? applyVal.join('\u001f') : applyVal;
  return `<div class="common-wrap">
    <button type="button" class="chip common" data-common="${escAttr(q.id)}" data-common-val="${escAttr(dataVal)}" data-common-multi="${q.type === 'multiselect' ? '1' : '0'}">
      Common: ${esc(label)}${esc(countHint)}
    </button>
  </div>`;
}

function suggestionsFor(qid) {
  return (SUGGESTIONS.byQuestion && SUGGESTIONS.byQuestion[qid]) || [];
}

function wireTypeahead(input, qid) {
  const wrap = input.closest('.suggest-wrap') || input.parentElement;
  let panel = wrap.querySelector('.suggest-list');
  if (!panel) {
    panel = document.createElement('div');
    panel.className = 'suggest-list';
    wrap.appendChild(panel);
  }
  const all = suggestionsFor(qid);
  const show = (filter) => {
    const f = String(filter || '').toLowerCase();
    const opts = all.filter((v) => !f || String(v).toLowerCase().includes(f)).slice(0, 8);
    if (!opts.length) { panel.classList.remove('open'); panel.innerHTML = ''; return; }
    panel.innerHTML = opts.map((v) =>
      `<button type="button" data-val="${escAttr(String(v))}">${esc(String(v))}</button>`
    ).join('');
    panel.classList.add('open');
    placeFloatingMenu(input, panel, 220);
    panel.querySelectorAll('button').forEach((b) => {
      b.onmousedown = (e) => e.preventDefault();
      b.onclick = () => {
        input.value = b.dataset.val;
        ANSWERS[qid] = b.dataset.val;
        markDirty();
        panel.classList.remove('open', 'drop-up');
        panel.style.maxHeight = '';
        refreshNextEnabled();
      };
    });
  };
  input.addEventListener('focus', () => show(input.value));
  input.addEventListener('input', () => {
    ANSWERS[qid] = input.value;
    markDirty();
    show(input.value);
    refreshNextEnabled();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      panel.classList.remove('open');
      input.blur();
      // After text entry, allow advancing if complete
      if (PHASE === 'survey' && isAnswered(FLAT[QINDEX])) {
        goNext(false);
      }
    }
  });
  input.addEventListener('blur', () => setTimeout(() => {
    panel.classList.remove('open', 'drop-up');
    panel.style.maxHeight = '';
  }, 120));
}

/** Advance to next question (or review). Auto-save first. */
async function goNext(fromAuto) {
  if (PHASE === 'pick') {
    if (SELECTED_STORE == null) return;
    if (!confirmCompletedStore(SELECTED_STORE)) return;
    await openStore(SELECTED_STORE, { preferAnswers: true });
    return;
  }
  if (PHASE === 'answers') {
    if (isLocked()) {
      await retakeSurvey();
      return;
    }
    QINDEX = 0;
    for (let i = 0; i < FLAT.length; i++) {
      if (!hasAnswerValue(FLAT[i])) { QINDEX = i; break; }
      QINDEX = i;
    }
    if (FLAT.length && FLAT.every(hasAnswerValue)) QINDEX = FLAT.length;
    renderQuestion();
    return;
  }
  if (PHASE === 'survey' && QINDEX >= FLAT.length) {
    if (isLocked()) {
      renderAnswerList();
      return;
    }
    const r = await saveDraft(true);
    if (r && r.ok) {
      PHASE = 'done';
      MY_SUBMISSIONS = [...MY_SUBMISSIONS, { id: r.response?.id, status: 'submitted', submittedAt: r.response?.submitted_at }];
      $('#stepnav').hidden = true;
      main.innerHTML = `<div class="card">
          <div class="qtext">${esc(storeLabel(STORE))} submitted. ✓</div>
          <div class="hint">Answers are locked and kept on record. Retake anytime to add another submission for this store — previous data is not overwritten.</div>
          <div class="stack-actions">
            <button type="button" class="opt" id="btn-done-answers" style="text-align:center">View answers</button>
            <button type="button" class="opt" id="btn-done-retake" style="text-align:center">Retake survey</button>
            <button type="button" class="opt" id="btn-done-home" style="text-align:center;background:var(--accent);color:#fff;border-color:var(--accent)">Home</button>
          </div>
        </div>`;
      $('#btn-done-answers').onclick = () => renderAnswerList();
      $('#btn-done-retake').onclick = () => retakeSurvey();
      $('#btn-done-home').onclick = () => goHome();
    }
    return;
  }
  if (PHASE !== 'survey') return;
  const q = FLAT[QINDEX];
  if (!isLocked()) await saveDraft(false);
  QINDEX++;
  rebuildFlat();
  if (QINDEX > FLAT.length) QINDEX = FLAT.length;
  renderQuestion();
}

function wireQuestion(q) {
  main.querySelectorAll('.opt[data-q]').forEach((b) => {
    b.onclick = () => {
      const val = b.dataset.val;
      ANSWERS[b.dataset.q] = val;
      // Clear stale detail if no longer needed
      if (q.detailOn && val !== q.detailOn) {
        delete ANSWERS[q.id + '_d'];
      }
      markDirty();
      rebuildFlat();
      const idx = FLAT.findIndex((x) => x.id === q.id);
      if (idx >= 0) QINDEX = idx;

      const needsDetail = q.detailOn && val === q.detailOn;
      if (needsDetail) {
        // Show detail text field; keep focus at top of card for reading
        renderQuestion();
        return;
      }

      // Yes/No and single-choice: auto-advance when fully answered
      if ((q.type === 'yesno' || q.type === 'choice') && isAnswered(q)) {
        // Brief visual update then advance
        main.querySelectorAll(`.opt[data-q="${q.id}"]`).forEach((el) => {
          el.setAttribute('aria-pressed', el.dataset.val === val ? 'true' : 'false');
        });
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = setTimeout(() => goNext(true), 180);
        return;
      }

      renderQuestion();
      refreshNextEnabled();
    };
  });
  main.querySelectorAll('.opt[data-mq]').forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.mq, val = b.dataset.val;
      let cur = ANSWERS[id] || [];
      if (val === 'None') cur = cur.includes('None') ? [] : ['None'];
      else {
        cur = cur.filter((x) => x !== 'None');
        cur = cur.includes(val) ? cur.filter((x) => x !== val) : [...cur, val];
      }
      ANSWERS[id] = cur;
      markDirty();
      // Multiselect: never auto-advance
      renderQuestion();
    };
  });
  main.querySelectorAll('input[data-tq]').forEach((i) => wireTypeahead(i, i.dataset.tq));
  main.querySelectorAll('textarea[data-comment]').forEach((t) => {
    t.oninput = () => { ANSWERS[t.dataset.comment + '_c'] = t.value; markDirty(); };
  });
  main.querySelectorAll('.chip[data-common]').forEach((c) => {
    c.onclick = () => {
      const qid = c.dataset.common;
      const multi = c.dataset.commonMulti === '1';
      const raw = c.dataset.commonVal || '';
      if (multi) {
        ANSWERS[qid] = raw.split('\u001f').filter(Boolean);
      } else {
        ANSWERS[qid] = raw;
      }
      markDirty();
      rebuildFlat();
      const idx = FLAT.findIndex((x) => x.id === qid);
      if (idx >= 0) QINDEX = idx;
      const cur = FLAT[QINDEX];
      const needsDetail = cur && cur.detailOn && ANSWERS[qid] === cur.detailOn;
      if (needsDetail) {
        renderQuestion();
        return;
      }
      // Auto-advance for yes/no and choice when fully answered
      if (cur && (cur.type === 'yesno' || cur.type === 'choice') && isAnswered(cur)) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = setTimeout(() => goNext(true), 180);
        renderQuestion();
        return;
      }
      renderQuestion();
    };
  });
  main.querySelectorAll('[data-add]').forEach((b) => {
    b.onclick = () => addPhoto(b.dataset.add);
  });
  main.querySelectorAll('[data-del]').forEach((b) => {
    b.onclick = async () => {
      await api('/api/survey/photos/' + b.dataset.del, { method: 'DELETE' });
      PHOTOS = PHOTOS.filter((p) => p.id !== Number(b.dataset.del));
      markDirty();
      renderQuestion();
    };
  });
  refreshNextEnabled();
}

function refreshNextEnabled() {
  if (PHASE !== 'survey' || QINDEX >= FLAT.length) return;
  $('#btn-next').disabled = false;
}

function renderReview() {
  if (isLocked()) {
    renderAnswerList();
    return;
  }
  PHASE = 'survey';
  $('#hdr-title').textContent = `${storeLabel(STORE)} · Review`;
  let answered = 0, total = 0;
  let html = '';
  rebuildFlat();
  FLAT.forEach((q, i) => {
    total++;
    const ok = hasAnswerValue(q);
    if (ok) answered++;
    const disp = displayAnswer(q);
    const label = disp == null
      ? '<span style="color:var(--danger)">Not answered</span>'
      : esc(disp);
    const qDisplay = fillStoreVars(q.text);
    html += `<button type="button" class="answer-row" data-jump="${i}">
      <span class="num">${esc(q.id.replace(/^Q/, ''))}</span>
      <span class="body">
        <div class="q">${esc(qDisplay.slice(0, 72))}${qDisplay.length > 72 ? '…' : ''}</div>
        <div class="a">${label}</div>
        <div class="edit-hint">Tap to edit</div>
      </span>
    </button>`;
  });
  main.innerHTML = `
    <div class="card">
      <div class="qtext">${answered} of ${total} answered</div>
      <div class="hint">Every question is optional. Tap any question to change it, or submit with blanks. Submit locks this response on record. A later retake adds a new submission — it does not overwrite this one.</div>
    </div>
    <div class="card" style="padding:10px">${html}</div>`;
  main.querySelectorAll('[data-jump]').forEach((b) => {
    b.onclick = () => { QINDEX = Number(b.dataset.jump); renderQuestion(); };
  });
  $('#btn-back').textContent = 'Answers';
  $('#btn-next').textContent = 'Submit store';
  $('#btn-next').className = 'submit';
  $('#btn-next').disabled = false;
  setProgress();
}

function addPhoto(questionId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    setSave('Adding photo…', '');
    try {
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = rej;
        i.src = URL.createObjectURL(file);
      });
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const b64 = cv.toDataURL('image/jpeg', 0.72).split(',')[1];
      const r = await api(`/api/survey/stores/${STORE}/photos`, {
        method: 'POST',
        body: JSON.stringify({ questionId, mime: 'image/jpeg', data: b64 }),
      });
      if (r.ok) {
        PHOTOS.push({ ...r.photo, respondent: ME.user.email });
        markDirty();
        renderQuestion();
      } else setSave(r.error || 'Photo failed', 'warn');
    } catch {
      setSave('Photo failed', 'warn');
    }
  };
  input.click();
}

// ─── Nav ─────────────────────────────────────────────────────────────────────
$('#btn-back').onclick = async () => {
  clearTimeout(autoAdvanceTimer);
  if (PHASE === 'pick') {
    SELECTED_STORE = null;
    addStorePick = '';
    renderPicker();
    return;
  }
  if (PHASE === 'answers') {
    await goHome();
    return;
  }
  if (!isLocked()) await saveDraft(false);
  if (QINDEX >= FLAT.length) {
    // Review → answer list
    renderAnswerList();
    return;
  }
  if (QINDEX <= 0) {
    renderAnswerList();
    return;
  }
  QINDEX--;
  rebuildFlat();
  if (QINDEX >= FLAT.length) QINDEX = FLAT.length - 1;
  renderQuestion();
};

$('#btn-next').onclick = async () => {
  clearTimeout(autoAdvanceTimer);
  await goNext(false);
};

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && STORE && !isLocked()) {
    writeLocalDraft();
    saveDraft(false);
  }
});
window.addEventListener('pagehide', () => {
  if (!STORE || isLocked()) return;
  writeLocalDraft();
  try {
    const body = JSON.stringify({
      answers: ANSWERS,
      photos: PHOTOS.map((p) => ({ id: p.id, questionId: p.question_id })),
      submit: false,
    });
    fetch(API + `/api/survey/stores/${STORE}/response`, {
      method: 'PUT',
      headers: authHeaders(),
      body,
      keepalive: true,
    }).catch(() => {});
  } catch (_) {}
});
window.addEventListener('beforeunload', (e) => {
  if (dirty && STORE) {
    writeLocalDraft();
    e.preventDefault();
    e.returnValue = '';
  }
});

(async function init() {
  try {
    if (window.dumpBinAuthReady) await window.dumpBinAuthReady;
    const [me, q] = await Promise.all([api('/api/survey/me'), api('/api/survey/questions')]);
    if (!me.ok) {
      main.innerHTML = `<div class="card">${esc(me.error || 'Not on survey roster')}</div>`;
      return;
    }
    ME = me;
    SPEC = q.questionSet.spec;
    SUGGESTIONS = me.suggestions || { byQuestion: {}, crossStoreAnswers: {} };
    const params = new URLSearchParams(location.search || '');
    const deepStore = Number(params.get('store'));
    if (Number.isFinite(deepStore) && deepStore > 0) {
      SELECTED_STORE = deepStore;
      await openStore(deepStore, { preferAnswers: true });
    } else {
      renderPicker();
    }
  } catch (e) {
    console.error(e);
    main.innerHTML = `<div class="card">Could not load the survey. Check your connection.</div>`;
  }
})();
})();
</script>
