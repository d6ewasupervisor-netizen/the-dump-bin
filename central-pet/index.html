<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Opening Central Pet Scheduler…</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">

  <script src="/auth-gate.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6fa;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 4px 12px rgba(0,0,0,.06);
      text-align: center;
    }
    h1 { font-size: 1.15rem; margin: 0 0 8px; color: #1a3a6e; }
    p { margin: 0; color: #6b7280; line-height: 1.5; font-size: .95rem; }
    .err { color: #b91c1c; margin-top: 12px; }
    a { color: #1a3a6e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Central Pet Scheduler</h1>
    <p id="status">Opening with your Dump Bin sign-in…</p>
    <p id="error" class="err" hidden></p>
  </div>
  <script>
    (function () {
      'use strict';

      var CP_BASE = 'https://cpscheduler-production.up.railway.app';
      var SESSION_KEY = 'dumpBinSession';
      var LEGACY_KEY = 'eodSession';

      function getSession() {
        try {
          return localStorage.getItem(SESSION_KEY) || localStorage.getItem(LEGACY_KEY) || '';
        } catch (_) {
          return '';
        }
      }

      function targetPath() {
        var q = new URLSearchParams(location.search);
        var to = (q.get('to') || q.get('dest') || 'dashboard').toLowerCase();
        if (to === 'admin' || to === 'desk' || to === 'planning' || to === 'index') return '/';
        if (to === 'dashboard' || to === 'home' || to === 'team') return '/dashboard.html';
        if (to === 'rep' || to === 'week') return '/rep.html';
        if (to === 'shiftday' || to === 'shift') return '/shiftday.html';
        if (to === 'signin') return '/signin.html';
        return '/dashboard.html';
      }

      function showError(msg) {
        document.getElementById('status').textContent = 'Could not open Central Pet.';
        var el = document.getElementById('error');
        el.hidden = false;
        el.innerHTML = msg;
      }

      function go() {
        var session = getSession();
        if (!session) {
          // auth-gate should have redirected already; fallback
          var next = encodeURIComponent('/central-pet/' + location.search);
          location.replace('/signin.html?next=' + next);
          return;
        }

        var path = targetPath();
        // Hash fragment keeps the JWT out of server access logs on the GET line.
        var url = CP_BASE + path + '#dbSession=' + encodeURIComponent(session);
        document.getElementById('status').textContent = 'Redirecting…';
        location.replace(url);
      }

      // Wait briefly for auth-gate boot if present
      if (window.dumpBinAuth && window.dumpBinAuth.bootPromise) {
        window.dumpBinAuth.bootPromise.then(go).catch(go);
      } else {
        setTimeout(go, 50);
      }
    })();
  </script>
</body>
</html>
