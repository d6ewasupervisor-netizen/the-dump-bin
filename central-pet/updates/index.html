<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Pet Updates — The Dump Bin</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/favicon.png?v=2">

  <link rel="stylesheet" href="/styles.css">
  <script src="/auth-gate.js"></script>
  <style>
    :root {
      --cp-green: #0b5d3a;
      --cp-green-2: #1a8a55;
      --cp-mint: #e8f5ee;
      --cp-line: #c8e6d4;
      --cp-ink: #1f2937;
      --cp-muted: #5a6b7d;
      --cp-bg: #f6faf7;
    }
    body { background: var(--cp-bg); }
    .cpu-page { max-width: 820px; margin: 0 auto; padding: 24px 14px 72px; }
    .cpu-hero {
      background: linear-gradient(135deg, var(--cp-green) 0%, var(--cp-green-2) 100%);
      color: #fff;
      border-radius: 10px;
      padding: 22px 24px;
      margin-bottom: 22px;
    }
    .cpu-hero .label {
      font-size: 11px; letter-spacing: 2px; font-weight: 700; opacity: 0.85;
    }
    .cpu-hero h1 { margin: 6px 0 8px; font-size: 1.6rem; line-height: 1.25; }
    .cpu-hero p { margin: 0; color: #eafaf1; font-size: 14px; line-height: 1.5; }
    .cpu-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .cpu-toolbar a {
      display: inline-block; padding: 8px 12px; border-radius: 8px;
      background: #fff; border: 1px solid var(--cp-line); color: var(--cp-green);
      text-decoration: none; font-size: 13px; font-weight: 600;
    }
    .cpu-status { color: var(--cp-muted); font-size: 14px; margin: 12px 0; }
    .cpu-card {
      background: #fff; border: 1px solid var(--cp-line); border-radius: 10px;
      padding: 16px 18px; margin-bottom: 14px; cursor: pointer;
      transition: box-shadow .15s ease, border-color .15s ease;
    }
    .cpu-card:hover, .cpu-card.open {
      border-color: var(--cp-green-2);
      box-shadow: 0 6px 18px rgba(11, 93, 58, 0.12);
    }
    .cpu-card .when { font-size: 12px; color: var(--cp-muted); margin-bottom: 4px; }
    .cpu-card h2 { margin: 0 0 6px; font-size: 1.15rem; color: var(--cp-green); }
    .cpu-card .summary { margin: 0; color: var(--cp-ink); font-size: 14px; line-height: 1.45; }
    .cpu-body {
      display: none; margin-top: 14px; padding-top: 14px;
      border-top: 1px solid var(--cp-line);
      cursor: default;
    }
    .cpu-card.open .cpu-body { display: block; }
    .cpu-frame {
      width: 100%; border: 0; min-height: 420px; background: var(--cp-mint);
      border-radius: 8px;
    }
    .cpu-atts { margin-top: 10px; font-size: 13px; color: var(--cp-muted); }
    .cpu-badge {
      display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px;
      background: var(--cp-mint); border: 1px solid var(--cp-line); color: var(--cp-green);
      font-size: 11px; font-weight: 700; letter-spacing: .5px; vertical-align: middle;
    }
    .cpu-doc { margin-bottom: 14px; }
    .cpu-doc-open {
      display: inline-block; padding: 10px 14px; border-radius: 8px;
      background: var(--cp-green); color: #fff; font-weight: 700; font-size: 14px;
      text-decoration: none;
    }
    .cpu-doc-frame {
      display: block; width: 100%; height: 80vh; min-height: 480px; margin-top: 12px;
      border: 1px solid var(--cp-line); border-radius: 8px; background: #fff;
    }
    .cpu-pager {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin: 18px 0 0;
    }
    .cpu-pager button {
      padding: 9px 14px; border-radius: 8px; border: 1px solid var(--cp-line);
      background: #fff; color: var(--cp-green); font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .cpu-pager button[disabled] { opacity: .4; cursor: default; }
    .cpu-pager .where { color: var(--cp-muted); font-size: 13px; }
  </style>
</head>
<body>
  <nav class="site-nav">
    <div class="site-nav__inner">
      <a href="/"><img src="/logo-banner.png" alt="Retail Odyssey Company" class="site-nav__logo"></a>
      <a href="/" class="site-nav__link">Home</a>
    </div>
  </nav>

  <main class="cpu-page">
    <section class="cpu-hero">
      <div class="label">CENTRAL PET UPDATES</div>
      <h1>Team callouts</h1>
    </section>

    <div class="cpu-toolbar" id="admin-bar" hidden>
      <a href="/central-pet/updates-admin/">Admin: roster &amp; publish</a>
    </div>

    <div class="cpu-status" id="status">Loading updates…</div>
    <div id="feed"></div>
    <nav class="cpu-pager" id="pager" hidden>
      <button type="button" id="newer">Newer</button>
      <span class="where" id="where"></span>
      <button type="button" id="older">Older</button>
    </nav>
  </main>

  <script>
    (function () {
      var PAGE_SIZE = 5;
      var feed = document.getElementById('feed');
      var statusEl = document.getElementById('status');
      var pager = document.getElementById('pager');
      var newerBtn = document.getElementById('newer');
      var olderBtn = document.getElementById('older');
      var whereEl = document.getElementById('where');
      var params = new URLSearchParams(location.search);
      var focusSlug = params.get('p') || '';
      var currentPage = Math.max(1, parseInt(params.get('page'), 10) || 1);
      var totalPages = 1;
      var docUrls = [];

      function fmtWhen(iso) {
        try {
          return new Date(iso).toLocaleString(undefined, {
            weekday: 'short', month: 'short', day: 'numeric',
            hour: 'numeric', minute: '2-digit'
          });
        } catch (_) { return iso; }
      }

      function setQuery(next) {
        var q = new URLSearchParams();
        if (next.page && next.page > 1) q.set('page', String(next.page));
        if (next.slug) q.set('p', next.slug);
        var qs = q.toString();
        try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch (_) {}
      }

      function releaseDocUrls() {
        docUrls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (_) {} });
        docUrls = [];
      }

      // Emails reference attached images by cid:, which a page cannot load.
      function resolveCidImages(html) {
        var logo = location.origin + '/central-pet/updates/ro-logo-email.png';
        return String(html || '')
          .replace(/(["'])cid:ro-logo\1/gi, '$1' + logo + '$1')
          .replace(/<img\b[^>]*\bsrc=["']cid:[^"']*["'][^>]*>/gi, '');
      }

      function renderBrief(container, html, atts) {
        html = resolveCidImages(html);
        var wrap = document.createElement('div');
        var attHtml = atts.length
          ? '<div class="cpu-atts"><strong>Attachments (on the email):</strong> '
            + atts.map(function (a) { return String(a); }).join(', ') + '</div>'
          : '';
        // allow-same-origin so we can size the frame; no allow-scripts
        wrap.innerHTML = '<iframe class="cpu-frame" title="Central Pet brief" sandbox="allow-same-origin allow-popups"></iframe>' + attHtml;
        container.appendChild(wrap);
        var iframe = wrap.querySelector('iframe');
        // Blob URL handles large inline-image emails better than srcdoc size limits
        var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        iframe.onload = function () {
          try { URL.revokeObjectURL(url); } catch (_) {}
          try {
            var doc = iframe.contentDocument;
            if (doc && doc.body) {
              var h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight, 420);
              iframe.style.height = Math.min(h + 24, 2400) + 'px';
            }
          } catch (_) {}
        };
        iframe.src = url;
      }

      function renderDocument(container, update) {
        var box = document.createElement('div');
        box.className = 'cpu-doc';
        box.innerHTML = '<div class="cpu-status">Loading full document…</div>';
        container.appendChild(box);
        dumpBinAuthFetch('/api/central-pet/updates/' + encodeURIComponent(update.slug) + '/document')
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.blob();
          })
          .then(function (blob) {
            var url = URL.createObjectURL(new Blob([blob], { type: 'application/pdf' }));
            docUrls.push(url);
            box.innerHTML = '';
            var open = document.createElement('a');
            open.className = 'cpu-doc-open';
            open.href = url;
            open.target = '_blank';
            open.rel = 'noopener';
            open.textContent = 'Open full document (PDF)';
            var frame = document.createElement('iframe');
            frame.className = 'cpu-doc-frame';
            frame.title = 'Full document';
            frame.src = url;
            box.appendChild(open);
            box.appendChild(frame);
          })
          .catch(function (err) {
            box.innerHTML = '<div class="cpu-status">Could not load the full document'
              + (err && err.message ? (' (' + err.message + ')') : '') + '.</div>';
          });
      }

      function openCard(card, update) {
        var wasOpen = card.classList.contains('open');
        document.querySelectorAll('.cpu-card.open').forEach(function (c) {
          c.classList.remove('open');
          var b = c.querySelector('.cpu-body');
          if (b) b.innerHTML = '';
        });
        releaseDocUrls();
        if (wasOpen) {
          setQuery({ page: currentPage });
          return;
        }
        card.classList.add('open');
        var body = card.querySelector('.cpu-body');
        body.innerHTML = '';
        if (update.has_document) renderDocument(body, update);
        var briefBox = document.createElement('div');
        briefBox.innerHTML = '<div class="cpu-status">Loading brief…</div>';
        body.appendChild(briefBox);
        setQuery({ page: currentPage, slug: update.slug });
        dumpBinAuthFetch('/api/central-pet/updates/' + encodeURIComponent(update.slug))
          .then(function (r) {
            return r.json().then(function (data) {
              return { okHttp: r.ok, status: r.status, data: data };
            });
          })
          .then(function (result) {
            var data = result.data || {};
            if (!result.okHttp || !data.ok || !data.update) {
              briefBox.innerHTML = '<div class="cpu-status">Could not load this brief'
                + (data.error ? (': ' + data.error) : (' (HTTP ' + result.status + ')'))
                + '.</div>';
              return;
            }
            var html = data.update.html_body || '';
            briefBox.innerHTML = '';
            if (!html) {
              if (!update.has_document) {
                briefBox.innerHTML = '<div class="cpu-status">This brief has no HTML body.</div>';
              }
              return;
            }
            var atts = Array.isArray(data.update.attachment_names) ? data.update.attachment_names : [];
            renderBrief(briefBox, html, atts);
          })
          .catch(function (err) {
            briefBox.innerHTML = '<div class="cpu-status">Could not load this brief'
              + (err && err.message ? (': ' + err.message) : '')
              + '.</div>';
          });
      }

      function renderPager(total) {
        pager.hidden = totalPages <= 1;
        newerBtn.disabled = currentPage <= 1;
        olderBtn.disabled = currentPage >= totalPages;
        whereEl.textContent = 'Page ' + currentPage + ' of ' + totalPages
          + ' · ' + total + ' update' + (total === 1 ? '' : 's');
      }

      async function loadPage(opts) {
        var q = new URLSearchParams({ pageSize: String(PAGE_SIZE) });
        if (opts.focus) q.set('focus', opts.focus);
        else q.set('page', String(opts.page || 1));
        statusEl.hidden = false;
        statusEl.textContent = 'Loading updates…';
        var res = await dumpBinAuthFetch('/api/central-pet/updates?' + q.toString());
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok || !data.ok) {
          statusEl.textContent = (data && data.error) || ('Could not load updates (HTTP ' + res.status + ').');
          return;
        }
        var updates = data.updates || [];
        currentPage = data.page || 1;
        totalPages = data.pages || 1;
        releaseDocUrls();
        feed.innerHTML = '';
        if (!updates.length) {
          statusEl.textContent = 'No updates yet.';
          pager.hidden = true;
          return;
        }
        statusEl.hidden = true;
        var focusCard = null;
        updates.forEach(function (u) {
          var card = document.createElement('article');
          card.className = 'cpu-card';
          card.dataset.slug = u.slug;
          card.innerHTML =
            '<div class="when">' + fmtWhen(u.published_at) + '</div>'
            + '<h2></h2><p class="summary"></p><div class="cpu-body"></div>';
          var h2 = card.querySelector('h2');
          h2.textContent = u.title || u.subject;
          if (u.has_document) {
            var badge = document.createElement('span');
            badge.className = 'cpu-badge';
            badge.textContent = 'PDF';
            h2.appendChild(badge);
          }
          card.querySelector('.summary').textContent = u.summary || u.subject || '';
          card.addEventListener('click', function (e) {
            if (e.target.closest('.cpu-body')) return;
            openCard(card, u);
          });
          feed.appendChild(card);
          if (opts.focus && opts.focus === u.slug) focusCard = { card: card, update: u };
        });
        renderPager(data.total || updates.length);
        if (focusCard) {
          openCard(focusCard.card, focusCard.update);
          focusCard.card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          setQuery({ page: currentPage });
          if (opts.scrollTop) window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      newerBtn.addEventListener('click', function () {
        if (currentPage > 1) loadPage({ page: currentPage - 1, scrollTop: true });
      });
      olderBtn.addEventListener('click', function () {
        if (currentPage < totalPages) loadPage({ page: currentPage + 1, scrollTop: true });
      });

      async function boot() {
        try {
          if (window.dumpBinAuthReady) {
            await window.dumpBinAuthReady;
          }
          var meRes = await dumpBinAuthFetch('/api/me', { noBounceOn401: true });
          if (!meRes.ok) {
            statusEl.innerHTML = 'Sign in required. <a href="/signin.html?next='
              + encodeURIComponent(location.pathname + location.search)
              + '">Sign in</a> to view Central Pet Updates.';
            return;
          }
          var me = await meRes.json();
          if (!me.hasCentralPetUpdatesAccess) {
            statusEl.textContent = 'You do not have access to Central Pet Updates. Ask your supervisor to grant Central Pet field access.';
            return;
          }
          if (me.canAdminCentralPetUpdates) {
            document.getElementById('admin-bar').hidden = false;
          }
          await loadPage(focusSlug ? { focus: focusSlug } : { page: currentPage });
        } catch (err) {
          statusEl.hidden = false;
          statusEl.textContent = 'Could not load updates.';
        }
      }

      boot();
    })();
  </script>
</body>
</html>
