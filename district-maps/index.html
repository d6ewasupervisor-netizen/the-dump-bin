    #map { height: calc(100vh - 125px); width: 100%; }

const map = L.map('map').setView([47.5, -120.5], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 18
}).addTo(map);

const markers = L.layerGroup().addTo(map);

function updateMap() {
  const districtFilter    = document.getElementById('district-select').value;
  const supervisorFilter  = document.getElementById('supervisor-select').value;
  markers.clearLayers();

  const filtered = STORE_DATA.filter(s =>
    (!districtFilter   || s.District   === districtFilter) &&
    (!supervisorFilter || s.Supervisor === supervisorFilter)
  );

  if (filtered.length === 0) {
    document.getElementById('count-display').textContent = 'No stores match.';
    return;
  }
  document.getElementById('count-display').textContent =
    filtered.length + ' store' + (filtered.length === 1 ? '' : 's');

  const bounds = L.latLngBounds();
  filtered.forEach(function(s) {
    var lat = s.coords[1], lon = s.coords[0];
    if (lat === 0 && lon === 0) return;
    var phone = s['store.phone'] && s['store.phone'] !== 'NaN' ? s['store.phone'] : '—';
    L.marker([lat, lon])
      .bindPopup(
        '<strong style="font-size:15px">FM ' + s['store.number'] + '</strong>' +
        '<div style="margin-top:4px;color:#555;font-size:13px">' +
          s['store.address.line'] + '<br>' +
          s['store.address.city.name'] + ', ' + s['store.address.city.state_abbr'] +
        '</div>' +
        '<div style="margin-top:6px;font-size:13px">' +
          '<b>District:</b> '    + s.District    + '<br>' +
          '<b>Supervisor:</b> '  + s.Supervisor  + '<br>' +
          '<b>Phone:</b> '       + phone +
        '</div>'
      )
      .addTo(markers);
    bounds.extend([lat, lon]);
  });

  if (bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40] });
}

// Wait for the auth gate to finish settling, then render.
(window.dumpBinAuthReady || Promise.resolve()).then(updateMap);
