<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extension Admin</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<script src="/auth-gate.js?v=20260913-ext-admin"></script>
<style>
:root {
  --bg:#0a0e13; --card:#151d28; --border:#243044; --text:#f0f4f8;
  --muted:#6b7d94; --sec:#a8b8cc; --accent:#4da6ff; --green:#00e87a;
  --amber:#ffcc00; --red:#ff4757; --purple:#b57bee; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── App shell ── */
.wrap{max-width:1100px;margin:0 auto;padding:18px 14px 80px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:1.5rem;font-weight:800}
.sub{color:var(--sec);font-size:13px;margin-top:4px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:9px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.refresh-info{color:var(--muted);font-size:12px}

/* ── Instance grid ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.instance-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.instance-card.killed{border-color:var(--red);background:rgba(255,71,87,.06)}
.card-head{display:flex;align-items:center;gap:10px}
.online-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot-yellow{background:var(--amber)}
.dot-red{background:var(--red)}
.card-label{font-weight:700;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.type-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;flex-shrink:0}
.badge-portable{background:rgba(181,123,238,.2);color:var(--purple)}
.badge-desktop{background:rgba(77,166,255,.15);color:var(--accent)}
.badge-unknown{background:rgba(107,125,148,.2);color:var(--muted)}
.card-meta{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.card-meta span{display:flex;gap:6px}
.meta-key{color:var(--sec);font-weight:600;flex-shrink:0;min-width:54px}

/* ── Rename ── */
.rename-row{display:flex;gap:6px;align-items:center}
.rename-input{flex:1;padding:6px 9px;border-radius:6px;border:1px solid var(--border);background:#111820;color:var(--text);font:inherit;font-size:13px}
.rename-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--sec);font:inherit;font-size:12px;cursor:pointer}
.rename-btn:hover{border-color:var(--accent);color:var(--accent)}
.rename-btn.save{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}

/* ── Feature flags ── */
.flags-grid{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:12px}
.flag-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.flag-label{font-size:13px;color:var(--sec)}
.flag-label small{display:block;font-size:11px;color:var(--muted)}

/* Toggle switch */
.toggle{position:relative;width:38px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;border-radius:999px;background:#243044;cursor:pointer;transition:background .2s}
.toggle input:checked + .toggle-track{background:var(--accent)}
.toggle input:checked + .toggle-track.danger-on{background:var(--red)}
.toggle-thumb{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;pointer-events:none}
.toggle input:checked ~ .toggle-thumb{transform:translateX(16px)}

/* Empty / error */
.empty{text-align:center;padding:60px 24px;color:var(--muted)}
.empty h2{font-size:1rem;margin-bottom:8px;color:var(--sec)}
.err-banner{background:rgba(255,71,87,.12);border:1px solid rgba(255,71,87,.4);border-radius:8px;padding:12px 14px;color:#ff8a96;font-size:13px;margin-bottom:16px;display:none}
.err-banner.visible{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Extension Instances</h1>
      <div class="sub" id="appSub">Loading…</div>
    </div>
    <div class="top-actions">
      <span class="refresh-info" id="refreshInfo"></span>
      <button class="btn" id="refreshBtn">↺ Refresh</button>
    </div>
  </div>
  <div class="err-banner" id="errBanner"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
'use strict';

const API = 'https://eod-api-production.up.railway.app';
let refreshTimer = null;

// ── Auth-gate integration ────────────────────────────────────────
// auth-gate.js exposes dumpBinAuthFetch once the session is verified.
// It redirects to /signin.html automatically if the user is not logged in.
async function authFetch(path, opts) {
  if (window.dumpBinAuthReady) await window.dumpBinAuthReady;
  const fn = window.dumpBinAuthFetch;
  if (!fn) throw new Error('Auth not ready');
  return fn(path, opts || {});
}

// ── Boot ─────────────────────────────────────────────────────────
async function boot() {
  // Wait for auth-gate to finish its session check (redirects if needed).
  if (window.dumpBinAuthReady) await window.dumpBinAuthReady;
  load();
  scheduleAutoRefresh();
}

document.getElementById('refreshBtn').addEventListener('click', load);

function scheduleAutoRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => { load(); scheduleAutoRefresh(); }, 60_000);
}

async function load() {
  document.getElementById('refreshInfo').textContent = '⟳ loading…';
  const errBanner = document.getElementById('errBanner');
  errBanner.classList.remove('visible');
  try {
    const r = await authFetch(API + '/extension/instances');
    if (!r.ok) {
      const msg = r.status === 403
        ? 'Admin role required to access extension management.'
        : 'Error ' + r.status + ' loading instances.';
      showErr(msg);
      return;
    }
    const data = await r.json();
    render(data);
    document.getElementById('refreshInfo').textContent =
      'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    showErr('Load failed: ' + e.message);
  }
}

function showErr(msg) {
  const el = document.getElementById('errBanner');
  el.textContent = msg;
  el.classList.add('visible');
  document.getElementById('refreshInfo').textContent = '';
}

// ── Render ──────────────────────────────────────────────────────
const FLAG_META = [
  { key: 'tabDailyRoutine',   label: 'Daily Routine tab',    sub: 'Show the module card & panel',  danger: false },
  { key: 'tabAdminAutoFind',  label: 'Admin Auto-Find',       sub: 'Show billable admin finder',     danger: false },
  { key: 'tabMoreTools',      label: 'More Tools tab',        sub: 'Show full More Tools section',   danger: false },
  { key: 'tabHAR',            label: 'HAR Recorder tab',      sub: 'Show network capture tab',       danger: false },
  { key: 'enableTimeExpense', label: 'Time & Expense access', sub: 'Allow T&E mutations in PROD',    danger: true  },
  { key: 'killSwitch',        label: 'Kill switch',           sub: 'Lock this instance entirely',    danger: true  },
];

function onlineDotClass(lastSeen) {
  if (!lastSeen) return 'dot-red';
  const age = (Date.now() - new Date(lastSeen).getTime()) / 1000 / 60;
  if (age < 5)  return 'dot-green';
  if (age < 60) return 'dot-yellow';
  return 'dot-red';
}

function relativeTime(ts) {
  if (!ts) return 'never';
  const sec = Math.round((Date.now() - new Date(ts).getTime()) / 1000);
  if (sec < 60)   return sec + 's ago';
  if (sec < 3600)  return Math.round(sec / 60) + 'm ago';
  if (sec < 86400) return Math.round(sec / 3600) + 'h ago';
  return Math.round(sec / 86400) + 'd ago';
}

function typeBadge(type) {
  if (type === 'portable') return '<span class="type-badge badge-portable">Portable</span>';
  if (type === 'desktop')  return '<span class="type-badge badge-desktop">Desktop</span>';
  return '<span class="type-badge badge-unknown">Unknown</span>';
}

function render({ instances, defaultConfig }) {
  const grid = document.getElementById('grid');
  const sub  = document.getElementById('appSub');
  sub.textContent = instances.length + ' instance' + (instances.length === 1 ? '' : 's') + ' registered';

  if (!instances.length) {
    grid.innerHTML = '<div class="empty"><h2>No instances yet</h2><p>Instances appear here once an extension phones home for the first time (~10 s after Chrome loads it).</p></div>';
    return;
  }

  grid.innerHTML = instances.map(inst => buildCard(inst, defaultConfig)).join('');
  attachCardEvents(instances);
}

function buildCard(inst, defaultConfig) {
  const cfg    = inst.config || defaultConfig;
  const dotCls = onlineDotClass(inst.lastSeen);
  const killed = cfg.killSwitch === true;
  const labelDisplay = inst.label || inst.instanceId.slice(0, 8) + '…';

  const flags = FLAG_META.map(fm => {
    const isChecked = fm.key === 'killSwitch' ? (cfg[fm.key] === true) : (cfg[fm.key] !== false);
    const trackCls  = (fm.key === 'killSwitch' && isChecked) ? 'danger-on' : '';
    return `
      <div class="flag-row">
        <div class="flag-label">
          ${fm.label}
          <small>${fm.sub}</small>
        </div>
        <label class="toggle" title="${fm.label}">
          <input type="checkbox" data-instance="${inst.instanceId}" data-flag="${fm.key}"
                 ${isChecked ? 'checked' : ''}>
          <div class="toggle-track ${trackCls}"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>`;
  }).join('');

  return `
    <div class="instance-card${killed ? ' killed' : ''}" data-id="${inst.instanceId}">
      <div class="card-head">
        <div class="online-dot ${dotCls}"></div>
        <div class="card-label" title="${inst.instanceId}">${escHtml(labelDisplay)}</div>
        ${typeBadge(inst.type)}
      </div>
      <div class="card-meta">
        <span><span class="meta-key">Version</span>${escHtml(inst.version || '—')}</span>
        <span><span class="meta-key">Seen</span>${relativeTime(inst.lastSeen)}</span>
        <span><span class="meta-key">First</span>${relativeTime(inst.firstSeen)}</span>
        <span><span class="meta-key">ID</span><span style="font-family:monospace;font-size:11px">${escHtml(inst.instanceId)}</span></span>
      </div>
      <div class="rename-row">
        <input class="rename-input" type="text" placeholder="Set a label…"
               value="${escHtml(inst.label || '')}" data-rename="${inst.instanceId}">
        <button class="rename-btn save" data-rename-save="${inst.instanceId}">Save</button>
      </div>
      <div class="flags-grid">${flags}</div>
    </div>`;
}

function attachCardEvents(instances) {
  // Feature flag toggles.
  document.querySelectorAll('input[data-flag]').forEach(cb => {
    cb.addEventListener('change', async () => {
      const instanceId = cb.dataset.instance;
      const flag       = cb.dataset.flag;
      const value      = cb.checked;
      cb.disabled = true;
      try {
        const r = await authFetch(`${API}/extension/instances/${encodeURIComponent(instanceId)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ config: { [flag]: value } }),
        });
        if (!r.ok) {
          cb.checked = !value;
          alert('Save failed: ' + r.status);
        } else {
          const card = document.querySelector(`.instance-card[data-id="${instanceId}"]`);
          if (flag === 'killSwitch' && card) {
            card.classList.toggle('killed', value);
          }
          const track = cb.nextElementSibling;
          if (track && flag === 'killSwitch') {
            track.classList.toggle('danger-on', value);
          }
        }
      } catch (e) {
        cb.checked = !value;
        alert('Network error: ' + e.message);
      } finally {
        cb.disabled = false;
      }
    });
  });

  // Rename.
  document.querySelectorAll('button[data-rename-save]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const instanceId = btn.dataset.renameSave;
      const input      = document.querySelector(`input[data-rename="${instanceId}"]`);
      if (!input) return;
      const label = input.value.trim() || null;
      btn.disabled = true;
      btn.textContent = '…';
      try {
        const r = await authFetch(`${API}/extension/instances/${encodeURIComponent(instanceId)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label }),
        });
        if (r.ok) {
          const card    = document.querySelector(`.instance-card[data-id="${instanceId}"]`);
          const labelEl = card && card.querySelector('.card-label');
          if (labelEl) labelEl.textContent = label || instanceId.slice(0, 8) + '…';
          btn.textContent = '✓';
          setTimeout(() => { btn.textContent = 'Save'; }, 1500);
        } else {
          btn.textContent = 'Error';
          setTimeout(() => { btn.textContent = 'Save'; }, 2000);
        }
      } catch (e) {
        btn.textContent = 'Error';
        setTimeout(() => { btn.textContent = 'Save'; }, 2000);
      } finally {
        btn.disabled = false;
      }
    });
  });

  document.querySelectorAll('input[data-rename]').forEach(input => {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const btn = document.querySelector(`button[data-rename-save="${input.dataset.rename}"]`);
        if (btn) btn.click();
      }
    });
  });
}

function escHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// Start.
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
